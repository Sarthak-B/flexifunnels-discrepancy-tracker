name: FlexiFunnels Discrepancy Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # JOB 1: GOOGLE SHEETS CONNECTION TEST
  # ============================================================

  test-google-sheets:
    name: Test Google Sheets Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Sheets dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth

      - name: Verify Google Sheets access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}

        run: |
          python - <<'PY'
          import os
          import json
          import gspread

          from google.oauth2.service_account import Credentials

          print("=" * 60)
          print("GOOGLE SHEETS CONNECTION TEST")
          print("=" * 60)

          required = [
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "RAW_DATA_SHEET_ID",
              "UTM_SHEET_ID",
              "DISCREPANCY_SHEET_ID",
          ]

          missing = [
              name
              for name in required
              if not os.environ.get(name, "").strip()
          ]

          if missing:
              raise RuntimeError(
                  "Missing GitHub secrets/variables: "
                  + ", ".join(missing)
              )

          print("Configuration variables found.")

          credentials = Credentials.from_service_account_info(
              json.loads(
                  os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
              ),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets.readonly"
              ],
          )

          client = gspread.authorize(credentials)

          spreadsheets = {
              "RAW DATA": os.environ["RAW_DATA_SHEET_ID"],
              "UTM": os.environ["UTM_SHEET_ID"],
              "DISCREPANCY STATS": os.environ["DISCREPANCY_SHEET_ID"],
          }

          for label, sheet_id in spreadsheets.items():

              print("\n" + "-" * 60)
              print("Checking:", label)

              spreadsheet = client.open_by_key(sheet_id)

              print("Status: CONNECTED")
              print("Spreadsheet:", spreadsheet.title)

              worksheets = spreadsheet.worksheets()

              print("Total tabs:", len(worksheets))

              for worksheet in worksheets:
                  print("  Tab:", worksheet.title)

          print("\n" + "=" * 60)
          print("SUCCESS: ALL GOOGLE SHEETS CONNECTED")
          print("READ-ONLY TEST: NO DATA MODIFIED")
          print("=" * 60)
          PY


  # ============================================================
  # JOB 2: FLEXIFUNNELS LOGIN TEST
  # ============================================================

  test-flexifunnels-login:
    name: Test FlexiFunnels Login
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test FlexiFunnels login and project access
        env:
          FLEXIFUNNELS_EMAIL: ${{ secrets.FLEXIFUNNELS_EMAIL }}
          FLEXIFUNNELS_PASSWORD: ${{ secrets.FLEXIFUNNELS_PASSWORD }}
          FLEXIFUNNELS_PROJECT_URL: ${{ vars.FLEXIFUNNELS_PROJECT_URL }}

        run: |
          python - <<'PY'
          import os

          from playwright.sync_api import (
              sync_playwright,
              TimeoutError as PlaywrightTimeout,
          )

          print("=" * 60)
          print("FLEXIFUNNELS LOGIN TEST")
          print("=" * 60)

          email = os.environ.get(
              "FLEXIFUNNELS_EMAIL", ""
          ).strip()

          password = os.environ.get(
              "FLEXIFUNNELS_PASSWORD", ""
          )

          project_url = os.environ.get(
              "FLEXIFUNNELS_PROJECT_URL", ""
          ).strip()

          if not email:
              raise RuntimeError(
                  "FLEXIFUNNELS_EMAIL secret is missing."
              )

          if not password:
              raise RuntimeError(
                  "FLEXIFUNNELS_PASSWORD secret is missing."
              )

          if not project_url:
              raise RuntimeError(
                  "FLEXIFUNNELS_PROJECT_URL variable is missing."
              )

          if not project_url.startswith(
              "https://app.flexifunnels.com/projects/"
          ):
              raise RuntimeError(
                  "Unexpected FlexiFunnels project URL."
              )

          print("Credentials and project URL configured.")
          print("Starting Playwright browser...")

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 900,
                  }
              )

              page = context.new_page()

              try:

                  # --------------------------------------------
                  # STEP 1: OPEN FLEXIFUNNELS
                  # --------------------------------------------

                  print("\nSTEP 1: Opening FlexiFunnels...")

                  page.goto(
                      "https://app.flexifunnels.com/",
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  print("FlexiFunnels page opened.")

                  # --------------------------------------------
                  # STEP 2: FIND LOGIN FIELDS
                  # --------------------------------------------

                  print("\nSTEP 2: Finding login fields...")

                  # Candidate selectors. These will be
                  # confirmed against the actual login UI.

                  email_field = page.locator(
                      'input[type="email"], '
                      'input[name="email"], '
                      'input[autocomplete="username"]'
                  ).first

                  password_field = page.locator(
                      'input[type="password"]'
                  ).first

                  email_field.wait_for(
                      state="visible",
                      timeout=30000,
                  )

                  password_field.wait_for(
                      state="visible",
                      timeout=15000,
                  )

                  print("Email field found.")
                  print("Password field found.")

                  # --------------------------------------------
                  # STEP 3: ENTER CREDENTIALS
                  # --------------------------------------------

                  print("\nSTEP 3: Entering credentials...")

                  email_field.fill(email)
                  password_field.fill(password)

                  print("Credentials entered securely.")

                  # --------------------------------------------
                  # STEP 4: SUBMIT LOGIN
                  # --------------------------------------------

                  print("\nSTEP 4: Submitting login...")

                  submit_button = page.locator(
                      'button[type="submit"]'
                  ).first

                  submit_button.wait_for(
                      state="visible",
                      timeout=15000,
                  )

                  submit_button.click()

                  # Give the app time to process authentication.
                  # A later project-page check determines success.

                  page.wait_for_timeout(5000)

                  print("Login submitted.")

                  # --------------------------------------------
                  # STEP 5: OPEN PROJECT
                  # --------------------------------------------

                  print("\nSTEP 5: Opening project...")

                  page.goto(
                      project_url,
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  page.wait_for_timeout(5000)

                  current_url = page.url

                  print("Current URL:", current_url)

                  # --------------------------------------------
                  # STEP 6: VERIFY PROJECT ACCESS
                  # --------------------------------------------

                  print("\nSTEP 6: Verifying project access...")

                  expected_path = (
                      "/projects/kvapNzyj"
                  )

                  if expected_path not in current_url:
                      raise RuntimeError(
                          "Project URL not reached. "
                          "Authentication may have failed."
                      )

                  # Verify visible content rather than relying
                  # on the URL alone.

                  project_content = page.get_by_text(
                      "Funnel Builder Agent",
                      exact=False,
                  ).first

                  project_content.wait_for(
                      state="visible",
                      timeout=20000,
                  )

                  print("Project-specific content found.")

                  # --------------------------------------------
                  # SUCCESS
                  # --------------------------------------------

                  print("\n" + "=" * 60)
                  print("SUCCESS: FLEXIFUNNELS LOGIN VERIFIED")
                  print("SUCCESS: PROJECT ACCESS VERIFIED")
                  print("NO REPORTS DOWNLOADED")
                  print("NO GOOGLE SHEETS MODIFIED")
                  print("=" * 60)

              except PlaywrightTimeout:

                  print("\nFAILED: Browser element timed out.")
                  print(
                      "Possible causes: login page selectors, "
                      "slow loading, CAPTCHA, or OTP."
                  )

                  raise RuntimeError(
                      "FlexiFunnels login test timed out."
                  ) from None

              except Exception as exc:

                  print("\nFAILED: FlexiFunnels test.")
                  print("Error type:", type(exc).__name__)

                  raise RuntimeError(
                      "Could not verify FlexiFunnels login "
                      "and project access."
                  ) from None

              finally:

                  context.close()
                  browser.close()

                  print("\nBrowser closed.")

          PY
