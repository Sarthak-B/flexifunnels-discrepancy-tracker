          def zoom_date_box(page, label, seconds=15):
              # The box showing a date on the same line as the visible 'From' / 'To' label.
              deadline = time.monotonic() + seconds
              found = None
              while time.monotonic() < deadline:
                  found = page.evaluate(ZOOM_BOX_JS, label)
                  if found and found.get('status') == 'ok':
