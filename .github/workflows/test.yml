          def zoom_date_value(value):
              value = ' '.join(str(value).split())
              for pattern in ('%m/%d/%Y', '%Y-%m-%d', '%Y/%m/%d', '%m-%d-%Y',
                              '%b %d, %Y', '%B %d, %Y', '%d %b %Y', '%d %B %Y'):
                  try:
                      return datetime.strptime(value, pattern).date()
                  except ValueError:
                      pass
              return None


          def zoom_route(page):
              # Report route and filter parameters only; no cookies or tokens live here.
              parsed = urlparse(page.url)
              return parsed.path + ('#' + parsed.fragment if parsed.fragment else '')


          def zoom_on_registration_report(page):
              return 'meetingRegistration' in urlparse(page.url).fragment


          def zoom_url_params(page):
              query = urlparse(page.url).fragment.partition('?')[2]
              return dict(parse_qsl(query, keep_blank_values=True))


          def zoom_url_range(page):
              # Zoom writes the applied filter into the address (seen in the recording).
              params = zoom_url_params(page)
              try:
                  return (date.fromisoformat(params['dateFrom']), date.fromisoformat(params['dateTo']))
              except (KeyError, ValueError):
                  return None


          def zoom_input_range(page):
              try:
