              print("Clicked Switch to user inside Saurabh's card.")


          def locate_switched_page(context, original_page):
              print()
              print('STEP 10: Checking browser tabs after sub-user switch')
              deadline = time.monotonic() + 15
              while time.monotonic() < deadline:
                  pages = [candidate for candidate in context.pages if not candidate.is_closed()]
                  for candidate in reversed(pages):
                      if candidate != original_page:
                          print('Additional browser tab detected.')
                          parsed = urlparse(candidate.url)
                          if parsed.scheme != 'https' or parsed.hostname != 'app.flexifunnels.com':
                              raise RuntimeError('Unexpected switch destination.')
                          return candidate
                  if current_path(original_page) != '/switch-sub-users':
                      print('Original tab changed location.')
                      return original_page
                  time.sleep(1)
              print('No navigation or new tab detected. Continuing to Projects.')
              return original_page


          def require_project(page):
              parsed = urlparse(page.url)
              if (parsed.scheme != 'https' or parsed.netloc != 'app.flexifunnels.com'
                      or parsed.path.rstrip('/') != urlparse(PROJECT_URL).path.rstrip('/')):
                  raise RuntimeError('Expected authenticated project kvapNzyj; got ' + safe_location(page))


          def overview_card(page):
              more = unique_visible(page.get_by_text('More', exact=True))
              if more is None:
                  return None
              card = more.locator("xpath=ancestor::*[contains(., 'Page Id')][1]")
              if card.count() != 1 or not card.is_visible():
                  return None
              # Never accept an ancestor that accidentally includes the page list.
              if card.locator('input[placeholder*="Search pages" i]').count():
                  return None
              return card


          def overview_urls(page):
              card = overview_card(page)
              if card is None:
                  return set()
              found = set()
              for field in visible_items(card.locator('input'), 120):
                  value = field.input_value().strip()
                  if re.fullmatch(r'https?://\S+', value):
                      found.add(value.rstrip('/'))
              for item in visible_items(card.get_by_text(re.compile(r'^\s*https?://\S+\s*$')), 120):
                  found.add(item.inner_text().strip().rstrip('/'))
              return found


          def project_page_names(page):
              search = wait_unique(page.locator('input[placeholder*="Search pages" i]'), 'Project page search', 45)
              if search.input_value():
                  search.fill('')
              # The recording shows a narrow left column with a Pages heading and search.
              # Identify that column by its layout, not by the ED badges or framework classes.
              names = search.evaluate('''input => {
                  document.querySelectorAll('[data-ff-page-list]').forEach(el => el.removeAttribute('data-ff-page-list'));
                  const searchBox = input.getBoundingClientRect();
                  for (let root = input.parentElement; root && root !== document.body; root = root.parentElement) {
                      const box = root.getBoundingClientRect();
                      if (box.width > innerWidth * 0.45) break;
                      if (!Array.from(root.querySelectorAll('*')).some(el => el.textContent.trim() === 'Pages')) continue;
                      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
                      const names = new Set();
                      let node;
                      while ((node = walker.nextNode())) {
                          const el = node.parentElement, text = node.textContent.trim();
                          if (!el || text.length < 3 || !/[a-z]/i.test(text)) continue;
                          if (el.closest('button, input, script, style')) continue;
                          const rect = el.getBoundingClientRect(), style = getComputedStyle(el);
                          if (!rect.width || !rect.height || style.visibility === 'hidden' || style.display === 'none') continue;
                          if (rect.top < searchBox.bottom || rect.left < box.left || rect.right > box.right + 2) continue;
                          if (/^(?:Add New Page|Pages|Load more|Show more)$/i.test(text)) continue;
                          names.add(text);
                      }
                      if (names.size) {
                          root.setAttribute('data-ff-page-list', 'true');
                          return Array.from(names);
                      }
                  }
                  return [];
              }''')
              return names


          def save_navigation_diagnostic(page, seen):
              Path('diagnostics').mkdir(exist_ok=True)
              Path('diagnostics/project-navigation.json').write_text(json.dumps({
                  'location': safe_location(page), 'pages_checked': seen,
                  'page_search_controls': len(visible_items(page.locator('input[placeholder*="Search pages" i]'))),
                  'overview_available': overview_card(page) is not None,
              }, indent=2))


          def click_unobstructed(page, locator, timeout=30000):
              """Wait for a physically reachable control; never force or dispatch a click.
              Trials do not activate controls. The real click is issued exactly once.
              """
              deadline = time.monotonic() + max(timeout, 30000) / 1000
              last_blockers = []
              while time.monotonic() < deadline:
                  locator.wait_for(state='visible', timeout=5000)
                  # Playwright's nearest-edge scrolling can place a control under the
                  # sticky header. Center it within ALL scrolling ancestors instead.
                  locator.evaluate("el => el.scrollIntoView({block:'center', inline:'center', behavior:'instant'})")
                  page.wait_for_timeout(150)
                  points = locator.evaluate('''el => {
                      const r = el.getBoundingClientRect();
                      return [[0.5,0.5],[0.25,0.5],[0.75,0.5],[0.5,0.75],[0.5,0.25]].map(([x,y]) => {
                          const px=r.width*x, py=r.height*y;
                          const top=document.elementFromPoint(r.left+px,r.top+py);
                          return {x:px,y:py,clear:!!top&&(top===el||el.contains(top)),
                                  blocker:top ? {tag:top.tagName,role:top.getAttribute('role'),
                                    position:getComputedStyle(top).position,
                                    fixedAncestor:!!top.closest('.fixed, .sticky, nav')} : null};
                      });
                  }''')
                  last_blockers = [item['blocker'] for item in points if not item['clear']]
                  for point in points:
                      if not point['clear']:
                          continue
                      position = {'x': point['x'], 'y': point['y']}
                      try:
                          locator.click(trial=True, position=position, timeout=1000)
                      except PlaywrightTimeoutError:
                          continue
                      locator.click(position=position, timeout=15000)
                      return
                  # Dismiss only the observed notification container, and only when it
                  # exposes an explicit close control. Never remove DOM or bypass overlays.
                  notices = page.locator('div.fixed.top-6.z-50.bg-gradient-to-r').filter(visible=True)
                  for notice in visible_items(notices):
                      close = first_unique_visible([
                          notice.get_by_role('button', name=re.compile(r'^\s*(?:Close|Dismiss)(?: notification| alert)?\s*$', re.I)),
                          notice.locator('[aria-label="Close" i], [aria-label="Dismiss" i], button[title="Close" i]'),
                      ])
                      if close is not None:
                          try:
                              close.click(trial=True, timeout=700)
                          except PlaywrightTimeoutError:
                              continue
                          close.click(timeout=3000)
                  page.wait_for_timeout(500)
              Path('diagnostics').mkdir(exist_ok=True)
              Path('diagnostics/blocked-click.json').write_text(json.dumps({
                  'location': safe_location(page), 'blockers': last_blockers,
              }, indent=2))
              raise RuntimeError('Control remains covered by another element; see blocked-click.json. No forced click attempted.')


          def open_page_from_project_sidebar(page, published_url):
              target = published_url.rstrip('/')
              parsed = urlparse(page.url)
              in_project = (parsed.scheme == 'https' and parsed.netloc == 'app.flexifunnels.com'
                            and parsed.path.rstrip('/') == urlparse(PROJECT_URL).path.rstrip('/'))
              if not in_project:
                  print('Opening authenticated project directly:', EXPECTED_PROJECT_URL)
                  page.goto(PROJECT_URL, wait_until='domcontentloaded', timeout=60000)
                  if not wait_for_project_page(page, 30):
                      raise RuntimeError('Direct project navigation failed; no export attempted.')
              else:
                  print('Reusing the current project session to select the next page.')
              require_project(page)
              # Reports/Downloads is a view inside this project. Return through its
              # own Back to Overview control instead of restarting the application.
              back_pattern = re.compile(r'^\s*Back to Overview\s*$', re.IGNORECASE)
              back = first_unique_visible([
                  page.get_by_role('button', name=back_pattern),
                  page.get_by_role('link', name=back_pattern),
                  page.get_by_text(back_pattern),
              ])
              if back is not None:
                  click_unobstructed(page, back, timeout=15000)
                  wait_unique(page.get_by_text('More', exact=True), 'Page Overview after Reports', 45)
                  print('Returned from Reports/Downloads to Page Overview.')
              search = wait_unique(page.locator('input[placeholder*="Search pages" i]'), 'Project page search', 45)
              if search.input_value():
                  search.fill('')
              # The first page selection may leave the list scrolled down. Start
              # each scan at the top, including independently scrolling child lists.
              search.evaluate('''input => {
                  for (let root = input.parentElement; root && root !== document.body; root = root.parentElement) {
                      if (root.getBoundingClientRect().width > innerWidth * 0.45) break;
                      for (const el of [root, ...root.querySelectorAll('*')]) {
                          if (el.scrollHeight > el.clientHeight && /auto|scroll/.test(getComputedStyle(el).overflowY)) {
                              el.scrollTop = 0;
                          }
                      }
                  }
              }''')
              seen, checked = [], set()
              deadline = time.monotonic() + 300
              while time.monotonic() < deadline:
                  require_project(page)
                  if target in overview_urls(page):
                      verify_overview(page, target)
                      print('Correct page verified by its exact published URL:', target)
                      return
                  names = project_page_names(page)
                  remaining = [name for name in names if name not in checked]
                  if not remaining:
                      # Also support lists that render more entries when scrolled.
                      sidebar = page.locator('[data-ff-page-list="true"]')
                      if sidebar.count() != 1:
                          time.sleep(0.5)
                          continue
                      moved = sidebar.evaluate('''root => {
                          let moved = false;
                          for (const el of [root, ...root.querySelectorAll('*')]) {
                              if (el.scrollHeight > el.clientHeight + 2 && /auto|scroll/.test(getComputedStyle(el).overflowY)) {
                                  const old = el.scrollTop;
                                  el.scrollTop += Math.max(100, el.clientHeight - 50);
                                  moved = moved || el.scrollTop > old;
                              }
                          }
                          return moved;
                      }''')
                      if not moved:
                          break
                      page.wait_for_timeout(500)
                      continue
                  name = remaining[0]
                  checked.add(name)
                  candidate = page.locator('[data-ff-page-list="true"]').get_by_text(name, exact=True)
                  if candidate.count() != 1:
                      raise RuntimeError('Ambiguous page title in project sidebar: ' + name)
                  candidate.scroll_into_view_if_needed(timeout=5000)
                  click_unobstructed(page, candidate, timeout=10000)
                  settled_until = time.monotonic() + 5
                  while time.monotonic() < settled_until:
                      require_project(page)
                      if target in overview_urls(page):
                          verify_overview(page, target)
                          print('Page selected and URL verified:', name)
                          return
                      time.sleep(0.25)
                  seen.append({'page': name, 'published_urls': sorted(overview_urls(page))})
              save_navigation_diagnostic(page, seen)
              raise RuntimeError('Requested published URL was not verified in project kvapNzyj. '
                                 'See project-navigation.json; no report was exported.')


          def wait_for_project_page(page, seconds):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  parsed = urlparse(page.url)
                  if (parsed.scheme == 'https' and parsed.netloc == 'app.flexifunnels.com'
                          and parsed.path.rstrip('/') == urlparse(PROJECT_URL).path.rstrip('/')):
                      return True
                  time.sleep(0.5)
              return False


          def verify_overview(page, published_url):
              deadline, stable_since = time.monotonic() + 30, None
              while time.monotonic() < deadline:
                  require_project(page)
                  if published_url.rstrip('/') in overview_urls(page):
                      if stable_since is None:
                          stable_since = time.monotonic()
                      elif time.monotonic() - stable_since >= 2:
                          return
                  else:
                      stable_since = None
                  time.sleep(0.25)
              raise RuntimeError('Page Overview did not confirm the exact published URL; stopping.')


          def wait_unique(locator, description, seconds=30):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  item = unique_visible(locator)
                  if item is not None:
                      return item
                  time.sleep(0.25)
              raise RuntimeError(description + ' missing or ambiguous; stopping.')


          def click_text(page, text):
              click_unobstructed(page, wait_unique(page.get_by_text(text, exact=True), text))


          def open_recorded_reports(page, published_url):
              verify_overview(page, published_url)
              more = wait_unique(page.get_by_text('More', exact=True), 'Overview More')
              card = more.locator("xpath=ancestor::*[contains(., 'Page Id')][1]")
              if card.count() != 1 or not card.is_visible():
                  raise RuntimeError('Page Overview card could not be identified.')
              card_values = [x.input_value() for x in visible_items(card.locator('input'))]
              if published_url.rstrip('/') not in overview_urls(page):
                  raise RuntimeError('Overview card does not contain the requested published URL.')
              locators = [
                  card.get_by_role('button', name='Reports', exact=True),
                  card.get_by_role('link', name='Reports', exact=True),
                  card.locator('[title="Reports"], [data-bs-original-title="Reports"], '
                               '[data-original-title="Reports"], [data-tooltip="Reports"]'),
              ]
              control = first_unique_visible(locators)
              if control is None:
                  candidates = visible_items(card.locator('button, a, [role="button"], svg, '
                                                         '[title], [data-bs-toggle="tooltip"], '
                                                         '[data-toggle="tooltip"]'), 60)
                  matched = {}
                  skipped = 0
                  for candidate in candidates:
                      page.mouse.move(0, 0)
                      tooltip = page.get_by_text('Reports', exact=True)
                      try:
                          tooltip.wait_for(state='hidden', timeout=1500)
                          candidate.hover(timeout=1500)
                          tooltip.wait_for(state='visible', timeout=1000)
                      except PlaywrightTimeoutError:
                          skipped += 1
                          continue
                      key = candidate.evaluate('''el => {
                          const owner = el.closest('button, a, [role="button"], [title], [data-bs-toggle="tooltip"], [data-toggle="tooltip"]') || el.closest('svg') || el;
                          return Array.from(document.querySelectorAll('*')).indexOf(owner);
                      }''')
                      matched.setdefault(key, candidate)
                  print('Overview hover candidates:', len(candidates), 'unmatched/unavailable:', skipped)
                  if len(matched) != 1:
                      raise RuntimeError('Recorded Reports icon cannot be identified uniquely inside Overview.')
                  control = next(iter(matched.values()))
              click_unobstructed(page, control)
              wait_unique(page.get_by_text(re.compile(r'^\s*Page Reports\b')), 'Page Reports', 45)
              require_project(page)
              wait_unique(page.get_by_text('Export Data', exact=True), 'Export Data', 45)


          def choose_recorded_custom_range(page):
              custom_pattern = re.compile(r'^\s*Custom\s+range\s*$', re.IGNORECASE)
              all_time_pattern = re.compile(r'^\s*All\s+Time\s*$', re.IGNORECASE)
              if unique_visible(page.get_by_text(custom_pattern)) is not None:
                  return
              deadline = time.monotonic() + 30
              while time.monotonic() < deadline:
                  selects = []
                  for item in visible_items(page.locator('select')):
                      options = item.locator('option')
                      matching = [options.nth(i) for i in range(options.count())
                                  if custom_pattern.fullmatch(options.nth(i).inner_text())]
                      if len(matching) == 1:
                          selects.append((item, matching[0]))
                  if len(selects) > 1:
                      raise RuntimeError('Multiple native date dropdowns; stopping.')
                  if selects:
                      select, option = selects[0]
                      value = option.get_attribute('value')
                      if value is None:
                          select.select_option(label=option.inner_text())
                      else:
                          select.select_option(value=value)
                      print('Custom range selected using native date dropdown.')
                      return
                  trigger = first_unique_visible([
                      page.get_by_role('combobox', name=all_time_pattern),
                      page.get_by_role('button', name=all_time_pattern),
                      page.get_by_text(all_time_pattern),
                  ])
                  if trigger is not None:
                      click_unobstructed(page, trigger, timeout=15000)
                      option_deadline = time.monotonic() + 15
                      while time.monotonic() < option_deadline:
                          option = first_unique_visible([
                              page.get_by_role('option', name=custom_pattern),
                              page.get_by_role('menuitem', name=custom_pattern),
                              page.get_by_text(custom_pattern),
                          ])
                          if option is not None:
                              click_unobstructed(page, option, timeout=15000)
                              print('Custom range selected using visible All Time control.')
                              return
                          time.sleep(0.25)
                      raise RuntimeError('All Time opened, but Custom range was not uniquely visible.')
                  time.sleep(0.25)
              print('Visible native date selects:', len(visible_items(page.locator('select'))))
              print('Visible All Time matches:', len(visible_items(page.get_by_text(all_time_pattern))))
              raise RuntimeError('Recorded All Time date control is missing or ambiguous.')


          def recorded_calendar(page):
              ok = wait_unique(page.get_by_text(re.compile(r'^\s*OK\s*$', re.IGNORECASE)), 'Calendar OK')
              calendar = ok.locator("xpath=ancestor::*[.//*[normalize-space(.)='Mo'] and .//*[normalize-space(.)='Su']][1]")
              if calendar.count() != 1 or not calendar.is_visible():
                  raise RuntimeError('Calendar with the recorded Mo–Su weekday header not uniquely identified.')
              return calendar


          def calendar_month(calendar):
              names = 'January February March April May June July August September October November December'.split()
              pattern = r'\b(' + '|'.join(name[:3] + '(?:' + name[3:] + ')?' for name in names) + r')\s+(\d{4})\b'
              matches = re.findall(pattern, calendar.inner_text(), re.IGNORECASE)
              values = {(int(year), next(i + 1 for i, name in enumerate(names) if name[:3].lower() == month[:3].lower()))
                        for month, year in matches}
              if len(values) != 1:
                  raise RuntimeError('Calendar month/year header is missing or ambiguous.')
              return next(iter(values))


          def click_calendar_date(page, target):
              calendar = recorded_calendar(page)
              expected_month = (target.year, target.month)
              for _ in range(24):
                  shown = calendar_month(calendar)
                  if shown == expected_month:
                      break
                  previous = shown > expected_month
                  direction = re.compile(r'previous|prev|back', re.IGNORECASE) if previous else re.compile(r'next|forward', re.IGNORECASE)
                  navigation = first_unique_visible([
                      calendar.get_by_role('button', name=direction),
                      calendar.locator('[title]').filter(has_text=direction),
                  ])
                  if navigation is None:
                      labeled = []
                      for control in visible_items(calendar.locator('button, [role="button"], [aria-label], [title]')):
                          label = ' '.join(control.get_attribute(attr) or '' for attr in ('aria-label', 'title'))
                          if direction.search(label):
                              labeled.append(control)
                      if len(labeled) == 1:
                          navigation = labeled[0]
                  if navigation is None:
                      raise RuntimeError('Calendar month arrow lacks a unique directional label; stopping.')
                  click_unobstructed(page, navigation)
                  deadline = time.monotonic() + 5
                  while time.monotonic() < deadline:
                      calendar = recorded_calendar(page)
                      if calendar_month(calendar) != shown:
                          break
                      time.sleep(0.1)
                  else:
                      raise RuntimeError('Calendar month did not change after navigation.')
              else:
                  raise RuntimeError('Requested calendar month was not reached.')

              day = re.compile(r'^\s*' + str(target.day) + r'\s*$')
              cells = {}
              for item in visible_items(calendar.get_by_text(day)):
                  info = item.evaluate('''el => {
                      const cell = el.closest('td, [role="gridcell"], button, [role="button"]') || el;
                      const flags = [];
                      for (let n = el; n && n !== cell.parentElement; n = n.parentElement) {
                          const raw = n.className && n.className.baseVal !== undefined ? n.className.baseVal : (n.className || '');
                          const cls = ' ' + raw + ' ';
                          if (n.getAttribute('aria-disabled') === 'true' || n.hasAttribute('disabled')
                              || /[\\s_-](disabled|is-disabled|unavailable)[\\s_-]/i.test(cls)) flags.push('disabled');
                          if (/[\\s_-](off|old|new|prev-month|next-month|other-month|outside|not-current|out-of-month|adjacent)[\\s_-]/i.test(cls)) flags.push('outside');
                      }
                      return {key: Array.from(document.querySelectorAll('*')).indexOf(cell),
                              disabled: flags.includes('disabled'), outside: flags.includes('outside')};
                  }''')
                  entry = cells.setdefault(info['key'], {'item': item, 'key': info['key'],
                                                         'disabled': False, 'outside': False})
                  entry['disabled'] = entry['disabled'] or info['disabled']
                  entry['outside'] = entry['outside'] or info['outside']
              usable = [e for e in cells.values() if not e['disabled'] and not e['outside']]
              if len(usable) > 1:
                  # The grid also shows leftover days from the neighbouring months.
                  # Previous-month days (e.g. 28-30 Sep) come BEFORE day 1 of this month;
                  # next-month days (e.g. 1-8 Nov) come AFTER the month's last day.
                  # So for day >= 15 the real cell is the LAST match, otherwise the FIRST.
                  # verify_calendar_preview() still checks the final range afterwards.
                  ordered = sorted(usable, key=lambda e: e['key'])
                  pick_last = target.day >= 15
                  print('Calendar day', target.isoformat(), '- duplicates from adjacent months:', len(usable),
                        '| picked the', 'last' if pick_last else 'first', 'by grid position')
                  usable = [ordered[-1] if pick_last else ordered[0]]
              if len(usable) != 1:
                  disabled = sum(1 for e in cells.values() if e['disabled'] and not e['outside'])
                  print('Calendar day', target.isoformat(), '- cells:', len(cells), 'disabled:', disabled, 'usable:', len(usable))
                  if not usable and disabled:
                      raise RuntimeError('Calendar day ' + target.isoformat() + ' is disabled in FlexiFunnels (future or unavailable date).')
                  raise RuntimeError('Calendar day ' + target.isoformat() + ' is missing or ambiguous.')
              click_unobstructed(page, usable[0]['item'])
              print('Calendar date clicked:', target.isoformat())


          def expected_dates_shown(found):
              expected = [RANGE_START.isoformat(), RANGE_END.isoformat()]
              # A one-day range may be displayed once or twice.
              return found == expected or (RANGE_START == RANGE_END and found == expected[:1])


          def verify_calendar_preview(page):
              calendar = recorded_calendar(page)
              deadline = time.monotonic() + 10
              while time.monotonic() < deadline:
                  values = [field.input_value() for field in visible_items(calendar.locator('input'))]
                  preview = calendar.inner_text() + ' ' + ' '.join(values)
                  if expected_dates_shown(re.findall(r'\b\d{4}-\d{2}-\d{2}\b', preview)):
                      print('Calendar start/end preview verified.')
                      return
                  time.sleep(0.25)
              raise RuntimeError('Calendar preview does not confirm ' + RANGE_START.isoformat() + ' through '
                                 + RANGE_END.isoformat() + '.')


          def save_calendar_diagnostic(page):
              try:
                  calendar = recorded_calendar(page)
                  Path('diagnostics').mkdir(exist_ok=True)
                  calendar.screenshot(path='diagnostics/calendar.png')
                  data = calendar.locator('input, button, [role="button"], [role="gridcell"], [aria-label], [title]').evaluate_all('''xs => xs.map(el => ({
                      tag: el.tagName, role: el.getAttribute('role'),
                      ariaLabel: el.getAttribute('aria-label'), title: el.getAttribute('title'),
                      disabled: el.getAttribute('aria-disabled'), readonly: el.hasAttribute('readonly'),
                      text: (el.innerText || '').trim().slice(0, 100)
                  }))''')
                  Path('diagnostics/calendar-controls.json').write_text(json.dumps(data, indent=2))
                  print('Calendar-only diagnostics saved.')
              except Exception:
                  print('Calendar-only diagnostics unavailable.')


          def range_dates(value):
              return re.findall(r'\b\d{4}-\d{2}-\d{2}\b', value.strip()) if len(value) <= 100 else []


          def applied_range_matches(page):
              values = [field.input_value() for field in visible_items(page.locator('input'))]
              if any(expected_dates_shown(range_dates(value)) for value in values):
                  return True
              pattern = re.compile(r'^\s*' + RANGE_START.isoformat() + r'\s*(?:to|[-–—~])\s*'
                                   + RANGE_END.isoformat() + r'\s*$', re.IGNORECASE)
              return unique_visible(page.get_by_text(pattern)) is not None


          def read_report_count(page):
              heading = unique_visible(page.get_by_text(re.compile(r'^\s*Page Reports\b')))
              if heading is None:
                  return None
              text = heading.evaluate('''el => {
                  for (let i = 0; el && i < 4; i++, el = el.parentElement) {
                      const text = (el.innerText || '').trim();
                      if (text.length <= 200 && /^Page Reports\\s*\\[\\s*[\\d,]+\\s*\\]/.test(text)) return text;
                  }
                  return '';
              }''')
              match = re.search(r'^Page Reports\s*\[\s*([\d,]+)\s*\]', text)
              return int(match.group(1).replace(',', '')) if match else None


          def wait_applied_report(page):
              deadline = time.monotonic() + 60
              stable_since = None
              range_confirmed = False
              while time.monotonic() < deadline:
                  range_confirmed = applied_range_matches(page)
                  count = read_report_count(page)
                  if range_confirmed:
                      if stable_since is None:
                          stable_since = time.monotonic()
                      elif time.monotonic() - stable_since >= 3:
                          print('Applied range verified:', RANGE_START.isoformat(), 'through', RANGE_END.isoformat())
                          print('Live Page Reports count (informational only):', count)
                          return count
                  else:
                      stable_since = None
                  time.sleep(0.5)
              print('Applied range matched:', range_confirmed)
              print('Page Reports count parsed:', read_report_count(page))
              Path('diagnostics').mkdir(exist_ok=True)
              heading = unique_visible(page.get_by_text(re.compile(r'^\s*Page Reports\b')))
              nearby = heading.evaluate('''el => {
                  const out = [];
                  for (let i = 0; el && i < 4; i++, el = el.parentElement) {
                      const text = (el.innerText || '').trim();
                      if (text.length <= 200) out.push(text);
                  }
                  return out;
              }''') if heading else []
              dates = [field.input_value() for field in visible_items(page.locator('input'))
                       if range_dates(field.input_value())]
              Path('diagnostics/applied-filter.json').write_text(json.dumps({
                  'expectedDates': [RANGE_START.isoformat(), RANGE_END.isoformat()],
                  'visibleDateValues': dates, 'reportHeader': nearby,
              }, indent=2))
              raise RuntimeError('Applied date range could not be verified; see applied-filter diagnostics.')


          def set_recorded_date_range(page):
              require_project(page)
              if not visible_items(page.get_by_text(re.compile(r'^\s*(?:All\s+Time|Custom\s+range)\s*$', re.IGNORECASE))):
                  click_text(page, 'Filters')
              print('Waiting for the date control to appear.')
              choose_recorded_custom_range(page)
              deadline = time.monotonic() + 30
              picker = None
              while time.monotonic() < deadline:
                  picker = first_unique_visible([
                      page.locator('input[placeholder="Select Date Range"]'),
                      page.get_by_text('Select Date Range', exact=True),
                  ])
                  if picker is not None:
                      break
                  time.sleep(0.25)
              if picker is None:
                  raise RuntimeError('Custom range selected, but Select Date Range did not appear.')
              click_unobstructed(page, picker)
              try:
                  click_calendar_date(page, RANGE_START)
                  click_calendar_date(page, RANGE_END)
                  verify_calendar_preview(page)
                  click_unobstructed(page, wait_unique(page.get_by_text(re.compile(r'^\s*OK\s*$', re.IGNORECASE)), 'Calendar OK'))
              except Exception:
                  save_calendar_diagnostic(page)
                  raise
              return wait_applied_report(page)


          def download_rows(page):
              return page.get_by_role('row').filter(has_text='Filter: Custom').filter(visible=True)


          def downloads_view_ready(page):
              labels = ('File Details', 'Records', 'Status', 'Created', 'Action')
              found = []
              for label in labels:
                  pattern = re.compile(r'^\s*' + r'\s+'.join(label.split()) + r'\s*$', re.IGNORECASE)
                  found.append(bool(visible_items(page.get_by_text(pattern))))
              if visible_items(page.get_by_text('Export Data', exact=True)):
                  return False
              if found[0] and sum(found) >= 3:
                  return True
              empty = re.compile(r'^\s*(?:No (?:data|downloads|records|exports)(?: found| available| yet)?)[.!]?\s*$', re.IGNORECASE)
              return bool(visible_items(page.get_by_text(empty)))


          def export_row_metadata(page):
              import hashlib
              from urllib.parse import parse_qsl, urlencode
              result = []
              rows = download_rows(page)
              for index in range(rows.count()):
                  row = rows.nth(index)
                  cells = row.get_by_role('cell')
                  if cells.count() < 5:
                      continue
                  stable = row.get_attribute('data-export-id') or row.get_attribute('data-file-id')
                  if stable:
                      stable = 'export-id:' + stable
                  else:
                      links = cells.nth(4).locator('a[href]')
                      targets = set()
                      for link in visible_items(links):
                          href = link.get_attribute('href') or ''
                          parsed = urlparse(href)
                          if parsed.scheme not in ('', 'https', 'http') or parsed.path in ('', '/'):
                              continue
                          # Ignore expiring signatures; never store signed download URLs in diagnostics.
                          ids = [(key, value) for key, value in parse_qsl(parsed.query)
                                 if key.lower() in ('id', 'file', 'file_id', 'export', 'export_id', 'filename', 'key')]
                          targets.add(parsed.netloc + parsed.path + '?' + urlencode(sorted(ids)))
                      if len(targets) == 1:
                          stable = 'download:' + targets.pop()
                  result.append({
                      'index': index,
                      'details': ' '.join(cells.nth(0).inner_text().split()),
                      'records': cells.nth(1).inner_text().strip(),
                      'status': cells.nth(2).inner_text().strip(),
                      'created': ' '.join(cells.nth(3).inner_text().split()),
                      'file_key': hashlib.sha256(stable.encode()).hexdigest() if stable else '',
                  })
              return result


          def export_identity(row):
              return row['details'], row['created'], row.get('file_key', '')


          def export_created_minute(row):
              value = re.sub(r'\s+(?:Kolkata|IST|Asia/Kolkata)\s*$', '', row['created'], flags=re.I).strip()
              for fmt in ('%d %b %Y / %I:%M %p', '%d %B %Y / %I:%M %p',
                          '%d %b %Y %I:%M %p', '%Y-%m-%d %H:%M:%S', '%Y-%m-%d %H:%M'):
                  try:
                      return datetime.strptime(value, fmt).replace(tzinfo=ZoneInfo(TZ_NAME), second=0, microsecond=0)
                  except ValueError:
                      pass
              return None


          def new_export_rows(before, current, requested_at=None):
              # A surplus count of identical display rows cannot identify which row is new.
              # Only a unique, previously unseen identity is eligible for download.
              from collections import Counter
              old = {export_identity(row) for row in before}
              counts = Counter(export_identity(row) for row in current)
              result = []
              for row in current:
                  key = export_identity(row)
                  if key in old or counts[key] != 1:
                      continue
                  # A missing file key becoming available on an old pending row is not a new export.
                  if any((prior['details'], prior['created']) == (row['details'], row['created'])
                         and not prior.get('file_key') for prior in before):
                      continue
                  if requested_at is not None:
                      created = export_created_minute(row)
                      if created is None or not requested_at.replace(second=0, microsecond=0) <= created <= datetime.now(ZoneInfo(TZ_NAME)):
                          continue
                  result.append(row)
              return result


          def completed_export_candidates(before, current, requested_at=None):
              return [row for row in new_export_rows(before, current, requested_at)
                      if row['status'].strip().casefold() == 'completed']


          def wait_downloads_snapshot(page):
              deadline = time.monotonic() + 45
              previous, stable_since = None, None
              while time.monotonic() < deadline:
                  if downloads_view_ready(page):
                      texts = export_row_metadata(page)
                      if texts != previous:
                          previous, stable_since = texts, time.monotonic()
                      elif time.monotonic() - stable_since >= 3:
                          print('Downloads view verified; existing custom exports:', len(texts))
                          return texts
                  else:
                      previous, stable_since = None, None
                  time.sleep(0.5)
              labels = ('Downloads', 'File Details', 'Records', 'Status', 'Created', 'Action', 'Export Data')
              known_counts = {}
              for label in labels:
                  pattern = re.compile(r'^\s*' + r'\s+'.join(label.split()) + r'\s*$', re.IGNORECASE)
                  known_counts[label] = len(visible_items(page.get_by_text(pattern)))
              print('Downloads view label counts:', known_counts)
              Path('diagnostics').mkdir(exist_ok=True)
              Path('diagnostics/downloads-view.json').write_text(json.dumps(known_counts, indent=2))
              raise RuntimeError('Downloads view not confirmed; see downloads-view diagnostics. No export was started.')


          def validate_and_reduce_export(path):
              """Keep every record dated within the chosen range; reduce to name, email, phone."""
              with path.open(encoding='utf-8-sig', newline='') as source:
                  reader = csv.DictReader(source)
                  required = ('first_name', 'email', 'phone', 'created_at')
                  if any(key not in (reader.fieldnames or []) for key in required):
                      raise RuntimeError('CSV is missing required identity/timestamp columns.')
                  identities, downloaded, before_cutoff = [], 0, 0
                  for record in reader:
                      downloaded += 1
                      timestamp = datetime.strptime(record['created_at'].strip(), '%b %d, %Y %I:%M %p (IST)')
                      if not RANGE_START <= timestamp.date() <= RANGE_END:
                          raise RuntimeError('Export contains a record dated ' + timestamp.date().isoformat()
                                             + ', outside the requested range.')
                      if WINDOW_START.time() != datetime.min.time() and timestamp <= WINDOW_START:
                          before_cutoff += 1   # signed up before the switch-over: previous webinar
                          continue
                      identities.append({'name': record['first_name'].strip(), 'email': record['email'].strip(),
                                         'phone': record['phone'].strip()})
              with path.open('w', encoding='utf-8-sig', newline='') as output:
                  writer = csv.DictWriter(output, fieldnames=['name', 'email', 'phone'])
                  writer.writeheader()
                  writer.writerows(identities)
              print(path.name + ': downloaded=' + str(downloaded) + ' | before ' + WINDOW_START.strftime('%Y-%m-%d %H:%M')
                    + ' (dropped)=' + str(before_cutoff) + ' | kept=' + str(len(identities)))
              return len(identities)


          def save_export_diagnostic(label, count, before, current):
              Path('diagnostics').mkdir(exist_ok=True)
              Path('diagnostics/' + label + '-export.json').write_text(json.dumps({
                  'live_report_count_for_information_only': count,
                  'date_range': [RANGE_START.isoformat(), RANGE_END.isoformat()],
                  'before': before, 'last_observed': current,
                  'new_rows': new_export_rows(before, current),
              }, indent=2))


          def export_current_report(page, label):
              click_text(page, 'Downloads')
              before = wait_downloads_snapshot(page)
              click_text(page, 'Reports')
              require_project(page)
              # Switching tabs can reset the date control. Apply the range AFTER
              # the Downloads snapshot; do not switch tabs again before exporting.
              count = set_recorded_date_range(page)
              if not applied_range_matches(page):
                  raise RuntimeError('Date range changed immediately before export; stopping.')
              click_unobstructed(page, wait_unique(page.get_by_text('Export Data', exact=True), 'Export Data'))
              requested_at = datetime.now(ZoneInfo(TZ_NAME))
              click_text(page, 'Filtered Data')
              print('Export requested at:', requested_at.isoformat())
              click_text(page, 'Downloads')
              deadline = time.monotonic() + 600
              refresh_at = time.monotonic() + 8
              current, last_observed = [], None
              while time.monotonic() < deadline:
                  require_project(page)
                  current = export_row_metadata(page)
                  fresh = new_export_rows(before, current, requested_at)
                  observed = [(row['records'], row['status'], row['created']) for row in fresh]
                  if observed != last_observed:
                      print(label + ': verified new export states (records, status, created):', observed)
                      last_observed = observed
                  if len(fresh) > 1:
                      save_export_diagnostic(label, count, before, current)
                      raise RuntimeError('Multiple fresh exports appeared; cannot identify this run uniquely.')
                  candidates = completed_export_candidates(before, current, requested_at)
                  if len(candidates) == 1:
                      chosen = candidates[0]
                      # Re-resolve after metadata collection so a reordered table cannot select an old row.
                      latest = export_row_metadata(page)
                      matching = [row for row in latest if export_identity(row) == export_identity(chosen)]
                      if len(matching) == 1 and matching[0]['status'].strip().casefold() == 'completed':
                          chosen = matching[0]
                          first = download_rows(page).nth(chosen['index'])
                          numeric_count = chosen['records'].replace(',', '').strip()
                          if not numeric_count.isdigit():
                              raise RuntimeError('Completed export has no unambiguous record count.')
                          with page.expect_download(timeout=60000) as event:
                              click_unobstructed(page, wait_unique(first.get_by_text('Download', exact=True), 'new export Download'))
                          download = event.value
                          if download.failure():
                              raise RuntimeError('CSV download failed.')
                          path = Path('reports') / (label + '.csv')
                          download.save_as(str(path))
                          with path.open(encoding='utf-8-sig', newline='') as source:
                              reader = csv.DictReader(source)
                              downloaded_count = sum(1 for _ in reader)
                          if downloaded_count != int(numeric_count):
                              raise RuntimeError('CSV row count disagrees with the selected completed export; stopping.')
                          total = validate_and_reduce_export(path)
                          print(label + ': CSV verified; records=' + str(total))
                          return
                  if time.monotonic() >= refresh_at:
                      # Some Downloads tables do not poll automatically. Refresh only the view,
                      # never submit another export or reload the project/page selection.
                      click_text(page, 'Reports')
                      click_text(page, 'Downloads')
                      wait_downloads_snapshot(page)
                      refresh_at = time.monotonic() + 8
                  time.sleep(2)
              save_export_diagnostic(label, count, before, current)
              Path('diagnostics/' + label + '-request.json').write_text(json.dumps({
                  'requested_at': requested_at.isoformat(),
                  'eligible_rows': new_export_rows(before, current, requested_at),
              }, indent=2))
              raise RuntimeError('No uniquely identifiable fresh completed export appeared within 10 minutes. '
                                 'Old or indistinguishable rows were ignored; no older CSV was used.')


          Path('reports').mkdir(exist_ok=True)
          Path('reports/report-window.json').write_text(json.dumps({'plan': PLAN}))
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              context = browser.new_context(viewport={'width': 1440, 'height': 900}, accept_downloads=True, timezone_id=TZ_NAME)
              page = context.new_page()
              page.set_default_timeout(15000)
              try:
                  login(page)
                  select_saurabh(page)
                  page = locate_switched_page(context, page)
                  page.set_default_timeout(15000)
                  for label, published_url in [('funnel-agent', LANDING_URL), ('flexi-genie-regteam', REG_URL)]:
                      open_page_from_project_sidebar(page, published_url)
                      verify_overview(page, published_url)
                      open_recorded_reports(page, published_url)
                      export_current_report(page, label)
                  print('VERSION 24.5: both CSVs verified; Google Sheets untouched in this job.')
              except Exception as error:
                  try:
                      save_navigation_diagnostic(page, [])
                  except Exception:
                      pass
                  print('VERSION 24.5 stopped:', type(error).__name__, str(error))
                  raise RuntimeError('Report automation failed; no fallback export was attempted.') from None
              finally:
                  browser.close()
          PY
      - name: Upload report-control diagnostics if verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flexifunnels-calendar-diagnostics-${{ github.run_id }}
          path: diagnostics/*
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload verified CSV reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flexifunnels-reports-${{ github.run_id }}
          path: reports/*
          if-no-files-found: error
          retention-days: 7

  zoom:
    name: Download Zoom registrants for the chosen webinar date
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download this run's inputs (UTM snapshot with run plan)
        uses: actions/download-artifact@v4
        with:
          name: utm-source-${{ github.run_id }}
          path: utm
      - name: Install Playwright
        run: |
          python -m pip install "playwright>=1.51,<2" cryptography
          python -m playwright install --with-deps chromium
      - name: Prepare private session cache key
        id: zoom-session-key
        env:
          ZOOM_STORAGE_STATE_B64: ${{ secrets.ZOOM_STORAGE_STATE_B64 }}
        run: |
          python - <<'PY'
          import hashlib, os
          seed = os.environ['ZOOM_STORAGE_STATE_B64'].strip()
          if not seed:
              raise SystemExit('Missing ZOOM_STORAGE_STATE_B64. Run the Zoom session setup first.')
          fingerprint = hashlib.sha256(seed.encode()).hexdigest()[:24]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('fingerprint=' + fingerprint + '\n')
          PY
      - name: Restore encrypted Zoom browser session
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/zoom-session-cache
          key: zoom-session-v1-${{ runner.os }}-${{ steps.zoom-session-key.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zoom-session-v1-${{ runner.os }}-${{ steps.zoom-session-key.outputs.fingerprint }}-
      - name: Reuse Zoom session and download All registrants
        env:
          ZOOM_STORAGE_STATE_B64: ${{ secrets.ZOOM_STORAGE_STATE_B64 }}
        run: |
          python -u - <<'PY'
          """Run plan created once by the prepare job and reused unchanged by every job."""
          import json
          import os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          TZ_NAME = 'Asia/Kolkata'
          PLAN_KEYS = {'timezone', 'ff_start', 'ff_end', 'webinar_date', 'webinar_time', 'slot',
                       'zoom_search_from', 'zoom_search_to', 'captured_at', 'ff_start_time',
                       'ac_date', 'ac_list_id', 'ac_list_name', 'ac_list_scope'}


          def load_plan():
              # The plan travels inside the UTM snapshot artifact (job outputs containing
              # JSON can be silently dropped by GitHub's secret masking).
              from pathlib import Path as _Path
              source = _Path('utm/snapshot.json')
              if not source.is_file():
                  raise RuntimeError('Run plan is missing: utm/snapshot.json was not downloaded from the prepare job.')
              plan = json.loads(source.read_text()).get('plan')
              if not isinstance(plan, dict):
                  raise RuntimeError('Run plan is missing from utm/snapshot.json.')
              if (set(plan) != PLAN_KEYS or plan['timezone'] != TZ_NAME
                      or plan['slot'] not in ('morning', 'evening')
                      or plan['webinar_time'] != ('11:00' if plan['slot'] == 'morning' else '19:30')):
                  raise RuntimeError('Run plan is invalid.')
              for key in ('ff_start', 'ff_end', 'webinar_date', 'zoom_search_from', 'zoom_search_to', 'ac_date'):
                  date.fromisoformat(plan[key])
              datetime.fromisoformat(plan['captured_at'])
              return plan

          """Reuse an explicitly saved Zoom session. Only encrypted state is cached in CI."""
          import base64
          import hashlib
          import zlib
          from pathlib import Path
          from urllib.parse import urlparse

          ZOOM_SESSION_SECRET = 'ZOOM_STORAGE_STATE_B64'
          ZOOM_STATE_LIMIT = 4 * 1024 * 1024


          def zoom_session_host(host):
              return bool(host) and (host == 'zoom.us' or host.endswith('.zoom.us'))


          def validate_zoom_bundle(bundle):
              if not isinstance(bundle, dict) or bundle.get('version') != 1:
                  raise RuntimeError('Saved Zoom session format is unsupported; run the session setup again.')
              state = bundle.get('storage_state')
              if not isinstance(state, dict) or not isinstance(state.get('cookies'), list) or not isinstance(state.get('origins'), list):
                  raise RuntimeError('Saved Zoom session is incomplete; run the session setup again.')
              if not state['cookies']:
                  raise RuntimeError('Saved Zoom session contains no cookies; sign in during setup.')
              for cookie in state['cookies']:
                  if not isinstance(cookie, dict) or not zoom_session_host(cookie.get('domain', '').lstrip('.')):
                      raise RuntimeError('Saved session contains a non-Zoom cookie.')
              for origin in state['origins']:
                  address = urlparse(origin.get('origin', ''))
                  if address.scheme != 'https' or not zoom_session_host(address.hostname):
                      raise RuntimeError('Saved session contains a non-Zoom origin.')
              sessions = bundle.get('session_storage', {})
              if not isinstance(sessions, dict):
                  raise RuntimeError('Saved Zoom session storage is invalid.')
              for origin, entries in sessions.items():
                  address = urlparse(origin)
                  if address.scheme != 'https' or not zoom_session_host(address.hostname):
                      raise RuntimeError('Saved session contains a non-Zoom session origin.')
                  if not isinstance(entries, dict) or not all(isinstance(k, str) and isinstance(v, str) for k, v in entries.items()):
                      raise RuntimeError('Saved Zoom session storage entries are invalid.')
              return bundle


          def decode_zoom_seed(encoded):
              if not encoded or not encoded.strip():
                  raise RuntimeError('Add ZOOM_STORAGE_STATE_B64 using the one-time Zoom session setup.')
              try:
                  compressed = base64.b64decode(encoded.strip(), validate=True)
                  decoder = zlib.decompressobj()
                  raw = decoder.decompress(compressed, ZOOM_STATE_LIMIT + 1)
                  if len(raw) > ZOOM_STATE_LIMIT or not decoder.eof or decoder.unused_data:
                      raise ValueError('invalid size')
                  bundle = json.loads(raw)
              except Exception:
                  raise RuntimeError('Saved Zoom session cannot be read; run the session setup again.') from None
              return validate_zoom_bundle(bundle)


          def zoom_seed_value():
              value = os.environ.get(ZOOM_SESSION_SECRET, '').strip()
              decode_zoom_seed(value)
              return value


          def zoom_cipher(seed):
              from cryptography.fernet import Fernet
              digest = hashlib.sha256(b'flexifunnels-zoom-session-cache-v1\x00' + seed.encode()).digest()
              return Fernet(base64.urlsafe_b64encode(digest))


          def load_zoom_session(seed, cache_file):
              initial = decode_zoom_seed(seed)
              if cache_file.is_file():
                  try:
                      if cache_file.stat().st_size > ZOOM_STATE_LIMIT * 2:
                          raise ValueError('cache too large')
                      raw = zoom_cipher(seed).decrypt(cache_file.read_bytes())
                      cached = validate_zoom_bundle(json.loads(raw))
                      print('Zoom: restored the encrypted browser-session cache.')
                      return cached
                  except Exception:
                      print('Zoom: cache is unavailable or invalid; using the saved initial session.')
              else:
                  print('Zoom: loaded the saved initial browser session.')
              return initial


          def collect_zoom_session(context):
              state = context.storage_state(indexed_db=True)
              state['cookies'] = [c for c in state['cookies'] if zoom_session_host(c['domain'].lstrip('.'))]
              state['origins'] = [o for o in state['origins'] if zoom_session_host(urlparse(o['origin']).hostname)]
              sessions = {}
              for page in context.pages:
                  address = urlparse(page.url)
                  if address.scheme == 'https' and zoom_session_host(address.hostname):
                      origin = address.scheme + '://' + address.netloc
                      sessions[origin] = page.evaluate('() => Object.fromEntries(Object.entries(sessionStorage))')
              return validate_zoom_bundle({'version': 1, 'storage_state': state, 'session_storage': sessions})


          def install_zoom_session_storage(context, bundle):
              serialized = json.dumps(bundle.get('session_storage', {}))
              context.add_init_script(script='''(() => {
                  const states = ''' + serialized + ''';
                  const entries = states[window.location.origin];
                  if (entries) for (const [key, value] of Object.entries(entries)) {
                      if (window.sessionStorage.getItem(key) === null) window.sessionStorage.setItem(key, value);
                  }
              })();''')


          def save_zoom_session_cache(context, seed, cache_file):
              bundle = collect_zoom_session(context)
              payload = zoom_cipher(seed).encrypt(json.dumps(bundle, separators=(',', ':')).encode())
              cache_file.parent.mkdir(parents=True, exist_ok=True)
              os.chmod(cache_file.parent, 0o700)
              temporary = cache_file.with_suffix('.tmp')
              fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(payload)
              os.replace(temporary, cache_file)
              print('Zoom: refreshed session saved to the encrypted cache.')

          """Parse the observed Zoom Registration Report format, not attendance reports."""
          import csv
          import re

          ZOOM_TOPIC = 'Launch Your Business Online in 10 Minutes — Directly From Your Phone | Live Build'


          def zoom_text(value):
              return ' '.join(value.split())


          def zoom_phone_candidate(value):
              value = value.strip()
              if not re.fullmatch(r'\+?[0-9][0-9\s().-]*', value):
                  return None
              digits = re.sub(r'[^0-9]', '', value)
              if digits.startswith('00'):
                  digits = digits[2:]
              if not 10 <= len(digits) <= 15:
                  return None
              if len(digits) == 12 and digits.startswith('91'):
                  digits = digits[2:]
              return digits


          def clean_zoom_identity(record, phone_columns=('Phone',)):
              """Keep name/email/phone; move phone numbers typed into a name field to the phone cell."""
              first = str(record.get('First Name', '')).strip()
              last = str(record.get('Last Name', '')).strip()
              phone = ''
              for column in phone_columns:
                  value = str(record.get(column, '')).strip()
                  if value.casefold() not in ('', '-', 'n/a', 'na', 'none', 'null') and zoom_phone_candidate(value):
                      phone = value
                      break
              repaired = False
              names = {'first': first, 'last': last}
              for part in ('last', 'first'):
                  text = names[part]
                  found = [match for match in re.finditer(r'(?<!\w)\+?[0-9][0-9\s().-]*[0-9](?!\w)', text)
                           if zoom_phone_candidate(match.group())]
                  if not found:
                      continue
                  if not phone:
                      phone = found[0].group().strip()
                  for match in reversed(found):
                      text = text[:match.start()] + ' ' + text[match.end():]
                  names[part] = ' '.join(text.split()).strip(' ,;|-/')
                  repaired = True
              return {'name': zoom_text(' '.join(filter(None, [names['first'], names['last']]))),
                      'email': str(record.get('Email', '')).strip(), 'phone': phone}, repaired


          def zoom_session_matches(scheduled, plan):
              return (scheduled.date().isoformat() == plan['webinar_date']
                      and scheduled.strftime('%H:%M') == plan['webinar_time'])


          def read_zoom_export(path, plan, expected_id=None):
              with path.open(encoding='utf-8-sig', newline='') as source:
                  rows = [[cell.strip() for cell in row] for row in csv.reader(source)]
              if not rows or rows[0][:1] != ['Registration Report']:
                  raise RuntimeError('Zoom file is not the recorded Registration Report CSV.')
              metadata_headers = ['Topic', 'ID', 'Scheduled Time', 'Duration (minutes)', '# Registrants',
                                  '# Cancelled registrants', '# Approved registrants', '# Denied registrants']
              meta_indices = [i for i, row in enumerate(rows) if row[:len(metadata_headers)] == metadata_headers]
              required_contact_headers = ['First Name', 'Last Name', 'Email']
              contact_indices = [i for i, row in enumerate(rows)
                                 if all(header in row for header in required_contact_headers)]
              if len(meta_indices) != 1 or len(contact_indices) != 1:
                  raise RuntimeError('Zoom CSV metadata/contact headers are missing or ambiguous.')
              m, h = meta_indices[0], contact_indices[0]
              contact_headers = rows[h]
              if any(contact_headers.count(header) != 1 for header in required_contact_headers):
                  raise RuntimeError('Zoom contact headers are duplicated or ambiguous.')
              if m + 1 >= len(rows) or h <= m + 1:
                  raise RuntimeError('Zoom CSV report structure is incomplete.')
              meta = dict(zip(metadata_headers, rows[m + 1]))
              if zoom_text(meta['Topic']) != zoom_text(ZOOM_TOPIC):
                  raise RuntimeError('Zoom CSV is for a different webinar topic.')
              scheduled = datetime.strptime(meta['Scheduled Time'], '%m/%d/%Y %I:%M:%S %p')
              if not zoom_session_matches(scheduled, plan):
                  raise RuntimeError('Zoom CSV webinar date/time does not match the chosen webinar.')
              webinar_id = re.sub(r'\s+', '', meta['ID'])
              if not webinar_id.isascii() or not webinar_id.isdigit():
                  raise RuntimeError('Zoom CSV webinar ID is invalid.')
              if expected_id is not None and webinar_id != re.sub(r'\s+', '', expected_id):
                  raise RuntimeError('Downloaded Zoom CSV does not match the selected webinar ID.')
              phone_columns = [header for header in contact_headers if header == 'Phone']
              phone_columns += [header for header in contact_headers if header != 'Phone'
                                and re.search(r'phone|mobile|whats\s*app|contact\s*(no|num)', header, re.I)]
              contacts = []
              repaired_names = skipped = 0
              for row in rows[h + 1:]:
                  if not row or not any(row):
                      continue
                  row = (row + [''] * len(contact_headers))[:len(contact_headers)]
                  record = dict(zip(contact_headers, row))
                  if '@' not in record.get('Email', ''):
                      skipped += 1
                      continue
                  contact, repaired = clean_zoom_identity(record, phone_columns)
                  contacts.append(contact)
                  repaired_names += int(repaired)
              count = int(str(meta['# Registrants']).replace(',', '') or 0)
              if count != len(contacts):
                  print('Zoom CSV note: report header says', count, 'registrants;', len(contacts),
                        'registrant rows read;', skipped, 'non-registrant rows skipped.')
              with_phone = sum(1 for contact in contacts if contact['phone'])
              print('Zoom CSV: phone columns used:', phone_columns or 'none', '| registrants with a phone:',
                    with_phone, 'of', len(contacts), '| phone moved out of a name field:', repaired_names)
              contacts.sort(key=lambda row: (row['name'].casefold(), row['email'].casefold(), row['phone']))
              return contacts, {'topic': ZOOM_TOPIC, 'webinar_id': webinar_id,
                                'scheduled_time': meta['Scheduled Time'], 'plan': plan,
                                'report_type': 'All registrants', 'downloaded_count': len(contacts),
                                'last_name_phone_rows_repaired': repaired_names}


          def save_zoom_contacts(raw_path, outdir, plan, expected_id):
              contacts, meta = read_zoom_export(raw_path, plan, expected_id)
              outdir.mkdir(exist_ok=True)
              path = outdir / 'registrants.csv'
              with path.open('w', encoding='utf-8-sig', newline='') as output:
                  writer = csv.DictWriter(output, fieldnames=['name', 'email', 'phone'])
                  writer.writeheader()
                  writer.writerows(contacts)
              meta.update({'search_from': plan['zoom_search_from'], 'search_to': plan['zoom_search_to'],
                           'csv_sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
              (outdir / 'manifest.json').write_text(json.dumps(meta, indent=2))
              return meta

          """Zoom portal export based on the supplied recording; no ActiveCampaign fallback."""
          import time
          import tempfile
          from urllib.parse import parse_qsl, urlencode
          from playwright.sync_api import sync_playwright, TimeoutError as ZoomTimeout


          def zoom_visible(locator):
              return [locator.nth(i) for i in range(locator.count()) if locator.nth(i).is_visible()]


          def zoom_one(locator, description, seconds=30):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  visible = zoom_visible(locator)
                  if len(visible) == 1:
                      return visible[0]
                  time.sleep(0.3)
              raise RuntimeError('Zoom ' + description + ' is missing or ambiguous.')


          def zoom_click(page, text):
              zoom_one(page.get_by_text(text, exact=True), text).click()


          def verify_saved_zoom_login(page):
              print('Zoom: checking the saved browser session; no password sign-in will be attempted.')
              page.goto('https://us06web.zoom.us/profile', wait_until='domcontentloaded')
              try:
                  zoom_one(page.get_by_text('Reports', exact=True), 'signed-in Reports navigation', seconds=45)
                  address = urlparse(page.url)
                  if not zoom_session_host(address.hostname) or address.path.rstrip('/') != '/profile':
                      raise RuntimeError('Session not authenticated')
              except (RuntimeError, ZoomTimeout):
                  raise RuntimeError('Zoom session expired or was not accepted on this runner. Run the Zoom '
                                     'session setup again and replace ZOOM_STORAGE_STATE_B64. '
                                     'No password retries, authentication bypass, or Sheets writes were attempted.') from None
              print('Zoom: saved sign-in verified.')


          def zoom_date_value(value):
              value = ' '.join(str(value).split())
              for pattern in ('%m/%d/%Y', '%Y-%m-%d', '%Y/%m/%d', '%m-%d-%Y',
                              '%b %d, %Y', '%B %d, %Y', '%d %b %Y', '%d %B %Y'):
                  try:
                      return datetime.strptime(value, pattern).date()
                  except ValueError:
                      pass
              return None


          def zoom_route(page):
              parsed = urlparse(page.url)
              return parsed.path + ('#' + parsed.fragment if parsed.fragment else '')


          def zoom_on_registration_report(page):
              return 'meetingRegistration' in urlparse(page.url).fragment


          def zoom_url_params(page):
              query = urlparse(page.url).fragment.partition('?')[2]
              return dict(parse_qsl(query, keep_blank_values=True))


          def zoom_url_range(page):
              params = zoom_url_params(page)
              try:
                  return (date.fromisoformat(params['dateFrom']), date.fromisoformat(params['dateTo']))
              except (KeyError, ValueError):
                  return None


          def zoom_input_range(page):
              try:
                  start = zoom_box_value(zoom_date_box(page, 'From', seconds=2))
                  end = zoom_box_value(zoom_date_box(page, 'To', seconds=2))
              except RuntimeError:
                  return None
              return (start, end) if start and end else None


          def zoom_displayed_range(page):
              boxes = zoom_input_range(page)
              address = zoom_url_range(page)
              if boxes and address and boxes != address:
                  print('Zoom: note - date boxes show', boxes, 'but the address says', address, '; using the boxes.')
              return boxes or address


          def zoom_filter_diagnostic(page, event_date):
              Path('zoom-diagnostics').mkdir(exist_ok=True)
              try:
                  inputs = page.evaluate('''() => Array.from(document.querySelectorAll('input')).map(el => ({
                      type: el.type, placeholder: el.placeholder, readonly: el.readOnly,
                      visible: el.offsetParent !== null, cls: String(el.className || ''),
                      value: /^\\d{1,4}[\\/-]\\d{1,2}[\\/-]\\d{1,4}$/.test(el.value || '') ? el.value : (el.value ? '[text]' : '')
                  }))''')
              except Exception:
                  inputs = []
              (Path('zoom-diagnostics') / 'filters.json').write_text(json.dumps({
                  'event_date': event_date.isoformat(), 'route': zoom_route(page), 'inputs': inputs}, indent=2))
              try:
                  page.screenshot(path='zoom-diagnostics/filters.png', full_page=True)
              except Exception:
                  pass


          def zoom_click_first(page, texts, description, seconds=30):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  for text in texts:
                      found = (zoom_visible(page.get_by_role('link', name=text, exact=True))
                               or zoom_visible(page.get_by_text(text, exact=True)))
                      if found:
                          found[0].click()
                          return text
                  time.sleep(0.5)
              raise RuntimeError('Zoom ' + description + ' was not found.')


          def open_registration_report(page):
              print('Zoom: Profile -> Reports -> Meetings & Webinars -> Meeting and webinar registrations.')
              if urlparse(page.url).path.rstrip('/') != '/profile':
                  page.goto('https://us06web.zoom.us/profile', wait_until='domcontentloaded')
              if not zoom_visible(page.get_by_text('Meetings & Webinars', exact=True)):
                  zoom_click_first(page, ['Reports'], 'Reports menu')
                  page.wait_for_timeout(1500)
              zoom_click_first(page, ['Meetings & Webinars', 'Meetings and Webinars'], 'Meetings & Webinars menu')
              page.wait_for_timeout(2500)
              deadline = time.monotonic() + 60
              while time.monotonic() < deadline and not zoom_on_registration_report(page):
                  links = (zoom_visible(page.get_by_role('link', name='Meeting and webinar registrations', exact=True))
                           or zoom_visible(page.get_by_text('Meeting and webinar registrations', exact=True))
                           or zoom_visible(page.get_by_text(re.compile(r'^\s*Meeting and webinar registrations?\s*$', re.I))))
                  if links:
                      links[0].click()
                      page.wait_for_timeout(2500)
                  else:
                      time.sleep(0.5)
              if not zoom_on_registration_report(page):
                  zoom_filter_diagnostic(page, date.today())
                  print('Zoom: route reached:', zoom_route(page))
                  raise RuntimeError('Could not open the Meeting and webinar registrations report. See filters.png.')
              zoom_one(page.get_by_text('From', exact=True), 'From label', seconds=45)
              zoom_one(page.get_by_text('To', exact=True), 'To label', seconds=15)
              print('Zoom: registrations report opened.')


          ZOOM_BOX_JS = '''(label) => {
              const visible = el => {
                  const r = el.getBoundingClientRect(), s = getComputedStyle(el);
                  return r.width > 0 && r.height > 0 && s.visibility !== 'hidden' && s.display !== 'none';
              };
              document.querySelectorAll('[data-ff-box="' + label + '"]').forEach(el => el.removeAttribute('data-ff-box'));
              let labels = Array.from(document.querySelectorAll('body *'))
                  .filter(el => visible(el) && (el.innerText || '').trim() === label);
              labels = labels.filter(el => !labels.some(other => other !== el && el.contains(other)));
              if (labels.length !== 1) return {status: 'label', count: labels.length};
              const L = labels[0].getBoundingClientRect();
              const middle = (L.top + L.bottom) / 2;
              const sameRowRight = el => {
                  const r = el.getBoundingClientRect();
                  return Math.abs((r.top + r.bottom) / 2 - middle) <= 25 && r.left >= L.right - 2;
              };
              const dateRe = /^\\s*\\d{1,2}\\/\\d{1,2}\\/\\d{4}\\s*$/;
              let best = null;
              for (const el of document.querySelectorAll('body *')) {
                  if (!visible(el) || !sameRowRight(el)) continue;
                  const text = el.tagName === 'INPUT' ? (el.value || '') : (el.children.length ? '' : (el.textContent || ''));
                  if (!dateRe.test(text)) continue;
                  const left = el.getBoundingClientRect().left;
                  if (!best || left < best[0]) best = [left, el];
              }
              if (!best) {
                  for (const el of document.querySelectorAll('input, [role="combobox"], [class*="date" i], [class*="picker" i]')) {
                      if (!visible(el) || !sameRowRight(el) || /search/i.test(el.getAttribute('placeholder') || '')) continue;
                      const left = el.getBoundingClientRect().left;
                      if (!best || left < best[0]) best = [left, el];
                  }
              }
              if (!best) return {status: 'box'};
              best[1].setAttribute('data-ff-box', label);
              return {status: 'ok', tag: best[1].tagName, text: best[1].tagName === 'INPUT' ? best[1].value : best[1].textContent.trim()};
          }'''


          def zoom_date_box(page, label, seconds=15):
              deadline = time.monotonic() + seconds
              found = None
              while time.monotonic() < deadline:
                  found = page.evaluate(ZOOM_BOX_JS, label)
                  if found and found.get('status') == 'ok':
                      return page.locator('[data-ff-box="' + label + '"]')
                  time.sleep(0.5)
              raise RuntimeError('Zoom ' + label + ' date box was not found next to its label (' + str(found) + ').')


          def zoom_box_value(box):
              try:
                  return zoom_date_value(box.evaluate("el => el.tagName === 'INPUT' ? el.value : el.innerText"))
              except Exception:
                  return None


          ZOOM_JS_HELPERS = '''
              const allElements = (root, out = []) => {
                  for (const el of root.querySelectorAll('*')) {
                      out.push(el);
                      if (el.shadowRoot) allElements(el.shadowRoot, out);
                  }
                  return out;
              };
              const visible = el => {
                  const r = el.getBoundingClientRect(), s = getComputedStyle(el);
                  return r.width > 0 && r.height > 0 && s.visibility !== 'hidden' && s.display !== 'none'
                         && Number(s.opacity || 1) > 0.05;
              };
              const ownText = el => el.tagName === 'INPUT' ? (el.value || '')
                                   : (el.children.length ? '' : (el.textContent || ''));
          '''

          ZOOM_CALENDAR_JS = '''() => {''' + ZOOM_JS_HELPERS + '''
              const months = ['January','February','March','April','May','June','July','August',
                              'September','October','November','December'];
              const shortMonths = months.map(m => m.slice(0, 3));
              const monthRe = new RegExp('\\\\b(' + months.join('|') + '|' + shortMonths.join('|') + ')\\\\b');
              const everything = allElements(document);
              everything.forEach(el => ['data-ff-cal', 'data-ff-prev', 'data-ff-next'].forEach(a => el.removeAttribute(a)));
              let best = null, bestSize = Infinity;
              const heads0 = everything.filter(el => visible(el) && monthRe.test(ownText(el)));
              for (const head of heads0) {
                  let node = head;
                  for (let depth = 0; depth < 12 && node; depth++) {
                      const inner = allElements(node);
                      const texts = [node, ...inner].filter(c => visible(c)).map(c => ownText(c).trim()).filter(Boolean);
                      const days = texts.filter(t => /^\\d{1,2}$/.test(t));
                      const nums = new Set(days);
                      if (/\\b20\\d\\d\\b/.test(texts.join(' ')) && nums.has('1') && nums.has('15') && nums.has('28')) {
                          if (days.length <= 50 && inner.length < bestSize) { best = node; bestSize = inner.length; }
                          break;
                      }
                      node = node.parentElement || (node.getRootNode && node.getRootNode().host) || null;
                  }
              }
              if (!best) return null;
              best.setAttribute('data-ff-cal', '1');
              const inner = allElements(best).filter(c => visible(c));
              const joined = inner.map(c => ownText(c).trim()).filter(Boolean).join(' ');
              const label = joined.match(monthRe)[1];
              const year = Number((joined.match(/\\b(20\\d\\d)\\b/) || [])[1]);
              const month = (months.indexOf(label) >= 0 ? months.indexOf(label) : shortMonths.indexOf(label)) + 1;
              const heads = inner.filter(c => monthRe.test(ownText(c)) || /^\\s*20\\d\\d\\s*$/.test(ownText(c)));
              if (heads.length) {
                  const boxes = heads.map(h => h.getBoundingClientRect());
                  const left = Math.min(...boxes.map(b => b.left)), right = Math.max(...boxes.map(b => b.right));
                  const middle = (Math.min(...boxes.map(b => b.top)) + Math.max(...boxes.map(b => b.bottom))) / 2;
                  let prev = null, next = null;
                  for (const c of inner) {
                      if (heads.includes(c) || !/^(BUTTON|A|I|SVG|SPAN)$/i.test(c.tagName) && c.getAttribute('role') !== 'button') continue;
                      const r = c.getBoundingClientRect();
                      const t = (c.innerText || '').trim();
                      if (r.width > 40 || Math.abs((r.top + r.bottom) / 2 - middle) > 15) continue;
                      if (t && !/^[<>‹›«»]+$/.test(t)) continue;
                      const centre = (r.left + r.right) / 2;
                      if (centre < left && (!prev || centre > prev[0])) prev = [centre, c];
                      if (centre > right && (!next || centre < next[0])) next = [centre, c];
                  }
                  if (prev) prev[1].setAttribute('data-ff-prev', '1');
                  if (next) next[1].setAttribute('data-ff-next', '1');
              }
              return {year: year, month: month};
          }'''


          def zoom_calendar(page, seconds=6):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  found = page.evaluate(ZOOM_CALENDAR_JS)
                  if found and found.get('year') and found.get('month'):
                      return page.locator('[data-ff-cal="1"]'), (found['year'], found['month'])
                  time.sleep(0.3)
              return None, None


          def zoom_save_popup_diagnostic(page, label):
              Path('zoom-diagnostics').mkdir(exist_ok=True)
              try:
                  page.screenshot(path='zoom-diagnostics/calendar-' + label.lower() + '.png', full_page=True)
                  html = page.evaluate('''() => Array.from(document.body.children).slice(-6)
                                              .map(el => el.outerHTML.slice(0, 15000)).join('\\n<!-- next -->\\n')''')
                  (Path('zoom-diagnostics') / ('calendar-' + label.lower() + '.html')).write_text(html)
              except Exception:
                  pass


          def zoom_safe_click(page, locator, description, timeout=3000):
              try:
                  locator.click(timeout=timeout)
                  return
              except Exception:
                  pass
              locator.scroll_into_view_if_needed(timeout=3000)
              box = locator.bounding_box()
              if not box:
                  raise RuntimeError('Zoom ' + description + ' has no position on screen.')
              page.mouse.click(box['x'] + box['width'] / 2, box['y'] + box['height'] / 2)


          ZOOM_CONTROL_JS = r"""(el) => {
              const visible = n => { const r = n.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
              document.querySelectorAll('[data-ff-control]').forEach(n => n.removeAttribute('data-ff-control'));
              if (el.id) {
                  const linked = Array.from(document.querySelectorAll('[aria-labelledby], [aria-describedby]'))
                      .find(n => (' ' + (n.getAttribute('aria-labelledby') || '') + ' ' + (n.getAttribute('aria-describedby') || '') + ' ')
                                 .includes(' ' + el.id + ' '));
                  if (linked) { linked.setAttribute('data-ff-control', '1'); return linked.tagName; }
              }
              let node = el;
              for (let i = 0; i < 5 && node; i++, node = node.parentElement) {
                  const found = node.querySelector('input:not([type="hidden"]), [role="combobox"], [role="button"], button');
                  if (found) { found.setAttribute('data-ff-control', '1'); return found.tagName; }
              }
              const r = el.getBoundingClientRect();
              const top = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
              if (top && top !== el) { top.setAttribute('data-ff-control', '1'); return top.tagName; }
              return null;
          }"""


          def zoom_box_control(page, box):
              tag = box.evaluate(ZOOM_CONTROL_JS)
              return page.locator('[data-ff-control="1"]').first if tag else None


          def zoom_try_open_calendar(page, box, label):
              attempts = [('date box', lambda: zoom_safe_click(page, box, label + ' date box'))]
              control = zoom_box_control(page, box)
              if control is not None:
                  attempts.append(('linked control', lambda: zoom_safe_click(page, control, label + ' date control')))
              icons = zoom_visible(box.locator('xpath=ancestor::*[3]').locator('svg, i, [class*="icon"]'))
              if icons:
                  attempts.append(('calendar icon', lambda: zoom_safe_click(page, icons[0], label + ' calendar icon')))
              for name, action in attempts:
                  try:
                      action()
                  except Exception as error:
                      print('Zoom: ' + label + ' ' + name + ' not clickable (' + type(error).__name__ + ').')
                      continue
                  popup, shown = zoom_calendar(page, seconds=4)
                  if popup is not None:
                      print('Zoom: ' + label + ' calendar opened via ' + name + '.')
                      return popup, shown
              zoom_save_popup_diagnostic(page, label)
              page.keyboard.press('Escape')
              page.wait_for_timeout(300)
              return None, None


          def zoom_close_calendar(page):
              popup, _ = zoom_calendar(page, seconds=1)
              if popup is None:
                  return
              notes = zoom_visible(page.get_by_text(re.compile(r'Maximum report duration', re.I)))
              if notes:
                  notes[0].click()
              else:
                  page.keyboard.press('Escape')
              page.wait_for_timeout(500)


          def zoom_click_calendar_day(page, popup, shown, target):
              wanted = (target.year, target.month)
              for _ in range(24):
                  if shown == wanted:
                      break
                  arrow = page.locator('[data-ff-prev="1"]' if shown > wanted else '[data-ff-next="1"]')
                  if arrow.count() != 1:
                      raise RuntimeError('Zoom calendar month arrows were not found.')
                  zoom_safe_click(page, arrow, 'calendar month arrow')
                  page.wait_for_timeout(500)
                  popup, shown = zoom_calendar(page)
                  if popup is None:
                      raise RuntimeError('Zoom calendar closed while changing month.')
              else:
                  raise RuntimeError('Zoom calendar could not reach ' + target.strftime('%B %Y') + '.')
              cells = popup.locator("xpath=.//*[not(*) and string-length(normalize-space(.)) >= 1 "
                                    "and string-length(normalize-space(.)) <= 2]")
              info = cells.evaluate_all('''els => els.map(el => {
                  const owner = el.closest('td, [role="gridcell"], button') || el.parentElement || el;
                  const cls = String(el.className && el.className.baseVal !== undefined ? el.className.baseVal : (el.className || ''))
                            + ' ' + String(owner.className || '');
                  const r = el.getBoundingClientRect();
                  return {text: (el.textContent || '').trim(), visible: r.width > 0 && r.height > 0,
                          disabled: !!el.closest('[aria-disabled="true"], [disabled]') || /disabled/i.test(cls)};
              })''')
              days = [index for index, cell in enumerate(info) if cell['visible'] and cell['text'].isdigit()]
              first = next((position for position, index in enumerate(days) if info[index]['text'] == '1'), None)
              if first is None or first + target.day - 1 >= len(days):
                  raise RuntimeError('Zoom calendar day grid could not be read.')
              index = days[first + target.day - 1]
              if info[index]['text'] != str(target.day):
                  raise RuntimeError('Zoom calendar day grid is out of order; ' + target.isoformat() + ' not clicked.')
              if info[index]['disabled']:
                  raise RuntimeError('Zoom calendar day ' + target.isoformat() + ' is greyed out (not selectable).')
              zoom_safe_click(page, cells.nth(index), 'calendar day ' + target.isoformat())
              page.wait_for_timeout(800)
              zoom_close_calendar(page)


          def zoom_type_date(page, box, target):
              if box.evaluate("el => el.tagName === 'INPUT'"):
                  field = box
              else:
                  field = zoom_box_control(page, box)
                  if field is None or not field.evaluate("el => el.tagName === 'INPUT' || el.isContentEditable"):
                      return False
              text = target.strftime('%m/%d/%Y')
              field.evaluate('el => el.removeAttribute("readonly")')
              try:
                  zoom_safe_click(page, field, 'date field')
              except Exception:
                  field.focus()
              page.keyboard.press('Control+A')
              page.keyboard.press('Backspace')
              page.keyboard.type(text, delay=40)
              page.keyboard.press('Enter')
              page.wait_for_timeout(800)
              zoom_close_calendar(page)
              page.keyboard.press('Tab')
              page.wait_for_timeout(500)
              return True


          def zoom_pick_date(page, label, target):
              zoom_close_calendar(page)
              box = zoom_date_box(page, label)
              if zoom_box_value(box) == target:
                  print('Zoom: ' + label + ' already', target.isoformat())
                  return True
              method = 'calendar'
              try:
                  popup, shown = zoom_try_open_calendar(page, box, label)
                  if popup is None:
                      raise RuntimeError('no calendar popup found')
                  zoom_click_calendar_day(page, popup, shown, target)
              except Exception as error:
                  print('Zoom: ' + label + ' calendar route failed (' + type(error).__name__ + ': '
                        + ' '.join(str(error).split())[:200] + '); typing the date instead.')
                  zoom_save_popup_diagnostic(page, label)
                  page.keyboard.press('Escape')
                  method = 'typing'
                  try:
                      if not zoom_type_date(page, zoom_date_box(page, label), target):
                          print('Zoom: ' + label + ' box has no text field to type into.')
                          return False
                  except Exception as error:
                      print('Zoom: ' + label + ' typing failed (' + type(error).__name__ + ': '
                            + ' '.join(str(error).split())[:200] + ').')
                      return False
              value = zoom_box_value(zoom_date_box(page, label, seconds=5))
              print('Zoom: ' + label + ' ->', value.isoformat() if value else 'unreadable', 'via', method,
                    '(wanted ' + target.isoformat() + ')')
              return value == target


          def zoom_set_dates_by_address(page, start, end):
              route, _, query = urlparse(page.url).fragment.partition('?')
              params = dict(parse_qsl(query, keep_blank_values=True))
              params.update({'dateFrom': start.isoformat(), 'dateTo': end.isoformat(), 'page': '1'})
              page.evaluate('h => { window.location.hash = h; }', route + '?' + urlencode(params))
              page.reload(wait_until='domcontentloaded')
              page.wait_for_timeout(4000)


          def zoom_set_dates(page, start, end, event_date):
              for attempt in range(2):
                  ok_from = zoom_pick_date(page, 'From', start)
                  ok_to = zoom_pick_date(page, 'To', end)
                  shown = zoom_input_range(page)
                  if shown == (start, end):
                      print('Zoom: date range set to', start.isoformat(), 'to', end.isoformat())
                      return
                  print('Zoom: date range now', shown, '(From ok:', ok_from, ', To ok:', ok_to, ')')
              print('Zoom: trying the page address to set the dates.')
              zoom_set_dates_by_address(page, start, end)
              if not zoom_on_registration_report(page):
                  open_registration_report(page)
              shown = zoom_input_range(page)
              if shown == (start, end):
                  print('Zoom: date range set (via page address) to', start.isoformat(), 'to', end.isoformat())
                  return
              zoom_filter_diagnostic(page, event_date)
              raise RuntimeError('Zoom From/To could not be set to ' + start.isoformat() + ' / ' + end.isoformat()
                                 + ' (showing ' + str(shown) + '). See calendar-from.png and calendar-from.html.')


          ZOOM_SCOPE_JS = '''() => {''' + ZOOM_JS_HELPERS + '''
              const everything = allElements(document);
              everything.forEach(el => el.removeAttribute('data-ff-scope'));
              const to = everything.find(el => el.getAttribute('data-ff-box') === 'To');
              const anchor = to ? to.getBoundingClientRect() : null;
              let best = null;
              for (const el of everything) {
                  if (!visible(el)) continue;
                  const text = ownText(el).trim();
                  if (text !== 'Meetings' && text !== 'Webinars') continue;
                  const r = el.getBoundingClientRect();
                  let score = 0;
                  if (anchor) {
                      const sameRow = Math.abs((r.top + r.bottom) / 2 - (anchor.top + anchor.bottom) / 2) <= 25
                                      && r.left >= anchor.right - 2;
                      score = (sameRow ? 0 : 100000) + Math.hypot(r.left - anchor.right, r.top - anchor.top);
                  }
                  if (!best || score < best[0]) best = [score, el, text];
              }
              if (!best) return null;
              best[1].setAttribute('data-ff-scope', '1');
              return best[2];
          }'''


          def zoom_scope(page):
              try:
                  zoom_date_box(page, 'To', seconds=2)
              except RuntimeError:
                  pass
              return page.evaluate(ZOOM_SCOPE_JS)


          def zoom_select_webinars(page):
              for _ in range(4):
                  current = zoom_scope(page)
                  if current == 'Webinars':
                      print('Zoom: report type is Webinars.')
                      return
                  if current == 'Meetings':
                      page.locator('[data-ff-scope="1"]').click()
                      page.wait_for_timeout(800)
                      options = [item for item in zoom_visible(page.get_by_text('Webinars', exact=True))]
                      options += [item for item in zoom_visible(page.get_by_role('option', name='Webinars'))
                                  if item not in options]
                      if options:
                          options[-1].click()
                          page.wait_for_timeout(800)
                  else:
                      time.sleep(1)
              zoom_filter_diagnostic(page, date.today())
              raise RuntimeError('Could not switch the Zoom report from Meetings to Webinars (now: '
                                 + str(zoom_scope(page)) + ').')


          ZOOM_DATETIME = re.compile(r'\b(\d{1,2}/\d{1,2}/\d{4})\s+(\d{1,2}:\d{2}:\d{2})\s*([AP]M)\b')


          def zoom_rows(page):
              result = []
              for button in zoom_visible(page.get_by_text('Generate', exact=True)):
                  row = button.locator("xpath=ancestor::*[self::tr or @role='row'][1]")
                  if row.count() != 1:
                      row = button.locator("xpath=ancestor::*[.//text()[contains(., '/20')]][1]")
                  if row.count() != 1:
                      continue
                  text = zoom_text(row.inner_text())
                  stamp = ZOOM_DATETIME.search(text)
                  meeting_id = re.search(r'\b\d{3}\s?\d{3,4}\s?\d{4}\b', text)
                  result.append({'topic_ok': zoom_text(ZOOM_TOPIC) in text,
                                 'type': 'Webinar' if re.search(r'\bWebinar\b', text) else '',
                                 'scheduled': ' '.join(stamp.groups()) if stamp else '',
                                 'id': meeting_id.group() if meeting_id else '',
                                 'generate': button})
              return result


          def select_zoom_row(records, plan):
              candidates, same_day = [], []
              for record in records:
                  if record['topic_ok'] and record['type'] == 'Webinar' and record['scheduled']:
                      scheduled = datetime.strptime(record['scheduled'], '%m/%d/%Y %I:%M:%S %p')
                      if scheduled.date().isoformat() == plan['webinar_date']:
                          same_day.append(scheduled.strftime('%I:%M %p'))
                      if zoom_session_matches(scheduled, plan):
                          candidates.append(record)
              if len(candidates) != 1:
                  raise RuntimeError('Expected exactly one Zoom webinar with this topic on ' + plan['webinar_date']
                                     + ' at ' + plan['webinar_time'] + ' IST; found ' + str(len(candidates))
                                     + '. Webinars found that day: ' + (', '.join(same_day) or 'none')
                                     + '. Rerun with the right date/time.')
              return candidates[0]


          def zoom_search_buttons(page):
              return (zoom_visible(page.get_by_role('button', name='Search', exact=True))
                      or zoom_visible(page.get_by_text('Search', exact=True)))


          def zoom_search_results(page, event_date):
              records, total = [], 0
              for attempt in range(1, 4):
                  page.keyboard.press('Escape')
                  notes = zoom_visible(page.get_by_text(re.compile(r'Maximum report duration', re.I)))
                  if notes:
                      zoom_safe_click(page, notes[0], 'page background')
                  page.wait_for_timeout(500)
                  if zoom_scope(page) != 'Webinars':
                      zoom_select_webinars(page)
                  buttons = zoom_search_buttons(page)
                  if len(buttons) != 1:
                      zoom_filter_diagnostic(page, event_date)
                      raise RuntimeError('Zoom Search button is missing or ambiguous.')
                  zoom_safe_click(page, buttons[0], 'Search button')
                  page.wait_for_timeout(1500)
                  deadline = time.monotonic() + 90
                  while time.monotonic() < deadline and len(zoom_search_buttons(page)) != 1:
                      time.sleep(0.5)
                  deadline = time.monotonic() + 60
                  stable, since = None, time.monotonic()
                  while time.monotonic() < deadline:
                      totals = zoom_visible(page.get_by_text(re.compile(r'^\s*\d+\s+result\(s\)\s*$')))
                      if len(totals) == 1 and len(zoom_search_buttons(page)) == 1:
                          total = int(re.search(r'\d+', totals[0].inner_text()).group())
                          records = zoom_rows(page) if total else []
                          signature = (total, tuple((r['scheduled'], r['id']) for r in records))
                          if signature != stable:
                              stable, since = signature, time.monotonic()
                          elif time.monotonic() - since >= 5:
                              break
                      time.sleep(0.5)
                  params = zoom_url_params(page)
                  print('Zoom: search attempt', attempt, '-> results =', total, '| type =', zoom_scope(page),
                        '| address says', params.get('dateFrom'), 'to', params.get('dateTo'),
                        'scope', params.get('meetingScope'))
                  if total:
                      return total, records
                  page.wait_for_timeout(3000)
              Path('zoom-diagnostics').mkdir(exist_ok=True)
              try:
                  page.screenshot(path='zoom-diagnostics/results.png', full_page=True)
              except Exception:
                  pass
              return total, records


          def export_zoom(page, plan, outdir):
              event_date = date.fromisoformat(plan['webinar_date'])
              start, end = date.fromisoformat(plan['zoom_search_from']), date.fromisoformat(plan['zoom_search_to'])
              open_registration_report(page)
              zoom_set_dates(page, start, end, event_date)
              zoom_select_webinars(page)
              total, records = zoom_search_results(page, event_date)
              shown = zoom_displayed_range(page)
              print('Zoom: results =', total, '| rows read =', len(records), '| range =',
                    (shown[0].isoformat() + ' to ' + shown[1].isoformat()) if shown else 'not readable')
              if shown is not None and shown != (start, end):
                  zoom_filter_diagnostic(page, event_date)
                  raise RuntimeError('Zoom range after Search is ' + str(shown) + ', expected '
                                     + str((start, end)) + '. No export requested.')
              if total != len(records):
                  zoom_filter_diagnostic(page, event_date)
                  raise RuntimeError('Zoom shows ' + str(total) + ' results but ' + str(len(records))
                                     + ' rows could be read; no ambiguous export attempted.')
              chosen = select_zoom_row(records, plan)
              print('Zoom webinar selected:', ZOOM_TOPIC, '| scheduled:', chosen['scheduled'], '| ID:', chosen['id'])
              chosen['generate'].click()
              page.wait_for_timeout(800)
              try:
                  with page.expect_download(timeout=180000) as pending:
                      zoom_click(page, 'All registrants')
              except ZoomTimeout:
                  raise RuntimeError('Zoom did not start the All registrants download within 3 minutes '
                                     '(it may have gone to Report queue).') from None
              download = pending.value
              if download.failure():
                  raise RuntimeError('Zoom registrants download failed.')
              with tempfile.TemporaryDirectory() as folder:
                  raw_path = Path(folder) / 'zoom-registration.csv'
                  download.save_as(str(raw_path))
                  meta = save_zoom_contacts(raw_path, outdir, plan, chosen['id'] or None)
              print('Zoom CSV verified: webinar=' + plan['webinar_date'] + ' ' + plan['webinar_time']
                    + '; registrants=' + str(meta['downloaded_count']))


          def run_zoom_export():
              plan = load_plan()
              event_date = date.fromisoformat(plan['webinar_date'])
              print('Zoom: webinar for this run:', plan['webinar_date'], plan['webinar_time'], 'IST')
              print('Zoom: report search range:', plan['zoom_search_from'], 'to', plan['zoom_search_to'])
              stage = 'saved-session'
              seed = zoom_seed_value()
              cache_file = Path(os.environ['RUNNER_TEMP']) / 'zoom-session-cache' / 'state.enc'
              cached = load_zoom_session(seed, cache_file)
              initial = decode_zoom_seed(seed)
              candidates = [('cached session', cached)]
              if cached != initial:
                  candidates.append(('original saved session (GitHub secret)', initial))
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch(headless=True)
                  context = page = None
                  for name, bundle in candidates:
                      if context is not None:
                          context.close()
                      context = browser.new_context(viewport={'width': 1440, 'height': 1000},
                                                    timezone_id='Asia/Kolkata', locale='en-US', accept_downloads=True,
                                                    storage_state=bundle['storage_state'])
                      install_zoom_session_storage(context, bundle)
                      page = context.new_page()
                      page.set_default_timeout(30000)
                      try:
                          verify_saved_zoom_login(page)
                          print('Zoom: signed in with the ' + name + '.')
                          break
                      except RuntimeError:
                          print('Zoom: the ' + name + ' was not accepted.')
                  else:
                      browser.close()
                      print('Zoom: every saved sign-in has expired. Run the Zoom session setup again and '
                            'replace the ZOOM_STORAGE_STATE_B64 secret.')
                      raise RuntimeError('Zoom export stopped at saved-session; no Sheets writes.')
                  try:
                      save_zoom_session_cache(context, seed, cache_file)
                      stage = 'report'
                      export_zoom(page, plan, Path('zoom'))
                      save_zoom_session_cache(context, seed, cache_file)
                  except Exception as error:
                      Path('zoom-diagnostics').mkdir(exist_ok=True)
                      (Path('zoom-diagnostics') / 'stage.json').write_text(json.dumps({
                          'stage': stage, 'event_date': event_date.isoformat(), 'error_type': type(error).__name__}))
                      if stage == 'report' and '/account/report' in urlparse(page.url).path:
                          page.screenshot(path='zoom-diagnostics/report.png', full_page=True)
                      import traceback
                      if isinstance(error, RuntimeError):
                          print(str(error))
                      else:
                          print('Zoom error:', type(error).__name__, '-', ' '.join(str(error).split())[:600])
                          frames = traceback.extract_tb(error.__traceback__)
                          print('Zoom error location:', ' <- '.join(f.name for f in reversed(frames[-6:])))
                      raise RuntimeError('Zoom export stopped at ' + stage + '; no Sheets writes.') from None
                  finally:
                      browser.close()


          run_zoom_export()
          PY
      - name: Save refreshed encrypted Zoom browser session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/zoom-session-cache
          key: zoom-session-v1-${{ runner.os }}-${{ steps.zoom-session-key.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save verified Zoom contacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zoom-registrants-${{ github.run_id }}
          path: zoom/*
          if-no-files-found: error
          retention-days: 7
      - name: Save Zoom report diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zoom-diagnostics-${{ github.run_id }}
          path: zoom-diagnostics/*
          if-no-files-found: ignore
          retention-days: 3

  publish:
    name: Build Descrepancy tabs and update Stats
    needs: [prepare, flexifunnels, zoom]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Sheets and ActiveCampaign dependencies
        run: python -m pip install gspread google-auth requests
      - name: Download this run's FlexiFunnels reports
        uses: actions/download-artifact@v4
        with:
          name: flexifunnels-reports-${{ github.run_id }}
          path: reports
      - name: Download this run's Zoom registrants
        uses: actions/download-artifact@v4
        with:
          name: zoom-registrants-${{ github.run_id }}
          path: zoom
      - name: Download this run's UTM snapshot
        uses: actions/download-artifact@v4
        with:
          name: utm-source-${{ github.run_id }}
          path: utm
      - name: Clean, compare, publish tabs and append Stats
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}
          DISCREPANCY_TAB_NAME: ${{ vars.DISCREPANCY_TAB_NAME }}
          ACTIVECAMPAIGN_API_URL: ${{ secrets.ACTIVECAMPAIGN_API_URL }}
          ACTIVECAMPAIGN_API_KEY: ${{ secrets.ACTIVECAMPAIGN_API_KEY }}
        run: |
          python -u - <<'PY'
          """Run plan created once by the prepare job and reused unchanged by every job."""
          import json
          import os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          TZ_NAME = 'Asia/Kolkata'
          PLAN_KEYS = {'timezone', 'ff_start', 'ff_end', 'webinar_date', 'webinar_time', 'slot',
                       'zoom_search_from', 'zoom_search_to', 'captured_at', 'ff_start_time',
                       'ac_date', 'ac_list_id', 'ac_list_name', 'ac_list_scope'}


          def load_plan():
              # The plan travels inside the UTM snapshot artifact (job outputs containing
              # JSON can be silently dropped by GitHub's secret masking).
              from pathlib import Path as _Path
              source = _Path('utm/snapshot.json')
              if not source.is_file():
                  raise RuntimeError('Run plan is missing: utm/snapshot.json was not downloaded from the prepare job.')
              plan = json.loads(source.read_text()).get('plan')
              if not isinstance(plan, dict):
                  raise RuntimeError('Run plan is missing from utm/snapshot.json.')
              if (set(plan) != PLAN_KEYS or plan['timezone'] != TZ_NAME
                      or plan['slot'] not in ('morning', 'evening')
                      or plan['webinar_time'] != ('11:00' if plan['slot'] == 'morning' else '19:30')):
                  raise RuntimeError('Run plan is invalid.')
              for key in ('ff_start', 'ff_end', 'webinar_date', 'zoom_search_from', 'zoom_search_to', 'ac_date'):
                  date.fromisoformat(plan[key])
              datetime.fromisoformat(plan['captured_at'])
              return plan


          def event_tab_prefix(plan):
              # Weekday tabs: "2026-10-21 UTM". Sunday has two sessions: "2026-10-25 730PM UTM".
              webinar_day = date.fromisoformat(plan['webinar_date'])
              suffix = (' 11AM' if plan['slot'] == 'morning' else ' 730PM') if webinar_day.weekday() == 6 else ''
              return plan['webinar_date'] + suffix + ' '

          import csv
          import hashlib
          import math
          import re
          import time
          from collections import defaultdict, deque
          from pathlib import Path
          from urllib.parse import urlparse

          # ---------------------------------------------------------------- matching helpers

          def normalized_phone(value):
              """Digits only; Indian numbers reduced to 10 digits (+91 / 91 / 0091 / 0 prefixes)."""
              raw = str(value or '').strip()
              if re.search(r'[A-Za-z]', raw):
                  return ''
              digits = re.sub(r'\D', '', raw)
              if digits.startswith('00'):
                  digits = digits[2:]
              if digits.startswith('91') and len(digits) in (12, 13):
                  digits = digits[2:]          # 91XXXXXXXXXX or 910XXXXXXXXXX
              if len(digits) == 11 and digits.startswith('0'):
                  digits = digits[1:]          # 0XXXXXXXXXX
              return digits


          _INVISIBLE = re.compile(r'[\s​-‏⁠﻿ ]+')


          def clean_email(value):
              """Lower-case email with spaces and invisible characters removed."""
              return _INVISIBLE.sub('', str(value or '')).casefold()


          def dedupe_key(row):
              """Duplicate key used on every tab: email + phone after cleaning.
              Rows missing one of the two still dedupe on what they have."""
              email, phone = clean_email(row['email']), normalized_phone(row['phone'])
              if not email and not phone:
                  return ('name-only', ' '.join(row['name'].split()).casefold())
              return email, phone


          def match_key(row):
              email = clean_email(row['email'])
              phone = normalized_phone(row['phone'])
              if not email or not phone or not phone.isascii() or not phone.isdigit():
                  return None
              return email, phone


          def compare_rows(ff_rows, utm_rows):
              available = defaultdict(deque)
              for index, row in enumerate(utm_rows):
                  key = match_key(row)
                  if key is not None:
                      available[key].append(index)
              matched, ff_only, used = [], [], set()
              for row in ff_rows:
                  key = match_key(row)
                  if key is not None and available[key]:
                      used.add(available[key].popleft())
                      matched.append(row)
                  else:
                      ff_only.append(row)
              utm_only = [row for index, row in enumerate(utm_rows) if index not in used]
              return matched, ff_only, utm_only


          def write_rows(path, rows):
              with path.open('w', encoding='utf-8-sig', newline='') as output:
                  writer = csv.DictWriter(output, fieldnames=['name', 'email', 'phone'])
                  writer.writeheader()
                  writer.writerows(rows)


          def sorted_records(rows):
              return sorted(rows, key=lambda row: (row['name'].strip().casefold(),
                                                   row['email'].strip().casefold(),
                                                   (match_key(row) or ('', row['phone']))[1]))


          def merge_records(*groups):
              """Combine lists, dropping repeated email+phone pairs (keeps a name if one copy lacks it)."""
              merged, seen = [], {}
              for group in groups:
                  for row in group:
                      key = dedupe_key(row)
                      if key == ('name-only', ''):
                          continue  # completely blank row
                      if key not in seen:
                          seen[key] = len(merged)
                          merged.append(dict(row))
                      elif not merged[seen[key]]['name'] and row['name']:
                          merged[seen[key]]['name'] = row['name']
              return sorted_records(merged)


          def prepare_contact_rows(rows):
              cleaned = [{'name': ' '.join(str(row['name']).split()), 'email': clean_email(row['email']),
                          'phone': normalized_phone(row['phone'])} for row in rows]
              return merge_records(sorted_records(cleaned))


          def load_identity_csv(path):
              with path.open(encoding='utf-8-sig', newline='') as source:
                  reader = csv.DictReader(source)
                  if reader.fieldnames != ['name', 'email', 'phone']:
                      raise RuntimeError('Identity file must contain only name, email, phone: ' + str(path))
                  return list(reader)

          # ---------------------------------------------------------------- ActiveCampaign

          class ActiveCampaignReader:
              def __init__(self, base_url, token):
                  import requests
                  parsed = urlparse(base_url.strip())
                  if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment:
                      raise RuntimeError('ACTIVECAMPAIGN_API_URL must be an HTTPS account API URL.')
                  if parsed.path.rstrip('/') not in ('', '/api/3'):
                      raise RuntimeError('ActiveCampaign API URL must end at the account host or /api/3.')
                  if not token.strip():
                      raise RuntimeError('ACTIVECAMPAIGN_API_KEY is missing.')
                  self.base = 'https://' + parsed.netloc + '/api/3/'
                  self.session = requests.Session()
                  self.session.headers.update({'Api-Token': token.strip(), 'Accept': 'application/json'})

              def get(self, endpoint, params):
                  for attempt in range(4):
                      response = self.session.get(self.base + endpoint, params=params, timeout=60, allow_redirects=False)
                      if response.status_code == 429 or response.status_code >= 500:
                          if attempt < 3:
                              time.sleep(2 ** attempt)
                              continue
                      if response.status_code != 200:
                          raise RuntimeError('ActiveCampaign ' + endpoint + ' read failed (HTTP ' + str(response.status_code) + ').')
                      return response.json()
                  raise RuntimeError('ActiveCampaign request did not complete.')

              def pages(self, endpoint, collection, params):
                  result, seen, offset = [], set(), 0
                  initial_total = None
                  for _ in range(1000):
                      data = self.get(endpoint, {**params, 'limit': 100, 'offset': offset})
                      records = data.get(collection)
                      if not isinstance(records, list):
                          raise RuntimeError('ActiveCampaign returned an unexpected collection.')
                      try:
                          total = int(data['meta']['total'])
                      except (KeyError, TypeError, ValueError):
                          raise RuntimeError('ActiveCampaign response did not include a valid total.') from None
                      if initial_total is None:
                          initial_total = total
                      if total != initial_total:
                          raise RuntimeError('ActiveCampaign group changed while reading; rerun for a consistent snapshot.')
                      for record in records:
                          key = str(record.get('id', ''))
                          if not key or key in seen:
                              raise RuntimeError('ActiveCampaign pagination returned a missing or repeated contact ID.')
                          seen.add(key)
                          result.append(record)
                      if len(result) == total:
                          return result
                      if not records or len(result) > total:
                          raise RuntimeError('ActiveCampaign pagination did not reconcile with its total.')
                      offset += len(records)
                  raise RuntimeError('ActiveCampaign group is too large for one workflow run.')

              def event_contacts(self, plan):
                  """Read the exact "10 Min Business" list the prepare job picked for the ActiveCampaign date."""
                  list_id = str(plan['ac_list_id'])
                  data = self.get('lists/' + list_id, {})
                  current = str((data.get('list') or {}).get('name', ''))
                  if current != plan['ac_list_name']:
                      raise RuntimeError('ActiveCampaign list ' + list_id + ' is now named "' + current
                                         + '" instead of "' + plan['ac_list_name'] + '". Rerun the workflow.')
                  records = self.pages('contacts', 'contacts', {'listid': list_id, 'status': 1, 'orders[id]': 'ASC'})
                  rows = [{'name': ' '.join(str(c.get(k) or '').strip() for k in ('firstName', 'lastName')).strip(),
                           'email': str(c.get('email') or '').strip(), 'phone': str(c.get('phone') or '').strip()}
                          for c in records]
                  print('ActiveCampaign list (date ' + plan['ac_date'] + '):', current, '| active contacts:', len(rows))
                  if plan['ac_list_scope'] == 'shared_sunday_list':
                      print('ActiveCampaign: shared Sunday list; this count combines both Sunday sessions.')
                  return rows, {'id': list_id, 'name': current, 'active_count': len(rows),
                                'scope': plan['ac_list_scope']}

          # ---------------------------------------------------------------- Zoom artifact

          ZOOM_TOPIC = 'Launch Your Business Online in 10 Minutes — Directly From Your Phone | Live Build'


          def load_zoom_contacts(folder, plan):
              meta = json.loads((folder / 'manifest.json').read_text())
              try:
                  scheduled = datetime.strptime(meta['scheduled_time'], '%m/%d/%Y %I:%M:%S %p')
                  time_matches = (scheduled.date().isoformat() == plan['webinar_date']
                                  and scheduled.strftime('%H:%M') == plan['webinar_time'])
              except (KeyError, TypeError, ValueError):
                  time_matches = False
              if (meta.get('plan') != plan or meta.get('topic') != ZOOM_TOPIC
                      or meta.get('report_type') != 'All registrants' or not time_matches):
                  raise RuntimeError('Zoom report metadata does not match this run\'s webinar date and time.')
              path = folder / 'registrants.csv'
              if hashlib.sha256(path.read_bytes()).hexdigest() != meta.get('csv_sha256'):
                  raise RuntimeError('Zoom CSV differs from the verified download.')
              contacts = load_identity_csv(path)
              if len(contacts) != meta.get('downloaded_count'):
                  raise RuntimeError('Zoom artifact count does not reconcile.')
              return contacts, meta

          # ---------------------------------------------------------------- Sheets helpers

          RECORD_HEADERS = ['name', 'email', 'phone']
          STATS_HEADERS = ['Date', 'Time Checked', 'Webinar Date', 'Webinar Type',
                           'Reports', 'UTM', 'Active Campaign', 'Zoom']


          def norm_cell(value):
              return ' '.join(str(value).split()).casefold()


          def trim_padding(rows):
              result = []
              for row in rows:
                  cells = list(row)
                  while cells and cells[-1] == '':
                      cells.pop()
                  result.append(cells)
              while result and not result[-1]:
                  result.pop()
              return result


          def record_values(rows):
              values = [list(RECORD_HEADERS)]
              for number, row in enumerate(rows, 1):
                  if len(row) != 3 or not all(isinstance(cell, str) for cell in row):
                      raise ValueError('Record ' + str(number) + ' must be three text cells.')
                  if not any(row):
                      raise ValueError('Record ' + str(number) + ' is entirely empty.')
                  values.append(list(row))
              return values


          def unused_sheet_id(title, used_ids):
              candidate = int.from_bytes(hashlib.sha256(title.encode('utf-8')).digest()[:4], 'big') & 0x7FFFFFFF
              while candidate in used_ids:
                  candidate = (candidate + 1) & 0x7FFFFFFF
              used_ids.add(candidate)
              return candidate


          def stats_layout(sheet):
              rows = trim_padding(sheet.get_all_values(value_render_option='FORMULA'))
              expected = [norm_cell(h) for h in STATS_HEADERS]
              for row in rows:
                  if [norm_cell(c) for c in row[:len(STATS_HEADERS)]] == expected:
                      extra = norm_cell(row[len(STATS_HEADERS)]) if len(row) > len(STATS_HEADERS) else ''
                      return rows, extra in ('discrepancy', 'descrepancy')
              raise RuntimeError('Cannot find the Stats headings in columns A-H. Nothing written.')


          def append_stats_row(book, sheet, row, run_key, cell_notes):
              """Add one Stats row below every occupied row; reruns of the same attempt are skipped safely."""
              for value in row:
                  if type(value) not in (str, int, float) or (isinstance(value, float) and not math.isfinite(value)):
                      raise ValueError('Stats cells must be text or finite numbers.')
              existing_rows, _ = stats_layout(sheet)
              sheet_id = int(sheet.id)
              metadata = book.fetch_sheet_metadata()
              sheets = [entry for entry in metadata.get('sheets', [])
                        if entry.get('properties', {}).get('sheetId') == sheet_id]
              if len(sheets) != 1:
                  raise RuntimeError('Stats worksheet was not uniquely identified in its spreadsheet.')
              grid = sheets[0].get('properties', {}).get('gridProperties', {})
              capacity = grid.get('rowCount')
              if not isinstance(capacity, int) or capacity < len(existing_rows):
                  raise RuntimeError('Stats worksheet row capacity could not be verified.')
              if grid.get('columnCount', 0) < len(row):
                  raise RuntimeError('Stats worksheet has fewer columns than the row being written.')

              notes_key = {str(k): v for k, v in cell_notes.items()}
              digest = hashlib.sha256(json.dumps({'row': row, 'notes': notes_key}, ensure_ascii=False,
                                                 separators=(',', ':')).encode('utf-8')).hexdigest()
              marker_value = run_key + '|' + digest
              candidates = list(metadata.get('developerMetadata', []))
              for entry in metadata.get('sheets', []):
                  candidates.extend(entry.get('developerMetadata', []))
              markers = [entry for entry in candidates
                         if entry.get('metadataKey') == 'ff_discrepancy_run'
                         and entry.get('metadataValue', '').rsplit('|', 1)[0] == run_key]
              if len(markers) > 1:
                  raise RuntimeError('Stats metadata contains duplicate entries for this run key.')
              if markers:
                  if markers[0].get('metadataValue') != marker_value:
                      raise RuntimeError('Stats row for this run already exists with different numbers.')
                  print('Stats row for this run already exists; skipped.')
                  return 'skipped'

              start = len(existing_rows)
              requests = []
              if start >= capacity:
                  requests.append({'appendDimension': {'sheetId': sheet_id, 'dimension': 'ROWS',
                                                       'length': start + 1 - capacity}})
              cells = [{'userEnteredValue': {'stringValue' if isinstance(value, str) else 'numberValue': value}}
                       for value in row]
              for index, note in cell_notes.items():
                  cells[index]['note'] = note
              requests.extend([
                  {'updateCells': {'start': {'sheetId': sheet_id, 'rowIndex': start, 'columnIndex': 0},
                                   'rows': [{'values': cells}], 'fields': 'userEnteredValue,note'}},
                  {'createDeveloperMetadata': {'developerMetadata': {
                      'metadataKey': 'ff_discrepancy_run', 'metadataValue': marker_value,
                      'visibility': 'DOCUMENT', 'location': {'dimensionRange': {
                          'sheetId': sheet_id, 'dimension': 'ROWS', 'startIndex': start, 'endIndex': start + 1,
                      }},
                  }}},
              ])
              book.batch_update({'requests': requests})
              return 'appended'


          DAILY_LABELS = ['UTM', 'LANDING PAGE', 'LANDING PAGE REG', 'ACTIVE CAMPAIGN', 'ZOOM', 'DESCREPANCY']


          def publish_daily_tabs(book, datasets, plan, finalize=False):
              """Create or overwrite only the six dated tabs; newest tabs move to the front."""
              prefix = event_tab_prefix(plan)
              allowed = [prefix + label for label in DAILY_LABELS]
              if not datasets or any(title not in allowed for title in datasets):
                  raise ValueError('Only the six daily result tabs may be published.')
              if finalize and set(datasets) != set(allowed):
                  raise ValueError('Final publication must contain all six result tabs.')
              prepared = {title: record_values(rows) for title, rows in datasets.items()}
              sheets = list(book.worksheets())
              existing = {sheet.title: sheet for sheet in sheets}
              used_ids = {int(sheet.id) for sheet in sheets}
              requests, sheet_ids = [], {}
              for title in allowed:
                  if title not in prepared:
                      continue
                  values = prepared[title]
                  if title in existing:
                      sheet = existing[title]
                      old = sheet.get_all_values(value_render_option='FORMULA')
                      if not old or old[0] != RECORD_HEADERS or any(len(r) > 3 for r in old):
                          raise RuntimeError('Daily tab has an unexpected layout; will not overwrite: ' + title)
                      sheet_id = int(sheet.id)
                      capacity = int(sheet.row_count)
                      if len(values) > capacity:
                          requests.append({'appendDimension': {'sheetId': sheet_id, 'dimension': 'ROWS',
                                                                'length': len(values) - capacity}})
                      requests.append({'repeatCell': {'range': {'sheetId': sheet_id, 'startRowIndex': 0,
                                                                 'endRowIndex': max(len(old), len(values)),
                                                                 'startColumnIndex': 0, 'endColumnIndex': 3},
                                                       'cell': {}, 'fields': 'userEnteredValue'}})
                  else:
                      sheet_id = unused_sheet_id(title, used_ids)
                      requests.append({'addSheet': {'properties': {'sheetId': sheet_id, 'title': title,
                          'gridProperties': {'rowCount': max(2, len(values)), 'columnCount': 3, 'frozenRowCount': 1}}}})
                  sheet_ids[title] = sheet_id
                  requests.append({'updateCells': {'start': {'sheetId': sheet_id, 'rowIndex': 0, 'columnIndex': 0},
                      'rows': [{'values': [{'userEnteredValue': {'stringValue': cell}} for cell in r]} for r in values],
                      'fields': 'userEnteredValue'}})
              for title in reversed(allowed):
                  if title in sheet_ids:
                      requests.append({'updateSheetProperties': {'properties': {
                          'sheetId': sheet_ids[title], 'index': 0, 'hidden': False}, 'fields': 'index,hidden'}})
              if not finalize and prefix + 'DESCREPANCY' in existing:
                  # Hide an old discrepancy tab while its inputs are being replaced.
                  requests.append({'updateSheetProperties': {'properties': {
                      'sheetId': int(existing[prefix + 'DESCREPANCY'].id), 'hidden': True}, 'fields': 'hidden'}})
              book.batch_update({'requests': requests})
              return {title: title for title in prepared}


          def read_verified_snapshot(book, titles, expected):
              """Read the saved tabs back; all counts are taken from what is really in the sheet."""
              result = {}
              for title, expected_rows in expected.items():
                  values = book.worksheet(titles[title]).get_all_values(value_render_option='FORMULA')
                  if not values or values[0] != RECORD_HEADERS:
                      raise RuntimeError('Saved tab headers could not be verified: ' + title)
                  rows = []
                  for row in values[1:]:
                      if len(row) > 3:
                          raise RuntimeError('Unexpected cells in saved tab: ' + title)
                      rows.append(row + [''] * (3 - len(row)))
                  if rows != expected_rows:
                      raise RuntimeError('Saved tab differs from this run\'s data: ' + title + '. Stats not updated.')
                  result[title] = [dict(zip(RECORD_HEADERS, row)) for row in rows]
              return result


          def sheet_matrices(plan, datasets):
              return {event_tab_prefix(plan) + label: [[r['name'], r['email'], r['phone']] for r in rows]
                      for label, rows in datasets.items()}

          # ---------------------------------------------------------------- main

          def run_complete_workflow():
              import gspread
              from google.oauth2.service_account import Credentials

              plan = load_plan()
              snapshot = json.loads(Path('utm/snapshot.json').read_text())
              window = json.loads(Path('reports/report-window.json').read_text())
              if snapshot.get('plan') != plan or window.get('plan') != plan:
                  raise RuntimeError('UTM, FlexiFunnels and this job do not share the same run inputs. Rerun the workflow.')
              webinar_date = date.fromisoformat(plan['webinar_date'])
              tz = ZoneInfo(plan['timezone'])
              print('FlexiFunnels/UTM range:', plan['ff_start'], 'to', plan['ff_end'],
                    '| webinar:', plan['webinar_date'], plan['webinar_time'], 'IST',
                    '| ActiveCampaign date:', plan['ac_date'], '| list:', plan['ac_list_name'])

              # STAGE 0: load every source
              utm_business = load_identity_csv(Path('utm/business.csv'))
              utm_reg = load_identity_csv(Path('utm/registration.csv'))
              if (len(utm_business) != snapshot['business_count']
                      or len(utm_reg) != snapshot['registration_count']):
                  raise RuntimeError('UTM snapshot counts do not match the saved records.')
              ff_business = load_identity_csv(Path('reports/funnel-agent.csv'))
              ff_reg = load_identity_csv(Path('reports/flexi-genie-regteam.csv'))
              ac = ActiveCampaignReader(os.environ['ACTIVECAMPAIGN_API_URL'], os.environ['ACTIVECAMPAIGN_API_KEY'])
              ac_rows, selected_list = ac.event_contacts(plan)
              zoom_rows, zoom_report = load_zoom_contacts(Path('zoom'), plan)

              outdir = Path('comparison')
              outdir.mkdir(exist_ok=True)
              invalid_utm = [row for row in utm_business + utm_reg if match_key(row) is None]
              invalid_zoom = [row for row in zoom_rows if match_key(row) is None]
              if invalid_utm or invalid_zoom:
                  write_rows(outdir / 'utm-identifiers-needing-review.csv', invalid_utm)
                  write_rows(outdir / 'zoom-identifiers-needing-review.csv', invalid_zoom)
                  print('Note:', len(invalid_utm), 'UTM and', len(invalid_zoom),
                        'Zoom records lack a usable email+phone pair (listed in the comparison artifact).')

              # Check both destination spreadsheets before writing anything.
              credentials = Credentials.from_service_account_info(
                  json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON']),
                  scopes=['https://www.googleapis.com/auth/spreadsheets'])
              client = gspread.authorize(credentials)
              raw_book = client.open_by_key(os.environ['RAW_DATA_SHEET_ID'])
              stats_book = client.open_by_key(os.environ['DISCREPANCY_SHEET_ID'])
              if os.environ['UTM_SHEET_ID'] in (raw_book.id, stats_book.id):
                  raise RuntimeError('Destination spreadsheet IDs must not point to the UTM source.')
              stats_sheet = stats_book.worksheet(os.environ['DISCREPANCY_TAB_NAME'].strip())
              _, has_discrepancy_column = stats_layout(stats_sheet)

              raw_counts = {'landing': len(ff_business), 'landing_reg': len(ff_reg),
                            'utm_business': len(utm_business), 'utm_reg': len(utm_reg),
                            'activecampaign': len(ac_rows), 'zoom': len(zoom_rows)}
              print('Raw counts before cleaning:', raw_counts)

              # STAGE 1: clean every list (trim, 10-digit phone, de-duplicate email+phone, sort)
              ff_business = prepare_contact_rows(ff_business)
              ff_reg = prepare_contact_rows(ff_reg)
              utm_business = prepare_contact_rows(utm_business)
              utm_reg = prepare_contact_rows(utm_reg)
              ac_rows = prepare_contact_rows(ac_rows)
              zoom_rows = prepare_contact_rows(zoom_rows)
              merged_utm = merge_records(utm_business, utm_reg)

              # STAGE 2: write the five source tabs into Descrepancy and read them back
              print('STAGE 2: writing source tabs into', raw_book.title)
              source_datasets = {'UTM': merged_utm, 'LANDING PAGE': ff_business, 'LANDING PAGE REG': ff_reg,
                                 'ACTIVE CAMPAIGN': ac_rows, 'ZOOM': zoom_rows}
              imported_matrices = sheet_matrices(plan, source_datasets)
              titles = publish_daily_tabs(raw_book, imported_matrices, plan)
              stored = read_verified_snapshot(raw_book, titles, imported_matrices)
              key = lambda label: event_tab_prefix(plan) + label
              ff_business, ff_reg = stored[key('LANDING PAGE')], stored[key('LANDING PAGE REG')]
              merged_utm, ac_rows, zoom_rows = stored[key('UTM')], stored[key('ACTIVE CAMPAIGN')], stored[key('ZOOM')]

              # STAGE 3: DESCREPANCY = everyone in ANY source tab who is NOT in ZOOM.
              # Tabs checked against ZOOM: UTM, LANDING PAGE, LANDING PAGE REG and ACTIVE CAMPAIGN.
              # The result has one row per email (Zoom registers people by email), ready to import into Zoom.
              # DISCREPANCY_MATCH decides when a person counts as "already in Zoom":
              #   'email'           -> same email in Zoom (what a VLOOKUP/COUNTIF on email does)
              #   'email_or_phone'  -> same email OR same phone
              #   'email_and_phone' -> same email AND same phone
              DISCREPANCY_MATCH = 'email'
              # A Sunday ActiveCampaign list with no time in its name covers BOTH Sunday sessions.
              # Checking it against one session's Zoom would push the other session's people into
              # this webinar, so it is skipped unless this is set to True.
              INCLUDE_SHARED_SUNDAY_AC = False
              zoom_emails = {clean_email(r['email']) for r in zoom_rows if clean_email(r['email'])}
              zoom_phones = {normalized_phone(r['phone']) for r in zoom_rows if len(normalized_phone(r['phone'])) >= 7}
              zoom_pairs = {(clean_email(r['email']), normalized_phone(r['phone'])) for r in zoom_rows}

              def found(row, rule):
                  email, phone = clean_email(row['email']), normalized_phone(row['phone'])
                  if rule == 'email':
                      return bool(email) and email in zoom_emails
                  if rule == 'email_and_phone':
                      return (email, phone) in zoom_pairs
                  return (bool(email) and email in zoom_emails) or (len(phone) >= 7 and phone in zoom_phones)

              def importable_email(value):
                  email = clean_email(value)
                  return email if re.fullmatch(r'[^@]+@[^@]+\.[^@]+', email) else ''

              check_tabs = [('UTM', merged_utm), ('LANDING PAGE', ff_business), ('LANDING PAGE REG', ff_reg)]
              ac_skipped = selected_list['scope'] == 'shared_sunday_list' and not INCLUDE_SHARED_SUNDAY_AC
              if ac_skipped:
                  print('STAGE 3: ACTIVE CAMPAIGN not checked - this Sunday list covers both Sunday sessions.')
              else:
                  check_tabs.append(('ACTIVE CAMPAIGN', ac_rows))

              def missing_from_zoom(rule):
                  """People in any checked tab but not in Zoom: one row per email, per-tab counts,
                  and the rows with no usable email (Zoom cannot import those)."""
                  people, per_tab, no_email = {}, {}, []
                  for label, tab_rows in check_tabs:
                      missing = new = 0
                      for row in tab_rows:
                          if found(row, rule):
                              continue
                          missing += 1
                          email = importable_email(row['email'])
                          if not email:
                              no_email.append(row)
                              continue
                          kept = people.get(email)
                          if kept is None:
                              people[email] = {'name': row['name'], 'email': email, 'phone': row['phone']}
                              new += 1
                          else:
                              kept['name'] = kept['name'] or row['name']
                              kept['phone'] = kept['phone'] or row['phone']
                      per_tab[label] = {'rows': len(tab_rows), 'not_in_zoom': missing, 'new_unique': new}
                  return sorted_records(list(people.values())), per_tab, merge_records(no_email)

              for rule in ('email', 'email_or_phone', 'email_and_phone'):
                  rule_rows, _, rule_no_email = missing_from_zoom(rule)
                  print('Check: not in Zoom by', rule, '=', len(rule_rows), 'unique people |',
                        len(rule_no_email), 'more with no usable email')
              discrepancy, discrepancy_by_tab, no_email_rows = missing_from_zoom(DISCREPANCY_MATCH)
              for label, counts in discrepancy_by_tab.items():
                  print('STAGE 3:', label, '->', counts['not_in_zoom'], 'of', counts['rows'], 'not in Zoom |',
                        counts['new_unique'], 'not already listed from an earlier tab')
              write_rows(outdir / 'not-in-zoom-without-email.csv', no_email_rows)
              if no_email_rows:
                  print('STAGE 3:', len(no_email_rows), 'people not in Zoom have no usable email, so Zoom cannot '
                        'import them; they are in not-in-zoom-without-email.csv (comparison artifact).')
              print('STAGE 3: DESCREPANCY tab (rule:', DISCREPANCY_MATCH + '):', len(discrepancy),
                    'unique people to import into Zoom')

              # Side check (CSV artifact only): each FlexiFunnels page vs its own UTM tab.
              summary = {}
              for label, ff, utm in [('funnel-agent', ff_business, utm_business),
                                     ('flexi-genie-regteam', ff_reg, utm_reg)]:
                  matched, ff_only, utm_only = compare_rows(ff, utm)
                  for suffix, rows in [('matched', matched), ('missing-from-utm', ff_only),
                                       ('missing-from-flexifunnels', utm_only)]:
                      write_rows(outdir / (label + '-' + suffix + '.csv'), sorted_records(rows))
                  summary[label] = {'flexifunnels_rows': len(ff), 'utm_rows': len(utm), 'matched_rows': len(matched),
                                    'missing_from_utm': len(ff_only), 'missing_from_flexifunnels': len(utm_only)}
              print('FlexiFunnels vs UTM:', summary)

              # STAGE 4: save all six tabs and read them back
              datasets = dict(source_datasets, **{'UTM': merged_utm, 'LANDING PAGE': ff_business,
                                                  'LANDING PAGE REG': ff_reg, 'ACTIVE CAMPAIGN': ac_rows,
                                                  'ZOOM': zoom_rows, 'DESCREPANCY': discrepancy})
              for label, rows in datasets.items():
                  write_rows(outdir / (label.lower().replace(' ', '-') + '.csv'), rows)
              dated = sheet_matrices(plan, datasets)
              published = publish_daily_tabs(raw_book, dated, plan, finalize=True)
              saved = read_verified_snapshot(raw_book, published, dated)
              ff_business, ff_reg = saved[key('LANDING PAGE')], saved[key('LANDING PAGE REG')]
              merged_utm, ac_rows = saved[key('UTM')], saved[key('ACTIVE CAMPAIGN')]
              zoom_rows, discrepancy = saved[key('ZOOM')], saved[key('DESCREPANCY')]
              print('STAGE 4: six tabs saved and verified:', list(published))

              # STAGE 5: append one row to Stats
              merged_reports = merge_records(ff_business, ff_reg)
              checked_at = datetime.fromisoformat(plan['captured_at']).astimezone(tz)
              webinar_label = datetime.strptime(plan['webinar_time'], '%H:%M').strftime('%I:%M %p').lstrip('0')
              stats_row = [checked_at.strftime('%d/%m/%Y'), checked_at.strftime('%I:%M %p'),
                           webinar_date.strftime('%d/%m/%Y'), '10 minute business',
                           len(merged_reports), len(merged_utm), len(ac_rows), len(zoom_rows)]
              if has_discrepancy_column:
                  stats_row.append(len(discrepancy))
              ff_range = 'after ' + plan['ff_start'] + ' ' + plan['ff_start_time'] + ' through ' + plan['ff_end']
              notes = {
                  2: 'Webinar ' + plan['webinar_date'] + ' at ' + webinar_label + ' IST.',
                  4: ('FlexiFunnels ' + ff_range + ': funnel-agent ' + str(len(ff_business))
                      + ' + flexi-genie-regteam ' + str(len(ff_reg)) + ' = ' + str(len(merged_reports))
                      + ' unique (email+phone).'),
                  5: ('UTM tabs "' + snapshot['business_tab'] + '" + "' + snapshot['registration_tab']
                      + '", filtered ' + ff_range + '; ' + str(len(merged_utm)) + ' unique.'),
                  6: ('ActiveCampaign list (date ' + plan['ac_date'] + '): ' + selected_list['name']
                      + (' (shared Sunday list: includes both Sunday sessions).'
                         if selected_list['scope'] == 'shared_sunday_list' else '.')),
                  7: ('Zoom All registrants, webinar ID ' + zoom_report['webinar_id'] + '. Not in Zoom (by '
                      + DISCREPANCY_MATCH + '): ' + str(len(discrepancy)) + ' unique to import; per tab: '
                      + ', '.join(label + ' ' + str(c['not_in_zoom']) for label, c in discrepancy_by_tab.items())
                      + ('; ActiveCampaign not checked (shared Sunday list)' if ac_skipped else '')
                      + ('; ' + str(len(no_email_rows)) + ' without email left out' if no_email_rows else '')
                      + '.'),
              }
              run_key = os.environ['GITHUB_RUN_ID'] + '.' + os.environ['GITHUB_RUN_ATTEMPT']
              stats_status = append_stats_row(stats_book, stats_sheet, stats_row, run_key, notes)
              print('STAGE 5: Stats', stats_status, '->', stats_row)

              (outdir / 'summary.json').write_text(json.dumps({
                  'plan': plan, 'raw_source_counts': raw_counts, 'flexifunnels_vs_utm': summary,
                  'stats_row': stats_row, 'stats_status': stats_status, 'discrepancy': len(discrepancy),
                  'discrepancy_rule': DISCREPANCY_MATCH, 'discrepancy_by_tab': discrepancy_by_tab,
                  'activecampaign_checked': not ac_skipped, 'not_in_zoom_without_email': len(no_email_rows),
                  'published_tabs': list(published), 'activecampaign_list': selected_list,
                  'zoom_report': {k: v for k, v in zoom_report.items() if k != 'plan'},
              }, indent=2))
              print('COMPLETE.')


          run_complete_workflow()
          PY
      - name: Upload calculated and published results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexifunnels-comparison-${{ github.run_id }}
          path: comparison/*
          if-no-files-found: ignore
          retention-days: 7
