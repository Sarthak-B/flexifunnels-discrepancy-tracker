name: FlexiFunnels Discrepancy Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-google-sheets:
    name: Test Google Sheets Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Sheets dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth

      - name: Verify Google Sheets access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}
          UTM_LANDING_TAB: ${{ vars.UTM_LANDING_TAB }}
          UTM_REG_TAB: ${{ vars.UTM_REG_TAB }}
          DISCREPANCY_TAB_NAME: ${{ vars.DISCREPANCY_TAB_NAME }}

        run: |
          python -u - <<'PY'
          import os
          import json
          import gspread

          from google.oauth2.service_account import Credentials

          print("=" * 60)
          print("GOOGLE SHEETS CONNECTION TEST - VERSION 6")
          print("=" * 60)

          required = [
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "RAW_DATA_SHEET_ID",
              "UTM_SHEET_ID",
              "DISCREPANCY_SHEET_ID",
              "UTM_LANDING_TAB",
              "UTM_REG_TAB",
              "DISCREPANCY_TAB_NAME",
          ]

          missing = [
              name for name in required
              if not os.environ.get(name, "").strip()
          ]

          if missing:
              raise RuntimeError(
                  "Missing configuration: " + ", ".join(missing)
              )

          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets.readonly"
              ],
          )

          client = gspread.authorize(credentials)

          spreadsheets = {
              "RAW DATA": os.environ["RAW_DATA_SHEET_ID"],
              "UTM": os.environ["UTM_SHEET_ID"],
              "DISCREPANCY STATS": os.environ["DISCREPANCY_SHEET_ID"],
          }

          opened = {}

          for label, sheet_id in spreadsheets.items():
              spreadsheet = client.open_by_key(sheet_id)
              opened[label] = spreadsheet

              print("\n" + label + ": CONNECTED")
              print("Spreadsheet:", spreadsheet.title)
              print("Total tabs:", len(spreadsheet.worksheets()))

              for worksheet in spreadsheet.worksheets():
                  print("  Tab:", worksheet.title)

          print("\nCHECKING CONFIGURED SOURCE TABS")

          checks = [
              ("UTM_LANDING_TAB", "UTM"),
              ("UTM_REG_TAB", "UTM"),
              ("DISCREPANCY_TAB_NAME", "DISCREPANCY STATS"),
          ]

          for variable, spreadsheet_label in checks:
              tab_name = os.environ[variable].strip()

              try:
                  opened[spreadsheet_label].worksheet(tab_name)
                  print(variable + ": FOUND")
              except gspread.WorksheetNotFound:
                  raise RuntimeError(
                      variable + " does not match an existing tab."
                  )

          print("\n" + "=" * 60)
          print("ALL GOOGLE SHEETS CONNECTIONS SUCCESSFUL")
          print("READ-ONLY TEST: NO DATA MODIFIED")
          print("=" * 60)
          PY

  test-flexifunnels-login:
    name: Test FlexiFunnels Login
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test login, sub-user switch, and project selection
        env:
          FLEXIFUNNELS_EMAIL: ${{ secrets.FLEXIFUNNELS_EMAIL }}
          FLEXIFUNNELS_PASSWORD: ${{ secrets.FLEXIFUNNELS_PASSWORD }}
          FLEXIFUNNELS_PROJECT_URL: ${{ vars.FLEXIFUNNELS_PROJECT_URL }}
          FLEXIFUNNELS_SUB_USER: Saurabh Bhatnagar

        run: |
          python -u - <<'PY'
          import os
          import re
          import time

          from urllib.parse import urlparse

          from playwright.sync_api import (
              sync_playwright,
              TimeoutError as PlaywrightTimeout,
          )

          print("=" * 60)
          print("FLEXIFUNNELS LOGIN TEST - VERSION 6")
          print("=" * 60)

          email = os.environ.get(
              "FLEXIFUNNELS_EMAIL", ""
          ).strip()

          password = os.environ.get(
              "FLEXIFUNNELS_PASSWORD", ""
          )

          project_url = os.environ.get(
              "FLEXIFUNNELS_PROJECT_URL", ""
          ).strip()

          sub_user = os.environ.get(
              "FLEXIFUNNELS_SUB_USER", ""
          ).strip()

          if not email or not password:
              raise RuntimeError(
                  "FlexiFunnels email or password is missing."
              )

          if not sub_user:
              raise RuntimeError(
                  "FlexiFunnels sub-user is missing."
              )

          parsed_project = urlparse(project_url)

          if (
              parsed_project.scheme != "https"
              or parsed_project.hostname != "app.flexifunnels.com"
              or parsed_project.path.rstrip("/")
                 != "/projects/kvapNzyj"
          ):
              raise RuntimeError(
                  "Unexpected FlexiFunnels project URL."
              )

          expected_project_path = (
              parsed_project.path.rstrip("/")
          )

          def safe_location(page):
              parsed = urlparse(page.url)

              return (
                  parsed.scheme
                  + "://"
                  + (parsed.hostname or "")
                  + parsed.path
              )

          def current_path(page):
              return urlparse(page.url).path.rstrip("/")

          def visible_items(locator, maximum=50):
              result = []

              for index in range(min(locator.count(), maximum)):
                  item = locator.nth(index)

                  if item.is_visible():
                      result.append(item)

              return result

          def unique_visible(locator):
              matches = visible_items(locator)

              if len(matches) == 1:
                  return matches[0]

              return None

          def wait_for_path(page, path, seconds=20):
              deadline = time.monotonic() + seconds

              while time.monotonic() < deadline:
                  if current_path(page) == path:
                      return True

                  time.sleep(1)

              return False

          def describe_selection_screen(page):
              """
              Log structural information only.

              Never print account lists, email addresses,
              page HTML, cookies, tokens, or form values.
              """

              print("\nSUB-USER SCREEN DIAGNOSTICS")
              print("-" * 60)

              print("Location:", safe_location(page))

              selectors = {
                  "buttons": "button",
                  "links": "a",
                  "dialogs": '[role="dialog"]',
                  "radio_inputs": 'input[type="radio"]',
                  "checkboxes": 'input[type="checkbox"]',
                  "forms": "form",
              }

              for label, selector in selectors.items():
                  locator = page.locator(selector)

                  print(
                      label + ":",
                      "total=" + str(locator.count()),
                      "visible=" + str(
                          len(visible_items(locator, 100))
                      ),
                  )

              dialogs = visible_items(
                  page.locator('[role="dialog"]')
              )

              for index, dialog in enumerate(dialogs):
                  print(
                      "Visible dialog",
                      index + 1,
                      "buttons=",
                      dialog.locator("button").count(),
                      "links=",
                      dialog.locator("a").count(),
                  )

              print("No private account data printed.")

          def select_named_sub_user(page, name):
              print("\nSTEP 7: Selecting sub-user")

              print("Required sub-user:", name)

              page.wait_for_timeout(2500)

              exact_name = re.compile(
                  r"^\s*" + re.escape(name) + r"\s*$",
                  re.IGNORECASE,
              )

              candidates = [
                  (
                      "Named button",
                      page.get_by_role(
                          "button",
                          name=exact_name,
                      ),
                  ),
                  (
                      "Named link",
                      page.get_by_role(
                          "link",
                          name=exact_name,
                      ),
                  ),
                  (
                      "Exact text",
                      page.get_by_text(
                          exact_name,
                      ),
                  ),
              ]

              for description, locator in candidates:
                  candidate = unique_visible(locator)

                  if candidate is None:
                      continue

                  print(
                      "Found unique sub-user match:",
                      description,
                  )

                  tag = candidate.evaluate(
                      "(element) => element.tagName.toLowerCase()"
                  )

                  role = candidate.get_attribute("role")

                  if tag in ("button", "a") or role == "button":
                      candidate.click(timeout=10000)

                      print("Sub-user control clicked.")
                      return True

                  ancestor = candidate.locator(
                      "xpath=ancestor::*["
                      "self::button or "
                      "self::a or "
                      "@role='button'"
                      "][1]"
                  )

                  if ancestor.count() == 1:
                      if ancestor.is_visible():
                          ancestor.click(timeout=10000)

                          print(
                              "Associated sub-user control clicked."
                          )

                          return True

                  try:
                      candidate.click(timeout=5000)

                      print("Exact sub-user text clicked.")
                      return True

                  except PlaywrightTimeout:
                      print(
                          "Sub-user text is not directly clickable."
                      )

              return False

          def try_confirm_named_selection(page, name):
              """
              Confirm only when the requested sub-user
              and one unambiguous confirmation control
              are present in the same visible dialog.

              Do not click unrelated account controls.
              """

              print("\nSTEP 8: Checking for confirmation")

              page.wait_for_timeout(2000)

              dialogs = visible_items(
                  page.locator('[role="dialog"]')
              )

              exact_name = re.compile(
                  r"^\s*" + re.escape(name) + r"\s*$",
                  re.IGNORECASE,
              )

              confirm_pattern = re.compile(
                  r"^\s*(continue|confirm|switch|select)\s*$",
                  re.IGNORECASE,
              )

              for dialog in dialogs:
                  matching_names = visible_items(
                      dialog.get_by_text(exact_name)
                  )

                  if len(matching_names) != 1:
                      continue

                  confirm_buttons = visible_items(
                      dialog.get_by_role(
                          "button",
                          name=confirm_pattern,
                      )
                  )

                  enabled_buttons = [
                      button
                      for button in confirm_buttons
                      if button.is_enabled()
                  ]

                  if len(enabled_buttons) == 1:
                      enabled_buttons[0].click(
                          timeout=10000
                      )

                      print(
                          "Confirmed named sub-user selection."
                      )

                      return True

              print(
                  "No unambiguous confirmation "
                  "button associated with the selected "
                  "sub-user was found."
              )

              return False

          def project_is_verified(page):
              if current_path(page) != expected_project_path:
                  return False

              project_content = page.get_by_text(
                  "Funnel Builder Agent",
                  exact=False,
              )

              return len(visible_items(project_content)) > 0

          def reopen_project(page, attempt):
              print(
                  "\nSTEP 9: Opening project after "
                  "sub-user selection"
              )

              print("Project opening attempt:", attempt)

              page.goto(
                  project_url,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              deadline = time.monotonic() + 20

              while time.monotonic() < deadline:
                  if project_is_verified(page):
                      return True

                  if current_path(page) == "/switch-sub-users":
                      break

                  time.sleep(1)

              print(
                  "Location after project attempt:",
                  safe_location(page),
              )

              return False

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 900,
                  },
                  accept_downloads=False,
              )

              page = context.new_page()

              page.set_default_timeout(15000)

              try:
                  print("\nSTEP 1: Opening FlexiFunnels")

                  page.goto(
                      "https://app.flexifunnels.com/login",
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  print("Location:", safe_location(page))

                  print("\nSTEP 2: Finding login fields")

                  email_field = unique_visible(
                      page.locator(
                          'input[type="email"], '
                          'input[name="email"], '
                          'input[autocomplete="username"]'
                      )
                  )

                  password_field = unique_visible(
                      page.locator('input[type="password"]')
                  )

                  if email_field is None:
                      raise RuntimeError(
                          "Email field not found uniquely."
                      )

                  if password_field is None:
                      raise RuntimeError(
                          "Password field not found uniquely."
                      )

                  print("Login fields found.")

                  print("\nSTEP 3: Entering credentials")

                  email_field.fill(email)
                  password_field.fill(password)

                  print("Credentials entered.")

                  print("\nSTEP 4: Finding login button")

                  login_selectors = [
                      'button[type="submit"]',
                      'input[type="submit"]',
                      'button:has-text("Login")',
                      'button:has-text("Log in")',
                      'button:has-text("Sign in")',
                  ]

                  login_button = None

                  for selector in login_selectors:
                      candidate = unique_visible(
                          page.locator(selector)
                      )

                      if candidate is not None:
                          login_button = candidate

                          print(
                              "Login button found using:",
                              selector,
                          )

                          break

                  print("\nSTEP 5: Submitting login")

                  if login_button is not None:
                      login_button.click(timeout=15000)
                  else:
                      password_field.press("Enter")

                  print("Login submitted.")

                  print("\nSTEP 6: Opening sub-user selection")

                  if not wait_for_path(
                      page,
                      "/switch-sub-users",
                      seconds=20,
                  ):
                      page.goto(
                          project_url,
                          wait_until="domcontentloaded",
                          timeout=60000,
                      )

                      page.wait_for_timeout(3000)

                  print("Current location:", safe_location(page))

                  if current_path(page) == expected_project_path:
                      if project_is_verified(page):
                          print(
                              "Project already accessible."
                          )
                      else:
                          raise RuntimeError(
                              "Project URL reached but "
                              "expected project content missing."
                          )

                  elif current_path(page) == "/switch-sub-users":
                      print(
                          "SUB-USER SELECTION SCREEN DETECTED"
                      )

                      describe_selection_screen(page)

                      selected = select_named_sub_user(
                          page,
                          sub_user,
                      )

                      if not selected:
                          raise RuntimeError(
                              "Requested sub-user not found "
                              "or not safely clickable."
                          )

                      page.wait_for_timeout(4000)

                      print(
                          "Location after clicking sub-user:",
                          safe_location(page),
                      )

                      # The user confirmed that the project
                      # must be opened again after selecting
                      # the sub-user.

                      verified = reopen_project(page, 1)

                      if not verified:
                          print(
                              "\nProject still unavailable. "
                              "Checking whether account "
                              "selection needs confirmation."
                          )

                          if current_path(page) == "/switch-sub-users":
                              confirmed = try_confirm_named_selection(
                                  page,
                                  sub_user,
                              )

                              if confirmed:
                                  page.wait_for_timeout(4000)

                                  verified = reopen_project(
                                      page,
                                      2,
                                  )

                      if not verified:
                          print(
                              "\nSUB-USER SWITCH NOT VERIFIED"
                          )

                          describe_selection_screen(page)

                          raise RuntimeError(
                              "Sub-user was clicked, but "
                              "the requested project could "
                              "not be opened. A further "
                              "account or project selection "
                              "step may be required."
                          )

                  else:
                      raise RuntimeError(
                          "Unexpected location after login."
                      )

                  print("\nSTEP 10: Final project verification")

                  if not project_is_verified(page):
                      raise RuntimeError(
                          "Final project verification failed."
                      )

                  print("\n" + "=" * 60)
                  print("SUCCESS: FLEXIFUNNELS LOGIN VERIFIED")
                  print("SUCCESS: SUB-USER FLOW COMPLETED")
                  print("SUCCESS: PROJECT ACCESS VERIFIED")
                  print("NO REPORTS DOWNLOADED")
                  print("NO GOOGLE SHEETS MODIFIED")
                  print("=" * 60)

              except Exception as exc:
                  print("\n" + "=" * 60)
                  print("FLEXIFUNNELS TEST FAILED")
                  print("Error type:", type(exc).__name__)
                  print("Last location:", safe_location(page))
                  print("=" * 60)

                  raise RuntimeError(
                      "FlexiFunnels login or project "
                      "selection failed. Review the "
                      "numbered steps above."
                  ) from None

              finally:
                  context.close()
                  browser.close()

                  print("\nBrowser closed.")
          PY
