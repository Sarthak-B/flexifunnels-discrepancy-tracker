        run: |
          python -u - <<'PY'
          """Run plan created once by the prepare job and reused unchanged by every job."""
          import json
          import os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          TZ_NAME = 'Asia/Kolkata'
          PLAN_KEYS = {'timezone', 'ff_start', 'ff_end', 'webinar_date', 'webinar_time', 'slot',
                       'zoom_search_from', 'zoom_search_to', 'captured_at', 'ff_start_time',
                       'ac_date', 'ac_list_id', 'ac_list_name', 'ac_list_scope'}


          def load_plan():
              # The plan travels inside the UTM snapshot artifact (job outputs containing
              # JSON can be silently dropped by GitHub's secret masking).
              from pathlib import Path as _Path
              source = _Path('utm/snapshot.json')
              if not source.is_file():
                  raise RuntimeError('Run plan is missing: utm/snapshot.json was not downloaded from the prepare job.')
              plan = json.loads(source.read_text()).get('plan')
              if not isinstance(plan, dict):
                  raise RuntimeError('Run plan is missing from utm/snapshot.json.')
              if (set(plan) != PLAN_KEYS or plan['timezone'] != TZ_NAME
                      or plan['slot'] not in ('morning', 'evening')
                      or plan['webinar_time'] != ('11:00' if plan['slot'] == 'morning' else '19:30')):
                  raise RuntimeError('Run plan is invalid.')
              for key in ('ff_start', 'ff_end', 'webinar_date', 'zoom_search_from', 'zoom_search_to', 'ac_date'):
                  date.fromisoformat(plan[key])
              datetime.fromisoformat(plan['captured_at'])
              return plan

          import csv
          import re
          import time
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          PLAN = load_plan()
          RANGE_START = date.fromisoformat(PLAN['ff_start'])
          RANGE_END = date.fromisoformat(PLAN['ff_end'])
          WINDOW_START = datetime.combine(RANGE_START, datetime.strptime(PLAN['ff_start_time'], '%H:%M').time())

          EMAIL = os.environ.get('FLEXIFUNNELS_EMAIL', '').strip()
          PASSWORD = os.environ.get('FLEXIFUNNELS_PASSWORD', '')
          PROJECT_URL = os.environ.get('FLEXIFUNNELS_PROJECT_URL', '').strip()
          LANDING_URL = os.environ.get('FLEXIFUNNELS_LANDING_URL', '').strip()
          REG_URL = os.environ.get('FLEXIFUNNELS_REG_URL', '').strip()

          EXPECTED_PROJECT_URL = 'https://app.flexifunnels.com/projects/kvapNzyj'
          EXPECTED_LANDING_URL = 'https://sb.flexifunnels.com/funnel-agent'
          EXPECTED_REG_URL = 'https://sb.flexifunnels.com/flexi-genie-regteam'

          print('WORKFLOW REVISION: V24.5 — wait for unobstructed controls and center scrolling')
          if not EMAIL or not PASSWORD:
              raise RuntimeError('FlexiFunnels credentials missing.')
          if PROJECT_URL.rstrip('/') != EXPECTED_PROJECT_URL:
              raise RuntimeError('Unexpected project URL configuration.')
          if LANDING_URL.rstrip('/') != EXPECTED_LANDING_URL:
              raise RuntimeError('Unexpected landing URL configuration.')
          if REG_URL.rstrip('/') != EXPECTED_REG_URL:
              raise RuntimeError('Unexpected registration URL configuration.')

          print()
          print('Timezone:', TZ_NAME)
          print('Report start date:', RANGE_START.isoformat())
          print('Report end date:', RANGE_END.isoformat())
          print('Date range: INCLUSIVE (all records on these days are kept)')
          print()


          def safe_location(page):
              if page.is_closed():
                  return 'closed'
              parsed = urlparse(page.url)
              path = parsed.path
              if ('login-as' in path or 'token' in path.lower()
                      or 'callback' in path.lower() or 'auth' in path.lower()):
                  path = '/[sensitive-path-redacted]'
              return parsed.scheme + '://' + (parsed.hostname or '') + path


          def current_path(page):
              if page.is_closed():
                  return ''
              return urlparse(page.url).path.rstrip('/')


          def visible_items(locator, limit=50):
              result = []
              for index in range(min(locator.count(), limit)):
                  item = locator.nth(index)
                  if item.is_visible():
                      result.append(item)
              return result


          def unique_visible(locator):
              items = visible_items(locator)
              if len(items) == 1:
                  return items[0]
              return None


          def first_unique_visible(locators):
              for locator in locators:
                  candidate = unique_visible(locator)
                  if candidate is not None:
                      return candidate
              return None


          def wait_for_path_change(page, original, seconds=25):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  if current_path(page) != original:
                      return current_path(page)
                  time.sleep(1)
              return current_path(page)


          def find_login_field(page, selectors):
              for selector in selectors:
                  field = unique_visible(page.locator(selector))
                  if field is not None:
                      return field
              return None


          def login(page):
              print()
              print('STEP 1: Opening FlexiFunnels login')
              page.goto('https://app.flexifunnels.com/login', wait_until='domcontentloaded', timeout=60000)
              print('Location:', safe_location(page))

              print()
              print('STEP 2: Finding login fields')
              email_field = find_login_field(page, ['input[type="email"]', 'input[name="email"]',
                                                    'input[autocomplete="username"]'])
              password_field = find_login_field(page, ['input[type="password"]'])
              if email_field is None or password_field is None:
                  raise RuntimeError('Login fields not found.')
              print('Login fields found.')

              print()
              print('STEP 3: Entering credentials')
              email_field.fill(EMAIL)
              password_field.fill(PASSWORD)
              print('Credentials entered.')

              print()
              print('STEP 4: Finding login button')
              login_button = first_unique_visible([
                  page.locator('button[type="submit"]'),
                  page.locator('input[type="submit"]'),
                  page.locator('button:has-text("Login")'),
                  page.locator('button:has-text("Log in")'),
                  page.locator('button:has-text("Sign in")'),
              ])

              print()
              print('STEP 5: Submitting login')
              if login_button is not None:
                  login_button.click(timeout=15000)
              else:
                  password_field.press('Enter')
              print('Login submitted.')

              print()
              print('STEP 6: Opening sub-user selection')
              path = wait_for_path_change(page, '/login', seconds=25)
              if path == '/login':
                  page.goto(PROJECT_URL, wait_until='domcontentloaded', timeout=60000)
              page.wait_for_timeout(3000)
              print('Current location:', safe_location(page))
              if current_path(page) != '/switch-sub-users':
                  raise RuntimeError('Sub-user selection screen missing.')
              print('SUB-USER SELECTION SCREEN DETECTED')


          def select_saurabh(page):
              print()
              print('STEP 7: Finding Saurabh Bhatnagar')
              exact_name = re.compile(r'^\s*Saurabh Bhatnagar\s*$', re.IGNORECASE)
              name_element = unique_visible(page.get_by_text(exact_name))
              if name_element is None:
                  raise RuntimeError('Saurabh Bhatnagar not found uniquely.')
              print('Saurabh Bhatnagar: FOUND')

              print()
              print("STEP 8: Finding Switch to user inside Saurabh's card")
              card = name_element.locator(
                  "xpath=ancestor::*["
                  ".//*["
                  "self::a or self::button or @role='button'"
                  "]["
                  "contains("
                  "translate(normalize-space(.), "
                  "'ABCDEFGHIJKLMNOPQRSTUVWXYZ', "
                  "'abcdefghijklmnopqrstuvwxyz'), "
                  "'switch to user'"
                  ")"
                  "]"
                  "][1]"
              )
              if card.count() != 1 or not card.is_visible():
                  raise RuntimeError('Saurabh account card not found.')
              print('Saurabh account card: FOUND')

              switch_pattern = re.compile(r'^\s*Switch to user\s*$', re.IGNORECASE)
              controls = card.locator("a, button, [role='button']")
              matches = [control for control in visible_items(controls)
                         if switch_pattern.fullmatch(control.inner_text().strip())]
              if len(matches) != 1:
                  raise RuntimeError('Saurabh Switch to user control not found uniquely.')
              switch_control = matches[0]
              if not switch_control.is_enabled():
                  raise RuntimeError('Switch to user control disabled.')
              print('Correct Switch to user control found.')

              print()
              print('STEP 9: Switching to Saurabh')
