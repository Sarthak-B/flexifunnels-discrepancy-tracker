name: FlexiFunnels Discrepancy Tracker

on:
  workflow_dispatch:
    inputs:
      utm_business_tab:
        description: "UTM sheet: full name of the 10-minute Business tab"
        type: string
        required: true
      utm_reg_tab:
        description: "UTM sheet: full name of the 10-minute Reg team tab"
        type: string
        required: true
      ff_start_date:
        description: "FlexiFunnels report START date (2026-10-20 or 20-10-2026)"
        type: string
        required: true
      ff_end_date:
        description: "FlexiFunnels report END date (2026-10-21 or 21-10-2026)"
        type: string
        required: true
      ff_start_time:
        description: "Count registrations AFTER this time on the start date (registration switch-over time)"
        type: choice
        required: true
        default: "6:00 PM"
        options:
          - "6:00 PM"
          - "9:00 AM"
          - "12:00 AM (whole day)"
      zoom_webinar_date:
        description: "Zoom webinar date to download registrants for (2026-10-21 or 21-10-2026)"
        type: string
        required: true
      zoom_webinar_time:
        description: "Zoom webinar time on that date"
        type: choice
        required: true
        default: "7:30 PM"
        options:
          - "7:30 PM"
          - "11:00 AM"
      ac_list_date:
        description: "ActiveCampaign: date written in the '10 Min Business' list name (2026-10-21 or 21-10-2026)"
        type: string
        required: true
      ac_list_encore:
        description: "ActiveCampaign: tick for the ENCORE list (name contains 'Encore'); leave unticked for the regular list"
        type: boolean
        required: false
        default: false
      ac_list_name:
        description: "ActiveCampaign (optional): exact list name, e.g. '25 Oct 2026 Flexi Genie 10 Mins Business Workshop Encore'. Blank = auto-pick by date + Encore box"
        type: string
        required: false
        default: ""

concurrency:
  group: flexifunnels-discrepancy-sheets
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  prepare:
    name: Check inputs, pick the ActiveCampaign list and read the two UTM tabs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      utm_business_tab: ${{ steps.prepare.outputs.utm_business_tab }}
      utm_reg_tab: ${{ steps.prepare.outputs.utm_reg_tab }}

    steps:

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Sheets dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth requests

      - name: Validate inputs, read UTM tabs and preflight destinations
        id: prepare
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}
          DISCREPANCY_TAB_NAME: ${{ vars.DISCREPANCY_TAB_NAME }}
          ACTIVECAMPAIGN_API_URL: ${{ secrets.ACTIVECAMPAIGN_API_URL }}
          ACTIVECAMPAIGN_API_KEY: ${{ secrets.ACTIVECAMPAIGN_API_KEY }}
          ZOOM_STORAGE_STATE_B64: ${{ secrets.ZOOM_STORAGE_STATE_B64 }}
          UTM_BUSINESS_TAB_NAME: ${{ inputs.utm_business_tab }}
          UTM_REG_TAB_NAME: ${{ inputs.utm_reg_tab }}
          FF_START_DATE: ${{ inputs.ff_start_date }}
          FF_END_DATE: ${{ inputs.ff_end_date }}
          ZOOM_WEBINAR_DATE: ${{ inputs.zoom_webinar_date }}
          ZOOM_WEBINAR_TIME: ${{ inputs.zoom_webinar_time }}
          FF_START_TIME: ${{ inputs.ff_start_time }}
          AC_LIST_DATE: ${{ inputs.ac_list_date }}
          AC_LIST_ENCORE: ${{ inputs.ac_list_encore }}
          AC_LIST_NAME: ${{ inputs.ac_list_name }}
        run: |
          python -u - <<'PY'
          import base64
          import csv
          import json
          import os
          import re
          import time
          import zlib
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from urllib.parse import urlparse
          from zoneinfo import ZoneInfo

          import gspread
          from google.oauth2.service_account import Credentials

          TZ_NAME = 'Asia/Kolkata'
          TZ = ZoneInfo(TZ_NAME)
          STATS_HEADERS = ['Date', 'Time Checked', 'Webinar Date', 'Webinar Type',
                           'Reports', 'UTM', 'Active Campaign', 'Zoom']


          def norm_cell(value):
              return ' '.join(str(value).split()).casefold()


          def trim_padding(rows):
              result = []
              for row in rows:
                  cells = list(row)
                  while cells and cells[-1] == '':
                      cells.pop()
                  result.append(cells)
              while result and not result[-1]:
                  result.pop()
              return result


          def stats_layout(sheet):
              """Find the A-H Stats headings; an optional 'Discrepancy' heading in column I is also filled."""
              rows = trim_padding(sheet.get_all_values(value_render_option='FORMULA'))
              expected = [norm_cell(h) for h in STATS_HEADERS]
              for row in rows:
                  if [norm_cell(c) for c in row[:len(STATS_HEADERS)]] == expected:
                      extra = norm_cell(row[len(STATS_HEADERS)]) if len(row) > len(STATS_HEADERS) else ''
                      return rows, extra in ('discrepancy', 'descrepancy')
              raise RuntimeError('Cannot find the Stats headings ' + ', '.join(STATS_HEADERS)
                                 + ' in columns A-H. Nothing written.')


          def parse_input_date(value, label):
              text = (value or '').strip()
              for fmt in ('%Y-%m-%d', '%d-%m-%Y', '%d/%m/%Y'):
                  try:
                      return datetime.strptime(text, fmt).date()
                  except ValueError:
                      pass
              raise RuntimeError(label + ' must look like 2026-10-21 or 21-10-2026 (got ' + repr(text) + ').')


          def find_tab(worksheets, name, label):
              exact = [ws for ws in worksheets if ws.title == name]
              if len(exact) == 1:
                  return exact[0]
              loose = [ws for ws in worksheets if norm_cell(ws.title) == norm_cell(name)]
              if len(loose) == 1:
                  print(label + ': matched tab "' + loose[0].title + '" (ignoring extra spaces/case).')
                  return loose[0]
              raise RuntimeError(label + ' tab not found in the UTM sheet: ' + name)


          def parse_utm_timestamp(value):
              value = value.strip()
              for fmt in ('%d/%m/%Y %H:%M:%S', '%d/%m/%Y %H:%M', '%d/%m/%Y %I:%M:%S %p', '%d/%m/%Y %I:%M %p'):
                  try:
                      return datetime.strptime(value, fmt).replace(tzinfo=TZ)
                  except ValueError:
                      pass
              try:
                  parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
                  return parsed.replace(tzinfo=TZ) if parsed.tzinfo is None else parsed.astimezone(TZ)
              except ValueError:
                  return None


          def read_utm_contacts(worksheet, window_start, end):
              """Keep rows whose timestamp_incoming_webhook date is within the FlexiFunnels range."""
              values = worksheet.get_all_values()
              if not values:
                  raise RuntimeError('UTM tab is empty: ' + worksheet.title)
              headers = [str(v).strip().casefold() for v in values[0]]
              columns = ('timestamp_incoming_webhook', 'first_name', 'email', 'phone')
              if any(headers.count(c) != 1 for c in columns):
                  raise RuntimeError('UTM tab needs unique timestamp_incoming_webhook, first_name, email and phone '
                                     'columns: ' + worksheet.title)
              idx = [headers.index(c) for c in columns]
              contacts, outside, no_time = [], 0, 0
              for row_number, row in enumerate(values[1:], 2):
                  row = list(row) + [''] * (max(idx) + 1 - len(row))
                  cells = [str(row[i]).strip() for i in idx]
                  if not any(cells):
                      continue
                  if not cells[0]:
                      no_time += 1
                      continue
                  stamp = parse_utm_timestamp(cells[0])
                  if stamp is None:
                      raise RuntimeError('Unrecognized timestamp in ' + worksheet.title + ' row ' + str(row_number)
                                         + ': ' + cells[0])
                  # Same window as FlexiFunnels: strictly after the start time, through the end date.
                  if (window_start.hour == 0 and window_start.minute == 0 and stamp >= window_start
                          or stamp > window_start) and stamp.date() <= end:
                      contacts.append({'name': cells[1], 'email': cells[2], 'phone': cells[3]})
                  else:
                      outside += 1
              print('UTM', worksheet.title, '-> kept', len(contacts), '| outside date range', outside,
                    '| no timestamp', no_time)
              return contacts


          def write_rows(path, rows):
              with path.open('w', encoding='utf-8-sig', newline='') as output:
                  writer = csv.DictWriter(output, fieldnames=['name', 'email', 'phone'])
                  writer.writeheader()
                  writer.writerows(rows)


          def zoom_host(host):
              return bool(host) and (host == 'zoom.us' or host.endswith('.zoom.us'))


          def check_zoom_seed(encoded):
              if not encoded.strip():
                  raise RuntimeError('Add ZOOM_STORAGE_STATE_B64 using the one-time Zoom session setup.')
              try:
                  raw = zlib.decompress(base64.b64decode(encoded.strip(), validate=True))
                  bundle = json.loads(raw)
                  cookies = bundle['storage_state']['cookies']
                  ok = (bundle.get('version') == 1 and cookies
                        and all(zoom_host(c.get('domain', '').lstrip('.')) for c in cookies))
              except Exception:
                  ok = False
              if not ok:
                  raise RuntimeError('Saved Zoom session cannot be read; run the Zoom session setup again.')


          # ---- ActiveCampaign list picker ------------------------------------------------
          # Picks ONLY the "10 Min Business" list for the ActiveCampaign date you entered.
          # The "Encore" checkbox decides between the regular list and the Encore list.
          # If you type an exact list name, that list is used (it must agree with the Encore box).
          # It never guesses: if nothing (or more than one) matches, the run stops here,
          # before any FlexiFunnels/Zoom work, and the log shows every list on that date.
          MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july',
                    'august', 'september', 'october', 'november', 'december']


          def ac_text(name):
              return ' '.join(str(name or '').split()).casefold()


          def ac_name_has_date(name, day):
              """True when the list name contains this date (24 Oct 2026, 24th October, Oct 24, 24/10/2026 ...)."""
              text = ac_text(name)
              years = set(re.findall(r'(?<!\d)(20\d{2})(?!\d)', text))
              if years and str(day.year) not in years:
                  return False
              full = MONTHS[day.month - 1]
              month = '(?:' + full + '|' + full[:3] + ('|sept' if day.month == 9 else '') + r')\.?'
              dd = r'0?' + str(day.day) + r'(?:st|nd|rd|th)?'
              patterns = [
                  r'(?<!\d)' + dd + r'[\s\-/.,]*' + month + r'(?![a-z])',
                  r'(?<![a-z])' + month + r'[\s\-/.,]*' + dd + r'(?!\d)',
                  r'(?<!\d)0?' + str(day.day) + r'[/\-.]0?' + str(day.month)
                  + r'(?:[/\-.](?:' + str(day.year) + '|' + str(day.year)[2:] + r'))?(?!\d)',
              ]
              return any(re.search(pattern, text) for pattern in patterns)


          def ac_is_10min_business(name):
              """True only for the 10-minute Business workshop lists (10 Min / 10 Mins / 10-Minute ... Business)."""
              text = ac_text(name)
              return (re.search(r'(?<!\d)10\s*-?\s*min(?:ute)?s?(?![a-z])', text) is not None
                      and re.search(r'\bbusiness\b', text) is not None)


          def ac_is_encore(name):
              """True when the list name contains the word Encore."""
              return re.search(r'\bencore\b', ac_text(name)) is not None


          def ac_kind(want_encore):
              return 'Encore' if want_encore else 'regular (non-Encore)'


          def ac_clock(name):
              """Time written in the list name as HH:MM, None if there is no time, 'ambiguous' if several."""
              text = str(name or '')
              found = set()
              for hour, minute, half in re.findall(
                      r'(?<!\d)(\d{1,2})(?:[:.]?([0-5]\d))?\s*([AaPp])\.?\s*[Mm](?![A-Za-z])', text):
                  hour = int(hour)
                  if 1 <= hour <= 12:
                      found.add('%02d:%02d' % (hour % 12 + (12 if half.lower() == 'p' else 0), int(minute or 0)))
              for hour, minute in re.findall(
                      r'(?<![\d:.])([01]?\d|2[0-3]):([0-5]\d)(?!\d)(?!\s*[AaPp]\.?\s*[Mm])', text):
                  found.add('%02d:%s' % (int(hour), minute))
              if not found:
                  return None
              return found.pop() if len(found) == 1 else 'ambiguous'


          def ac_all_lists():
              import requests
              parsed = urlparse(os.environ['ACTIVECAMPAIGN_API_URL'].strip())
              if (parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password
                      or parsed.path.rstrip('/') not in ('', '/api/3')):
                  raise RuntimeError('ACTIVECAMPAIGN_API_URL must be the HTTPS account host or end at /api/3.')
              endpoint = 'https://' + parsed.netloc + '/api/3/lists'
              session = requests.Session()
              session.headers.update({'Api-Token': os.environ['ACTIVECAMPAIGN_API_KEY'].strip(),
                                      'Accept': 'application/json'})
              lists, seen, offset = [], set(), 0
              for _ in range(200):
                  for attempt in range(4):
                      response = session.get(endpoint, params={'limit': 100, 'offset': offset, 'orders[name]': 'ASC'},
                                             timeout=60, allow_redirects=False)
                      if (response.status_code == 429 or response.status_code >= 500) and attempt < 3:
                          time.sleep(2 ** attempt)
                          continue
                      break
                  if response.status_code != 200:
                      raise RuntimeError('ActiveCampaign lists read failed (HTTP ' + str(response.status_code) + ').')
                  data = response.json()
                  batch = data.get('lists') or []
                  try:
                      total = int(data['meta']['total'])
                  except (KeyError, TypeError, ValueError):
                      raise RuntimeError('ActiveCampaign lists response did not include a total.') from None
                  for item in batch:
                      key = str(item.get('id', ''))
                      if key and key not in seen:
                          seen.add(key)
                          lists.append(item)
                  offset += len(batch)
                  if not batch or offset >= total:
                      return lists
              raise RuntimeError('Too many ActiveCampaign lists to read in one run.')


          def resolve_ac_list(ac_date, webinar_time, want_encore, exact_name):
              lists = ac_all_lists()
              dated = [item for item in lists if ac_name_has_date(item.get('name', ''), ac_date)]
              print('ActiveCampaign: lists read:', len(lists), '| lists with', ac_date.isoformat(),
                    'in the name:', len(dated))
              for item in dated:
                  name = item.get('name', '')
                  tag = ''
                  if ac_is_10min_business(name):
                      tag = '<- 10 Min Business' + (' (Encore)' if ac_is_encore(name) else ' (regular)')
                  print('   -', name, '(id ' + str(item.get('id')) + ')', tag)
              print('ActiveCampaign: Encore box ticked:', 'yes' if want_encore else 'no',
                    '-> looking for the', ac_kind(want_encore), 'list')

              # ---- A. Exact list name typed in the form -----------------------------------
              if exact_name:
                  named = [item for item in lists if ac_text(item.get('name', '')) == ac_text(exact_name)]
                  if not named:
                      raise RuntimeError('No ActiveCampaign list is named exactly "' + exact_name + '". Lists on '
                                         + ac_date.isoformat() + ': '
                                         + (' | '.join(str(i.get('name')) for i in dated) or 'none') + '.')
                  if len(named) > 1:
                      raise RuntimeError('More than one ActiveCampaign list is named "' + exact_name + '": '
                                         + ' | '.join('id ' + str(i.get('id')) for i in named)
                                         + '. Rename or remove the duplicate.')
                  chosen = named[0]
                  name = chosen.get('name', '')
                  if ac_is_encore(name) != want_encore:
                      raise RuntimeError('The list name you typed ("' + name + '") is '
                                         + ('an Encore' if ac_is_encore(name) else 'a regular (non-Encore)')
                                         + ' list, but the Encore box was ' + ('ticked' if want_encore else 'not ticked')
                                         + '. Fix the box or the name and rerun.')
                  if not ac_is_10min_business(name):
                      print('ActiveCampaign WARNING: typed list does not look like a "10 Min Business" list.')
                  if not ac_name_has_date(name, ac_date):
                      print('ActiveCampaign WARNING: typed list name does not contain', ac_date.isoformat())
                  print('ActiveCampaign list chosen (typed name):', name, '(id ' + str(chosen.get('id')) + ')')
                  return chosen, 'event_list'

              # ---- B. Auto-pick by date + Encore box ---------------------------------------
              business = [item for item in dated if ac_is_10min_business(item.get('name', ''))]
              if not business:
                  raise RuntimeError('No ActiveCampaign "10 Min Business" list found for ' + ac_date.isoformat()
                                     + '. Lists on that date: '
                                     + (' | '.join(str(i.get('name')) for i in dated) or 'none')
                                     + '. Check the ActiveCampaign date you entered.')
              wanted = [item for item in business if ac_is_encore(item.get('name', '')) == want_encore]
              if not wanted:
                  raise RuntimeError('No ' + ac_kind(want_encore) + ' "10 Min Business" list found for '
                                     + ac_date.isoformat() + '. The lists on that date are: '
                                     + ' | '.join(str(i.get('name')) for i in business)
                                     + '. ' + ('Untick' if want_encore else 'Tick') + ' the Encore box if you meant that one.')
              exact, untimed, other = [], [], []
              for item in wanted:
                  clock = ac_clock(item.get('name', ''))
                  if clock == webinar_time:
                      exact.append(item)
                  elif clock is None:
                      untimed.append(item)
                  else:
                      other.append(item)
              pool = exact or untimed
              if not pool:
                  raise RuntimeError('The ' + ac_kind(want_encore) + ' "10 Min Business" lists on ' + ac_date.isoformat()
                                     + ' are for other times: ' + ' | '.join(str(i.get('name')) for i in other)
                                     + '. Check the Zoom webinar time you chose.')
              if len(pool) > 1:
                  raise RuntimeError('More than one ' + ac_kind(want_encore) + ' "10 Min Business" list matches '
                                     + ac_date.isoformat() + ' ' + webinar_time + ' (not guessing): '
                                     + ' | '.join(str(i.get('name')) + ' (id ' + str(i.get('id')) + ')' for i in pool)
                                     + '. Type the exact list name in the "ActiveCampaign list name" field.')
              chosen = pool[0]
              # A Sunday list is "shared" only when it has no time and is the ONLY 10 Min Business
              # list that day (no separate Encore list for the second session).
              shared = not exact and ac_date.weekday() == 6 and len(business) == 1
              scope = 'shared_sunday_list' if shared else 'event_list'
              print('ActiveCampaign list chosen:', chosen.get('name'), '(id ' + str(chosen.get('id')) + ')')
              if scope == 'shared_sunday_list':
                  print('ActiveCampaign: Sunday list has no time in its name; it covers both Sunday sessions.')
              return chosen, scope


          print('=' * 60)
          print('DISCREPANCY TRACKER — VERSION 24 (DESCREPANCY = every tab checked against Zoom)')
          print('=' * 60)

          required = ['GOOGLE_SERVICE_ACCOUNT_JSON', 'RAW_DATA_SHEET_ID', 'UTM_SHEET_ID',
                      'DISCREPANCY_SHEET_ID', 'DISCREPANCY_TAB_NAME',
                      'ACTIVECAMPAIGN_API_URL', 'ACTIVECAMPAIGN_API_KEY']
          missing = [key for key in required if not os.environ.get(key, '').strip()]
          if missing:
              raise RuntimeError('Missing configuration: ' + ', '.join(missing))

          # ---- 1. Validate the run inputs -------------------------------------------------
          now = datetime.now(TZ)
          ff_start = parse_input_date(os.environ.get('FF_START_DATE'), 'FlexiFunnels start date')
          ff_end = parse_input_date(os.environ.get('FF_END_DATE'), 'FlexiFunnels end date')
          webinar_date = parse_input_date(os.environ.get('ZOOM_WEBINAR_DATE'), 'Zoom webinar date')
          ac_date = parse_input_date(os.environ.get('AC_LIST_DATE'), 'ActiveCampaign list date')
          ac_want_encore = os.environ.get('AC_LIST_ENCORE', 'false').strip().casefold() == 'true'
          ac_exact_name = ' '.join(os.environ.get('AC_LIST_NAME', '').split())
          if ff_start > ff_end:
              raise RuntimeError('FlexiFunnels start date ' + ff_start.isoformat() + ' is after the end date '
                                 + ff_end.isoformat() + '.')
          if ff_end > now.date():
              raise RuntimeError('FlexiFunnels end date ' + ff_end.isoformat() + ' is in the future.')
          if (ff_end - ff_start).days > 92:
              raise RuntimeError('FlexiFunnels range is longer than 92 days; check the dates.')
          slots = {'7:30 PM': ('evening', '19:30'), '11:00 AM': ('morning', '11:00')}
          time_choice = os.environ.get('ZOOM_WEBINAR_TIME', '').strip()
          if time_choice not in slots:
              raise RuntimeError('Choose the Zoom webinar time: 7:30 PM or 11:00 AM.')
          slot, webinar_time = slots[time_choice]
          business_name = os.environ.get('UTM_BUSINESS_TAB_NAME', '').strip()
          reg_name = os.environ.get('UTM_REG_TAB_NAME', '').strip()
          if not business_name or not reg_name or business_name == reg_name:
              raise RuntimeError('Provide two different UTM tab names.')

          start_times = {'6:00 PM': '18:00', '9:00 AM': '09:00', '12:00 AM (whole day)': '00:00'}
          start_choice = os.environ.get('FF_START_TIME', '6:00 PM').strip()
          if start_choice not in start_times:
              raise RuntimeError('Choose a valid start time.')
          ff_start_time = start_times[start_choice]
          window_start = datetime.combine(ff_start, datetime.strptime(ff_start_time, '%H:%M').time(), tzinfo=TZ)
          plan = {'timezone': TZ_NAME, 'ff_start_time': ff_start_time,
                  'ff_start': ff_start.isoformat(), 'ff_end': ff_end.isoformat(),
                  'webinar_date': webinar_date.isoformat(), 'webinar_time': webinar_time, 'slot': slot,
                  'zoom_search_from': (webinar_date - timedelta(days=1)).isoformat(),
                  'zoom_search_to': webinar_date.isoformat(),
                  'captured_at': now.isoformat(timespec='seconds')}
          print('FlexiFunnels + UTM window: after', plan['ff_start'], start_choice, 'through end of', plan['ff_end'])
          print('Zoom webinar:', plan['webinar_date'], time_choice, 'IST')
          print('ActiveCampaign list date:', ac_date.isoformat(), '| time:', time_choice,
                '| Encore:', 'yes' if ac_want_encore else 'no',
                '| typed name:', ac_exact_name or '(none, auto-pick)')
          if ac_date != webinar_date:
              print('Note: ActiveCampaign date differs from the Zoom webinar date (as entered).')

          # ---- 2. Pick the ActiveCampaign "10 Min Business" list (fails fast) -------------
          ac_list, ac_scope = resolve_ac_list(ac_date, webinar_time, ac_want_encore, ac_exact_name)
          plan.update({'ac_date': ac_date.isoformat(), 'ac_list_id': str(ac_list['id']),
                       'ac_list_name': str(ac_list['name']), 'ac_list_scope': ac_scope})

          # ---- 3. Connect to the three spreadsheets (read-only) ---------------------------
          credentials = Credentials.from_service_account_info(
              json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON']),
              scopes=['https://www.googleapis.com/auth/spreadsheets.readonly'])
          client = gspread.authorize(credentials)
          if os.environ['UTM_SHEET_ID'] in (os.environ['RAW_DATA_SHEET_ID'], os.environ['DISCREPANCY_SHEET_ID']):
              raise RuntimeError('UTM source must be separate from the destination spreadsheets.')
          books = {}
          for label, key in [('UTM', 'UTM_SHEET_ID'), ('DESCREPANCY', 'RAW_DATA_SHEET_ID'),
                             ('STATS', 'DISCREPANCY_SHEET_ID')]:
              books[label] = client.open_by_key(os.environ[key])
              print(label + ': connected ->', books[label].title)

          # ---- 4. Preflight everything that later jobs need ------------------------------
          stats_sheet = books['STATS'].worksheet(os.environ['DISCREPANCY_TAB_NAME'].strip())
          _, has_discrepancy_column = stats_layout(stats_sheet)
          print('Stats headings found. Discrepancy column (I):', 'yes' if has_discrepancy_column else 'no')
          check_zoom_seed(os.environ.get('ZOOM_STORAGE_STATE_B64', ''))
          print('Zoom saved session: readable.')

          # ---- 5. Read the two UTM tabs, filtered to the FlexiFunnels date range -----------
          utm_tabs = books['UTM'].worksheets()
          business_tab = find_tab(utm_tabs, business_name, 'Business UTM')
          reg_tab = find_tab(utm_tabs, reg_name, 'Reg team UTM')
          business_rows = read_utm_contacts(business_tab, window_start, ff_end)
          registration_rows = read_utm_contacts(reg_tab, window_start, ff_end)

          Path('utm').mkdir(exist_ok=True)
