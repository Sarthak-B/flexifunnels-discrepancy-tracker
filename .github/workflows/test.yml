name: FlexiFunnels Discrepancy Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # JOB 1: GOOGLE SHEETS CONNECTION TEST
  # ============================================================

  test-google-sheets:
    name: Test Google Sheets Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth

      - name: Verify Google Sheets access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}
          UTM_LANDING_TAB: ${{ vars.UTM_LANDING_TAB }}
          UTM_REG_TAB: ${{ vars.UTM_REG_TAB }}
          DISCREPANCY_TAB_NAME: ${{ vars.DISCREPANCY_TAB_NAME }}

        run: |
          python -u - <<'PY'
          import os
          import json
          import gspread

          from google.oauth2.service_account import Credentials

          print("=" * 60)
          print("GOOGLE SHEETS CONNECTION TEST - VERSION 5")
          print("=" * 60)

          required = [
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "RAW_DATA_SHEET_ID",
              "UTM_SHEET_ID",
              "DISCREPANCY_SHEET_ID",
          ]

          missing = [
              key for key in required
              if not os.environ.get(key, "").strip()
          ]

          if missing:
              raise RuntimeError(
                  "Missing configuration: " + ", ".join(missing)
              )

          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets.readonly"
              ],
          )

          client = gspread.authorize(credentials)

          spreadsheets = {
              "RAW DATA": os.environ["RAW_DATA_SHEET_ID"],
              "UTM": os.environ["UTM_SHEET_ID"],
              "DISCREPANCY STATS": os.environ["DISCREPANCY_SHEET_ID"],
          }

          opened = {}

          for label, sheet_id in spreadsheets.items():
              spreadsheet = client.open_by_key(sheet_id)
              opened[label] = spreadsheet

              print("\n" + label + ": CONNECTED")
              print("Spreadsheet:", spreadsheet.title)

              worksheets = spreadsheet.worksheets()

              print("Total tabs:", len(worksheets))

              for worksheet in worksheets:
                  print("  Tab:", worksheet.title)

          print("\nCHECKING CONFIGURED SOURCE TABS")

          checks = [
              ("UTM_LANDING_TAB", "UTM"),
              ("UTM_REG_TAB", "UTM"),
              ("DISCREPANCY_TAB_NAME", "DISCREPANCY STATS"),
          ]

          for variable, spreadsheet_label in checks:
              tab_name = os.environ.get(variable, "").strip()

              if not tab_name:
                  print(variable + ": NOT CONFIGURED")
                  continue

              spreadsheet = opened[spreadsheet_label]

              try:
                  spreadsheet.worksheet(tab_name)
                  print(variable + ": FOUND")
              except gspread.WorksheetNotFound:
                  raise RuntimeError(
                      variable + " does not match an existing tab."
                  )

          print("\n" + "=" * 60)
          print("GOOGLE SHEETS CONNECTION TEST SUCCESSFUL")
          print("READ-ONLY TEST: NO DATA MODIFIED")
          print("=" * 60)
          PY

  # ============================================================
  # JOB 2: FLEXIFUNNELS LOGIN + SUB-USER SELECTION
  # ============================================================

  test-flexifunnels-login:
    name: Test FlexiFunnels Login
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test login, sub-user selection, and project
        env:
          FLEXIFUNNELS_EMAIL: ${{ secrets.FLEXIFUNNELS_EMAIL }}
          FLEXIFUNNELS_PASSWORD: ${{ secrets.FLEXIFUNNELS_PASSWORD }}
          FLEXIFUNNELS_PROJECT_URL: ${{ vars.FLEXIFUNNELS_PROJECT_URL }}
          FLEXIFUNNELS_SUB_USER: Saurabh Bhatnagar

        run: |
          python -u - <<'PY'
          import os
          import time
          import re

          from urllib.parse import urlparse

          from playwright.sync_api import (
              sync_playwright,
              TimeoutError as PlaywrightTimeout,
          )

          print("=" * 60)
          print("FLEXIFUNNELS LOGIN TEST - VERSION 5")
          print("=" * 60)

          email = os.environ.get(
              "FLEXIFUNNELS_EMAIL", ""
          ).strip()

          password = os.environ.get(
              "FLEXIFUNNELS_PASSWORD", ""
          )

          project_url = os.environ.get(
              "FLEXIFUNNELS_PROJECT_URL", ""
          ).strip()

          sub_user = os.environ.get(
              "FLEXIFUNNELS_SUB_USER", ""
          ).strip()

          if not email:
              raise RuntimeError(
                  "FLEXIFUNNELS_EMAIL is missing."
              )

          if not password:
              raise RuntimeError(
                  "FLEXIFUNNELS_PASSWORD is missing."
              )

          if not sub_user:
              raise RuntimeError(
                  "FLEXIFUNNELS_SUB_USER is missing."
              )

          parsed_project = urlparse(project_url)

          if (
              parsed_project.scheme != "https"
              or parsed_project.hostname != "app.flexifunnels.com"
              or parsed_project.path.rstrip("/")
                 != "/projects/kvapNzyj"
          ):
              raise RuntimeError(
                  "Unexpected FlexiFunnels project URL."
              )

          expected_project_path = (
              parsed_project.path.rstrip("/")
          )

          def safe_location(page):
              parsed = urlparse(page.url)

              return (
                  parsed.scheme
                  + "://"
                  + (parsed.hostname or "")
                  + parsed.path
              )

          def visible_first(locator):
              count = min(locator.count(), 50)

              for index in range(count):
                  item = locator.nth(index)

                  if item.is_visible():
                      return item

              return None

          def wait_for_path_change(page, original_path, seconds=30):
              deadline = time.monotonic() + seconds

              while time.monotonic() < deadline:
                  current = urlparse(page.url).path.rstrip("/")

                  if current != original_path:
                      return current

                  time.sleep(1)

              return urlparse(page.url).path.rstrip("/")

          def click_named_sub_user(page, name):
              """
              Select only the requested sub-user.

              Never click an unrelated account or an
              arbitrary button based on its position.
              """

              print("\nSTEP 7: Finding requested sub-user")

              print("Expected sub-user: Saurabh Bhatnagar")

              page.wait_for_timeout(3000)

              exact_name = re.compile(
                  r"^\s*" + re.escape(name) + r"\s*$",
                  re.IGNORECASE,
              )

              # First try accessible controls that carry
              # the exact requested account name.

              candidate_locators = [
                  (
                      "Exact button name",
                      page.get_by_role(
                          "button",
                          name=exact_name,
                      ),
                  ),
                  (
                      "Exact link name",
                      page.get_by_role(
                          "link",
                          name=exact_name,
                      ),
                  ),
                  (
                      "Exact text",
                      page.get_by_text(
                          exact_name,
                      ),
                  ),
              ]

              for description, locator in candidate_locators:

                  matches = [
                      locator.nth(index)
                      for index in range(min(locator.count(), 30))
                      if locator.nth(index).is_visible()
                  ]

                  if len(matches) != 1:
                      continue

                  candidate = matches[0]

                  print(
                      "Found unique account match using:",
                      description,
                  )

                  # Click the named element itself if it
                  # is an interactive control.

                  tag = candidate.evaluate(
                      "(element) => element.tagName.toLowerCase()"
                  )

                  role = candidate.get_attribute("role")

                  if tag in ("button", "a") or role == "button":
                      candidate.click(timeout=10000)

                      print("Named sub-user control clicked.")
                      return True

                  # Otherwise, find a directly associated
                  # interactive ancestor.

                  # Do not select arbitrary buttons in
                  # other account rows.

                  ancestor = candidate.locator(
                      "xpath=ancestor::*["
                      "self::button or "
                      "self::a or "
                      "@role='button'"
                      "][1]"
                  )

                  if ancestor.count() == 1:
                      if ancestor.is_visible():
                          ancestor.click(timeout=10000)

                          print(
                              "Sub-user account control clicked."
                          )

                          return True

                  # Some interfaces make the account
                  # name itself clickable through JS.
                  # Try a normal Playwright click only
                  # when the exact name is unique.

                  try:
                      candidate.click(
                          timeout=5000,
                      )

                      print(
                          "Exact sub-user name clicked."
                      )

                      return True

                  except PlaywrightTimeout:
                      print(
                          "Name found but not directly clickable."
                      )

              print(
                  "Could not safely identify a unique "
                  "clickable control for the requested sub-user."
              )

              return False

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 900,
                  },
                  accept_downloads=False,
              )

              page = context.new_page()

              page.set_default_timeout(15000)

              try:

                  # ============================================
                  # STEP 1: OPEN LOGIN
                  # ============================================

                  print("\nSTEP 1: Opening FlexiFunnels")

                  page.goto(
                      "https://app.flexifunnels.com/login",
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  print("Location:", safe_location(page))

                  # ============================================
                  # STEP 2: FIND LOGIN FIELDS
                  # ============================================

                  print("\nSTEP 2: Finding login fields")

                  email_field = visible_first(
                      page.locator(
                          'input[type="email"], '
                          'input[name="email"], '
                          'input[autocomplete="username"]'
                      )
                  )

                  password_field = visible_first(
                      page.locator(
                          'input[type="password"]'
                      )
                  )

                  if email_field is None:
                      raise RuntimeError(
                          "Email field not found."
                      )

                  if password_field is None:
                      raise RuntimeError(
                          "Password field not found."
                      )

                  print("Login fields found.")

                  # ============================================
                  # STEP 3: ENTER CREDENTIALS
                  # ============================================

                  print("\nSTEP 3: Entering credentials")

                  email_field.fill(email)
                  password_field.fill(password)

                  print("Credentials entered.")

                  # ============================================
                  # STEP 4: FIND LOGIN BUTTON
                  # ============================================

                  print("\nSTEP 4: Finding login button")

                  login_selectors = [
                      'button[type="submit"]',
                      'input[type="submit"]',
                      'button:has-text("Login")',
                      'button:has-text("Log in")',
                      'button:has-text("Sign in")',
                  ]

                  login_button = None

                  for selector in login_selectors:
                      candidate = visible_first(
                          page.locator(selector)
                      )

                      if candidate is not None:
                          login_button = candidate

                          print(
                              "Login button found using:",
                              selector,
                          )

                          break

                  # ============================================
                  # STEP 5: SUBMIT LOGIN
                  # ============================================

                  print("\nSTEP 5: Submitting login")

                  if login_button is not None:
                      login_button.click(timeout=15000)
                  else:
                      password_field.press("Enter")

                  print("Login submitted.")

                  # ============================================
                  # STEP 6: WAIT FOR ACCOUNT SELECTION
                  # ============================================

                  print(
                      "\nSTEP 6: Waiting for authentication"
                  )

                  current_path = wait_for_path_change(
                      page,
                      "/login",
                      seconds=30,
                  )

                  print(
                      "Location after login:",
                      safe_location(page),
                  )

                  if current_path == "/login":

                      print(
                          "Still on login URL. "
                          "Checking protected project route."
                      )

                      page.goto(
                          project_url,
                          wait_until="domcontentloaded",
                          timeout=60000,
                      )

                      page.wait_for_timeout(3000)

                      current_path = urlparse(
                          page.url
                      ).path.rstrip("/")

                  print(
                      "Current location:",
                      safe_location(page),
                  )

                  # ============================================
                  # STEP 7: SELECT SUB-USER
                  # ============================================

                  if current_path == "/switch-sub-users":

                      print(
                          "\nSUB-USER SELECTION SCREEN DETECTED"
                      )

                      selected = click_named_sub_user(
                          page,
                          sub_user,
                      )

                      if not selected:
                          raise RuntimeError(
                              "Requested sub-user could not "
                              "be safely selected."
                          )

                      print(
                          "\nSTEP 8: Waiting after sub-user selection"
                      )

                      page.wait_for_timeout(5000)

                      print(
                          "Location after selection:",
                          safe_location(page),
                      )

                  else:

                      print(
                          "\nSub-user selection page "
                          "not currently displayed."
                      )

                  # ============================================
                  # STEP 9: OPEN PROJECT
                  # ============================================

                  print("\nSTEP 9: Opening FlexiFunnels project")

                  page.goto(
                      project_url,
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  print(
                      "Project navigation completed."
                  )

                  print(
                      "Current location:",
                      safe_location(page),
                  )

                  # ============================================
                  # STEP 10: VERIFY PROJECT
                  # ============================================

                  print("\nSTEP 10: Verifying project access")

                  deadline = time.monotonic() + 30

                  verified = False

                  while time.monotonic() < deadline:

                      current_path = urlparse(
                          page.url
                      ).path.rstrip("/")

                      if current_path == expected_project_path:

                          project_content = page.get_by_text(
                              "Funnel Builder Agent",
                              exact=False,
                          )

                          if visible_first(project_content) is not None:
                              verified = True
                              break

                      time.sleep(2)

                  if not verified:

                      print(
                          "Project verification unsuccessful."
                      )

                      print(
                          "Final location:",
                          safe_location(page),
                      )

                      raise RuntimeError(
                          "Project could not be verified "
                          "after sub-user selection."
                      )

                  # ============================================
                  # SUCCESS
                  # ============================================

                  print("\n" + "=" * 60)
                  print("SUCCESS: FLEXIFUNNELS LOGIN VERIFIED")
                  print("SUCCESS: SUB-USER SELECTION COMPLETED")
                  print("SUCCESS: PROJECT ACCESS VERIFIED")
                  print("NO REPORTS DOWNLOADED")
                  print("NO GOOGLE SHEETS MODIFIED")
                  print("=" * 60)

              except Exception as exc:

                  print("\n" + "=" * 60)
                  print("FLEXIFUNNELS TEST FAILED")
                  print(
                      "Error type:",
                      type(exc).__name__,
                  )
                  print(
                      "Last browser location:",
                      safe_location(page),
                  )
                  print("=" * 60)

                  raise RuntimeError(
                      "FlexiFunnels login, sub-user "
                      "selection, or project verification failed. "
                      "Review the numbered steps above."
                  ) from None

              finally:

                  context.close()
                  browser.close()

                  print("\nBrowser closed.")

          PY
