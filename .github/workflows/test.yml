name: FlexiFunnels Discrepancy Tracker

on:
  workflow_dispatch:
    inputs:
      event_date:
        description: "Webinar date to process (YYYY-MM-DD). Clear it to auto-pick the latest non-future date."
        required: false
        default: "2026-10-14"

concurrency:
  group: flexifunnels-discrepancy-sheets
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  test-google-sheets:
    name: Find latest paired UTM tabs and verify Sheets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      utm_landing_tab: ${{ steps.verify-sheets.outputs.utm_landing_tab }}
      utm_reg_tab: ${{ steps.verify-sheets.outputs.utm_reg_tab }}
      utm_tab_date: ${{ steps.verify-sheets.outputs.utm_tab_date }}

    steps:

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Sheets dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth

      - name: Verify Google Sheets access and discover daily UTM tabs
        id: verify-sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}
          DISCREPANCY_TAB_NAME: ${{ vars.DISCREPANCY_TAB_NAME }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          ACTIVECAMPAIGN_API_URL: ${{ secrets.ACTIVECAMPAIGN_API_URL }}
          ACTIVECAMPAIGN_API_KEY: ${{ secrets.ACTIVECAMPAIGN_API_KEY }}
          ZOOM_STORAGE_STATE_B64: ${{ secrets.ZOOM_STORAGE_STATE_B64 }}
          TARGET_EVENT_DATE: ${{ inputs.event_date }}

        run: |
          python -u - <<'PY'
          import json
          import os
          import re
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          import gspread
          from google.oauth2.service_account import Credentials

          print("=" * 60)
          print("GOOGLE SHEETS TEST - VERSION 18")
          print("=" * 60)

          required = [
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "RAW_DATA_SHEET_ID",
              "UTM_SHEET_ID",
              "DISCREPANCY_SHEET_ID",
              "DISCREPANCY_TAB_NAME",
          ]

          missing = [
              key
              for key in required
              if not os.environ.get(key, "").strip()
          ]

          if missing:
              raise RuntimeError(
                  "Missing configuration: " + ", ".join(missing)
              )

          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets.readonly"
              ],
          )

          client = gspread.authorize(credentials)

          spreadsheets = {
              "UTM": os.environ["UTM_SHEET_ID"],
              "RAW DATA": os.environ["RAW_DATA_SHEET_ID"],
              "DISCREPANCY STATS": os.environ["DISCREPANCY_SHEET_ID"],
          }

          opened = {}

          for label, spreadsheet_id in spreadsheets.items():

              spreadsheet = client.open_by_key(spreadsheet_id)

              opened[label] = spreadsheet

              print()
              print(label + ": CONNECTED")
              print("Spreadsheet:", spreadsheet.title)
              print("Tabs:", len(spreadsheet.worksheets()))

          """Reuse an explicitly saved Zoom session. Only encrypted state is cached in CI."""
          import base64
          import hashlib
          import json
          import os
          import zlib
          from pathlib import Path
          from urllib.parse import urlparse

          ZOOM_SESSION_SECRET = 'ZOOM_STORAGE_STATE_B64'
          ZOOM_STATE_LIMIT = 4 * 1024 * 1024


          def zoom_session_host(host):
              return bool(host) and (host == 'zoom.us' or host.endswith('.zoom.us'))


          def validate_zoom_bundle(bundle):
              if not isinstance(bundle, dict) or bundle.get('version') != 1:
                  raise RuntimeError('Saved Zoom session format is unsupported; run the session setup again.')
              state = bundle.get('storage_state')
              if not isinstance(state, dict) or not isinstance(state.get('cookies'), list) or not isinstance(state.get('origins'), list):
                  raise RuntimeError('Saved Zoom session is incomplete; run the session setup again.')
              if not state['cookies']:
                  raise RuntimeError('Saved Zoom session contains no cookies; sign in during setup.')
              for cookie in state['cookies']:
                  if not isinstance(cookie, dict) or not zoom_session_host(cookie.get('domain', '').lstrip('.')):
                      raise RuntimeError('Saved session contains a non-Zoom cookie.')
              for origin in state['origins']:
                  address = urlparse(origin.get('origin', ''))
                  if address.scheme != 'https' or not zoom_session_host(address.hostname):
                      raise RuntimeError('Saved session contains a non-Zoom origin.')
              sessions = bundle.get('session_storage', {})
              if not isinstance(sessions, dict):
                  raise RuntimeError('Saved Zoom session storage is invalid.')
              for origin, entries in sessions.items():
                  address = urlparse(origin)
                  if address.scheme != 'https' or not zoom_session_host(address.hostname):
                      raise RuntimeError('Saved session contains a non-Zoom session origin.')
                  if not isinstance(entries, dict) or not all(isinstance(k, str) and isinstance(v, str) for k, v in entries.items()):
                      raise RuntimeError('Saved Zoom session storage entries are invalid.')
              return bundle


          def decode_zoom_seed(encoded):
              if not encoded or not encoded.strip():
                  raise RuntimeError('Add ZOOM_STORAGE_STATE_B64 using the one-time Zoom session setup.')
              try:
                  compressed = base64.b64decode(encoded.strip(), validate=True)
                  decoder = zlib.decompressobj()
                  raw = decoder.decompress(compressed, ZOOM_STATE_LIMIT + 1)
                  if len(raw) > ZOOM_STATE_LIMIT or not decoder.eof or decoder.unused_data:
                      raise ValueError('invalid size')
                  bundle = json.loads(raw)
              except Exception:
                  raise RuntimeError('Saved Zoom session cannot be read; run the session setup again.') from None
              return validate_zoom_bundle(bundle)


          def encode_zoom_bundle(bundle):
              validate_zoom_bundle(bundle)
              raw = json.dumps(bundle, separators=(',', ':')).encode()
              if len(raw) > ZOOM_STATE_LIMIT:
                  raise RuntimeError('Zoom session is too large to save.')
              encoded = base64.b64encode(zlib.compress(raw, level=9)).decode('ascii')
              if len(encoded.encode()) > 48 * 1024:
                  raise RuntimeError('Zoom session exceeds the GitHub secret size limit; no session was uploaded.')
              return encoded


          def zoom_seed_value():
              value = os.environ.get(ZOOM_SESSION_SECRET, '').strip()
              decode_zoom_seed(value)
              return value


          def zoom_cipher(seed):
              from cryptography.fernet import Fernet
              digest = hashlib.sha256(b'flexifunnels-zoom-session-cache-v1\x00' + seed.encode()).digest()
              return Fernet(base64.urlsafe_b64encode(digest))


          def load_zoom_session(seed, cache_file):
              initial = decode_zoom_seed(seed)
              if cache_file.is_file():
                  try:
                      if cache_file.stat().st_size > ZOOM_STATE_LIMIT * 2:
                          raise ValueError('cache too large')
                      raw = zoom_cipher(seed).decrypt(cache_file.read_bytes())
                      cached = validate_zoom_bundle(json.loads(raw))
                      print('Zoom: restored the encrypted browser-session cache.')
                      return cached
                  except Exception:
                      # Never print exceptions that might contain authentication values.
                      print('Zoom: cache is unavailable or invalid; using the saved initial session.')
              else:
                  print('Zoom: loaded the saved initial browser session.')
              return initial


          def collect_zoom_session(context):
              state = context.storage_state(indexed_db=True)
              state['cookies'] = [c for c in state['cookies'] if zoom_session_host(c['domain'].lstrip('.'))]
              state['origins'] = [o for o in state['origins'] if zoom_session_host(urlparse(o['origin']).hostname)]
              sessions = {}
              for page in context.pages:
                  address = urlparse(page.url)
                  if address.scheme == 'https' and zoom_session_host(address.hostname):
                      origin = address.scheme + '://' + address.netloc
                      sessions[origin] = page.evaluate('() => Object.fromEntries(Object.entries(sessionStorage))')
              return validate_zoom_bundle({'version': 1, 'storage_state': state, 'session_storage': sessions})


          def install_zoom_session_storage(context, bundle):
              # Executed only on the exact Zoom origins included in the authenticated state.
              serialized = json.dumps(bundle.get('session_storage', {}))
              context.add_init_script(script='''(() => {
                  const states = ''' + serialized + ''';
                  const entries = states[window.location.origin];
                  if (entries) for (const [key, value] of Object.entries(entries)) {
                      if (window.sessionStorage.getItem(key) === null) window.sessionStorage.setItem(key, value);
                  }
              })();''')


          def save_zoom_session_cache(context, seed, cache_file):
              bundle = collect_zoom_session(context)
              payload = zoom_cipher(seed).encrypt(json.dumps(bundle, separators=(',', ':')).encode())
              cache_file.parent.mkdir(parents=True, exist_ok=True)
              os.chmod(cache_file.parent, 0o700)
              temporary = cache_file.with_suffix('.tmp')
              fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(payload)
              os.replace(temporary, cache_file)
              print('Zoom: refreshed session saved to the encrypted cache.')

          import csv
          import json
          import os
          import re
          from collections import defaultdict, deque
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo


          def normalized_phone(value):
              """Digits only; Indian numbers reduced to 10 digits (+91 / 91 / 0091 / 0 prefixes)."""
              raw = str(value or '').strip()
              if re.search(r'[A-Za-z]', raw):
                  return ''
              digits = re.sub(r'\D', '', raw)
              if digits.startswith('0091'):
                  digits = digits[4:]
              elif digits.startswith('00'):
                  digits = digits[2:]
              if len(digits) == 12 and digits.startswith('91'):
                  digits = digits[2:]
              elif len(digits) == 11 and digits.startswith('0'):
                  digits = digits[1:]
              return digits


          def match_key(row):
              email = row['email'].strip().casefold()
              phone = normalized_phone(row['phone'])
              if not email or not phone or not phone.isascii() or not phone.isdigit():
                  return None
              return email, phone


          def compare_rows(ff_rows, utm_rows):
              available = defaultdict(deque)
              for index, row in enumerate(utm_rows):
                  key = match_key(row)
                  if key is not None:
                      available[key].append(index)
              matched, ff_only, used = [], [], set()
              for row in ff_rows:
                  key = match_key(row)
                  if key is not None and available[key]:
                      used.add(available[key].popleft())
                      matched.append(row)
                  else:
                      ff_only.append(row)
              utm_only = [row for index, row in enumerate(utm_rows) if index not in used]
              return matched, ff_only, utm_only


          def parse_utm_timestamp(value, timezone):
              value = value.strip()
              for fmt in ('%d/%m/%Y %H:%M:%S', '%d/%m/%Y %H:%M', '%d/%m/%Y %I:%M:%S %p', '%d/%m/%Y %I:%M %p'):
                  try:
                      return datetime.strptime(value, fmt).replace(tzinfo=timezone)
                  except ValueError:
                      pass
              try:
                  parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
                  return parsed.replace(tzinfo=timezone) if parsed.tzinfo is None else parsed.astimezone(timezone)
              except ValueError:
                  raise RuntimeError('Unrecognized UTM timestamp format. No comparison was produced.') from None


          def read_utm_rows(worksheet, start, end, timezone):
              values = worksheet.get_all_values()
              if not values:
                  raise RuntimeError('Selected UTM tab has no header row.')
              headers = [value.strip().casefold() for value in values[0]]
              required = ('timestamp_incoming_webhook', 'first_name', 'email', 'phone')
              if any(headers.count(key) != 1 for key in required):
                  raise RuntimeError('UTM tab must have unique timestamp_incoming_webhook, first_name, email and phone columns.')
              indexes = {key: headers.index(key) for key in required}
              result = []
              excluded = 0
              for cells in values[1:]:
                  get = lambda key: cells[indexes[key]].strip() if indexes[key] < len(cells) else ''
                  if not any(get(key) for key in required):
                      continue
                  timestamp = parse_utm_timestamp(get('timestamp_incoming_webhook'), timezone)
                  if start <= timestamp.date() <= end:
                      result.append({'name': get('first_name'), 'email': get('email'), 'phone': get('phone')})
                  else:
                      excluded += 1
              print('UTM timestamp-filtered rows:', len(result), '; outside range:', excluded)
              return result


          def read_utm_tab_contacts(worksheet):
              # The selected tab's event date defines this cohort. Import its full data,
              # including registrations made the previous day, as in the manual workflow.
              values = worksheet.get_all_values()
              if not values:
                  raise RuntimeError('Selected UTM tab has no header row.')
              headers = [str(value).strip().casefold() for value in values[0]]
              required = ('first_name', 'email', 'phone')
              if any(headers.count(key) != 1 for key in required):
                  raise RuntimeError('UTM tab must have unique first_name, email and phone columns.')
              indexes = {key: headers.index(key) for key in required}
              result = []
              for cells in values[1:]:
                  row = {key: str(cells[indexes[key]]).strip() if indexes[key] < len(cells) else '' for key in required}
                  if any(row.values()):
                      result.append({'name': row['first_name'], 'email': row['email'], 'phone': row['phone']})
              print('UTM tab contact rows imported:', len(result))
              return result


          def write_rows(path, rows):
              with path.open('w', encoding='utf-8-sig', newline='') as output:
                  writer = csv.DictWriter(output, fieldnames=['name', 'email', 'phone'])
                  writer.writeheader()
                  writer.writerows(rows)


          def run():
              import gspread
              from google.oauth2.service_account import Credentials
              window = json.loads(Path('reports/report-window.json').read_text())
              start, end = date.fromisoformat(window['start_date']), date.fromisoformat(window['end_date'])
              timezone = ZoneInfo(window['timezone'])
              event_date = end
              if os.environ.get('UTM_TAB_DATE') != event_date.isoformat():
                  raise RuntimeError('Sheets discovery and exported report dates differ. Rerun the workflow.')
              credentials = Credentials.from_service_account_info(
                  json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON']),
                  scopes=['https://www.googleapis.com/auth/spreadsheets.readonly'],
              )
              spreadsheet = gspread.authorize(credentials).open_by_key(os.environ['UTM_SHEET_ID'])
              selections = [('funnel-agent', os.environ['SELECTED_UTM_BUSINESS_TAB']),
                            ('flexi-genie-regteam', os.environ['SELECTED_UTM_REG_TAB'])]
              summaries = {}
              outdir = Path('comparison')
              outdir.mkdir(exist_ok=True)
              for label, tab_name in selections:
                  with (Path('reports') / (label + '.csv')).open(encoding='utf-8-sig', newline='') as source:
                      reader = csv.DictReader(source)
                      if reader.fieldnames != ['name', 'email', 'phone']:
                          raise RuntimeError('Report artifact must contain only name, email, phone.')
                      ff_rows = list(reader)
                  utm_rows = read_utm_rows(spreadsheet.worksheet(tab_name), start, end, timezone)
                  matched, ff_only, utm_only = compare_rows(ff_rows, utm_rows)
                  for suffix, rows in [('matched', matched), ('missing-from-utm', ff_only), ('missing-from-flexifunnels', utm_only)]:
                      write_rows(outdir / (label + '-' + suffix + '.csv'), rows)
                  summaries[label] = {'flexifunnels_rows': len(ff_rows), 'utm_rows': len(utm_rows),
                                      'matched_rows': len(matched), 'missing_from_utm': len(ff_only),
                                      'missing_from_flexifunnels': len(utm_only),
                                      'incomplete_or_invalid_identifiers_ff': sum(match_key(r) is None for r in ff_rows),
                                      'incomplete_or_invalid_identifiers_utm': sum(match_key(r) is None for r in utm_rows)}
                  print(label + ':', summaries[label])
              (outdir / 'summary.json').write_text(json.dumps({
                  'start_date': start.isoformat(), 'end_date': end.isoformat(), 'timezone': window['timezone'],
                  'utm_event_date': event_date.isoformat(), 'matching_rule': 'email AND phone; occurrences preserved',
                  'reports': summaries,
              }, indent=2))
              print('READ-ONLY COMPARISON COMPLETE — no Google Sheets modified.')


          """Read explicit event groups from ActiveCampaign. Never infer attendance."""
          import json
          import re
          import os
          import time
          from urllib.parse import urlparse


          class ActiveCampaignReader:
              def __init__(self, base_url, token, session=None):
                  import requests
                  parsed = urlparse(base_url.strip())
                  if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment:
                      raise RuntimeError('ACTIVECAMPAIGN_API_URL must be an HTTPS account API URL.')
                  if parsed.path.rstrip('/') not in ('', '/api/3'):
                      raise RuntimeError('ActiveCampaign API URL must end at the account host or /api/3.')
                  if not token.strip():
                      raise RuntimeError('ACTIVECAMPAIGN_API_KEY is missing.')
                  self.base = 'https://' + parsed.netloc + '/api/3/'
                  self.session = session or requests.Session()
                  self.session.headers.update({'Api-Token': token.strip(), 'Accept': 'application/json'})

              def get(self, endpoint, params):
                  for attempt in range(4):
                      response = self.session.get(self.base + endpoint, params=params, timeout=60, allow_redirects=False)
                      if response.status_code == 429 or response.status_code >= 500:
                          if attempt < 3:
                              time.sleep(2 ** attempt)
                              continue
                      if response.status_code != 200:
                          raise RuntimeError('ActiveCampaign ' + endpoint + ' read failed (HTTP ' + str(response.status_code) + ').')
                      return response.json()
                  raise RuntimeError('ActiveCampaign request did not complete.')

              def pages(self, endpoint, collection, params):
                  result, seen, offset = [], set(), 0
                  initial_total = None
                  for _ in range(1000):
                      data = self.get(endpoint, {**params, 'limit': 100, 'offset': offset})
                      records = data.get(collection)
                      if not isinstance(records, list):
                          raise RuntimeError('ActiveCampaign returned an unexpected collection.')
                      try:
                          total = int(data['meta']['total'])
                      except (KeyError, TypeError, ValueError):
                          raise RuntimeError('ActiveCampaign response did not include a valid total.') from None
                      if initial_total is None:
                          initial_total = total
                      if total != initial_total:
                          raise RuntimeError('ActiveCampaign group changed while reading; rerun for a consistent snapshot.')
                      for record in records:
                          key = str(record.get('id', ''))
                          if not key or key in seen:
                              raise RuntimeError('ActiveCampaign pagination returned a missing or repeated contact ID.')
                          seen.add(key)
                          result.append(record)
                      if len(result) == total:
                          return result
                      if not records or len(result) > total:
                          raise RuntimeError('ActiveCampaign pagination did not reconcile with its total.')
                      offset += len(records)
                  raise RuntimeError('ActiveCampaign group is too large for one workflow run.')

              def event_contacts(self, event_date):
                  month = 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split()[event_date.month - 1]
                  search = str(event_date.day) + ' ' + month
                  lists = self.pages('lists', 'lists', {'filters[name][contains]': search, 'orders[name]': 'ASC'})
                  pattern = re.compile(r'^0?' + str(event_date.day) + r'\s+' + month
                                       + r'\s+' + str(event_date.year)
                                       + r'\s+Flexi\s+Genie\s+10\s+Mins?\s+Business\s+Workshop$', re.I)
                  candidates = [item for item in lists if pattern.fullmatch(str(item.get('name', '')).strip())]
                  if not candidates:
                      raise RuntimeError('No Flexi Genie 10 Mins Business Workshop list found for ' + event_date.isoformat())
                  ranked = []
                  for item in candidates:
                      data = self.get('contacts', {'listid': item['id'], 'status': 1, 'meta': 'only'})
                      try:
                          count = int(data['meta']['total'])
                          if count < 0:
                              raise ValueError()
                      except (KeyError, TypeError, ValueError):
                          raise RuntimeError('Cannot verify the active contact count for a matching list.') from None
                      ranked.append((count, item))
                  # max preserves the first result when active counts are equal.
                  _, selected = max(ranked, key=lambda entry: entry[0])
                  records = self.pages('contacts', 'contacts', {'listid': selected['id'], 'status': 1, 'orders[id]': 'ASC'})
                  rows = [{'name': ' '.join(str(c.get(k) or '').strip() for k in ('firstName', 'lastName')).strip(),
                           'email': str(c.get('email') or '').strip(), 'phone': str(c.get('phone') or '').strip()}
                          for c in records]
                  print('ActiveCampaign list selected:', selected['name'])
                  print('Active contacts fetched:', len(rows))
                  return rows, {'id': str(selected['id']), 'name': selected['name'], 'active_count': len(rows)}

              def contacts(self, selector):
                  kind, value = selector['type'], selector['value']
                  if kind == 'tag':
                      tags = self.pages('tags', 'tags', {'filters[tag]': value, 'type': 'contact'})
                      tags = [tag for tag in tags if tag.get('tag') == value]
                      if len(tags) != 1:
                          raise RuntimeError('Configured event tag was not found uniquely. No all-contact fallback.')
                      params = {'tagid': tags[0]['id']}
                  elif kind == 'list_id':
                      # List IDs must be supplied explicitly; their date meaning is configured.
                      params = {'listid': value}
                  else:
                      raise RuntimeError('ActiveCampaign selector must be tag or list_id.')
                  contacts = self.pages('contacts', 'contacts', {**params, 'orders[id]': 'asc'})
                  return [{'name': ' '.join(str(contact.get(key) or '').strip() for key in ('firstName', 'lastName')).strip(),
                           'email': str(contact.get('email') or '').strip(),
                           'phone': str(contact.get('phone') or '').strip()} for contact in contacts]


          def event_selector(raw_json, event_date):
              try:
                  selector = json.loads(raw_json)
              except (TypeError, json.JSONDecodeError):
                  raise RuntimeError('Provide an explicit ActiveCampaign event selector as JSON.') from None
              if not isinstance(selector, dict) or set(selector) != {'type', 'value'}:
                  raise RuntimeError('ActiveCampaign selector must contain exactly type and value.')
              if selector['type'] not in ('tag', 'list_id') or not isinstance(selector['value'], str):
                  raise RuntimeError('ActiveCampaign selector needs a tag name or a numeric list ID.')
              tokens = {'event_date': event_date.isoformat(), 'day': str(event_date.day),
                        'day2': event_date.strftime('%d'), 'month': event_date.strftime('%b'),
                        'month2': event_date.strftime('%m'), 'year': str(event_date.year)}
              try:
                  value = selector['value'].format_map(tokens).strip()
              except (KeyError, ValueError):
                  raise RuntimeError('Unknown date placeholder in ActiveCampaign selector.') from None
              if not value or '\n' in value or '\r' in value:
                  raise RuntimeError('ActiveCampaign selector value is empty or invalid.')
              if selector['type'] == 'list_id' and (not value.isascii() or not value.isdigit()):
                  raise RuntimeError('ActiveCampaign list ID must be numeric.')
              return {'type': selector['type'], 'value': value}

          """Non-destructive publication helpers for the discrepancy workflow.

          No credentials or network calls run on import. Pass authenticated gspread objects.
          Serialize workflow runs with GitHub Actions concurrency: read-then-append cannot
          guarantee exactly-once statistics writes across concurrent independent writers.
          """

          import hashlib
          import json
          import math
          import re
          from collections.abc import Mapping


          RECORD_HEADERS = ["name", "email", "phone"]
          _INVALID_TITLE = re.compile(r"[:\\/?*\[\]]")


          def snapshot_title(base_title, run_id, attempt):
              """Add a GitHub run/attempt suffix, refusing unsafe or truncated titles."""
              if not isinstance(base_title, str) or not base_title.strip():
                  raise ValueError("Snapshot base titles must be nonempty strings.")
              run_id, attempt = str(run_id), str(attempt)
              if not re.fullmatch(r"[1-9]\d*", run_id) or not re.fullmatch(r"[1-9]\d*", attempt):
                  raise ValueError("run_id and attempt must be positive integer identifiers.")
              title = f"{base_title} · {run_id}.{attempt}"
              if len(title) > 100 or _INVALID_TITLE.search(title) or any(ord(c) < 32 for c in title):
                  raise ValueError("Snapshot title exceeds 100 characters or contains an invalid character.")
              return title


          def _trim_padding(rows):
              """Ignore API-provided empty padding only, retaining interior blank rows."""
              result = []
              for row in rows:
                  cells = list(row)
                  while cells and cells[-1] == "":
                      cells.pop()
                  result.append(cells)
              while result and not result[-1]:
                  result.pop()
              return result


          def _record_values(rows):
              if not isinstance(rows, (list, tuple)):
                  raise ValueError("Each snapshot dataset must be a list of three-column data rows.")
              values = [list(RECORD_HEADERS)]
              for number, row in enumerate(rows, 1):
                  if not isinstance(row, (list, tuple)) or len(row) != 3:
                      raise ValueError(f"Snapshot record {number} must contain name, email, and phone only.")
                  if not all(isinstance(cell, str) for cell in row):
                      raise ValueError(f"Snapshot record {number} must use text cells to preserve identifiers.")
                  if not any(row):
                      raise ValueError(f"Snapshot record {number} is entirely empty.")
                  if any(len(cell) > 50000 for cell in row):
                      raise ValueError(f"Snapshot record {number} exceeds the Sheets cell size limit.")
                  values.append(list(row))
              return values


          def _unused_sheet_id(title, used_ids):
              candidate = int.from_bytes(hashlib.sha256(title.encode("utf-8")).digest()[:4], "big") & 0x7FFFFFFF
              while candidate in used_ids:
                  candidate = (candidate + 1) & 0x7FFFFFFF
              used_ids.add(candidate)
              return candidate


          def publish_snapshot(book, datasets, run_id, attempt):
              """Publish new record tabs without changing any preexisting cells or tabs.

              ``datasets`` maps descriptive base titles (caller includes the event date) to
              lists of DATA rows, each exactly [name, email, phone] using string cells.
              Headers are added here. The final title is ``base · run_id.attempt``.
              All inputs and existing title collisions are checked before one atomic
              spreadsheet batchUpdate creates and populates all missing tabs. An existing
              final title is skipped only if its entire data matrix matches. Any differing
              content raises before mutation. Repeating after an uncertain response is safe.

              Return: {"created": [final titles], "skipped": [final titles],
                       "titles": {base title: final title}}.
              """
              if not isinstance(datasets, Mapping) or not datasets:
                  raise ValueError("Provide at least one named snapshot dataset.")

              prepared, title_map = [], {}
              for base_title, rows in datasets.items():
                  title = snapshot_title(base_title, run_id, attempt)
                  title_map[base_title] = title
                  prepared.append((title, _record_values(rows)))
              if len(set(title_map.values())) != len(title_map):
                  raise ValueError("Snapshot titles must be unique.")

              worksheets = list(book.worksheets())
              existing = {sheet.title: sheet for sheet in worksheets}
              if len(existing) != len(worksheets):
                  raise RuntimeError("Spreadsheet contains ambiguous duplicate worksheet titles.")
              used_ids = {int(sheet.id) for sheet in worksheets}
              pending, skipped = [], []
              for title, values in prepared:
                  if title in existing:
                      # FORMULA returns formula text rather than allowing a calculated value
                      # to hide a changed cell. We do not alter even matching existing tabs.
                      actual = existing[title].get_all_values(value_render_option="FORMULA")
                      if _trim_padding(actual) != _trim_padding(values):
                          raise RuntimeError(f"Snapshot title collision: {title!r}; existing contents differ.")
                      skipped.append(title)
                  else:
                      pending.append((title, values))

              requests = []
              for title, values in pending:
                  sheet_id = _unused_sheet_id(title, used_ids)
                  requests.append({"addSheet": {"properties": {
                      "sheetId": sheet_id, "title": title,
                      "gridProperties": {"rowCount": max(2, len(values)), "columnCount": 3,
                                         "frozenRowCount": 1},
                  }}})
                  requests.append({"updateCells": {
                      "start": {"sheetId": sheet_id, "rowIndex": 0, "columnIndex": 0},
                      "rows": [{"values": [{"userEnteredValue": {"stringValue": cell}}
                                            for cell in row]} for row in values],
                      "fields": "userEnteredValue",
                  }})
              if requests:
                  book.batch_update({"requests": requests})
              return {"created": [title for title, _ in pending], "skipped": skipped, "titles": title_map}


          def append_summary(sheet, expected_headers, row, runkey_index):
              """Append one statistics row only to a verified, already initialized layout.

              Header order and spelling must match ``expected_headers`` exactly. ``row``
              follows this order and contains only strings or finite numbers. Its run key
              must be a nonempty string at the zero-based ``runkey_index``. The caller must
              include any comparison/category in that key if a run writes multiple rows.
              Existing rows and their order are preserved. A single identical existing key
              and row returns "skipped"; duplicate keys or differing contents raise.
              Otherwise append_rows uses RAW/INSERT_ROWS and returns "appended". Headers
              are never initialized or changed automatically. Serialize writers externally.
              """
              if not isinstance(expected_headers, (list, tuple)) or not expected_headers:
                  raise ValueError("Expected summary headers must be an explicit nonempty list.")
              headers = list(expected_headers)
              if (not all(isinstance(value, str) and value for value in headers)
                      or len(set(headers)) != len(headers)):
                  raise ValueError("Expected summary headers must be nonempty, unique strings.")
              if not isinstance(row, (list, tuple)) or len(row) != len(headers):
                  raise ValueError("Summary row must match the expected header width.")
              row = list(row)
              for value in row:
                  if type(value) not in (str, int, float):
                      raise ValueError("Summary cells must be strings or finite numbers.")
                  if isinstance(value, float) and not math.isfinite(value):
                      raise ValueError("Summary numbers must be finite.")
              if type(runkey_index) is not int or not 0 <= runkey_index < len(headers):
                  raise ValueError("runkey_index must point to a summary column.")
              key = row[runkey_index]
              if not isinstance(key, str) or not key:
                  raise ValueError("Summary run key must be a nonempty string.")

              existing = _trim_padding(sheet.get_all_values(value_render_option="UNFORMATTED_VALUE"))
              if not existing or existing[0] != headers:
                  raise RuntimeError("Summary headers do not match the explicitly configured layout.")
              matches = []
              for old_row in existing[1:]:
                  if len(old_row) > len(headers):
                      raise RuntimeError("Existing summary row extends beyond the configured headers.")
                  padded = old_row + [""] * (len(headers) - len(old_row))
                  if padded[runkey_index] == key:
                      matches.append(padded)
              if len(matches) > 1:
                  raise RuntimeError("Summary already contains duplicate entries for this run key.")
              if matches:
                  if matches[0] != row:
                      raise RuntimeError("Summary run key exists with different contents.")
                  return "skipped"

              sheet.append_rows([row], value_input_option="RAW", insert_data_option="INSERT_ROWS")
              return "appended"


          def validate_summary_layout(sheet, expected_headers):
              """Read-only preflight for an existing stats layout; return occupied rows.

              This can be called before publishing to a separate spreadsheet. Formula text
              is read so an existing formula displaying an empty string remains occupied.
              The first row must contain exactly the known headers; no layout is inferred.
              """
              if (not isinstance(expected_headers, (list, tuple)) or not expected_headers
                      or not all(isinstance(value, str) and value for value in expected_headers)
                      or len(set(expected_headers)) != len(expected_headers)):
                  raise ValueError("Expected summary headers must be nonempty, unique strings.")
              rows = _trim_padding(sheet.get_all_values(value_render_option="FORMULA"))
              if not rows or rows[0] != list(expected_headers):
                  raise RuntimeError("Summary headers do not match the explicitly configured layout.")
              if any(len(row) > len(expected_headers) for row in rows[1:]):
                  raise RuntimeError("Existing summary row extends beyond the configured headers.")
              return rows


          def validate_stats_layout(sheet, expected_headers):
              """Locate the observed A-H header anywhere; preserve other columns and rows."""
              rows = _trim_padding(sheet.get_all_values(value_render_option="FORMULA"))
              normalize = lambda cells: [' '.join(str(cell).split()).casefold() for cell in cells]
              width = len(expected_headers)
              expected = normalize(expected_headers)
              if not any(normalize(row[:width]) == expected for row in rows):
                  raise RuntimeError('Cannot find the expected Stats headings in columns A-H. Nothing written.')
              return rows


          def append_summary_with_metadata(book, sheet, expected_headers, row, run_key, prefix_headers=False):
              """Append stats while retaining its existing visible columns.

              The known headers must be present already. One atomic spreadsheet batch adds
              a stats row below every occupied row and attaches its run key/content hash as
              developer metadata. No visible run-key column is added. A retry validates the
              metadata and actual row then returns "skipped"; a conflict raises. Success
              returns "appended". Existing rows, formulas, formats, and headers are intact.

              Requires an authenticated gspread Spreadsheet and its Worksheet. External
              writers must be serialized, including manual edits during the short preflight
              and append period. Metadata and row content are committed together.
              """
              if (not isinstance(row, (list, tuple)) or len(row) != len(expected_headers)
                      or not row):
                  raise ValueError("Summary row must match the expected header width.")
              row = list(row)
              for value in row:
                  if type(value) not in (str, int, float):
                      raise ValueError("Summary cells must be strings or finite numbers.")
                  if isinstance(value, float) and not math.isfinite(value):
                      raise ValueError("Summary numbers must be finite.")
              if not isinstance(run_key, str) or not run_key:
                  raise ValueError("Summary run key must be a nonempty string.")
              if not any(value != "" for value in row):
                  raise ValueError("Summary row must contain at least one value.")

              existing_rows = (validate_stats_layout(sheet, expected_headers) if prefix_headers
                               else validate_summary_layout(sheet, expected_headers))
              sheet_id = int(sheet.id)
              metadata = book.fetch_sheet_metadata()
              sheets = [entry for entry in metadata.get("sheets", [])
                        if entry.get("properties", {}).get("sheetId") == sheet_id]
              if len(sheets) != 1:
                  raise RuntimeError("Stats worksheet was not uniquely identified in its spreadsheet.")
              grid = sheets[0].get("properties", {}).get("gridProperties", {})
              capacity = grid.get("rowCount")
              if not isinstance(capacity, int) or capacity < len(existing_rows):
                  raise RuntimeError("Stats worksheet row capacity could not be verified.")
              if grid.get("columnCount", 0) < len(expected_headers):
                  raise RuntimeError("Stats worksheet has fewer columns than the configured layout.")

              digest = hashlib.sha256(json.dumps(row, ensure_ascii=False, separators=(",", ":"),
                                                allow_nan=False).encode("utf-8")).hexdigest()
              marker_value = f"{run_key}|{digest}"
              candidates = list(metadata.get("developerMetadata", []))
              for entry in metadata.get("sheets", []):
                  candidates.extend(entry.get("developerMetadata", []))
              markers = [entry for entry in candidates
                         if entry.get("metadataKey") == "ff_discrepancy_run"
                         and entry.get("metadataValue", "").rsplit("|", 1)[0] == run_key]
              if len(markers) > 1:
                  raise RuntimeError("Stats metadata contains duplicate entries for this run key.")
              if markers:
                  marker = markers[0]
                  if marker.get("metadataValue") != marker_value:
                      raise RuntimeError("Stats run key exists with different summary contents.")
                  location = marker.get("location", {}).get("dimensionRange", {})
                  start = location.get("startIndex")
                  if (location.get("sheetId") != sheet_id or location.get("dimension") != "ROWS"
                          or type(start) is not int or start < 1
                          or location.get("endIndex") != start + 1 or start >= len(existing_rows)):
                      raise RuntimeError("Stats run-key metadata points to an unexpected or missing row.")
                  actual = existing_rows[start][:len(row)] + [""] * max(0, len(row) - len(existing_rows[start]))
                  if actual != row:
                      raise RuntimeError("Stats run-key row was changed after publication.")
                  return "skipped"

              start = len(existing_rows)
              requests = []
              if start >= capacity:
                  requests.append({"appendDimension": {"sheetId": sheet_id, "dimension": "ROWS",
                                                       "length": start + 1 - capacity}})
              cells = [{"userEnteredValue": {"stringValue" if isinstance(value, str) else "numberValue": value}}
                       for value in row]
              requests.extend([
                  {"updateCells": {"start": {"sheetId": sheet_id, "rowIndex": start, "columnIndex": 0},
                                   "rows": [{"values": cells}], "fields": "userEnteredValue"}},
                  {"createDeveloperMetadata": {"developerMetadata": {
                      "metadataKey": "ff_discrepancy_run", "metadataValue": marker_value,
                      "visibility": "DOCUMENT", "location": {"dimensionRange": {
                          "sheetId": sheet_id, "dimension": "ROWS", "startIndex": start, "endIndex": start + 1,
                      }},
                  }}},
              ])
              book.batch_update({"requests": requests})
              return "appended"


          def publish_daily_tabs(book, datasets, event_date, finalize=False):
              """Upsert only the six named daily tabs; reruns reuse them, newest at front."""
              labels = ['UTM', 'LANDING PAGE', 'LANDING PAGE REG', 'ACTIVE CAMPAIGN', 'ZOOM', 'DESCREPANCY']
              prefix = event_date.isoformat() + ' '
              allowed = [prefix + label for label in labels]
              if not datasets or any(title not in allowed for title in datasets):
                  raise ValueError('Only the six daily result tabs may be published.')
              if finalize and set(datasets) != set(allowed):
                  raise ValueError('Final publication must contain all six result tabs.')
              prepared = {title: _record_values(rows) for title, rows in datasets.items()}
              sheets = list(book.worksheets())
              existing = {sheet.title: sheet for sheet in sheets}
              used_ids = {int(sheet.id) for sheet in sheets}
              requests, sheet_ids, created, updated = [], {}, [], []
              for title in allowed:
                  if title not in prepared:
                      continue
                  values = prepared[title]
                  if title in existing:
                      sheet = existing[title]
                      old = sheet.get_all_values(value_render_option='FORMULA')
                      if not old or old[0] != RECORD_HEADERS or any(len(row) > 3 for row in old):
                          raise RuntimeError('Daily tab has an unexpected layout; will not overwrite: ' + title)
                      sheet_id = int(sheet.id)
                      capacity = int(sheet.row_count)
                      if len(values) > capacity:
                          requests.append({'appendDimension': {'sheetId': sheet_id, 'dimension': 'ROWS',
                                                                'length': len(values) - capacity}})
                      # Clear previous record values, including stale rows after a smaller rerun.
                      requests.append({'repeatCell': {'range': {'sheetId': sheet_id, 'startRowIndex': 0,
                                                                 'endRowIndex': max(len(old), len(values)),
                                                                 'startColumnIndex': 0, 'endColumnIndex': 3},
                                                       'cell': {}, 'fields': 'userEnteredValue'}})
                      updated.append(title)
                  else:
                      sheet_id = _unused_sheet_id(title, used_ids)
                      requests.append({'addSheet': {'properties': {'sheetId': sheet_id, 'title': title,
                          'gridProperties': {'rowCount': max(2, len(values)), 'columnCount': 3, 'frozenRowCount': 1}}}})
                      created.append(title)
                  sheet_ids[title] = sheet_id
                  requests.append({'updateCells': {'start': {'sheetId': sheet_id, 'rowIndex': 0, 'columnIndex': 0},
                      'rows': [{'values': [{'userEnteredValue': {'stringValue': cell}} for cell in row]} for row in values],
                      'fields': 'userEnteredValue'}})
              # Move in reverse order to index zero, producing the requested left-to-right order.
              for title in reversed(allowed):
                  if title in sheet_ids:
                      requests.append({'updateSheetProperties': {'properties': {
                          'sheetId': sheet_ids[title], 'index': 0, 'hidden': False}, 'fields': 'index,hidden'}})
              hidden = []
              if not finalize and prefix + 'DESCREPANCY' in existing:
                  # Do not display the previous discrepancy alongside newly imported inputs.
                  requests.append({'updateSheetProperties': {'properties': {
                      'sheetId': int(existing[prefix + 'DESCREPANCY'].id), 'hidden': True}, 'fields': 'hidden'}})
              if finalize:
                  # Earlier versions used exact dated names followed by a run/attempt suffix.
                  old_labels = labels + ['IMPORT LANDING PAGE', 'IMPORT LANDING PAGE REG',
                                         'IMPORT UTM BUSINESS', 'IMPORT UTM REG', 'IMPORT ACTIVE CAMPAIGN']
                  pattern = re.compile(r'^' + re.escape(prefix) + '(?:' + '|'.join(re.escape(x) for x in old_labels)
                                       + r') · [1-9]\d*\.[1-9]\d*$')
                  for sheet in sheets:
                      if pattern.fullmatch(sheet.title):
                          requests.append({'updateSheetProperties': {'properties': {'sheetId': int(sheet.id), 'hidden': True},
                                                                      'fields': 'hidden'}})
                          hidden.append(sheet.title)
              book.batch_update({'requests': requests})
              return {'created': created, 'updated': updated, 'hidden_legacy_tabs': hidden,
                      'titles': {title: title for title in prepared}}

          """Parse the observed Zoom Registration Report format, not attendance reports."""
          import csv
          import hashlib
          import json
          import re
          from datetime import datetime, timedelta
          from pathlib import Path

          ZOOM_TOPIC = 'Launch Your Business Online in 10 Minutes — Directly From Your Phone | Live Build'


          def zoom_text(value):
              return ' '.join(value.split())


          def zoom_phone_candidate(value):
              """Recognize phone-shaped text without treating ordinary surnames as numbers."""
              value = value.strip()
              if not re.fullmatch(r'\+?[0-9][0-9\s().-]*', value):
                  return None
              digits = re.sub(r'[^0-9]', '', value)
              if digits.startswith('00'):
                  digits = digits[2:]
              if not 10 <= len(digits) <= 15:
                  return None
              # Compare Indian country-code variants without changing other phone data.
              if len(digits) == 12 and digits.startswith('91'):
                  digits = digits[2:]
              return digits


          def clean_zoom_identity(record, csv_row, phone_columns=('Phone',)):
              """Keep name/email/phone; move phone numbers typed into a name field to the phone cell."""
              first = str(record.get('First Name', '')).strip()
              last = str(record.get('Last Name', '')).strip()
              phone = ''
              for column in phone_columns:
                  value = str(record.get(column, '')).strip()
                  if value.casefold() not in ('', '-', 'n/a', 'na', 'none', 'null') and zoom_phone_candidate(value):
                      phone = value
                      break
              repaired = False
              names = {'first': first, 'last': last}
              for part in ('last', 'first'):
                  text = names[part]
                  found = [match for match in re.finditer(r'(?<!\w)\+?[0-9][0-9\s().-]*[0-9](?!\w)', text)
                           if zoom_phone_candidate(match.group())]
                  if not found:
                      continue
                  if not phone:
                      phone = found[0].group().strip()
                  for match in reversed(found):
                      text = text[:match.start()] + ' ' + text[match.end():]
                  names[part] = ' '.join(text.split()).strip(' ,;|-/')
                  repaired = True
              return {'name': zoom_text(' '.join(filter(None, [names['first'], names['last']]))),
                      'email': str(record.get('Email', '')).strip(), 'phone': phone}, repaired


          def read_zoom_export(path, event_date, expected_id=None):
              with path.open(encoding='utf-8-sig', newline='') as source:
                  rows = [[cell.strip() for cell in row] for row in csv.reader(source)]
              if not rows or rows[0][:1] != ['Registration Report']:
                  raise RuntimeError('Zoom file is not the recorded Registration Report CSV.')
              metadata_headers = ['Topic', 'ID', 'Scheduled Time', 'Duration (minutes)', '# Registrants',
                                  '# Cancelled registrants', '# Approved registrants', '# Denied registrants']
              meta_indices = [i for i, row in enumerate(rows) if row[:len(metadata_headers)] == metadata_headers]
              required_contact_headers = ['First Name', 'Last Name', 'Email']
              contact_indices = [i for i, row in enumerate(rows)
                                 if all(header in row for header in required_contact_headers)]
              if len(meta_indices) != 1 or len(contact_indices) != 1:
                  raise RuntimeError('Zoom CSV metadata/contact headers are missing or ambiguous.')
              m, h = meta_indices[0], contact_indices[0]
              contact_headers = rows[h]
              if any(contact_headers.count(header) != 1 for header in required_contact_headers):
                  raise RuntimeError('Zoom contact headers are duplicated or ambiguous.')
              if m + 1 >= len(rows) or h <= m + 1:
                  raise RuntimeError('Zoom CSV report structure is incomplete.')
              meta = dict(zip(metadata_headers, rows[m + 1]))
              if zoom_text(meta['Topic']) != zoom_text(ZOOM_TOPIC):
                  raise RuntimeError('Zoom CSV is for a different webinar topic.')
              scheduled = datetime.strptime(meta['Scheduled Time'], '%m/%d/%Y %I:%M:%S %p')
              if scheduled.date() != event_date:
                  raise RuntimeError('Zoom CSV webinar date does not match the selected UTM event date.')
              webinar_id = re.sub(r'\s+', '', meta['ID'])
              if not webinar_id.isascii() or not webinar_id.isdigit():
                  raise RuntimeError('Zoom CSV webinar ID is invalid.')
              if expected_id is not None and webinar_id != re.sub(r'\s+', '', expected_id):
                  raise RuntimeError('Downloaded Zoom CSV does not match the selected webinar ID.')
              # Phone may sit in "Phone" or in a custom question such as "Mobile" / "WhatsApp Number".
              phone_columns = [header for header in contact_headers if header == 'Phone']
              phone_columns += [header for header in contact_headers if header != 'Phone'
                                and re.search(r'phone|mobile|whats\s*app|contact\s*(no|num)', header, re.I)]
              contacts = []
              repaired_names = skipped = 0
              for csv_row, row in enumerate(rows[h + 1:], start=h + 2):
                  if not row or not any(row):
                      continue
                  row = (row + [''] * len(contact_headers))[:len(contact_headers)]
                  record = dict(zip(contact_headers, row))
                  if '@' not in record.get('Email', ''):
                      skipped += 1  # Not a registrant row (Zoom adds other blocks to this export).
                      continue
                  contact, repaired = clean_zoom_identity(record, csv_row, phone_columns)
                  contacts.append(contact)
                  repaired_names += int(repaired)
              count = int(str(meta['# Registrants']).replace(',', '') or 0)
              if count != len(contacts):
                  print('Zoom CSV note: report header says', count, 'registrants;', len(contacts),
                        'registrant rows read;', skipped, 'non-registrant rows skipped.')
              with_phone = sum(1 for contact in contacts if contact['phone'])
              print('Zoom CSV: phone columns used:', phone_columns or 'none', '| registrants with a phone:',
                    with_phone, 'of', len(contacts), '| phone moved out of a name field:', repaired_names)
              contacts.sort(key=lambda row: (row['name'].casefold(), row['email'].casefold(), row['phone']))
              return contacts, {'topic': ZOOM_TOPIC, 'webinar_id': webinar_id,
                                'scheduled_time': meta['Scheduled Time'], 'event_date': event_date.isoformat(),
                                'report_type': 'All registrants', 'downloaded_count': len(contacts),
                                'last_name_phone_rows_repaired': repaired_names}


          def save_zoom_contacts(raw_path, outdir, event_date, expected_id):
              contacts, meta = read_zoom_export(raw_path, event_date, expected_id)
              print('Zoom cleanup: kept name/email/phone only; Last Name phone rows repaired:',
                    meta['last_name_phone_rows_repaired'])
              outdir.mkdir(exist_ok=True)
              path = outdir / 'registrants.csv'
              with path.open('w', encoding='utf-8-sig', newline='') as output:
                  writer = csv.DictWriter(output, fieldnames=['name', 'email', 'phone'])
                  writer.writeheader()
                  writer.writerows(contacts)
              meta.update({'search_from': (event_date - timedelta(days=1)).isoformat(),
                           'search_to': event_date.isoformat(), 'timezone': 'Asia/Kolkata',
                           'csv_sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
              (outdir / 'manifest.json').write_text(json.dumps(meta, indent=2))
              return meta


          def load_zoom_contacts(folder, event_date):
              meta = json.loads((folder / 'manifest.json').read_text())
              if (meta.get('event_date') != event_date.isoformat()
                      or meta.get('search_from') != (event_date - timedelta(days=1)).isoformat()
                      or meta.get('search_to') != event_date.isoformat()
                      or meta.get('topic') != ZOOM_TOPIC or meta.get('report_type') != 'All registrants'
                      or meta.get('timezone') != 'Asia/Kolkata'
                      or datetime.strptime(meta['scheduled_time'], '%m/%d/%Y %I:%M:%S %p').date() != event_date):
                  raise RuntimeError('Zoom report metadata does not match this UTM event.')
              path = folder / 'registrants.csv'
              if hashlib.sha256(path.read_bytes()).hexdigest() != meta.get('csv_sha256'):
                  raise RuntimeError('Zoom CSV differs from the verified download.')
              with path.open(encoding='utf-8-sig', newline='') as source:
                  reader = csv.DictReader(source)
                  if reader.fieldnames != ['name', 'email', 'phone']:
                      raise RuntimeError('Zoom identity columns are invalid.')
                  contacts = list(reader)
              if len(contacts) != meta.get('downloaded_count'):
                  raise RuntimeError('Zoom artifact count does not reconcile.')
              return contacts, meta

          """Final stage; inlined after comparison, ActiveCampaign and Sheets helpers."""

          def sorted_records(rows):
              return sorted(rows, key=lambda row: (row['name'].strip().casefold(),
                                                   row['email'].strip().casefold(),
                                                   (match_key(row) or ('', row['phone']))[1]))


          def merge_utm_records(business, registration):
              merged, seen = [], {}
              for row in business + registration:
                  key = match_key(row)
                  if key is None:
                      merged.append(dict(row))
                  elif key not in seen:
                      seen[key] = len(merged)
                      merged.append(dict(row))
                  elif not merged[seen[key]]['name'] and row['name']:
                      merged[seen[key]]['name'] = row['name']
              return sorted_records(merged)


          def prepare_contact_rows(rows):
              cleaned = [{'name': row['name'].strip(), 'email': row['email'].strip(),
                          'phone': normalized_phone(row['phone'])} for row in rows]
              # Select email AND phone as the duplicate key, then sort retained records.
              return merge_utm_records(sorted_records(cleaned), [])


          def required_configuration(event_date):
              headers = ['Date', 'Time Checked', 'Webinar Date', 'Webinar Type',
                         'Reports', 'UTM', 'Active Campaign', 'Zoom']
              keys = ['checked_date', 'checked_time', 'webinar_date', 'webinar_type',
                      'reports', 'utm', 'activecampaign', 'zoom']
              return {'mode': 'dated_business_list_most_active', 'zoom': 'zoom_all_registrants'}, [
                  {'header': header, 'key': key} for header, key in zip(headers, keys)]


          def load_identity_csv(path):
              with path.open(encoding='utf-8-sig', newline='') as source:
                  reader = csv.DictReader(source)
                  if reader.fieldnames != ['name', 'email', 'phone']:
                      raise RuntimeError('Identity file must contain only name, email, phone.')
                  return list(reader)


          def sheet_matrices(event_date, datasets):
              return {event_date.isoformat() + ' ' + label:
                      [[row['name'], row['email'], row['phone']] for row in rows]
                      for label, rows in datasets.items()}


          def read_verified_snapshot(book, title_map, expected):
              """Read the committed tabs back; calculations use these verified records."""
              result = {}
              for base_title, expected_rows in expected.items():
                  sheet = book.worksheet(title_map[base_title])
                  values = sheet.get_all_values(value_render_option='FORMULA')
                  if not values or values[0] != ['name', 'email', 'phone']:
                      raise RuntimeError('Imported tab headers could not be verified: ' + sheet.title)
                  rows = []
                  for row in values[1:]:
                      if len(row) > 3 or not all(isinstance(cell, str) for cell in row):
                          raise RuntimeError('Unexpected cells in imported tab: ' + sheet.title)
                      rows.append(row + [''] * (3 - len(row)))
                  if rows != expected_rows:
                      raise RuntimeError('Saved tab differs from this run data: ' + sheet.title + '. Stats not updated.')
                  result[base_title] = [dict(zip(('name', 'email', 'phone'), row)) for row in rows]
              return result


          def run_complete_workflow():
              import gspread
              from google.oauth2.service_account import Credentials
              snapshot = json.loads(Path('utm/snapshot.json').read_text())
              window = json.loads(Path('reports/report-window.json').read_text())
              event_date = date.fromisoformat(snapshot['event_date'])
              expected_start = event_date - timedelta(days=1)
              if window != {'start_date': expected_start.isoformat(), 'end_date': event_date.isoformat(), 'timezone': snapshot['timezone']}:
                  raise RuntimeError('UTM snapshot and FlexiFunnels report dates do not agree.')
              selectors, layout = required_configuration(event_date)
              if snapshot['activecampaign_selectors'] != selectors or snapshot['stats_layout'] != layout:
                  raise RuntimeError('Configuration changed after discovery; rerun the whole workflow.')

              utm_business = load_identity_csv(Path('utm/business.csv'))
              utm_reg = load_identity_csv(Path('utm/registration.csv'))
              if (len(utm_business) != snapshot['business_count']
                      or len(utm_reg) != snapshot['registration_count']):
                  raise RuntimeError('UTM snapshot counts do not match the saved records.')
              ff_business = load_identity_csv(Path('reports/funnel-agent.csv'))
              ff_reg = load_identity_csv(Path('reports/flexi-genie-regteam.csv'))

              ac = ActiveCampaignReader(os.environ['ACTIVECAMPAIGN_API_URL'], os.environ['ACTIVECAMPAIGN_API_KEY'])
              contacts, selected_list = ac.event_contacts(event_date)
              ac_rows = contacts
              zoom_rows, zoom_report = load_zoom_contacts(Path('zoom'), event_date)
              outdir = Path('comparison')
              outdir.mkdir(exist_ok=True)
              invalid_utm = [row for row in utm_business + utm_reg if match_key(row) is None]
              invalid_zoom = [row for row in zoom_rows if match_key(row) is None]
              if invalid_utm or invalid_zoom:
                  write_rows(outdir / 'utm-identifiers-needing-review.csv', invalid_utm)
                  write_rows(outdir / 'zoom-identifiers-needing-review.csv', invalid_zoom)
                  print('Note: ' + str(len(invalid_utm)) + ' UTM and ' + str(len(invalid_zoom))
                        + ' Zoom records lack a usable email+phone pair (listed in the comparison '
                        + 'artifact). They are still matched by email or phone alone.')
              # Validate destinations before importing; Stats is written only at the end.
              credentials = Credentials.from_service_account_info(
                  json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON']),
                  scopes=['https://www.googleapis.com/auth/spreadsheets'],
              )
              client = gspread.authorize(credentials)
              raw_book = client.open_by_key(os.environ['RAW_DATA_SHEET_ID'])
              stats_book = client.open_by_key(os.environ['DISCREPANCY_SHEET_ID'])
              if os.environ['UTM_SHEET_ID'] in (raw_book.id, stats_book.id):
                  raise RuntimeError('Destination spreadsheet IDs must not point to the UTM source.')
              stats_sheet = stats_book.worksheet(os.environ['DISCREPANCY_TAB_NAME'])
              headers = [column['header'] for column in layout]
              validate_stats_layout(stats_sheet, headers)
              print('Clean all datasets: sort, deduplicate email+phone pairs, remove explicit +91 prefixes.')
              raw_counts = {'landing': len(ff_business), 'landing_reg': len(ff_reg),
                            'utm_business': len(utm_business), 'utm_reg': len(utm_reg), 'activecampaign': len(ac_rows),
                            'zoom': len(zoom_rows)}
              ff_business = prepare_contact_rows(ff_business)
              ff_reg = prepare_contact_rows(ff_reg)
              utm_business = prepare_contact_rows(utm_business)
              utm_reg = prepare_contact_rows(utm_reg)
              ac_rows = prepare_contact_rows(ac_rows)
              zoom_rows = prepare_contact_rows(zoom_rows)
              print('STAGE 1: Update the five daily data tabs in Descrepancy:', raw_book.title)
              merged_utm = merge_utm_records(utm_business, utm_reg)
              source_datasets = {'UTM': merged_utm, 'LANDING PAGE': sorted_records(ff_business),
                                 'LANDING PAGE REG': sorted_records(ff_reg),
                                 'ACTIVE CAMPAIGN': sorted_records(ac_rows), 'ZOOM': sorted_records(zoom_rows)}
              imported_matrices = sheet_matrices(event_date, source_datasets)
              imported = publish_daily_tabs(raw_book, imported_matrices, event_date)
              publication = {'stage': 'sources_imported', 'raw_spreadsheet_id': raw_book.id,
                             'source_tabs': imported['titles'], 'stats_status': 'not_written'}
              (outdir / 'publication.json').write_text(json.dumps(publication, indent=2))
              print('Daily data tabs:', imported['titles'])
              stored = read_verified_snapshot(raw_book, imported['titles'], imported_matrices)
              key = lambda label: event_date.isoformat() + ' ' + label
              ff_business, ff_reg = stored[key('LANDING PAGE')], stored[key('LANDING PAGE REG')]
              merged_utm, ac_rows = stored[key('UTM')], stored[key('ACTIVE CAMPAIGN')]
              zoom_rows = stored[key('ZOOM')]
              print('STAGE 2: Compare the records from these daily tabs.')
              zoom_emails = {row['email'].strip().casefold() for row in zoom_rows if row['email'].strip()}
              zoom_phones = {normalized_phone(row['phone']) for row in zoom_rows
                             if len(normalized_phone(row['phone'])) >= 7}

              def in_zoom(row):
                  return (row['email'].strip().casefold() in zoom_emails
                          or normalized_phone(row['phone']) in zoom_phones)

              discrepancy = [row for row in merged_utm if not in_zoom(row)]
              print('UTM people not found in Zoom (by email or phone):', len(discrepancy), 'of', len(merged_utm))

              summary = {}
              for label, ff, utm in [('funnel-agent', ff_business, utm_business), ('flexi-genie-regteam', ff_reg, utm_reg)]:
                  matched, ff_only, utm_only = compare_rows(ff, utm)
                  for suffix, rows in [('matched', matched), ('missing-from-utm', ff_only), ('missing-from-flexifunnels', utm_only)]:
                      write_rows(outdir / (label + '-' + suffix + '.csv'), sorted_records(rows))
                  summary[label] = {'flexifunnels_rows': len(ff), 'utm_rows': len(utm), 'matched_rows': len(matched),
                                    'missing_from_utm': len(ff_only), 'missing_from_flexifunnels': len(utm_only)}
              datasets = {'UTM': merged_utm, 'LANDING PAGE': ff_business, 'LANDING PAGE REG': ff_reg, 'ACTIVE CAMPAIGN': ac_rows, 'ZOOM': zoom_rows,
                          'DESCREPANCY': discrepancy}
              for label, rows in datasets.items():
                  write_rows(outdir / (label.lower().replace(' ', '-') + '.csv'), rows)

              print('STAGE 3: Save and verify completed result tabs in Descrepancy.')
              dated = sheet_matrices(event_date, datasets)
              published = publish_daily_tabs(raw_book, dated, event_date, finalize=True)
              publication.update({'stage': 'results_saved', 'result_tabs': published['titles'],
                                  'hidden_legacy_tabs': published['hidden_legacy_tabs']})
              (outdir / 'publication.json').write_text(json.dumps(publication, indent=2))
              saved = read_verified_snapshot(raw_book, published['titles'], dated)
              ff_business, ff_reg = saved[key('LANDING PAGE')], saved[key('LANDING PAGE REG')]
              merged_utm, ac_rows = saved[key('UTM')], saved[key('ACTIVE CAMPAIGN')]
              zoom_rows, discrepancy = saved[key('ZOOM')], saved[key('DESCREPANCY')]
              print('STAGE 4: Append totals from verified result tabs to Discrepancy Stats.')
              merged_reports = prepare_contact_rows(ff_business + ff_reg)
              run_key = os.environ['GITHUB_RUN_ID'] + '.' + os.environ['GITHUB_RUN_ATTEMPT']
              counts = {'event_date': event_date.isoformat(), 'range_start': expected_start.isoformat(),
                        'range_end': event_date.isoformat(), 'run_time': snapshot['captured_at'], 'run_key': run_key,
                        'landing': len(ff_business), 'landing_reg': len(ff_reg), 'reports': len(merged_reports),
                        'utm': len(merged_utm), 'activecampaign': len(ac_rows), 'zoom': len(zoom_rows), 'discrepancy': len(discrepancy)}
              checked_at = datetime.fromisoformat(snapshot['captured_at']).astimezone(ZoneInfo(snapshot['timezone']))
              counts.update({'checked_date': checked_at.strftime('%d/%m/%Y'),
                             'checked_time': checked_at.strftime('%I:%M %p'),
                             'webinar_date': event_date.strftime('%d/%m/%Y'),
                             'webinar_type': '10 minute business'})
              stats_row = [counts[column['key']] for column in layout]
              stats_status = append_summary_with_metadata(stats_book, stats_sheet, headers, stats_row, run_key, prefix_headers=True)
              publication.update({'stage': 'complete', 'stats_status': stats_status})
              (outdir / 'publication.json').write_text(json.dumps(publication, indent=2))
              (outdir / 'summary.json').write_text(json.dumps({
                  'start_date': expected_start.isoformat(), 'end_date': event_date.isoformat(),
                  'utm_event_date': event_date.isoformat(), 'timezone': snapshot['timezone'],
                  'matching_rule': 'deduplicated on email+phone; UTM-vs-Zoom presence by email OR phone (Indian numbers to 10 digits)',
                  'raw_source_counts': raw_counts,
                  'source_tabs': imported['titles'],
                  'reports': summary, 'totals': counts, 'published_tabs': published['titles'], 'stats_status': stats_status,
                  'activecampaign_list': selected_list,
                  'zoom_source': 'Zoom Registration Report: All registrants for the UTM event date',
                  'zoom_report': zoom_report,
              }, indent=2))
              print('COMPLETE: sorted datasets and UTM-minus-Zoom discrepancy written; Stats appended below existing rows.')
              print('Counts:', counts)

          import re
          from datetime import date


          def discover_daily_utm_tabs(worksheets, target_date=None, today=None):
              """Select the newest calendar date with both matching UTM tab types.

              Ignore incomplete newer dates until both tabs exist, and never auto-select a
              date in the future (tabs are created ahead of upcoming webinars). Duplicate
              tabs on the selected date remain an error. An explicit target_date selects
              exactly that date.
              """
              # Match the event-tab names supplied by the user, not unrelated daily tabs.
              pattern = re.compile(
                  r'^\s*(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})\s+'
                  r'7\s*:\s*30\s*PM\s+Flexi\s+Genie\s+10\s+Mins?\s+'
                  r'(Busines(?:s)?|Reg\s+team)\s*$', re.IGNORECASE,
              )
              months = {name.lower(): index + 1 for index, name in enumerate(
                  'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split())}
              matches_by_date = {}
              for worksheet in worksheets:
                  title = worksheet.title
                  if '\n' in title or '\r' in title:
                      continue
                  match = pattern.fullmatch(title)
                  if not match:
                      continue
                  day, month, year, kind = match.groups()
                  try:
                      tab_date = date(int(year), months[month.lower()], int(day))
                  except (ValueError, KeyError):
                      continue
                  key = 'registration' if kind.lower().startswith('reg') else 'business'
                  matches_by_date.setdefault(
                      tab_date, {'business': [], 'registration': []}
                  )[key].append(worksheet)
              if not matches_by_date:
                  raise RuntimeError(
                      'No daily UTM tabs match the 7:30 PM Flexi Genie 10 Min/Mins '
                      'Business/Busines or Reg team naming patterns.'
                  )
              if target_date is not None and today is not None and target_date > today:
                  raise RuntimeError('Requested event date ' + target_date.isoformat() + ' is in the future.')
              if target_date is None:
                  # Tabs are created ahead of time for upcoming webinars; never pick a future date.
                  complete_dates = [day for day, kinds in matches_by_date.items()
                                    if kinds['business'] and kinds['registration']
                                    and (today is None or day <= today)]
                  if not complete_dates:
                      raise RuntimeError('No complete daily UTM pair found: business and registration tabs must share the same date.')
                  target_date = max(complete_dates)
                  skipped = sorted(day.isoformat() for day in matches_by_date if day > target_date)
                  if skipped:
                      print('Newer UTM dates skipped (future or incomplete):', ', '.join(skipped))
              if target_date not in matches_by_date:
                  raise RuntimeError('No UTM tab pair found for the required date ' + target_date.isoformat() + '. No other date substituted.')
              matches = matches_by_date[target_date]
              for kind, items in matches.items():
                  if len(items) != 1:
                      raise RuntimeError(
                          'Required UTM event date is ' + target_date.isoformat()
                          + '. Expected exactly one ' + kind + ' tab'
                          + '; found ' + str(len(items)) + '. No older tab will be substituted.'
                      )
              return target_date, matches['business'][0], matches['registration'][0]

          # Inspect UTM first and select the event date.
          # 14 Oct tabs -> 13–14 Oct reports; 15 Oct tabs -> 14–15 Oct reports.
          timezone_name = os.environ.get('TIMEZONE', '').strip() or 'Asia/Kolkata'
          today_local = datetime.now(ZoneInfo(timezone_name)).date()
          override = os.environ.get('TARGET_EVENT_DATE', '').strip()
          requested_date = date.fromisoformat(override) if override else None
          if requested_date is not None:
              print('Event date requested for this run:', requested_date.isoformat())
          target_tab_date, landing_tab, reg_tab = discover_daily_utm_tabs(
              opened['UTM'].worksheets(), target_date=requested_date, today=today_local)
          print('UTM target event date:', target_tab_date.isoformat())
          print('Business tab selected:', landing_tab.title)
          print('Registration tab selected:', reg_tab.title)
          print('Required FlexiFunnels range:', (target_tab_date - timedelta(days=1)).isoformat(), 'through', target_tab_date.isoformat())

          discrepancy_name = os.environ['DISCREPANCY_TAB_NAME'].strip()
          stats_sheet = opened['DISCREPANCY STATS'].worksheet(discrepancy_name)
          print('DISCREPANCY_TAB_NAME: FOUND')
          selectors, layout = required_configuration(target_tab_date)
          headers = [column['header'] for column in layout]
          validate_stats_layout(stats_sheet, headers)
          if not os.environ.get('ACTIVECAMPAIGN_API_URL') or not os.environ.get('ACTIVECAMPAIGN_API_KEY'):
              raise RuntimeError('ActiveCampaign API URL/key secrets are required for the full workflow.')
          zoom_seed_value()  # Check saved-session format before downloads or Sheets writes.
          if os.environ['UTM_SHEET_ID'] in (os.environ['RAW_DATA_SHEET_ID'], os.environ['DISCREPANCY_SHEET_ID']):
              raise RuntimeError('UTM source must be separate from the destination spreadsheets.')
          start_date = target_tab_date - timedelta(days=1)
          timezone = ZoneInfo(timezone_name)
          business_rows = read_utm_tab_contacts(landing_tab)
          registration_rows = read_utm_tab_contacts(reg_tab)
          Path('utm').mkdir(exist_ok=True)
          write_rows(Path('utm/business.csv'), business_rows)
          write_rows(Path('utm/registration.csv'), registration_rows)
          Path('utm/snapshot.json').write_text(json.dumps({
              'event_date': target_tab_date.isoformat(), 'timezone': timezone_name,
              'captured_at': datetime.now(timezone).isoformat(),
              'business_tab': landing_tab.title, 'registration_tab': reg_tab.title,
              'business_count': len(business_rows), 'registration_count': len(registration_rows),
              'activecampaign_selectors': selectors, 'stats_layout': layout,
          }, indent=2))

          output_file = os.environ.get('GITHUB_OUTPUT')
          if output_file:
              with open(output_file, 'a', encoding='utf-8') as output:
                  output.write('utm_landing_tab=' + landing_tab.title + '\n')
                  output.write('utm_reg_tab=' + reg_tab.title + '\n')
                  output.write('utm_tab_date=' + target_tab_date.isoformat() + '\n')

          print()
          print("=" * 60)
          print("GOOGLE SHEETS TEST SUCCESSFUL")
          print("READ ONLY - NOTHING MODIFIED")
          print("=" * 60)
          PY


      - name: Save the selected UTM snapshot
        uses: actions/upload-artifact@v4
        with:
          name: utm-source-${{ github.run_id }}
          path: utm/*
          if-no-files-found: error
          retention-days: 7

  test-flexifunnels:
    name: Download the selected date's FlexiFunnels reports
    needs: test-google-sheets
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
