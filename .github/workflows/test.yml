name: FlexiFunnels Discrepancy Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-google-sheets:
    name: Test Google Sheets Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Sheets dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth

      - name: Verify Google Sheets access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}
          UTM_LANDING_TAB: ${{ vars.UTM_LANDING_TAB }}
          UTM_REG_TAB: ${{ vars.UTM_REG_TAB }}
          DISCREPANCY_TAB_NAME: ${{ vars.DISCREPANCY_TAB_NAME }}

        run: |
          python -u - <<'PY'
          import json
          import os

          import gspread
          from google.oauth2.service_account import Credentials

          print("=" * 60)
          print("GOOGLE SHEETS CONNECTION TEST - VERSION 10")
          print("=" * 60)

          required = [
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "RAW_DATA_SHEET_ID",
              "UTM_SHEET_ID",
              "DISCREPANCY_SHEET_ID",
              "UTM_LANDING_TAB",
              "UTM_REG_TAB",
              "DISCREPANCY_TAB_NAME",
          ]

          missing = [
              name for name in required
              if not os.environ.get(name, "").strip()
          ]

          if missing:
              raise RuntimeError(
                  "Missing configuration: " + ", ".join(missing)
              )

          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets.readonly"
              ],
          )

          client = gspread.authorize(credentials)

          spreadsheet_ids = {
              "RAW DATA": os.environ["RAW_DATA_SHEET_ID"],
              "UTM": os.environ["UTM_SHEET_ID"],
              "DISCREPANCY STATS": os.environ["DISCREPANCY_SHEET_ID"],
          }

          opened = {}

          for label, spreadsheet_id in spreadsheet_ids.items():
              spreadsheet = client.open_by_key(spreadsheet_id)
              opened[label] = spreadsheet

              print("\n" + label + ": CONNECTED")
              print("Spreadsheet:", spreadsheet.title)
              print("Total tabs:", len(spreadsheet.worksheets()))

          print("\nCHECKING CONFIGURED SOURCE TABS")

          checks = [
              ("UTM_LANDING_TAB", "UTM"),
              ("UTM_REG_TAB", "UTM"),
              ("DISCREPANCY_TAB_NAME", "DISCREPANCY STATS"),
          ]

          for variable, spreadsheet_label in checks:
              tab_name = os.environ[variable].strip()

              try:
                  opened[spreadsheet_label].worksheet(tab_name)
                  print(variable + ": FOUND")
              except gspread.WorksheetNotFound:
                  raise RuntimeError(
                      variable + " does not match an existing tab."
                  )

          print("\n" + "=" * 60)
          print("GOOGLE SHEETS CONNECTION TEST SUCCESSFUL")
          print("READ-ONLY TEST: NO DATA MODIFIED")
          print("=" * 60)
          PY

  test-flexifunnels-login:
    name: Test FlexiFunnels Login
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test login, sub-user switch, and project URL search
        env:
          FLEXIFUNNELS_EMAIL: ${{ secrets.FLEXIFUNNELS_EMAIL }}
          FLEXIFUNNELS_PASSWORD: ${{ secrets.FLEXIFUNNELS_PASSWORD }}
          FLEXIFUNNELS_PROJECT_URL: ${{ vars.FLEXIFUNNELS_PROJECT_URL }}
          FLEXIFUNNELS_SUB_USER: Saurabh Bhatnagar

        run: |
          python -u - <<'PY'
          import os
          import re
          import time
          from urllib.parse import urlparse

          from playwright.sync_api import sync_playwright

          print("=" * 60)
          print("FLEXIFUNNELS LOGIN TEST - VERSION 10")
          print("=" * 60)

          email = os.environ.get(
              "FLEXIFUNNELS_EMAIL", ""
          ).strip()

          password = os.environ.get(
              "FLEXIFUNNELS_PASSWORD", ""
          )

          project_url = os.environ.get(
              "FLEXIFUNNELS_PROJECT_URL", ""
          ).strip()

          sub_user = os.environ.get(
              "FLEXIFUNNELS_SUB_USER", ""
          ).strip()

          if not email or not password:
              raise RuntimeError(
                  "FlexiFunnels credentials are missing."
              )

          if sub_user != "Saurabh Bhatnagar":
              raise RuntimeError(
                  "Unexpected sub-user configuration."
              )

          parsed_project = urlparse(project_url)

          if (
              parsed_project.scheme != "https"
              or parsed_project.hostname != "app.flexifunnels.com"
              or parsed_project.path.rstrip("/")
                 != "/projects/kvapNzyj"
          ):
              raise RuntimeError(
                  "Unexpected project URL configuration."
              )

          def safe_location(page):
              if page.is_closed():
                  return "closed"

              parsed = urlparse(page.url)

              return (
                  parsed.scheme
                  + "://"
                  + (parsed.hostname or "")
                  + parsed.path
              )

          def current_path(page):
              if page.is_closed():
                  return ""

              return urlparse(page.url).path.rstrip("/")

          def visible_items(locator, limit=50):
              matches = []

              for index in range(min(locator.count(), limit)):
                  item = locator.nth(index)

                  if item.is_visible():
                      matches.append(item)

              return matches

          def unique_visible(locator):
              matches = visible_items(locator)

              if len(matches) == 1:
                  return matches[0]

              return None

          def wait_for_path_change(page, original, seconds=25):
              deadline = time.monotonic() + seconds

              while time.monotonic() < deadline:
                  path = current_path(page)

                  if path != original:
                      return path

                  time.sleep(1)

              return current_path(page)

          def find_login_field(page, selectors):
              for selector in selectors:
                  try:
                      locator = page.locator(selector)
                      field = unique_visible(locator)

                      if field is not None:
                          return field
                  except Exception:
                      continue

              return None

          def select_saurabh(page):
              print("\nSTEP 7: Finding Saurabh Bhatnagar")

              exact_name = re.compile(
                  r"^\s*Saurabh Bhatnagar\s*$",
                  re.IGNORECASE,
              )

              name_element = unique_visible(
                  page.get_by_text(exact_name)
              )

              if name_element is None:
                  raise RuntimeError(
                      "Saurabh Bhatnagar was not found uniquely."
                  )

              print("Saurabh Bhatnagar: FOUND")

              print(
                  "\nSTEP 8: Finding Switch to user "
                  "inside Saurabh's card"
              )

              # Keep the selector that worked in Version 9.
              # The account switch control is an anchor.

              card = name_element.locator(
                  "xpath=ancestor::*["
                  ".//*["
                  "self::a or self::button or @role='button'"
                  "]["
                  "contains("
                  "translate(normalize-space(.), "
                  "'ABCDEFGHIJKLMNOPQRSTUVWXYZ', "
                  "'abcdefghijklmnopqrstuvwxyz'), "
                  "'switch to user'"
                  ")"
                  "]"
                  "][1]"
              )

              if card.count() != 1 or not card.is_visible():
                  raise RuntimeError(
                      "Could not identify Saurabh's account card."
                  )

              print("Saurabh account card: FOUND")

              switch_pattern = re.compile(
                  r"^\s*Switch to user\s*$",
                  re.IGNORECASE,
              )

              controls = card.locator(
                  "a, button, [role='button']"
              )

              matches = []

              for control in visible_items(controls):
                  label = control.inner_text().strip()

                  if switch_pattern.fullmatch(label):
                      matches.append(control)

              if len(matches) != 1:
                  raise RuntimeError(
                      "Could not uniquely identify "
                      "Saurabh's Switch to user control."
                  )

              switch_control = matches[0]

              if not switch_control.is_enabled():
                  raise RuntimeError(
                      "Saurabh's Switch to user control is disabled."
                  )

              tag = switch_control.evaluate(
                  "(element) => element.tagName.toLowerCase()"
              )

              print("Correct Switch to user control found.")
              print("Control type:", tag)

              # Read only the destination structure.
              # Do not log hrefs or account IDs.

              target = switch_control.get_attribute("target")

              print(
                  "Opens new tab:",
                  target == "_blank",
              )

              print("\nSTEP 9: Switching to Saurabh")

              switch_control.click(timeout=15000)

              print(
                  "Clicked Switch to user "
                  "inside Saurabh's card."
              )

          def locate_switched_page(context, original_page):
              print(
                  "\nSTEP 10: Checking browser tabs "
                  "after sub-user switch"
              )

              deadline = time.monotonic() + 30

              while time.monotonic() < deadline:
                  pages = [
                      p for p in context.pages
                      if not p.is_closed()
                  ]

                  for candidate in reversed(pages):
                      if candidate != original_page:
                          candidate.wait_for_load_state(
                              "domcontentloaded",
                              timeout=15000,
                          )

                          print(
                              "Additional browser tab detected."
                          )
                          print(
                              "New tab location:",
                              safe_location(candidate),
                          )

                          parsed = urlparse(candidate.url)

                          if (
                              parsed.scheme != "https"
                              or parsed.hostname != "app.flexifunnels.com"
                          ):
                              raise RuntimeError(
                                  "Unexpected destination "
                                  "after sub-user switch."
                              )

                          return candidate

                  if current_path(original_page) != "/switch-sub-users":
                      print(
                          "Original tab changed location."
                      )
                      print(
                          "Location:",
                          safe_location(original_page),
                      )

                      return original_page

                  time.sleep(1)

              print(
                  "No navigation or new tab detected "
                  "after clicking Switch to user."
              )

              return original_page

          def open_projects(page):
              print(
                  "\nSTEP 11: Opening Projects "
                  "after sub-user selection"
              )

              page.goto(
                  "https://app.flexifunnels.com/projects",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(4000)

              print(
                  "Projects page location:",
                  safe_location(page),
              )

              if current_path(page) != "/projects":
                  raise RuntimeError(
                      "Projects page is inaccessible "
                      "after switching sub-users."
                  )

              # Verify the page is actually displaying
              # project search controls, not merely
              # the expected URL.

              search_field = unique_visible(
                  page.locator(
                      'input[placeholder*="Search" i]'
                  )
              )

              if search_field is None:
                  raise RuntimeError(
                      "Projects page opened, but the "
                      "project search field is missing."
                  )

              print(
                  "SUCCESS: PROJECTS PAGE ACCESS VERIFIED"
              )

          def choose_project_url_filter(page):
              print(
                  "\nSTEP 12: Selecting Project URL filter"
              )

              dropdown = unique_visible(
                  page.get_by_text(
                      "Project Name",
                      exact=True,
                  )
              )

              if dropdown is None:
                  # The dropdown may already be set
                  # to Project URL.

                  selected = unique_visible(
                      page.get_by_text(
                          "Project URL",
                          exact=True,
                      )
                  )

                  if selected is not None:
                      print(
                          "Project URL filter already selected."
                      )
                      return

                  raise RuntimeError(
                      "Project search filter was not found."
                  )

              dropdown.click(timeout=15000)

              page.wait_for_timeout(1000)

              option = unique_visible(
                  page.get_by_text(
                      "Project URL",
                      exact=True,
                  )
              )

              if option is None:
                  raise RuntimeError(
                      "Project URL option not found."
                  )

              option.click(timeout=15000)

              print("Project URL filter selected.")

          def search_project(page):
              print("\nSTEP 13: Entering project URL")

              search_field = unique_visible(
                  page.locator(
                      'input[placeholder*="Search" i]'
                  )
              )

              if search_field is None:
                  raise RuntimeError(
                      "Project search field not found."
                  )

              search_field.fill(project_url)

              print("Project URL entered.")

              print("\nSTEP 14: Clicking Search")

              search_button = unique_visible(
                  page.get_by_role(
                      "button",
                      name=re.compile(
                          r"^\s*Search\s*$",
                          re.IGNORECASE,
                      ),
                  )
              )

              if search_button is None:
                  raise RuntimeError(
                      "Project Search button not found."
                  )

              search_button.click(timeout=15000)

              print("Search submitted.")

          def verify_project(page, context):
              print(
                  "\nSTEP 15: Checking project search result"
              )

              deadline = time.monotonic() + 40

              expected_path = parsed_project.path.rstrip("/")

              while time.monotonic() < deadline:
                  pages = [
                      p for p in context.pages
                      if not p.is_closed()
                  ]

                  for candidate in pages:
                      if current_path(candidate) == expected_path:
                          print(
                              "Expected project URL reached."
                          )
                          return candidate

                  if current_path(page) in (
                      "/login",
                      "/switch-sub-users",
                  ):
                      raise RuntimeError(
                          "Authentication was lost "
                          "during project search."
                      )

                  time.sleep(2)

              print(
                  "Project did not open automatically."
              )

              print(
                  "Current location:",
                  safe_location(page),
              )

              print(
                  "Visible Open Project controls:",
                  len(
                      visible_items(
                          page.get_by_text(
                              "Open Project",
                              exact=True,
                          )
                      )
                  ),
              )

              raise RuntimeError(
                  "Project search did not reach "
                  "the configured project URL."
              )

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 900,
                  },
                  accept_downloads=False,
              )

              page = context.new_page()

              page.set_default_timeout(15000)

              try:
                  print("\nSTEP 1: Opening FlexiFunnels login")

                  page.goto(
                      "https://app.flexifunnels.com/login",
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  print("Location:", safe_location(page))

                  print("\nSTEP 2: Finding login fields")

                  email_field = find_login_field(
                      page,
                      [
                          'input[type="email"]',
                          'input[name="email"]',
                          'input[autocomplete="username"]',
                      ],
                  )

                  password_field = find_login_field(
                      page,
                      ['input[type="password"]'],
                  )

                  if email_field is None or password_field is None:
                      raise RuntimeError(
                          "Login fields were not found."
                      )

                  print("Login fields found.")

                  print("\nSTEP 3: Entering credentials")

                  email_field.fill(email)
                  password_field.fill(password)

                  print("Credentials entered.")

                  print("\nSTEP 4: Finding login button")

                  login_button = None

                  for selector in [
                      'button[type="submit"]',
                      'input[type="submit"]',
                      'button:has-text("Login")',
                      'button:has-text("Log in")',
                      'button:has-text("Sign in")',
                  ]:
                      candidate = unique_visible(
                          page.locator(selector)
                      )

                      if candidate is not None:
                          login_button = candidate
                          break

                  print("\nSTEP 5: Submitting login")

                  if login_button is not None:
                      login_button.click(timeout=15000)
                  else:
                      password_field.press("Enter")

                  print("Login submitted.")

                  print("\nSTEP 6: Opening sub-user selection")

                  path = wait_for_path_change(
                      page,
                      "/login",
                      seconds=25,
                  )

                  if path == "/login":
                      page.goto(
                          project_url,
                          wait_until="domcontentloaded",
                          timeout=60000,
                      )

                  page.wait_for_timeout(3000)

                  print(
                      "Current location:",
                      safe_location(page),
                  )

                  if current_path(page) != "/switch-sub-users":
                      raise RuntimeError(
                          "Sub-user selection page "
                          "was not displayed."
                      )

                  print(
                      "SUB-USER SELECTION SCREEN DETECTED"
                  )

                  select_saurabh(page)

                  switched_page = locate_switched_page(
                      context,
                      page,
                  )

                  switched_page.set_default_timeout(15000)

                  open_projects(switched_page)

                  choose_project_url_filter(switched_page)

                  search_project(switched_page)

                  verify_project(switched_page, context)

                  print("\n" + "=" * 60)
                  print("SUCCESS: FLEXIFUNNELS LOGIN VERIFIED")
                  print("SUCCESS: SAURABH SUB-USER SELECTED")
                  print("SUCCESS: PROJECTS PAGE ACCESS VERIFIED")
                  print("SUCCESS: PROJECT URL SEARCH COMPLETED")
                  print("SUCCESS: TARGET PROJECT OPENED")
                  print("NO REPORTS DOWNLOADED")
                  print("NO GOOGLE SHEETS MODIFIED")
                  print("=" * 60)

              except Exception as exc:
                  print("\n" + "=" * 60)
                  print("FLEXIFUNNELS TEST FAILED")
                  print("Error type:", type(exc).__name__)
                  print("Last location:", safe_location(page))
                  print("=" * 60)

                  raise RuntimeError(
                      "FlexiFunnels login, sub-user switch, "
                      "or project search failed. "
                      "Review the numbered steps above."
                  ) from None

              finally:
                  context.close()
                  browser.close()

                  print("\nBrowser closed.")
          PY
