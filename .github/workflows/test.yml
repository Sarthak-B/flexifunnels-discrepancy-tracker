name: FlexiFunnels Discrepancy Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # JOB 1: GOOGLE SHEETS CONNECTION TEST
  # ============================================================

  test-google-sheets:
    name: Test Google Sheets Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Sheets dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth

      - name: Verify Google Sheets access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}

        run: |
          python -u - <<'PY'
          import os
          import json
          import gspread

          from google.oauth2.service_account import Credentials

          print("=" * 60)
          print("GOOGLE SHEETS CONNECTION TEST")
          print("=" * 60)

          required = [
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "RAW_DATA_SHEET_ID",
              "UTM_SHEET_ID",
              "DISCREPANCY_SHEET_ID",
          ]

          missing = [
              name
              for name in required
              if not os.environ.get(name, "").strip()
          ]

          if missing:
              raise RuntimeError(
                  "Missing GitHub secrets/variables: "
                  + ", ".join(missing)
              )

          credentials = Credentials.from_service_account_info(
              json.loads(
                  os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
              ),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets.readonly"
              ],
          )

          client = gspread.authorize(credentials)

          spreadsheets = {
              "RAW DATA": os.environ["RAW_DATA_SHEET_ID"],
              "UTM": os.environ["UTM_SHEET_ID"],
              "DISCREPANCY STATS": os.environ["DISCREPANCY_SHEET_ID"],
          }

          for label, sheet_id in spreadsheets.items():

              print("\n" + "-" * 60)
              print("Checking:", label)

              spreadsheet = client.open_by_key(sheet_id)

              print("Status: CONNECTED")
              print("Spreadsheet:", spreadsheet.title)

              worksheets = spreadsheet.worksheets()

              print("Total tabs:", len(worksheets))

              for worksheet in worksheets:
                  print("  Tab:", worksheet.title)

          print("\n" + "=" * 60)
          print("SUCCESS: ALL GOOGLE SHEETS CONNECTED")
          print("READ-ONLY TEST: NO DATA MODIFIED")
          print("=" * 60)
          PY


  # ============================================================
  # JOB 2: FLEXIFUNNELS LOGIN TEST
  # ============================================================

  test-flexifunnels-login:
    name: Test FlexiFunnels Login
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test FlexiFunnels login and project access
        env:
          FLEXIFUNNELS_EMAIL: ${{ secrets.FLEXIFUNNELS_EMAIL }}
          FLEXIFUNNELS_PASSWORD: ${{ secrets.FLEXIFUNNELS_PASSWORD }}
          FLEXIFUNNELS_PROJECT_URL: ${{ vars.FLEXIFUNNELS_PROJECT_URL }}

        run: |
          python -u - <<'PY'
          import os
          import re
          import time

          from urllib.parse import urlparse

          from playwright.sync_api import (
              sync_playwright,
              TimeoutError as PlaywrightTimeout,
          )

          print("=" * 60)
          print("FLEXIFUNNELS LOGIN TEST - VERSION 2")
          print("=" * 60)

          email = os.environ.get(
              "FLEXIFUNNELS_EMAIL", ""
          ).strip()

          password = os.environ.get(
              "FLEXIFUNNELS_PASSWORD", ""
          )

          project_url = os.environ.get(
              "FLEXIFUNNELS_PROJECT_URL", ""
          ).strip()

          if not email:
              raise RuntimeError(
                  "Missing FLEXIFUNNELS_EMAIL secret."
              )

          if not password:
              raise RuntimeError(
                  "Missing FLEXIFUNNELS_PASSWORD secret."
              )

          parsed_project = urlparse(project_url)

          if (
              parsed_project.scheme != "https"
              or parsed_project.hostname != "app.flexifunnels.com"
              or not parsed_project.path.startswith("/projects/")
          ):
              raise RuntimeError(
                  "Invalid FLEXIFUNNELS_PROJECT_URL."
              )

          expected_path = parsed_project.path.rstrip("/")

          print("Configuration verified.")

          # Never print passwords, cookies, tokens,
          # page HTML, or browser storage state.

          def safe_location(page):
              parsed = urlparse(page.url)
              return (
                  parsed.scheme
                  + "://"
                  + (parsed.hostname or "")
                  + parsed.path
              )

          def find_visible(locator):
              try:
                  count = min(locator.count(), 20)

                  for index in range(count):
                      candidate = locator.nth(index)

                      if candidate.is_visible():
                          return candidate

              except Exception:
                  pass

              return None

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 900,
                  },
                  accept_downloads=False,
              )

              page = context.new_page()

              page.set_default_timeout(15000)

              try:

                  # ============================================
                  # STEP 1: OPEN FLEXIFUNNELS
                  # ============================================

                  print("\nSTEP 1: Opening FlexiFunnels")

                  page.goto(
                      "https://app.flexifunnels.com/",
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  print("Page opened.")
                  print("Location:", safe_location(page))

                  # ============================================
                  # STEP 2: FIND LOGIN FIELDS
                  # ============================================

                  print("\nSTEP 2: Finding login fields")

                  email_selectors = [
                      'input[type="email"]',
                      'input[name="email"]',
                      'input[autocomplete="username"]',
                      'input[placeholder*="email" i]',
                  ]

                  password_selectors = [
                      'input[type="password"]',
                      'input[name="password"]',
                  ]

                  email_field = None
                  password_field = None

                  for selector in email_selectors:
                      candidate = page.locator(selector)

                      email_field = find_visible(candidate)

                      if email_field is not None:
                          print(
                              "Email field found using:",
                              selector,
                          )
                          break

                  for selector in password_selectors:
                      candidate = page.locator(selector)

                      password_field = find_visible(candidate)

                      if password_field is not None:
                          print(
                              "Password field found using:",
                              selector,
                          )
                          break

                  if email_field is None:
                      raise RuntimeError(
                          "Email field not found."
                      )

                  if password_field is None:
                      raise RuntimeError(
                          "Password field not found."
                      )

                  # ============================================
                  # STEP 3: ENTER CREDENTIALS
                  # ============================================

                  print("\nSTEP 3: Entering credentials")

                  email_field.fill(email)
                  password_field.fill(password)

                  print("Credentials entered.")

                  # ============================================
                  # STEP 4: FIND LOGIN BUTTON
                  # ============================================

                  print("\nSTEP 4: Finding login button")

                  button_selectors = [
                      'button[type="submit"]',
                      'input[type="submit"]',
                      'button:has-text("Login")',
                      'button:has-text("Log in")',
                      'button:has-text("Sign in")',
                      'button:has-text("Sign In")',
                      'button:has-text("Continue")',
                      '[role="button"]:has-text("Login")',
                      '[role="button"]:has-text("Log in")',
                      '[role="button"]:has-text("Sign in")',
                      '[role="button"]:has-text("Continue")',
                  ]

                  login_button = None

                  for selector in button_selectors:

                      candidate = find_visible(
                          page.locator(selector)
                      )

                      if candidate is not None:

                          login_button = candidate

                          print(
                              "Login button found using:",
                              selector,
                          )

                          break

                  # ============================================
                  # STEP 5: SUBMIT LOGIN
                  # ============================================

                  print("\nSTEP 5: Submitting login")

                  if login_button is not None:

                      try:
                          login_button.click(
                              timeout=10000
                          )

                          print(
                              "Login button clicked."
                          )

                      except PlaywrightTimeout:

                          print(
                              "Button click timed out."
                          )

                          print(
                              "Trying Enter key instead."
                          )

                          password_field.press("Enter")

                          print(
                              "Enter key submitted."
                          )

                  else:

                      print(
                          "No supported login button found."
                      )

                      print(
                          "Trying Enter key in password field."
                      )

                      password_field.press("Enter")

                      print(
                          "Enter key submitted."
                      )

                  # ============================================
                  # STEP 6: WAIT FOR AUTHENTICATION
                  # ============================================

                  print(
                      "\nSTEP 6: Waiting for authentication"
                  )

                  time.sleep(5)

                  print(
                      "Location after login:",
                      safe_location(page),
                  )

                  # ============================================
                  # STEP 7: OPEN PROJECT
                  # ============================================

                  print("\nSTEP 7: Opening project")

                  page.goto(
                      project_url,
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  print(
                      "Project navigation completed."
                  )

                  print(
                      "Current location:",
                      safe_location(page),
                  )

                  # ============================================
                  # STEP 8: VERIFY PROJECT
                  # ============================================

                  print(
                      "\nSTEP 8: Verifying project access"
                  )

                  deadline = time.monotonic() + 30

                  project_verified = False

                  while time.monotonic() < deadline:

                      current_path = urlparse(
                          page.url
                      ).path.rstrip("/")

                      if current_path == expected_path:

                          project_text = page.get_by_text(
                              "Funnel Builder Agent",
                              exact=False,
                          )

                          if find_visible(
                              project_text
                          ) is not None:

                              project_verified = True

                              break

                      time.sleep(2)

                  if not project_verified:

                      print(
                          "Project verification failed."
                      )

                      print(
                          "Final location:",
                          safe_location(page),
                      )

                      current_path = urlparse(
                          page.url
                      ).path.lower()

                      if any(
                          word in current_path
                          for word in [
                              "login",
                              "signin",
                              "sign-in",
                              "auth",
                          ]
                      ):
                          print(
                              "Likely redirected to login."
                          )

                      raise RuntimeError(
                          "Could not verify project access. "
                          "Login may have failed, "
                          "additional verification may be "
                          "required, or the project text "
                          "may differ."
                      )

                  # ============================================
                  # SUCCESS
                  # ============================================

                  print("\n" + "=" * 60)
                  print(
                      "SUCCESS: FLEXIFUNNELS LOGIN VERIFIED"
                  )
                  print(
                      "SUCCESS: PROJECT ACCESS VERIFIED"
                  )
                  print(
                      "NO REPORTS DOWNLOADED"
                  )
                  print(
                      "NO GOOGLE SHEETS MODIFIED"
                  )
                  print("=" * 60)

              except Exception as exc:

                  print("\n" + "=" * 60)
                  print(
                      "FLEXIFUNNELS TEST FAILED"
                  )
                  print(
                      "Error type:",
                      type(exc).__name__,
                  )
                  print(
                      "Last browser location:",
                      safe_location(page),
                  )
                  print("=" * 60)

                  raise RuntimeError(
                      "FlexiFunnels authentication "
                      "or project verification failed. "
                      "Review the numbered steps above."
                  ) from None

              finally:

                  context.close()
                  browser.close()

                  print("\nBrowser closed.")

          PY
