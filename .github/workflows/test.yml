name: FlexiFunnels Discrepancy Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-google-sheets:
    name: Test Google Sheets Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth

      - name: Verify Google Sheets access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}

        run: |
          python -u - <<'PY'
          import os
          import json
          import gspread

          from google.oauth2.service_account import Credentials

          print("=" * 60)
          print("GOOGLE SHEETS CONNECTION TEST")
          print("=" * 60)

          required = [
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "RAW_DATA_SHEET_ID",
              "UTM_SHEET_ID",
              "DISCREPANCY_SHEET_ID",
          ]

          missing = [
              key for key in required
              if not os.environ.get(key, "").strip()
          ]

          if missing:
              raise RuntimeError(
                  "Missing configuration: " + ", ".join(missing)
              )

          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets.readonly"
              ],
          )

          client = gspread.authorize(credentials)

          sheets = {
              "RAW DATA": os.environ["RAW_DATA_SHEET_ID"],
              "UTM": os.environ["UTM_SHEET_ID"],
              "DISCREPANCY STATS": os.environ["DISCREPANCY_SHEET_ID"],
          }

          for label, sheet_id in sheets.items():
              spreadsheet = client.open_by_key(sheet_id)

              print("\n" + label + ": CONNECTED")
              print("Spreadsheet:", spreadsheet.title)

              for worksheet in spreadsheet.worksheets():
                  print("  Tab:", worksheet.title)

          print("\nALL GOOGLE SHEETS CONNECTIONS SUCCESSFUL")
          print("READ-ONLY TEST: NO DATA MODIFIED")
          PY

  test-flexifunnels-login:
    name: Test FlexiFunnels Login
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Diagnose login and account selection
        env:
          FLEXIFUNNELS_EMAIL: ${{ secrets.FLEXIFUNNELS_EMAIL }}
          FLEXIFUNNELS_PASSWORD: ${{ secrets.FLEXIFUNNELS_PASSWORD }}
          FLEXIFUNNELS_PROJECT_URL: ${{ vars.FLEXIFUNNELS_PROJECT_URL }}

        run: |
          python -u - <<'PY'
          import os
          import time

          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          print("=" * 60)
          print("FLEXIFUNNELS LOGIN TEST - VERSION 4")
          print("=" * 60)

          email = os.environ.get(
              "FLEXIFUNNELS_EMAIL", ""
          ).strip()

          password = os.environ.get(
              "FLEXIFUNNELS_PASSWORD", ""
          )

          project_url = os.environ.get(
              "FLEXIFUNNELS_PROJECT_URL", ""
          ).strip()

          if not email or not password:
              raise RuntimeError(
                  "FlexiFunnels login secrets are missing."
              )

          parsed_project = urlparse(project_url)

          if (
              parsed_project.scheme != "https"
              or parsed_project.hostname != "app.flexifunnels.com"
              or parsed_project.path.rstrip("/")
                 != "/projects/kvapNzyj"
          ):
              raise RuntimeError(
                  "Unexpected FlexiFunnels project URL."
              )

          def safe_location(page):
              parsed = urlparse(page.url)

              return (
                  parsed.scheme
                  + "://"
                  + (parsed.hostname or "")
                  + parsed.path
              )

          def visible_first(locator):
              for index in range(min(locator.count(), 30)):
                  item = locator.nth(index)

                  if item.is_visible():
                      return item

              return None

          def inspect_controls(page):
              """
              Print only structural metadata.

              Never print:
              - Account or workspace names
              - Email addresses
              - Passwords
              - Page text or HTML
              - Cookies or tokens
              - Form values
              """

              print("\nACCOUNT SELECTION DIAGNOSTICS")
              print("=" * 60)

              print("Location:", safe_location(page))

              categories = {
                  "buttons": "button",
                  "links": "a",
                  "dialogs": '[role="dialog"]',
                  "radio_inputs": 'input[type="radio"]',
                  "checkboxes": 'input[type="checkbox"]',
                  "select_menus": "select",
                  "listboxes": '[role="listbox"]',
                  "options": '[role="option"]',
                  "comboboxes": '[role="combobox"]',
                  "forms": "form",
                  "images": "img",
              }

              for label, selector in categories.items():
                  locator = page.locator(selector)

                  total = locator.count()

                  visible = sum(
                      locator.nth(i).is_visible()
                      for i in range(min(total, 100))
                  )

                  print(
                      f"{label}: total={total}, "
                      f"visible={visible}"
                  )

              print("\nVISIBLE BUTTON STRUCTURE")
              print("-" * 60)

              buttons = page.locator(
                  'button, [role="button"]'
              )

              button_number = 0

              for index in range(min(buttons.count(), 50)):
                  button = buttons.nth(index)

                  if not button.is_visible():
                      continue

                  button_number += 1

                  tag = button.evaluate(
                      "(element) => element.tagName.toLowerCase()"
                  )

                  button_type = button.get_attribute(
                      "type"
                  ) or "none"

                  if button_type not in [
                      "button",
                      "submit",
                      "reset",
                      "none",
                  ]:
                      button_type = "other"

                  disabled = button.is_disabled()

                  in_dialog = button.evaluate(
                      """(element) => Boolean(
                          element.closest('[role="dialog"]')
                      )"""
                  )

                  print(
                      f"Button {button_number}: "
                      f"tag={tag}, "
                      f"type={button_type}, "
                      f"disabled={disabled}, "
                      f"inside_dialog={in_dialog}"
                  )

              print("\nVISIBLE LINK STRUCTURE")
              print("-" * 60)

              links = page.locator("a")

              link_number = 0

              for index in range(min(links.count(), 50)):
                  link = links.nth(index)

                  if not link.is_visible():
                      continue

                  link_number += 1

                  href = link.get_attribute("href") or ""

                  # Do not print hrefs: they may contain
                  # account IDs, tokens, or other private data.

                  if not href:
                      href_type = "no_href"
                  elif href.startswith("#"):
                      href_type = "fragment"
                  elif href.startswith("javascript:"):
                      href_type = "javascript"
                  elif href.startswith("/"):
                      href_type = "internal_relative"
                  elif href.startswith("https://"):
                      href_type = "absolute_https"
                  else:
                      href_type = "other"

                  in_dialog = link.evaluate(
                      """(element) => Boolean(
                          element.closest('[role="dialog"]')
                      )"""
                  )

                  print(
                      f"Link {link_number}: "
                      f"href_type={href_type}, "
                      f"inside_dialog={in_dialog}"
                  )

              print("\nDIALOG STRUCTURE")
              print("-" * 60)

              dialogs = page.locator('[role="dialog"]')

              for index in range(min(dialogs.count(), 10)):
                  dialog = dialogs.nth(index)

                  if not dialog.is_visible():
                      continue

                  print(
                      f"Dialog {index + 1}: visible=True"
                  )

                  print(
                      "  Buttons:",
                      dialog.locator("button").count()
                  )

                  print(
                      "  Links:",
                      dialog.locator("a").count()
                  )

                  print(
                      "  Inputs:",
                      dialog.locator("input").count()
                  )

              print("\nACCOUNT SELECTION NOT PERFORMED")
              print("NO ACCOUNT NAMES OR EMAILS PRINTED")
              print("=" * 60)

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 900,
                  },
                  accept_downloads=False,
              )

              page = context.new_page()

              page.set_default_timeout(15000)

              try:

                  print("\nSTEP 1: Opening FlexiFunnels")

                  page.goto(
                      "https://app.flexifunnels.com/login",
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  print("Location:", safe_location(page))

                  print("\nSTEP 2: Finding login fields")

                  email_field = visible_first(
                      page.locator(
                          'input[type="email"], '
                          'input[name="email"], '
                          'input[autocomplete="username"]'
                      )
                  )

                  password_field = visible_first(
                      page.locator('input[type="password"]')
                  )

                  if email_field is None:
                      raise RuntimeError(
                          "Email field not found."
                      )

                  if password_field is None:
                      raise RuntimeError(
                          "Password field not found."
                      )

                  print("Login fields found.")

                  print("\nSTEP 3: Entering credentials")

                  email_field.fill(email)
                  password_field.fill(password)

                  print("Credentials entered.")

                  print("\nSTEP 4: Finding login button")

                  login_selectors = [
                      'button[type="submit"]',
                      'input[type="submit"]',
                      'button:has-text("Login")',
                      'button:has-text("Log in")',
                      'button:has-text("Sign in")',
                  ]

                  login_button = None

                  for selector in login_selectors:
                      candidate = visible_first(
                          page.locator(selector)
                      )

                      if candidate is not None:
                          login_button = candidate
                          print(
                              "Login button selector:",
                              selector
                          )
                          break

                  print("\nSTEP 5: Submitting login")

                  if login_button is not None:
                      login_button.click(timeout=15000)
                  else:
                      password_field.press("Enter")

                  print("Login submitted.")

                  print("\nSTEP 6: Waiting for authentication")

                  deadline = time.monotonic() + 45

                  while time.monotonic() < deadline:
                      current_path = urlparse(
                          page.url
                      ).path.rstrip("/")

                      if current_path != "/login":
                          break

                      time.sleep(1)

                  print(
                      "Location after waiting:",
                      safe_location(page)
                  )

                  print("\nSTEP 7: Opening project")

                  page.goto(
                      project_url,
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  page.wait_for_timeout(5000)

                  print(
                      "Location after project navigation:",
                      safe_location(page)
                  )

                  print("\nSTEP 8: Checking account selection")

                  current_path = urlparse(
                      page.url
                  ).path.rstrip("/")

                  if current_path == "/switch-sub-users":

                      print(
                          "ACCOUNT SELECTION SCREEN DETECTED"
                      )

                      inspect_controls(page)

                      print("\n" + "=" * 60)
                      print("LOGIN FLOW DIAGNOSTIC COMPLETED")
                      print("ACCOUNT SELECTION REQUIRED")
                      print("PROJECT ACCESS NOT YET VERIFIED")
                      print("NO GOOGLE SHEETS MODIFIED")
                      print("=" * 60)

                  elif current_path == parsed_project.path.rstrip("/"):

                      project_content = page.get_by_text(
                          "Funnel Builder Agent",
                          exact=False,
                      )

                      project_content.first.wait_for(
                          state="visible",
                          timeout=15000,
                      )

                      print(
                          "SUCCESS: PROJECT ACCESS VERIFIED"
                      )

                  else:

                      print(
                          "Unexpected location:",
                          safe_location(page)
                      )

                      raise RuntimeError(
                          "Login flow did not reach the "
                          "project or account-selection screen."
                      )

              except Exception as exc:

                  print("\nFLEXIFUNNELS TEST FAILED")
                  print(
                      "Error type:",
                      type(exc).__name__
                  )
                  print(
                      "Location:",
                      safe_location(page)
                  )

                  raise RuntimeError(
                      "FlexiFunnels login diagnostic failed."
                  ) from None

              finally:

                  context.close()
                  browser.close()

                  print("\nBrowser closed.")

          PY
