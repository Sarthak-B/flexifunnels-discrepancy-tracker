name: FlexiFunnels Discrepancy Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test-google-sheets:
    name: Test Google Sheets Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Sheets dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth

      - name: Verify Google Sheets access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}
          UTM_LANDING_TAB: ${{ vars.UTM_LANDING_TAB }}
          UTM_REG_TAB: ${{ vars.UTM_REG_TAB }}
          DISCREPANCY_TAB_NAME: ${{ vars.DISCREPANCY_TAB_NAME }}

        run: |
          python -u - <<'PY'
          import json
          import os

          import gspread
          from google.oauth2.service_account import Credentials

          print("=" * 60)
          print("GOOGLE SHEETS TEST - VERSION 13")
          print("=" * 60)

          required = [
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "RAW_DATA_SHEET_ID",
              "UTM_SHEET_ID",
              "DISCREPANCY_SHEET_ID",
              "UTM_LANDING_TAB",
              "UTM_REG_TAB",
              "DISCREPANCY_TAB_NAME",
          ]

          missing = [
              key
              for key in required
              if not os.environ.get(key, "").strip()
          ]

          if missing:
              raise RuntimeError(
                  "Missing configuration: " + ", ".join(missing)
              )

          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets.readonly"
              ],
          )

          client = gspread.authorize(credentials)

          spreadsheets = {
              "RAW DATA": os.environ["RAW_DATA_SHEET_ID"],
              "UTM": os.environ["UTM_SHEET_ID"],
              "DISCREPANCY STATS": os.environ["DISCREPANCY_SHEET_ID"],
          }

          opened = {}

          for label, spreadsheet_id in spreadsheets.items():

              spreadsheet = client.open_by_key(spreadsheet_id)

              opened[label] = spreadsheet

              print()
              print(label + ": CONNECTED")
              print("Spreadsheet:", spreadsheet.title)
              print("Tabs:", len(spreadsheet.worksheets()))

          checks = [
              ("UTM_LANDING_TAB", "UTM"),
              ("UTM_REG_TAB", "UTM"),
              ("DISCREPANCY_TAB_NAME", "DISCREPANCY STATS"),
          ]

          for variable, spreadsheet_label in checks:

              tab_name = os.environ[variable].strip()

              try:
                  opened[spreadsheet_label].worksheet(tab_name)

                  print(variable + ": FOUND")

              except gspread.WorksheetNotFound:
                  raise RuntimeError(
                      variable + " does not match an existing tab."
                  )

          print()
          print("=" * 60)
          print("GOOGLE SHEETS TEST SUCCESSFUL")
          print("READ ONLY - NOTHING MODIFIED")
          print("=" * 60)
          PY


  test-flexifunnels:
    name: Test FlexiFunnels Reports Navigation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test login, both searches, and Reports access
        env:
          FLEXIFUNNELS_EMAIL: ${{ secrets.FLEXIFUNNELS_EMAIL }}
          FLEXIFUNNELS_PASSWORD: ${{ secrets.FLEXIFUNNELS_PASSWORD }}
          FLEXIFUNNELS_PROJECT_URL: ${{ vars.FLEXIFUNNELS_PROJECT_URL }}
          FLEXIFUNNELS_LANDING_URL: ${{ vars.FLEXIFUNNELS_LANDING_URL }}
          FLEXIFUNNELS_REG_URL: ${{ vars.FLEXIFUNNELS_REG_URL }}
          TIMEZONE: ${{ vars.TIMEZONE }}

        run: |
          python -u - <<'PY'

          import os
          import re
          import time

          from datetime import datetime, timedelta
          from urllib.parse import urlparse
          from zoneinfo import ZoneInfo

          from playwright.sync_api import sync_playwright


          print("=" * 60)
          print("FLEXIFUNNELS REPORTS TEST - VERSION 13")
          print("=" * 60)


          EMAIL = os.environ.get(
              "FLEXIFUNNELS_EMAIL", ""
          ).strip()

          PASSWORD = os.environ.get(
              "FLEXIFUNNELS_PASSWORD", ""
          )

          PROJECT_URL = os.environ.get(
              "FLEXIFUNNELS_PROJECT_URL", ""
          ).strip()

          LANDING_URL = os.environ.get(
              "FLEXIFUNNELS_LANDING_URL", ""
          ).strip()

          REG_URL = os.environ.get(
              "FLEXIFUNNELS_REG_URL", ""
          ).strip()

          TIMEZONE = os.environ.get(
              "TIMEZONE", "Asia/Kolkata"
          ).strip() or "Asia/Kolkata"


          EXPECTED_PROJECT_URL = (
              "https://app.flexifunnels.com/projects/kvapNzyj"
          )

          EXPECTED_LANDING_URL = (
              "https://sb.flexifunnels.com/funnel-agent"
          )

          EXPECTED_REG_URL = (
              "https://sb.flexifunnels.com/flexi-genie-regteam"
          )


          if not EMAIL or not PASSWORD:
              raise RuntimeError(
                  "FlexiFunnels credentials missing."
              )

          if PROJECT_URL.rstrip("/") != EXPECTED_PROJECT_URL:
              raise RuntimeError(
                  "Unexpected project URL configuration."
              )

          if LANDING_URL.rstrip("/") != EXPECTED_LANDING_URL:
              raise RuntimeError(
                  "Unexpected landing URL configuration."
              )

          if REG_URL.rstrip("/") != EXPECTED_REG_URL:
              raise RuntimeError(
                  "Unexpected registration URL configuration."
              )


          today = datetime.now(
              ZoneInfo(TIMEZONE)
          ).date()

          yesterday = today - timedelta(days=1)

          print()
          print("Timezone:", TIMEZONE)
          print("Report start date:", yesterday.isoformat())
          print("Report end date:", today.isoformat())
          print("Date range: INCLUSIVE")
          print()


          def safe_location(page):

              if page.is_closed():
                  return "closed"

              parsed = urlparse(page.url)

              path = parsed.path

              if (
                  "login-as" in path
                  or "token" in path.lower()
                  or "callback" in path.lower()
                  or "auth" in path.lower()
              ):
                  path = "/[sensitive-path-redacted]"

              return (
                  parsed.scheme
                  + "://"
                  + (parsed.hostname or "")
                  + path
              )


          def current_path(page):

              if page.is_closed():
                  return ""

              return urlparse(page.url).path.rstrip("/")


          def visible_items(locator, limit=50):

              result = []

              for index in range(min(locator.count(), limit)):

                  item = locator.nth(index)

                  if item.is_visible():
                      result.append(item)

              return result


          def unique_visible(locator):

              items = visible_items(locator)

              if len(items) == 1:
                  return items[0]

              return None


          def first_unique_visible(locators):

              for locator in locators:

                  candidate = unique_visible(locator)

                  if candidate is not None:
                      return candidate

              return None


          def wait_for_path_change(
              page,
              original,
              seconds=25,
          ):

              deadline = time.monotonic() + seconds

              while time.monotonic() < deadline:

                  if current_path(page) != original:
                      return current_path(page)

                  time.sleep(1)

              return current_path(page)


          def find_login_field(page, selectors):

              for selector in selectors:

                  field = unique_visible(
                      page.locator(selector)
                  )

                  if field is not None:
                      return field

              return None


          def login(page):

              print()
              print("STEP 1: Opening FlexiFunnels login")

              page.goto(
                  "https://app.flexifunnels.com/login",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              print("Location:", safe_location(page))

              print()
              print("STEP 2: Finding login fields")

              email_field = find_login_field(
                  page,
                  [
                      'input[type="email"]',
                      'input[name="email"]',
                      'input[autocomplete="username"]',
                  ],
              )

              password_field = find_login_field(
                  page,
                  [
                      'input[type="password"]',
                  ],
              )

              if email_field is None or password_field is None:
                  raise RuntimeError(
                      "Login fields not found."
                  )

              print("Login fields found.")

              print()
              print("STEP 3: Entering credentials")

              email_field.fill(EMAIL)

              password_field.fill(PASSWORD)

              print("Credentials entered.")

              print()
              print("STEP 4: Finding login button")

              login_button = first_unique_visible(
                  [
                      page.locator('button[type="submit"]'),
                      page.locator('input[type="submit"]'),
                      page.locator(
                          'button:has-text("Login")'
                      ),
                      page.locator(
                          'button:has-text("Log in")'
                      ),
                      page.locator(
                          'button:has-text("Sign in")'
                      ),
                  ]
              )

              print()
              print("STEP 5: Submitting login")

              if login_button is not None:
                  login_button.click(timeout=15000)
              else:
                  password_field.press("Enter")

              print("Login submitted.")

              print()
              print("STEP 6: Opening sub-user selection")

              path = wait_for_path_change(
                  page,
                  "/login",
                  seconds=25,
              )

              if path == "/login":

                  page.goto(
                      PROJECT_URL,
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

              page.wait_for_timeout(3000)

              print(
                  "Current location:",
                  safe_location(page),
              )

              if current_path(page) != "/switch-sub-users":
                  raise RuntimeError(
                      "Sub-user selection screen missing."
                  )

              print(
                  "SUB-USER SELECTION SCREEN DETECTED"
              )


          def select_saurabh(page):

              print()
              print("STEP 7: Finding Saurabh Bhatnagar")

              exact_name = re.compile(
                  r"^\s*Saurabh Bhatnagar\s*$",
                  re.IGNORECASE,
              )

              name_element = unique_visible(
                  page.get_by_text(exact_name)
              )

              if name_element is None:
                  raise RuntimeError(
                      "Saurabh Bhatnagar not found uniquely."
                  )

              print("Saurabh Bhatnagar: FOUND")

              print()
              print(
                  "STEP 8: Finding Switch to user "
                  "inside Saurabh's card"
              )

              # This is the selector confirmed working
              # in Versions 9 through 12.

              card = name_element.locator(
                  "xpath=ancestor::*["
                  ".//*["
                  "self::a or self::button or @role='button'"
                  "]["
                  "contains("
                  "translate(normalize-space(.), "
                  "'ABCDEFGHIJKLMNOPQRSTUVWXYZ', "
                  "'abcdefghijklmnopqrstuvwxyz'), "
                  "'switch to user'"
                  ")"
                  "]"
                  "][1]"
              )

              if card.count() != 1 or not card.is_visible():
                  raise RuntimeError(
                      "Saurabh account card not found."
                  )

              print("Saurabh account card: FOUND")

              switch_pattern = re.compile(
                  r"^\s*Switch to user\s*$",
                  re.IGNORECASE,
              )

              controls = card.locator(
                  "a, button, [role='button']"
              )

              matches = []

              for control in visible_items(controls):

                  label = control.inner_text().strip()

                  if switch_pattern.fullmatch(label):
                      matches.append(control)

              if len(matches) != 1:
                  raise RuntimeError(
                      "Saurabh Switch to user control "
                      "not found uniquely."
                  )

              switch_control = matches[0]

              if not switch_control.is_enabled():
                  raise RuntimeError(
                      "Switch to user control disabled."
                  )

              print(
                  "Correct Switch to user control found."
              )

              print()
              print("STEP 9: Switching to Saurabh")

              switch_control.click(timeout=15000)

              print(
                  "Clicked Switch to user "
                  "inside Saurabh's card."
              )


          def locate_switched_page(
              context,
              original_page,
          ):

              print()
              print(
                  "STEP 10: Checking browser tabs "
                  "after sub-user switch"
              )

              deadline = time.monotonic() + 15

              while time.monotonic() < deadline:

                  pages = [
                      candidate
                      for candidate in context.pages
                      if not candidate.is_closed()
                  ]

                  for candidate in reversed(pages):

                      if candidate != original_page:

                          print(
                              "Additional browser tab detected."
                          )

                          parsed = urlparse(candidate.url)

                          if (
                              parsed.scheme != "https"
                              or parsed.hostname
                                 != "app.flexifunnels.com"
                          ):
                              raise RuntimeError(
                                  "Unexpected switch destination."
                              )

                          return candidate

                  if current_path(original_page) != "/switch-sub-users":

                      print(
                          "Original tab changed location."
                      )

                      return original_page

                  time.sleep(1)

              print(
                  "No navigation or new tab detected. "
                  "Continuing to Projects."
              )

              return original_page


          def open_projects(page):

              print()
              print("Opening Projects page")

              page.goto(
                  "https://app.flexifunnels.com/projects",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(3000)

              print(
                  "Projects location:",
                  safe_location(page),
              )

              if current_path(page) != "/projects":
                  raise RuntimeError(
                      "Projects page inaccessible."
                  )

              search_field = unique_visible(
                  page.locator(
                      'input[placeholder*="Search" i]'
                  )
              )

              if search_field is None:
                  raise RuntimeError(
                      "Projects search field missing."
                  )

              print("Projects page verified.")


          def select_published_url(page):

              print()
              print("Selecting Published URL filter")

              native_selects = visible_items(
                  page.locator("select")
              )

              for select in native_selects:

                  options = select.locator("option")

                  labels = [
                      options.nth(i).inner_text().strip()
                      for i in range(options.count())
                  ]

                  if "Published URL" in labels:

                      select.select_option(
                          label="Published URL"
                      )

                      print(
                          "Published URL selected "
                          "using native dropdown."
                      )

                      return

              dropdown = first_unique_visible(
                  [
                      page.get_by_role(
                          "button",
                          name=re.compile(
                              r"Project Name",
                              re.IGNORECASE,
                          ),
                      ),
                      page.get_by_role(
                          "combobox",
                          name=re.compile(
                              r"Project",
                              re.IGNORECASE,
                          ),
                      ),
                      page.get_by_text(
                          "Project Name",
                          exact=True,
                      ),
                  ]
              )

              if dropdown is None:
                  raise RuntimeError(
                      "Project Name dropdown missing."
                  )

              dropdown.click(timeout=15000)

              print("Project Name dropdown opened.")

              page.wait_for_timeout(700)

              option = first_unique_visible(
                  [
                      page.get_by_role(
                          "option",
                          name=re.compile(
                              r"^\s*Published URL\s*$",
                              re.IGNORECASE,
                          ),
                      ),
                      page.get_by_role(
                          "menuitem",
                          name=re.compile(
                              r"^\s*Published URL\s*$",
                              re.IGNORECASE,
                          ),
                      ),
                      page.get_by_text(
                          "Published URL",
                          exact=True,
                      ),
                  ]
              )

              if option is None:
                  raise RuntimeError(
                      "Published URL option missing."
                  )

              option.click(timeout=15000)

              print("Published URL selected.")


          def search_published_url(
              page,
              published_url,
          ):

              print()
              print("Entering published URL")

              search_field = unique_visible(
                  page.locator(
                      'input[placeholder*="Search" i]'
                  )
              )

              if search_field is None:
                  raise RuntimeError(
                      "Published URL search field missing."
                  )

              search_field.fill(published_url)

              print("Published URL entered.")

              search_button = unique_visible(
                  page.get_by_role(
                      "button",
                      name=re.compile(
                          r"^\s*Search\s*$",
                          re.IGNORECASE,
                      ),
                  )
              )

              if search_button is not None:

                  print("Clicking Search.")

                  search_button.click(timeout=15000)

              else:

                  print(
                      "No separate Search button. "
                      "Waiting for reactive search."
                  )

              print("Published URL search submitted.")

              # IMPORTANT CHANGE:
              #
              # Do not wait for the browser URL to become
              # /projects/kvapNzyj.
              #
              # Do not click Open Project.
              #
              # Instead inspect the Reports interface
              # after the published URL search.

              page.wait_for_timeout(4000)

              print(
                  "Location after search:",
                  safe_location(page),
              )


          def visible_report_controls(page):

              patterns = [
                  re.compile(
                      r"^\s*Reports?\s*$",
                      re.IGNORECASE,
                  ),
                  re.compile(
                      r"^\s*Page Reports?\s*$",
                      re.IGNORECASE,
                  ),
              ]

              found = []

              for pattern in patterns:

                  locator = page.get_by_text(pattern)

                  for item in visible_items(locator):

                      if item not in found:
                          found.append(item)

              return found


          def inspect_report_navigation(page, context):

              print()
              print("Checking Reports interface")

              deadline = time.monotonic() + 20

              while time.monotonic() < deadline:

                  pages = [
                      candidate
                      for candidate in context.pages
                      if not candidate.is_closed()
                  ]

                  for candidate in reversed(pages):

                      controls = visible_report_controls(
                          candidate
                      )

                      if controls:

                          print(
                              "Reports-related controls found:",
                              len(controls),
                          )

                          print(
                              "Reports page location:",
                              safe_location(candidate),
                          )

                          return candidate, controls

                  time.sleep(1)

              print(
                  "No Reports interface detected."
              )

              print(
                  "Current location:",
                  safe_location(page),
              )

              print()
              print("DIAGNOSTIC: Visible navigation labels")

              # Log only known UI labels.
              # Do not print page HTML, input values,
              # cookies, tokens, or private data.

              diagnostic_labels = [
                  "Reports",
                  "Report",
                  "Page Reports",
                  "Pages",
                  "Funnels",
                  "Analytics",
                  "Filters",
                  "Export Data",
                  "Downloads",
                  "Open Project",
              ]

              for label in diagnostic_labels:

                  count = len(
                      visible_items(
                          page.get_by_text(
                              label,
                              exact=True,
                          )
                      )
                  )

                  print(
                      label + ":",
                      count,
                  )

              raise RuntimeError(
                  "Published URL search completed, "
                  "but Reports interface was not found. "
                  "Need to identify the correct navigation "
                  "control before exporting data."
              )


          def open_reports(page, context):

              report_page, controls = inspect_report_navigation(
                  page,
                  context,
              )

              print()
              print("Opening Reports interface")

              # Prefer explicit navigation controls.
              # Avoid clicking generic text when
              # multiple matches exist.

              report_button = first_unique_visible(
                  [
                      report_page.get_by_role(
                          "button",
                          name=re.compile(
                              r"^\s*Page Reports?\s*$",
                              re.IGNORECASE,
                          ),
                      ),
                      report_page.get_by_role(
                          "link",
                          name=re.compile(
                              r"^\s*Page Reports?\s*$",
                              re.IGNORECASE,
                          ),
                      ),
                      report_page.get_by_role(
                          "button",
                          name=re.compile(
                              r"^\s*Reports?\s*$",
                              re.IGNORECASE,
                          ),
                      ),
                      report_page.get_by_role(
                          "link",
                          name=re.compile(
                              r"^\s*Reports?\s*$",
                              re.IGNORECASE,
                          ),
                      ),
                  ]
              )

              if report_button is None:

                  if len(controls) == 1:
                      report_button = controls[0]

                  else:
                      raise RuntimeError(
                          "Multiple Reports controls found. "
                          "Cannot safely choose one."
                      )

              report_button.click(timeout=15000)

              report_page.wait_for_timeout(3000)

              print(
                  "Reports location:",
                  safe_location(report_page),
              )

              return report_page


          def inspect_report_controls(page):

              print()
              print("INSPECTING REPORT FILTER AND EXPORT CONTROLS")

              labels = [
                  "Filters",
                  "Filter",
                  "Custom",
                  "Custom Range",
                  "Custom Date",
                  "Date Range",
                  "Export Data",
                  "Filtered Data",
                  "Downloads",
              ]

              found = {}

              for label in labels:

                  count = len(
                      visible_items(
                          page.get_by_text(
                              label,
                              exact=True,
                          )
                      )
                  )

                  found[label] = count

                  print(
                      label + ":",
                      count,
                  )

              print()
              print(
                  "Visible date inputs:",
                  len(
                      visible_items(
                          page.locator(
                              'input[type="date"]'
                          )
                      )
                  ),
              )

              print(
                  "Visible select elements:",
                  len(
                      visible_items(
                          page.locator("select")
                      )
                  ),
              )

              print()
              print("Required date range:")
              print("Start:", yesterday.isoformat())
              print("End:", today.isoformat())

              print()
              print(
                  "REPORTS INTERFACE INSPECTION COMPLETE"
              )

              print(
                  "No export triggered in this test."
              )

              return found


          def test_page(
              page,
              context,
              label,
              published_url,
          ):

              print()
              print("=" * 60)
              print("TESTING:", label)
              print("=" * 60)

              open_projects(page)

              select_published_url(page)

              search_published_url(
                  page,
                  published_url,
              )

              report_page = open_reports(
                  page,
                  context,
              )

              inspect_report_controls(
                  report_page
              )

              print()
              print(
                  "SUCCESS:",
                  label,
                  "Reports interface reached."
              )

              return report_page


          with sync_playwright() as playwright:

              browser = playwright.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 900,
                  },
                  accept_downloads=False,
              )

              page = context.new_page()

              page.set_default_timeout(15000)

              try:

                  login(page)

                  select_saurabh(page)

                  switched_page = locate_switched_page(
                      context,
                      page,
                  )

                  switched_page.set_default_timeout(15000)

                  first_report_page = test_page(
                      switched_page,
                      context,
                      "FUNNEL AGENT",
                      LANDING_URL,
                  )

                  second_report_page = test_page(
                      first_report_page,
                      context,
                      "FUNNEL AGENT REG",
                      REG_URL,
                  )

                  print()
                  print("=" * 60)
                  print("VERSION 13 NAVIGATION TEST SUCCESSFUL")
                  print("=" * 60)

                  print("LOGIN: VERIFIED")
                  print("SAURABH SWITCH CONTROL: CLICKED")
                  print("PUBLISHED URL FILTER: VERIFIED")
                  print("FUNNEL AGENT REPORTS: REACHED")
                  print("FUNNEL AGENT REG REPORTS: REACHED")

                  print()
                  print("NO REPORTS EXPORTED")
                  print("NO GOOGLE SHEETS MODIFIED")

                  print("=" * 60)

              except Exception as exc:

                  print()
                  print("=" * 60)
                  print("VERSION 13 TEST FAILED")
                  print("=" * 60)

                  print(
                      "Error type:",
                      type(exc).__name__,
                  )

                  print(
                      "Failure detail:",
                      str(exc)[:300],
                  )

                  print(
                      "Last location:",
                      safe_location(page),
                  )

                  print("=" * 60)

                  raise RuntimeError(
                      "FlexiFunnels navigation or Reports "
                      "inspection failed. "
                      "Review the detailed logs above."
                  ) from None

              finally:

                  context.close()

                  browser.close()

                  print()
                  print("Browser closed.")

          PY
