          def wait_unique(locator, description, seconds=30):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  item = unique_visible(locator)
                  if item is not None:
                      return item
                  time.sleep(0.25)
              raise RuntimeError(description + ' missing or ambiguous; stopping.')


          def click_text(page, text):
              wait_unique(page.get_by_text(text, exact=True), text).click()


          def verify_overview(page, published_url):
              # Published URL search selects the page automatically in the recording.
              # Require the requested URL to be displayed in Overview before proceeding.
              deadline = time.monotonic() + 45
              while time.monotonic() < deadline:
                  if current_path(page) != urlparse(PROJECT_URL).path.rstrip('/'):
                      time.sleep(0.5)
                      continue
                  values = [x.input_value() for x in visible_items(page.locator('input'))]
                  exact = visible_items(page.get_by_text(published_url, exact=True))
                  if published_url in values or len(exact) == 1:
                      return
                  time.sleep(0.5)
              raise RuntimeError('Overview did not confirm the requested published URL.')


          def open_recorded_reports(page, published_url):
              # The recorded purple icon has the hover tooltip "Reports".
              # The recorded Overview card contains Page Id and More. Restrict discovery
              # to that card, excluding global navigation and the animated onboarding CTA.
              more = wait_unique(page.get_by_text('More', exact=True), 'Overview More')
              card = more.locator("xpath=ancestor::*[contains(., 'Page Id')][1]")
              if card.count() != 1 or not card.is_visible():
                  raise RuntimeError('Page Overview card could not be identified.')
              card_values = [x.input_value() for x in visible_items(card.locator('input'))]
              if published_url not in card_values and published_url not in card.inner_text():
                  raise RuntimeError('Overview card does not contain the requested published URL.')
              # Resolve semantic metadata at runtime; never click by icon position.
              locators = [
                  card.get_by_role('button', name='Reports', exact=True),
                  card.get_by_role('link', name='Reports', exact=True),
                  card.locator('[title="Reports"], [data-bs-original-title="Reports"], '
                               '[data-original-title="Reports"], [data-tooltip="Reports"]'),
              ]
              control = first_unique_visible(locators)
              if control is None:
                  # Hover only to identify the recorded tooltip; do not click unknown icons.
                  candidates = visible_items(card.locator('button, a, [role="button"], svg, '
                                                         '[title], [data-bs-toggle="tooltip"], '
                                                         '[data-toggle="tooltip"]'), 60)
                  matched = {}
                  skipped = 0
                  for candidate in candidates:
                      # Clear prior hover state before testing another control.
                      page.mouse.move(0, 0)
                      tooltip = page.get_by_text('Reports', exact=True)
                      try:
                          tooltip.wait_for(state='hidden', timeout=1500)
                          candidate.hover(timeout=1500)
                          tooltip.wait_for(state='visible', timeout=1000)
                      except PlaywrightTimeoutError:
                          skipped += 1
                          continue
                      # A button and its nested SVG may both trigger the same tooltip.
                      # Group them by the element that owns the recorded interaction.
                      key = candidate.evaluate('''el => {
                          const owner = el.closest('button, a, [role="button"], [title], [data-bs-toggle="tooltip"], [data-toggle="tooltip"]') || el.closest('svg') || el;
                          return Array.from(document.querySelectorAll('*')).indexOf(owner);
                      }''')
                      matched.setdefault(key, candidate)
                  print('Overview hover candidates:', len(candidates), 'unmatched/unavailable:', skipped)
                  if len(matched) != 1:
                      raise RuntimeError('Recorded Reports icon cannot be identified uniquely inside Overview.')
                  control = next(iter(matched.values()))
              control.click()
              page.get_by_text(re.compile(r'^Page Reports')).wait_for(timeout=45000)
              wait_unique(page.get_by_text('Export Data', exact=True), 'Export Data', 45)


          def choose_recorded_custom_range(page):
              # The recording establishes visible labels, not the underlying DOM type.
              # Support either a native select or the same observed custom control.
              custom_pattern = re.compile(r'^\s*Custom\s+range\s*$', re.IGNORECASE)
              all_time_pattern = re.compile(r'^\s*All\s+Time\s*$', re.IGNORECASE)
              deadline = time.monotonic() + 30
              while time.monotonic() < deadline:
                  selects = []
                  for item in visible_items(page.locator('select')):
                      options = item.locator('option')
                      matching = [options.nth(i) for i in range(options.count())
                                  if custom_pattern.fullmatch(options.nth(i).inner_text())]
                      if len(matching) == 1:
                          selects.append((item, matching[0]))
                  if len(selects) > 1:
                      raise RuntimeError('Multiple native date dropdowns; stopping.')
                  if selects:
                      select, option = selects[0]
                      value = option.get_attribute('value')
                      if value is None:
                          select.select_option(label=option.inner_text())
                      else:
                          select.select_option(value=value)
                      print('Custom range selected using native date dropdown.')
                      return

                  trigger = first_unique_visible([
                      page.get_by_role('combobox', name=all_time_pattern),
                      page.get_by_role('button', name=all_time_pattern),
                      page.get_by_text(all_time_pattern),
                  ])
                  if trigger is not None:
                      trigger.click(timeout=15000)
                      option_deadline = time.monotonic() + 15
                      while time.monotonic() < option_deadline:
                          option = first_unique_visible([
                              page.get_by_role('option', name=custom_pattern),
                              page.get_by_role('menuitem', name=custom_pattern),
                              page.get_by_text(custom_pattern),
                          ])
                          if option is not None:
                              option.click(timeout=15000)
                              print('Custom range selected using visible All Time control.')
                              return
                          time.sleep(0.25)
                      raise RuntimeError('All Time opened, but Custom range was not uniquely visible.')
                  time.sleep(0.25)
              print('Visible native date selects:', len(visible_items(page.locator('select'))))
              print('Visible All Time matches:', len(visible_items(page.get_by_text(all_time_pattern))))
              raise RuntimeError('Recorded All Time date control is missing or ambiguous.')


          def recorded_calendar(page):
              ok = wait_unique(page.get_by_text(re.compile(r'^\s*OK\s*$', re.IGNORECASE)), 'Calendar OK')
              # The recording shows Monday-first weekday labels Mo ... Su.
              calendar = ok.locator("xpath=ancestor::*[.//*[normalize-space(.)='Mo'] and .//*[normalize-space(.)='Su']][1]")
              if calendar.count() != 1 or not calendar.is_visible():
                  raise RuntimeError('Calendar with the recorded Mo–Su weekday header not uniquely identified.')
              return calendar


          def calendar_month(calendar):
              names = 'January February March April May June July August September October November December'.split()
              pattern = r'\b(' + '|'.join(name[:3] + '(?:' + name[3:] + ')?' for name in names) + r')\s+(\d{4})\b'
              matches = re.findall(pattern, calendar.inner_text(), re.IGNORECASE)
              values = {(int(year), next(i + 1 for i, name in enumerate(names) if name[:3].lower() == month[:3].lower()))
                        for month, year in matches}
              if len(values) != 1:
                  raise RuntimeError('Calendar month/year header is missing or ambiguous.')
              return next(iter(values))


          def click_calendar_date(page, target):
              calendar = recorded_calendar(page)
              expected_month = (target.year, target.month)
              for _ in range(24):
                  shown = calendar_month(calendar)
                  if shown == expected_month:
                      break
                  previous = shown > expected_month
                  direction = re.compile(r'previous|prev|back', re.IGNORECASE) if previous else re.compile(r'next|forward', re.IGNORECASE)
                  navigation = first_unique_visible([
                      calendar.get_by_role('button', name=direction),
                      calendar.locator('[title]').filter(has_text=direction),
                  ])
                  if navigation is None:
                      # Inspect only semantic labels on calendar controls, not global UI.
                      labeled = []
                      for control in visible_items(calendar.locator('button, [role="button"], [aria-label], [title]')):
                          label = ' '.join(control.get_attribute(attr) or '' for attr in ('aria-label', 'title'))
                          if direction.search(label):
                              labeled.append(control)
                      if len(labeled) == 1:
                          navigation = labeled[0]
                  if navigation is None:
                      raise RuntimeError('Calendar month arrow lacks a unique directional label; stopping.')
                  navigation.click()
                  deadline = time.monotonic() + 5
                  while time.monotonic() < deadline:
                      calendar = recorded_calendar(page)
                      if calendar_month(calendar) != shown:
                          break
                      time.sleep(0.1)
                  else:
                      raise RuntimeError('Calendar month did not change after navigation.')
              else:
                  raise RuntimeError('Requested calendar month was not reached.')

              # Match the actual visible day number within the confirmed month. Exclude
              # explicitly disabled cells and fail if adjacent-month cells are ambiguous.
              day = re.compile(r'^\s*' + str(target.day) + r'\s*$')
              candidates = visible_items(calendar.get_by_text(day))
              candidates = [item for item in candidates if item.is_enabled() and not item.evaluate(
                  "el => !!el.closest('[aria-disabled=\"true\"], [disabled]')")]
              if len(candidates) != 1:
                  raise RuntimeError('Calendar day ' + target.isoformat() + ' is missing or ambiguous.')
              candidates[0].click()
              print('Calendar date clicked:', target.isoformat())


          def verify_calendar_preview(page):
              calendar = recorded_calendar(page)
              deadline = time.monotonic() + 10
              while time.monotonic() < deadline:
                  values = [field.input_value() for field in visible_items(calendar.locator('input'))]
                  preview = calendar.inner_text() + ' ' + ' '.join(values)
                  selected = re.findall(r'\b\d{4}-\d{2}-\d{2}\b', preview)
                  if selected == [yesterday.isoformat(), today.isoformat()]:
                      print('Calendar start/end preview verified.')
                      return
                  time.sleep(0.25)
              raise RuntimeError('Calendar preview does not confirm yesterday through today.')


          def save_calendar_diagnostic(page):
              # Capture only the calendar, excluding report rows and customer information.
              try:
                  calendar = recorded_calendar(page)
                  Path('diagnostics').mkdir(exist_ok=True)
                  calendar.screenshot(path='diagnostics/calendar.png')
                  data = calendar.locator('input, button, [role="button"], [role="gridcell"], [aria-label], [title]').evaluate_all('''xs => xs.map(el => ({
                      tag: el.tagName, role: el.getAttribute('role'),
                      ariaLabel: el.getAttribute('aria-label'), title: el.getAttribute('title'),
                      disabled: el.getAttribute('aria-disabled'), readonly: el.hasAttribute('readonly'),
                      text: (el.innerText || '').trim().slice(0, 100)
                  }))''')
                  import json
                  Path('diagnostics/calendar-controls.json').write_text(json.dumps(data, indent=2))
                  print('Calendar-only diagnostics saved.')
              except Exception:
                  print('Calendar-only diagnostics unavailable.')


          def range_dates(value):
              # Read the two ISO dates independently of spacing or the display separator.
              return re.findall(r'\b\d{4}-\d{2}-\d{2}\b', value.strip()) if len(value) <= 100 else []


          def applied_range_matches(page):
              expected_dates = [yesterday.isoformat(), today.isoformat()]
              values = [field.input_value() for field in visible_items(page.locator('input'))]
              if any(range_dates(value) == expected_dates for value in values):
                  return True
              # The selected range can be rendered as text rather than an input value.
              pattern = re.compile(r'^\s*' + yesterday.isoformat() + r'\s*(?:to|[-–—~])\s*' + today.isoformat() + r'\s*$', re.IGNORECASE)
              return unique_visible(page.get_by_text(pattern)) is not None


          def read_report_count(page):
              heading = unique_visible(page.get_by_text(re.compile(r'^\s*Page Reports\b')))
              if heading is None:
                  return None
              # The [count] badge may be a sibling of the Page Reports text. Read only
              # its nearby header, not the whole report or any customer rows.
              text = heading.evaluate('''el => {
                  for (let i = 0; el && i < 4; i++, el = el.parentElement) {
                      const text = (el.innerText || '').trim();
                      if (text.length <= 200 && /^Page Reports\\s*\\[\\s*[\\d,]+\\s*\\]/.test(text)) return text;
                  }
                  return '';
              }''')
              match = re.search(r'^Page Reports\s*\[\s*([\d,]+)\s*\]', text)
              return int(match.group(1).replace(',', '')) if match else None


          def wait_applied_report(page):
              deadline = time.monotonic() + 60
              stable_since = None
              range_confirmed = False
              while time.monotonic() < deadline:
                  range_confirmed = applied_range_matches(page)
                  count = read_report_count(page)
                  if range_confirmed:
                      if stable_since is None:
                          stable_since = time.monotonic()
                      elif time.monotonic() - stable_since >= 3:
                          print('Applied range verified:', yesterday.isoformat(), 'through', today.isoformat())
                          print('Live Page Reports count (informational only):', count)
                          return count
                  else:
                      stable_since = None
                  time.sleep(0.5)
              # Emit only the known report header and date-control evidence.
              print('Applied range matched:', range_confirmed)
              print('Page Reports count parsed:', read_report_count(page))
              Path('diagnostics').mkdir(exist_ok=True)
              import json
              heading = unique_visible(page.get_by_text(re.compile(r'^\s*Page Reports\b')))
              nearby = heading.evaluate('''el => {
                  const out = [];
                  for (let i = 0; el && i < 4; i++, el = el.parentElement) {
                      const text = (el.innerText || '').trim();
                      if (text.length <= 200) out.push(text);
                  }
                  return out;
              }''') if heading else []
              dates = [field.input_value() for field in visible_items(page.locator('input'))
                       if range_dates(field.input_value())]
              Path('diagnostics/applied-filter.json').write_text(json.dumps({
                  'expectedDates': [yesterday.isoformat(), today.isoformat()],
                  'visibleDateValues': dates, 'reportHeader': nearby,
              }, indent=2))
              raise RuntimeError('Applied date range could not be verified; see applied-filter diagnostics.')


          def set_recorded_date_range(page):
              # At 14–15 seconds in the recording, clicking Filters reveals All Time.
              # Each published URL is opened afresh before this function is called.
              click_text(page, 'Filters')
              print('Filters clicked; waiting for the date control to appear.')
              choose_recorded_custom_range(page)
              # Wait for the date picker to appear after selection instead of inspecting
              # it immediately while the report UI is still updating.
              deadline = time.monotonic() + 30
              picker = None
              while time.monotonic() < deadline:
                  picker = first_unique_visible([
                      page.locator('input[placeholder="Select Date Range"]'),
                      page.get_by_text('Select Date Range', exact=True),
                  ])
                  if picker is not None:
                      break
                  time.sleep(0.25)
              if picker is None:
                  raise RuntimeError('Custom range selected, but Select Date Range did not appear.')
              picker.click()

              try:
                  click_calendar_date(page, yesterday)
                  click_calendar_date(page, today)
                  verify_calendar_preview(page)
                  wait_unique(page.get_by_text(re.compile(r'^\s*OK\s*$', re.IGNORECASE)), 'Calendar OK').click()
              except Exception:
                  save_calendar_diagnostic(page)
                  raise
              return wait_applied_report(page)


          def download_rows(page):
              # Use table rows containing the recorded "Filter: Custom" marker.
              return page.get_by_role('row').filter(has_text='Filter: Custom')


          def downloads_view_ready(page):
              # CSS can display "File Details" as "FILE DETAILS". Match the actual
              # label without assuming its DOM capitalization or whitespace.
              labels = ('File Details', 'Records', 'Status', 'Created', 'Action')
              found = []
              for label in labels:
                  pattern = re.compile(r'^\s*' + r'\s+'.join(label.split()) + r'\s*$', re.IGNORECASE)
                  found.append(bool(visible_items(page.get_by_text(pattern))))
              export_visible = bool(visible_items(page.get_by_text('Export Data', exact=True)))
              if export_visible:
                  return False
              if found[0] and sum(found) >= 3:
                  return True
              # Some empty lists hide the table headers. Accept only an explicit empty
              # state after the report's Export Data control has disappeared.
              empty = re.compile(r'^\s*(?:No (?:data|downloads|records|exports)(?: found| available| yet)?)[.!]?\s*$', re.IGNORECASE)
              return bool(visible_items(page.get_by_text(empty)))


          def export_row_metadata(page):
              result = []
              rows = download_rows(page)
              for index in range(rows.count()):
                  cells = rows.nth(index).get_by_role('cell')
                  if cells.count() < 5:
                      continue
                  result.append({'index': index,
                                 'details': ' '.join(cells.nth(0).inner_text().split()),
                                 'records': cells.nth(1).inner_text().strip(),
                                 'status': cells.nth(2).inner_text().strip(),
                                 'created': ' '.join(cells.nth(3).inner_text().split())})
              return result


          def export_identity(row):
              # Status/count can change while processing; they are not identity fields.
              return row['details'], row['created']


          def new_export_rows(before, current):
              from collections import Counter
              old = Counter(export_identity(row) for row in before)
              now = Counter(export_identity(row) for row in current)
              surplus = now - old
              result = []
              # Recorded table prepends new rows, including duplicate minute timestamps.
              for row in current:
                  key = export_identity(row)
                  if surplus[key] > 0:
                      result.append(row)
                      surplus[key] -= 1
              return result


          def completed_export_candidates(before, current):
              return [row for row in new_export_rows(before, current)
                      if row['status'].strip().casefold() == 'completed']


          def wait_downloads_snapshot(page):
              deadline = time.monotonic() + 45
              previous, stable_since = None, None
              while time.monotonic() < deadline:
                  if downloads_view_ready(page):
                      texts = export_row_metadata(page)
                      if texts != previous:
                          previous, stable_since = texts, time.monotonic()
                      elif time.monotonic() - stable_since >= 3:
                          print('Downloads view verified; existing custom exports:', len(texts))
                          return texts
                  else:
                      previous, stable_since = None, None
                  time.sleep(0.5)
              labels = ('Downloads', 'File Details', 'Records', 'Status', 'Created', 'Action', 'Export Data')
              known_counts = {}
              for label in labels:
                  pattern = re.compile(r'^\s*' + r'\s+'.join(label.split()) + r'\s*$', re.IGNORECASE)
                  known_counts[label] = len(visible_items(page.get_by_text(pattern)))
              print('Downloads view label counts:', known_counts)
              Path('diagnostics').mkdir(exist_ok=True)
              import json
              Path('diagnostics/downloads-view.json').write_text(json.dumps(known_counts, indent=2))
              raise RuntimeError('Downloads view not confirmed; see downloads-view diagnostics. No export was started.')


          def validate_and_reduce_export(path, start_date, end_date):
              # The CSV is the count source. No comparison with a live screen count.
              with path.open(encoding='utf-8-sig', newline='') as source:
                  reader = csv.DictReader(source)
                  required = ('first_name', 'email', 'phone', 'created_at')
                  if any(key not in (reader.fieldnames or []) for key in required):
                      raise RuntimeError('CSV is missing required identity/timestamp columns.')
                  identities = []
                  for record in reader:
                      timestamp = datetime.strptime(record['created_at'].strip(), '%b %d, %Y %I:%M %p (IST)')
                      if not start_date <= timestamp.date() <= end_date:
                          raise RuntimeError('Export contains a record outside the requested date range.')
                      identities.append({'name': record['first_name'].strip(), 'email': record['email'].strip(), 'phone': record['phone'].strip()})
              with path.open('w', encoding='utf-8-sig', newline='') as output:
                  writer = csv.DictWriter(output, fieldnames=['name', 'email', 'phone'])
                  writer.writeheader()
                  writer.writerows(identities)
              return len(identities)


          def export_current_report(page, label, count):
              click_text(page, 'Downloads')
              before = wait_downloads_snapshot(page)
              click_text(page, 'Reports')
              latest_count = wait_applied_report(page)
              if latest_count != count:
                  print(label + ': filtered count changed before export:', count, '->', latest_count)
              count = latest_count
              wait_unique(page.get_by_text('Export Data', exact=True), 'Export Data').click()
              click_text(page, 'Filtered Data')
              click_text(page, 'Downloads')
              deadline = time.monotonic() + 600
              current = []
              last_observed = None
              while time.monotonic() < deadline:
                  current = export_row_metadata(page)
                  new_rows = new_export_rows(before, current)
                  observed = [(row['records'], row['status'], row['created']) for row in new_rows]
                  if observed != last_observed:
                      print(label + ': new export states (records, status, created):', observed)
                      last_observed = observed
                  candidates = completed_export_candidates(before, current)
                  if len(candidates) > 1:
                      save_export_diagnostic(label, count, before, current)
                      raise RuntimeError('Multiple new completed exports appeared; cannot identify this export uniquely.')
                  if len(candidates) == 1:
                      chosen = candidates[0]
                      first = download_rows(page).nth(chosen['index'])
                      cells = first.get_by_role('cell')
                      # Recheck the row immediately before clicking, as the table updates.
                      if (cells.count() >= 5
                              and ' '.join(cells.nth(0).inner_text().split()) == chosen['details']
                              and ' '.join(cells.nth(3).inner_text().split()) == chosen['created']
                              and cells.nth(2).inner_text().strip().casefold() == 'completed'):
                          with page.expect_download(timeout=60000) as event:
                              wait_unique(first.get_by_text('Download', exact=True), 'new export Download').click()
                          download = event.value
                          if download.failure():
                              raise RuntimeError('CSV download failed.')
                          path = Path('reports') / (label + '.csv')
                          download.save_as(str(path))
                          total = validate_and_reduce_export(path, yesterday, today)
                          print(label + ': CSV verified; records=' + str(total))
                          return
                  time.sleep(2)
              save_export_diagnostic(label, count, before, current)
              raise RuntimeError('No uniquely new completed export appeared within 10 minutes. '
                                 + 'See export diagnostics; no older CSV was used.')


          def save_export_diagnostic(label, count, before, current):
              import json
              Path('diagnostics').mkdir(exist_ok=True)
              Path('diagnostics/' + label + '-export.json').write_text(json.dumps({
                  'live_report_count_for_information_only': count,
                  'date_range': [yesterday.isoformat(), today.isoformat()],
                  'before': before, 'last_observed': current,
                  'new_rows': new_export_rows(before, current),
              }, indent=2))


          Path('reports').mkdir(exist_ok=True)
          import json
          Path('reports/report-window.json').write_text(json.dumps({
              'start_date': yesterday.isoformat(), 'end_date': today.isoformat(), 'timezone': TIMEZONE,
          }))
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              context = browser.new_context(viewport={'width': 1440, 'height': 900}, accept_downloads=True, timezone_id=TIMEZONE)
              page = context.new_page()
              page.set_default_timeout(15000)
              try:
                  login(page)
                  select_saurabh(page)
                  page = locate_switched_page(context, page)
                  page.set_default_timeout(15000)
                  for label, published_url in [('funnel-agent', LANDING_URL), ('flexi-genie-regteam', REG_URL)]:
                      open_projects(page)
                      select_published_url(page)
                      search_published_url(page, published_url)
                      verify_overview(page, published_url)
                      open_recorded_reports(page, published_url)
                      count = set_recorded_date_range(page)
                      export_current_report(page, label, count)
                  print('VERSION 16-R4: both CSVs verified; Google Sheets remain read-only.')
              except Exception as error:
                  print('VERSION 16-R4 stopped:', type(error).__name__, str(error))
                  raise RuntimeError('Report automation failed; no fallback export was attempted.') from None
              finally:
                  browser.close()

