name: FlexiFunnels Discrepancy Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *" # Daily at 06:00 Asia/Kolkata

permissions:
  contents: read

jobs:

  test-google-sheets:
    name: Test Google Sheets Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Sheets dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth

      - name: Verify Google Sheets access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}
          UTM_LANDING_TAB: ${{ vars.UTM_LANDING_TAB }}
          UTM_REG_TAB: ${{ vars.UTM_REG_TAB }}
          DISCREPANCY_TAB_NAME: ${{ vars.DISCREPANCY_TAB_NAME }}

        run: |
          python -u - <<'PY'
          import json
          import os

          import gspread
          from google.oauth2.service_account import Credentials

          print("=" * 60)
          print("GOOGLE SHEETS TEST - VERSION 14")
          print("=" * 60)

          required = [
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "RAW_DATA_SHEET_ID",
              "UTM_SHEET_ID",
              "DISCREPANCY_SHEET_ID",
              "UTM_LANDING_TAB",
              "UTM_REG_TAB",
              "DISCREPANCY_TAB_NAME",
          ]

          missing = [
              key
              for key in required
              if not os.environ.get(key, "").strip()
          ]

          if missing:
              raise RuntimeError(
                  "Missing configuration: " + ", ".join(missing)
              )

          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets.readonly"
              ],
          )

          client = gspread.authorize(credentials)

          spreadsheets = {
              "RAW DATA": os.environ["RAW_DATA_SHEET_ID"],
              "UTM": os.environ["UTM_SHEET_ID"],
              "DISCREPANCY STATS": os.environ["DISCREPANCY_SHEET_ID"],
          }

          opened = {}

          for label, spreadsheet_id in spreadsheets.items():

              spreadsheet = client.open_by_key(spreadsheet_id)

              opened[label] = spreadsheet

              print()
              print(label + ": CONNECTED")
              print("Spreadsheet:", spreadsheet.title)
              print("Tabs:", len(spreadsheet.worksheets()))

          checks = [
              ("UTM_LANDING_TAB", "UTM"),
              ("UTM_REG_TAB", "UTM"),
              ("DISCREPANCY_TAB_NAME", "DISCREPANCY STATS"),
          ]

          for variable, spreadsheet_label in checks:

              tab_name = os.environ[variable].strip()

              try:
                  opened[spreadsheet_label].worksheet(tab_name)

                  print(variable + ": FOUND")

              except gspread.WorksheetNotFound:
                  raise RuntimeError(
                      variable + " does not match an existing tab."
                  )

          print()
          print("=" * 60)
          print("GOOGLE SHEETS TEST SUCCESSFUL")
          print("READ ONLY - NOTHING MODIFIED")
          print("=" * 60)
          PY


  test-flexifunnels:
    name: Download both filtered FlexiFunnels reports (Version 14)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Export yesterday through today
        env:
          FLEXIFUNNELS_EMAIL: ${{ secrets.FLEXIFUNNELS_EMAIL }}
          FLEXIFUNNELS_PASSWORD: ${{ secrets.FLEXIFUNNELS_PASSWORD }}
          FLEXIFUNNELS_PROJECT_URL: ${{ vars.FLEXIFUNNELS_PROJECT_URL }}
          FLEXIFUNNELS_LANDING_URL: ${{ vars.FLEXIFUNNELS_LANDING_URL }}
          FLEXIFUNNELS_REG_URL: ${{ vars.FLEXIFUNNELS_REG_URL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: |
          python -u - <<'PY'
          import os
          import re
          import time
          import csv
          from pathlib import Path
          from datetime import datetime, timedelta
          from urllib.parse import urlparse
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          EMAIL = os.environ.get('FLEXIFUNNELS_EMAIL', '').strip()
          PASSWORD = os.environ.get('FLEXIFUNNELS_PASSWORD', '')
          PROJECT_URL = os.environ.get('FLEXIFUNNELS_PROJECT_URL', '').strip()
          LANDING_URL = os.environ.get('FLEXIFUNNELS_LANDING_URL', '').strip()
          REG_URL = os.environ.get(
              "FLEXIFUNNELS_REG_URL", ""
          ).strip()

          TIMEZONE = os.environ.get(
              "TIMEZONE", "Asia/Kolkata"
          ).strip() or "Asia/Kolkata"


          EXPECTED_PROJECT_URL = (
              "https://app.flexifunnels.com/projects/kvapNzyj"
          )

          EXPECTED_LANDING_URL = (
              "https://sb.flexifunnels.com/funnel-agent"
          )

          EXPECTED_REG_URL = (
              "https://sb.flexifunnels.com/flexi-genie-regteam"
          )


          if not EMAIL or not PASSWORD:
              raise RuntimeError(
                  "FlexiFunnels credentials missing."
              )

          if PROJECT_URL.rstrip("/") != EXPECTED_PROJECT_URL:
              raise RuntimeError(
                  "Unexpected project URL configuration."
              )

          if LANDING_URL.rstrip("/") != EXPECTED_LANDING_URL:
              raise RuntimeError(
                  "Unexpected landing URL configuration."
              )

          if REG_URL.rstrip("/") != EXPECTED_REG_URL:
              raise RuntimeError(
                  "Unexpected registration URL configuration."
              )


          today = datetime.now(
              ZoneInfo(TIMEZONE)
          ).date()

          yesterday = today - timedelta(days=1)

          print()
          print("Timezone:", TIMEZONE)
          print("Report start date:", yesterday.isoformat())
          print("Report end date:", today.isoformat())
          print("Date range: INCLUSIVE")
          print()


          def safe_location(page):

              if page.is_closed():
                  return "closed"

              parsed = urlparse(page.url)

              path = parsed.path

              if (
                  "login-as" in path
                  or "token" in path.lower()
                  or "callback" in path.lower()
                  or "auth" in path.lower()
              ):
                  path = "/[sensitive-path-redacted]"

              return (
                  parsed.scheme
                  + "://"
                  + (parsed.hostname or "")
                  + path
              )


          def current_path(page):

              if page.is_closed():
                  return ""

              return urlparse(page.url).path.rstrip("/")


          def visible_items(locator, limit=50):

              result = []

              for index in range(min(locator.count(), limit)):

                  item = locator.nth(index)

                  if item.is_visible():
                      result.append(item)

              return result


          def unique_visible(locator):

              items = visible_items(locator)

              if len(items) == 1:
                  return items[0]

              return None


          def first_unique_visible(locators):

              for locator in locators:

                  candidate = unique_visible(locator)

                  if candidate is not None:
                      return candidate

              return None


          def wait_for_path_change(
              page,
              original,
              seconds=25,
          ):

              deadline = time.monotonic() + seconds

              while time.monotonic() < deadline:

                  if current_path(page) != original:
                      return current_path(page)

                  time.sleep(1)

              return current_path(page)


          def find_login_field(page, selectors):

              for selector in selectors:

                  field = unique_visible(
                      page.locator(selector)
                  )

                  if field is not None:
                      return field

              return None


          def login(page):

              print()
              print("STEP 1: Opening FlexiFunnels login")

              page.goto(
                  "https://app.flexifunnels.com/login",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              print("Location:", safe_location(page))

              print()
              print("STEP 2: Finding login fields")

              email_field = find_login_field(
                  page,
                  [
                      'input[type="email"]',
                      'input[name="email"]',
                      'input[autocomplete="username"]',
                  ],
              )

              password_field = find_login_field(
                  page,
                  [
                      'input[type="password"]',
                  ],
              )

              if email_field is None or password_field is None:
                  raise RuntimeError(
                      "Login fields not found."
                  )

              print("Login fields found.")

              print()
              print("STEP 3: Entering credentials")

              email_field.fill(EMAIL)

              password_field.fill(PASSWORD)

              print("Credentials entered.")

              print()
              print("STEP 4: Finding login button")

              login_button = first_unique_visible(
                  [
                      page.locator('button[type="submit"]'),
                      page.locator('input[type="submit"]'),
                      page.locator(
                          'button:has-text("Login")'
                      ),
                      page.locator(
                          'button:has-text("Log in")'
                      ),
                      page.locator(
                          'button:has-text("Sign in")'
                      ),
                  ]
              )

              print()
              print("STEP 5: Submitting login")

              if login_button is not None:
                  login_button.click(timeout=15000)
              else:
                  password_field.press("Enter")

              print("Login submitted.")

              print()
              print("STEP 6: Opening sub-user selection")

              path = wait_for_path_change(
                  page,
                  "/login",
                  seconds=25,
              )

              if path == "/login":

                  page.goto(
                      PROJECT_URL,
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

              page.wait_for_timeout(3000)

              print(
                  "Current location:",
                  safe_location(page),
              )

              if current_path(page) != "/switch-sub-users":
                  raise RuntimeError(
                      "Sub-user selection screen missing."
                  )

              print(
                  "SUB-USER SELECTION SCREEN DETECTED"
              )


          def select_saurabh(page):

              print()
              print("STEP 7: Finding Saurabh Bhatnagar")

              exact_name = re.compile(
                  r"^\s*Saurabh Bhatnagar\s*$",
                  re.IGNORECASE,
              )

              name_element = unique_visible(
                  page.get_by_text(exact_name)
              )

              if name_element is None:
                  raise RuntimeError(
                      "Saurabh Bhatnagar not found uniquely."
                  )

              print("Saurabh Bhatnagar: FOUND")

              print()
              print(
                  "STEP 8: Finding Switch to user "
                  "inside Saurabh's card"
              )

              # This is the selector confirmed working
              # in Versions 9 through 12.

              card = name_element.locator(
                  "xpath=ancestor::*["
                  ".//*["
                  "self::a or self::button or @role='button'"
                  "]["
                  "contains("
                  "translate(normalize-space(.), "
                  "'ABCDEFGHIJKLMNOPQRSTUVWXYZ', "
                  "'abcdefghijklmnopqrstuvwxyz'), "
                  "'switch to user'"
                  ")"
                  "]"
                  "][1]"
              )

              if card.count() != 1 or not card.is_visible():
                  raise RuntimeError(
                      "Saurabh account card not found."
                  )

              print("Saurabh account card: FOUND")

              switch_pattern = re.compile(
                  r"^\s*Switch to user\s*$",
                  re.IGNORECASE,
              )

              controls = card.locator(
                  "a, button, [role='button']"
              )

              matches = []

              for control in visible_items(controls):

                  label = control.inner_text().strip()

                  if switch_pattern.fullmatch(label):
                      matches.append(control)

              if len(matches) != 1:
                  raise RuntimeError(
                      "Saurabh Switch to user control "
                      "not found uniquely."
                  )

              switch_control = matches[0]

              if not switch_control.is_enabled():
                  raise RuntimeError(
                      "Switch to user control disabled."
                  )

              print(
                  "Correct Switch to user control found."
              )

              print()
              print("STEP 9: Switching to Saurabh")

              switch_control.click(timeout=15000)

              print(
                  "Clicked Switch to user "
                  "inside Saurabh's card."
              )


          def locate_switched_page(
              context,
              original_page,
          ):

              print()
              print(
                  "STEP 10: Checking browser tabs "
                  "after sub-user switch"
              )

              deadline = time.monotonic() + 15

              while time.monotonic() < deadline:

                  pages = [
                      candidate
                      for candidate in context.pages
                      if not candidate.is_closed()
                  ]

                  for candidate in reversed(pages):

                      if candidate != original_page:

                          print(
                              "Additional browser tab detected."
                          )

                          parsed = urlparse(candidate.url)

                          if (
                              parsed.scheme != "https"
                              or parsed.hostname
                                 != "app.flexifunnels.com"
                          ):
                              raise RuntimeError(
                                  "Unexpected switch destination."
                              )

                          return candidate

                  if current_path(original_page) != "/switch-sub-users":

                      print(
                          "Original tab changed location."
                      )

                      return original_page

                  time.sleep(1)

              print(
                  "No navigation or new tab detected. "
                  "Continuing to Projects."
              )

              return original_page


          def open_projects(page):

              print()
              print("Opening Projects page")

              page.goto(
                  "https://app.flexifunnels.com/projects",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(3000)

              print(
                  "Projects location:",
                  safe_location(page),
              )

              if current_path(page) != "/projects":
                  raise RuntimeError(
                      "Projects page inaccessible."
                  )

              search_field = unique_visible(
                  page.locator(
                      'input[placeholder*="Search" i]'
                  )
              )

              if search_field is None:
                  raise RuntimeError(
                      "Projects search field missing."
                  )

              print("Projects page verified.")


          def select_published_url(page):

              print()
              print("Selecting Published URL filter")

              native_selects = visible_items(
                  page.locator("select")
              )

              for select in native_selects:

                  options = select.locator("option")

                  labels = [
                      options.nth(i).inner_text().strip()
                      for i in range(options.count())
                  ]

                  if "Published URL" in labels:

                      select.select_option(
                          label="Published URL"
                      )

                      print(
                          "Published URL selected "
                          "using native dropdown."
                      )

                      return

              dropdown = first_unique_visible(
                  [
                      page.get_by_role(
                          "button",
                          name=re.compile(
                              r"Project Name",
                              re.IGNORECASE,
                          ),
                      ),
                      page.get_by_role(
                          "combobox",
                          name=re.compile(
                              r"Project",
                              re.IGNORECASE,
                          ),
                      ),
                      page.get_by_text(
                          "Project Name",
                          exact=True,
                      ),
                  ]
              )

              if dropdown is None:
                  raise RuntimeError(
                      "Project Name dropdown missing."
                  )

              dropdown.click(timeout=15000)

              print("Project Name dropdown opened.")

              page.wait_for_timeout(700)

              option = first_unique_visible(
                  [
                      page.get_by_role(
                          "option",
                          name=re.compile(
                              r"^\s*Published URL\s*$",
                              re.IGNORECASE,
                          ),
                      ),
                      page.get_by_role(
                          "menuitem",
                          name=re.compile(
                              r"^\s*Published URL\s*$",
                              re.IGNORECASE,
                          ),
                      ),
                      page.get_by_text(
                          "Published URL",
                          exact=True,
                      ),
                  ]
              )

              if option is None:
                  raise RuntimeError(
                      "Published URL option missing."
                  )

              option.click(timeout=15000)

              print("Published URL selected.")


          def search_published_url(
              page,
              published_url,
          ):

              print()
              print("Entering published URL")

              search_field = unique_visible(
                  page.locator(
                      'input[placeholder*="Search" i]'
                  )
              )

              if search_field is None:
                  raise RuntimeError(
                      "Published URL search field missing."
                  )

              search_field.fill(published_url)

              print("Published URL entered.")

              search_button = unique_visible(
                  page.get_by_role(
                      "button",
                      name=re.compile(
                          r"^\s*Search\s*$",
                          re.IGNORECASE,
                      ),
                  )
              )

              if search_button is not None:

                  print("Clicking Search.")

                  search_button.click(timeout=15000)

              else:

                  print(
                      "No separate Search button. "
                      "Waiting for reactive search."
                  )

              print("Published URL search submitted.")

              # IMPORTANT CHANGE:
              #
              # Do not wait for the browser URL to become
              # /projects/kvapNzyj.
              #
              # Do not click Open Project.
              #
              # Instead inspect the Reports interface
              # after the published URL search.

              page.wait_for_timeout(4000)

              print(
                  "Location after search:",
                  safe_location(page),
              )


          def wait_unique(locator, description, seconds=30):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  item = unique_visible(locator)
                  if item is not None:
                      return item
                  time.sleep(0.25)
              raise RuntimeError(description + ' missing or ambiguous; stopping.')


          def click_text(page, text):
              wait_unique(page.get_by_text(text, exact=True), text).click()


          def verify_overview(page, published_url):
              # Published URL search selects the page automatically in the recording.
              # Require the requested URL to be displayed in Overview before proceeding.
              deadline = time.monotonic() + 45
              while time.monotonic() < deadline:
                  if current_path(page) != urlparse(PROJECT_URL).path.rstrip('/'):
                      time.sleep(0.5)
                      continue
                  values = [x.input_value() for x in visible_items(page.locator('input'))]
                  exact = visible_items(page.get_by_text(published_url, exact=True))
                  if published_url in values or len(exact) == 1:
                      return
                  time.sleep(0.5)
              raise RuntimeError('Overview did not confirm the requested published URL.')


          def open_recorded_reports(page, published_url):
              # The recorded purple icon has the hover tooltip "Reports".
              # The recorded Overview card contains Page Id and More. Restrict discovery
              # to that card, excluding global navigation and the animated onboarding CTA.
              more = wait_unique(page.get_by_text('More', exact=True), 'Overview More')
              card = more.locator("xpath=ancestor::*[contains(., 'Page Id')][1]")
              if card.count() != 1 or not card.is_visible():
                  raise RuntimeError('Page Overview card could not be identified.')
              card_values = [x.input_value() for x in visible_items(card.locator('input'))]
              if published_url not in card_values and published_url not in card.inner_text():
                  raise RuntimeError('Overview card does not contain the requested published URL.')
              # Resolve semantic metadata at runtime; never click by icon position.
              locators = [
                  card.get_by_role('button', name='Reports', exact=True),
                  card.get_by_role('link', name='Reports', exact=True),
                  card.locator('[title="Reports"], [data-bs-original-title="Reports"], '
                               '[data-original-title="Reports"], [data-tooltip="Reports"]'),
              ]
              control = first_unique_visible(locators)
              if control is None:
                  # Hover only to identify the recorded tooltip; do not click unknown icons.
                  candidates = visible_items(card.locator('button, a, [role="button"], svg, '
                                                         '[title], [data-bs-toggle="tooltip"], '
                                                         '[data-toggle="tooltip"]'), 60)
                  matched = {}
                  skipped = 0
                  for candidate in candidates:
                      # Clear prior hover state before testing another control.
                      page.mouse.move(0, 0)
                      tooltip = page.get_by_text('Reports', exact=True)
                      try:
                          tooltip.wait_for(state='hidden', timeout=1500)
                          candidate.hover(timeout=1500)
                          tooltip.wait_for(state='visible', timeout=1000)
                      except PlaywrightTimeoutError:
                          skipped += 1
                          continue
                      # A button and its nested SVG may both trigger the same tooltip.
                      # Group them by the element that owns the recorded interaction.
                      key = candidate.evaluate('''el => {
                          const owner = el.closest('button, a, [role="button"], [title], [data-bs-toggle="tooltip"], [data-toggle="tooltip"]') || el.closest('svg') || el;
                          return Array.from(document.querySelectorAll('*')).indexOf(owner);
                      }''')
                      matched.setdefault(key, candidate)
                  print('Overview hover candidates:', len(candidates), 'unmatched/unavailable:', skipped)
                  if len(matched) != 1:
                      raise RuntimeError('Recorded Reports icon cannot be identified uniquely inside Overview.')
                  control = next(iter(matched.values()))
              control.click()
              page.get_by_text(re.compile(r'^Page Reports')).wait_for(timeout=45000)
              wait_unique(page.get_by_text('Export Data', exact=True), 'Export Data', 45)


          def choose_recorded_custom_range(page):
              # The recording establishes visible labels, not the underlying DOM type.
              # Support either a native select or the same observed custom control.
              custom_pattern = re.compile(r'^\s*Custom\s+range\s*$', re.IGNORECASE)
              all_time_pattern = re.compile(r'^\s*All\s+Time\s*$', re.IGNORECASE)
              deadline = time.monotonic() + 30
              while time.monotonic() < deadline:
                  selects = []
                  for item in visible_items(page.locator('select')):
                      options = item.locator('option')
                      matching = [options.nth(i) for i in range(options.count())
                                  if custom_pattern.fullmatch(options.nth(i).inner_text())]
                      if len(matching) == 1:
                          selects.append((item, matching[0]))
                  if len(selects) > 1:
                      raise RuntimeError('Multiple native date dropdowns; stopping.')
                  if selects:
                      select, option = selects[0]
                      value = option.get_attribute('value')
                      if value is None:
                          select.select_option(label=option.inner_text())
                      else:
                          select.select_option(value=value)
                      print('Custom range selected using native date dropdown.')
                      return

                  trigger = first_unique_visible([
                      page.get_by_role('combobox', name=all_time_pattern),
                      page.get_by_role('button', name=all_time_pattern),
                      page.get_by_text(all_time_pattern),
                  ])
                  if trigger is not None:
                      trigger.click(timeout=15000)
                      option_deadline = time.monotonic() + 15
                      while time.monotonic() < option_deadline:
                          option = first_unique_visible([
                              page.get_by_role('option', name=custom_pattern),
                              page.get_by_role('menuitem', name=custom_pattern),
                              page.get_by_text(custom_pattern),
                          ])
                          if option is not None:
                              option.click(timeout=15000)
                              print('Custom range selected using visible All Time control.')
                              return
                          time.sleep(0.25)
                      raise RuntimeError('All Time opened, but Custom range was not uniquely visible.')
                  time.sleep(0.25)
              print('Visible native date selects:', len(visible_items(page.locator('select'))))
              print('Visible All Time matches:', len(visible_items(page.get_by_text(all_time_pattern))))
              raise RuntimeError('Recorded All Time date control is missing or ambiguous.')


          def recorded_calendar(page):
              ok = wait_unique(page.get_by_text(re.compile(r'^\s*OK\s*$', re.IGNORECASE)), 'Calendar OK')
              # The recording shows Monday-first weekday labels Mo ... Su.
              calendar = ok.locator("xpath=ancestor::*[.//*[normalize-space(.)='Mo'] and .//*[normalize-space(.)='Su']][1]")
              if calendar.count() != 1 or not calendar.is_visible():
                  raise RuntimeError('Calendar with the recorded Mo–Su weekday header not uniquely identified.')
              return calendar


          def calendar_month(calendar):
              names = 'January February March April May June July August September October November December'.split()
              pattern = r'\b(' + '|'.join(name[:3] + '(?:' + name[3:] + ')?' for name in names) + r')\s+(\d{4})\b'
              matches = re.findall(pattern, calendar.inner_text(), re.IGNORECASE)
              values = {(int(year), next(i + 1 for i, name in enumerate(names) if name[:3].lower() == month[:3].lower()))
                        for month, year in matches}
              if len(values) != 1:
                  raise RuntimeError('Calendar month/year header is missing or ambiguous.')
              return next(iter(values))


          def click_calendar_date(page, target):
              calendar = recorded_calendar(page)
              expected_month = (target.year, target.month)
              for _ in range(24):
                  shown = calendar_month(calendar)
                  if shown == expected_month:
                      break
                  previous = shown > expected_month
                  direction = re.compile(r'previous|prev|back', re.IGNORECASE) if previous else re.compile(r'next|forward', re.IGNORECASE)
                  navigation = first_unique_visible([
                      calendar.get_by_role('button', name=direction),
                      calendar.locator('[title]').filter(has_text=direction),
                  ])
                  if navigation is None:
                      # Inspect only semantic labels on calendar controls, not global UI.
                      labeled = []
                      for control in visible_items(calendar.locator('button, [role="button"], [aria-label], [title]')):
                          label = ' '.join(control.get_attribute(attr) or '' for attr in ('aria-label', 'title'))
                          if direction.search(label):
                              labeled.append(control)
                      if len(labeled) == 1:
                          navigation = labeled[0]
                  if navigation is None:
                      raise RuntimeError('Calendar month arrow lacks a unique directional label; stopping.')
                  navigation.click()
                  deadline = time.monotonic() + 5
                  while time.monotonic() < deadline:
                      calendar = recorded_calendar(page)
                      if calendar_month(calendar) != shown:
                          break
                      time.sleep(0.1)
                  else:
                      raise RuntimeError('Calendar month did not change after navigation.')
              else:
                  raise RuntimeError('Requested calendar month was not reached.')

              # Match the actual visible day number within the confirmed month. Exclude
              # explicitly disabled cells and fail if adjacent-month cells are ambiguous.
              day = re.compile(r'^\s*' + str(target.day) + r'\s*$')
              candidates = visible_items(calendar.get_by_text(day))
              candidates = [item for item in candidates if item.is_enabled() and not item.evaluate(
                  "el => !!el.closest('[aria-disabled=\"true\"], [disabled]')")]
              if len(candidates) != 1:
                  raise RuntimeError('Calendar day ' + target.isoformat() + ' is missing or ambiguous.')
              candidates[0].click()
              print('Calendar date clicked:', target.isoformat())


          def verify_calendar_preview(page):
              calendar = recorded_calendar(page)
              deadline = time.monotonic() + 10
              while time.monotonic() < deadline:
                  values = [field.input_value() for field in visible_items(calendar.locator('input'))]
                  preview = calendar.inner_text() + ' ' + ' '.join(values)
                  selected = re.findall(r'\b\d{4}-\d{2}-\d{2}\b', preview)
                  if selected == [yesterday.isoformat(), today.isoformat()]:
                      print('Calendar start/end preview verified.')
                      return
                  time.sleep(0.25)
              raise RuntimeError('Calendar preview does not confirm yesterday through today.')


          def save_calendar_diagnostic(page):
              # Capture only the calendar, excluding report rows and customer information.
              try:
                  calendar = recorded_calendar(page)
                  Path('diagnostics').mkdir(exist_ok=True)
                  calendar.screenshot(path='diagnostics/calendar.png')
                  data = calendar.locator('input, button, [role="button"], [role="gridcell"], [aria-label], [title]').evaluate_all('''xs => xs.map(el => ({
                      tag: el.tagName, role: el.getAttribute('role'),
                      ariaLabel: el.getAttribute('aria-label'), title: el.getAttribute('title'),
                      disabled: el.getAttribute('aria-disabled'), readonly: el.hasAttribute('readonly'),
                      text: (el.innerText || '').trim().slice(0, 100)
                  }))''')
                  import json
                  Path('diagnostics/calendar-controls.json').write_text(json.dumps(data, indent=2))
                  print('Calendar-only diagnostics saved.')
              except Exception:
                  print('Calendar-only diagnostics unavailable.')


          def set_recorded_date_range(page):
              # At 14–15 seconds in the recording, clicking Filters reveals All Time.
              # Each published URL is opened afresh before this function is called.
              click_text(page, 'Filters')
              print('Filters clicked; waiting for the date control to appear.')
              choose_recorded_custom_range(page)
              # Wait for the date picker to appear after selection instead of inspecting
              # it immediately while the report UI is still updating.
              deadline = time.monotonic() + 30
              picker = None
              while time.monotonic() < deadline:
                  picker = first_unique_visible([
                      page.locator('input[placeholder="Select Date Range"]'),
                      page.get_by_text('Select Date Range', exact=True),
                  ])
                  if picker is not None:
                      break
                  time.sleep(0.25)
              if picker is None:
                  raise RuntimeError('Custom range selected, but Select Date Range did not appear.')
              picker.click()

              try:
                  click_calendar_date(page, yesterday)
                  click_calendar_date(page, today)
                  verify_calendar_preview(page)
                  wait_unique(page.get_by_text(re.compile(r'^\s*OK\s*$', re.IGNORECASE)), 'Calendar OK').click()
              except Exception:
                  save_calendar_diagnostic(page)
                  raise
              expected = yesterday.isoformat() + ' to ' + today.isoformat()
              deadline = time.monotonic() + 45
              while time.monotonic() < deadline:
                  values = [x.input_value() for x in visible_items(page.locator('input'))]
                  if expected in values or unique_visible(page.get_by_text(expected, exact=True)):
                      # Wait for report loading to settle; range display alone is insufficient.
                      page.wait_for_timeout(2000)
                      count_text = page.get_by_text(re.compile(r'^Page Reports')).inner_text()
                      match = re.search(r'\[(\d+)\]', count_text)
                      if match:
                          return int(match.group(1))
                  time.sleep(0.5)
              raise RuntimeError('Applied report date range/count could not be verified.')


          def download_rows(page):
              # Use table rows containing the recorded "Filter: Custom" marker.
              return page.get_by_role('row').filter(has_text='Filter: Custom')


          def export_current_report(page, label, count):
              click_text(page, 'Downloads')
              page.get_by_text('FILE DETAILS', exact=True).wait_for(timeout=30000)
              before = download_rows(page).all_text_contents()
              click_text(page, 'Reports')
              wait_unique(page.get_by_text('Export Data', exact=True), 'Export Data').click()
              click_text(page, 'Filtered Data')
              click_text(page, 'Downloads')
              deadline = time.monotonic() + 600
              seen_new = False
              while time.monotonic() < deadline:
                  rows = download_rows(page)
                  texts = rows.all_text_contents()
                  if texts:
                      # Recorded exports prepend to Downloads. Require evidence of a new
                      # row, so an old Completed export cannot be downloaded by mistake.
                      normalize = lambda s: re.sub(r'Pending|Completed|Queued\.\.\.|Download', '', s).strip()
                      if len(texts) > len(before) or not before or normalize(texts[0]) != normalize(before[0]):
                          seen_new = True
                      first = rows.first
                      if seen_new:
                          cells = first.get_by_role('cell')
                          if cells.count() < 5:
                              raise RuntimeError('Downloads columns differ from the recording.')
                          if cells.nth(1).inner_text().strip() != str(count):
                              raise RuntimeError('New export record count differs from filtered report.')
                          status = cells.nth(2).inner_text().strip()
                          if status == 'Completed':
                              with page.expect_download(timeout=60000) as event:
                                  wait_unique(first.get_by_text('Download', exact=True), 'new export Download').click()
                              download = event.value
                              if download.failure():
                                  raise RuntimeError('CSV download failed.')
                              path = Path('reports') / (label + '.csv')
                              download.save_as(str(path))
                              with path.open(encoding='utf-8-sig', newline='') as source:
                                  reader = csv.reader(source)
                                  header = next(reader, None)
                                  total = sum(1 for row in reader if any(row))
                              if not header or total != count:
                                  raise RuntimeError('Downloaded CSV row count does not match report.')
                              print(label + ': CSV verified; records=' + str(total))
                              return
                          if status not in ('Pending', 'Processing', 'Queued'):
                              raise RuntimeError('Unexpected export status; stopping.')
                  time.sleep(2)
              raise RuntimeError('New export did not complete within 10 minutes. No refresh attempted.')


          Path('reports').mkdir(exist_ok=True)
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              context = browser.new_context(viewport={'width': 1440, 'height': 900}, accept_downloads=True, timezone_id=TIMEZONE)
              page = context.new_page()
              page.set_default_timeout(15000)
              try:
                  login(page)
                  select_saurabh(page)
                  page = locate_switched_page(context, page)
                  page.set_default_timeout(15000)
                  for label, published_url in [('funnel-agent', LANDING_URL), ('flexi-genie-regteam', REG_URL)]:
                      open_projects(page)
                      select_published_url(page)
                      search_published_url(page, published_url)
                      verify_overview(page, published_url)
                      open_recorded_reports(page, published_url)
                      count = set_recorded_date_range(page)
                      export_current_report(page, label, count)
                  print('VERSION 14: both CSVs verified; Google Sheets remain read-only.')
              except Exception as error:
                  print('VERSION 14 stopped:', type(error).__name__, str(error))
                  raise RuntimeError('Report automation failed; no fallback export was attempted.') from None
              finally:
                  browser.close()

          PY
      - name: Upload calendar diagnostics if selection fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flexifunnels-calendar-diagnostics-${{ github.run_id }}
          path: diagnostics/*
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload verified CSV reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flexifunnels-reports-${{ github.run_id }}
          path: reports/*.csv
          if-no-files-found: error
          retention-days: 7
