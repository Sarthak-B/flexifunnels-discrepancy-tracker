              const shortMonths = months.map(m => m.slice(0, 3));
              const monthRe = new RegExp('\\\\b(' + months.join('|') + '|' + shortMonths.join('|') + ')\\\\b');
              const everything = allElements(document);
              everything.forEach(el => ['data-ff-cal', 'data-ff-prev', 'data-ff-next'].forEach(a => el.removeAttribute(a)));
              // Start at visible month-name text and walk up to the smallest block that also
              // shows a year and one month of day numbers (crossing component boundaries).
              let best = null, bestSize = Infinity;
              const heads0 = everything.filter(el => visible(el) && monthRe.test(ownText(el)));
              for (const head of heads0) {
                  let node = head;
                  for (let depth = 0; depth < 12 && node; depth++) {
                      const inner = allElements(node);
                      const texts = [node, ...inner].filter(c => visible(c)).map(c => ownText(c).trim()).filter(Boolean);
                      const days = texts.filter(t => /^\\d{1,2}$/.test(t));
                      const nums = new Set(days);
                      if (/\\b20\\d\\d\\b/.test(texts.join(' ')) && nums.has('1') && nums.has('15') && nums.has('28')) {
                          if (days.length <= 50 && inner.length < bestSize) { best = node; bestSize = inner.length; }
                          break;
                      }
                      node = node.parentElement || (node.getRootNode && node.getRootNode().host) || null;
                  }
              }
              if (!best) return null;
              best.setAttribute('data-ff-cal', '1');
              const inner = allElements(best).filter(c => visible(c));
              const joined = inner.map(c => ownText(c).trim()).filter(Boolean).join(' ');
              const label = joined.match(monthRe)[1];
              const year = Number((joined.match(/\\b(20\\d\\d)\\b/) || [])[1]);
              const month = (months.indexOf(label) >= 0 ? months.indexOf(label) : shortMonths.indexOf(label)) + 1;
              const heads = inner.filter(c => monthRe.test(ownText(c)) || /^\\s*20\\d\\d\\s*$/.test(ownText(c)));
              if (heads.length) {
                  const boxes = heads.map(h => h.getBoundingClientRect());
                  const left = Math.min(...boxes.map(b => b.left)), right = Math.max(...boxes.map(b => b.right));
                  const middle = (Math.min(...boxes.map(b => b.top)) + Math.max(...boxes.map(b => b.bottom))) / 2;
                  let prev = null, next = null;
                  for (const c of inner) {
                      if (heads.includes(c) || !/^(BUTTON|A|I|SVG|SPAN)$/i.test(c.tagName) && c.getAttribute('role') !== 'button') continue;
                      const r = c.getBoundingClientRect();
