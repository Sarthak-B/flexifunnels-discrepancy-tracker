                  end = zoom_box_value(zoom_date_box(page, 'To', seconds=2))
              except RuntimeError:
                  return None
              return (start, end) if start and end else None


          def zoom_displayed_range(page):
              """The report's From/To dates: from the date boxes, else from the page address."""
              boxes = zoom_input_range(page)
              address = zoom_url_range(page)
              if boxes and address and boxes != address:
                  print('Zoom: note - date boxes show', boxes, 'but the address says', address, '; using the boxes.')
              return boxes or address


          def zoom_wait_range(page, seconds=30):
              deadline = time.monotonic() + seconds
