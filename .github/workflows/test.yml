          ZOOM_MONTHS = 'January February March April May June July August September October November December'.split()


          ZOOM_BOX_JS = '''(label) => {
              const visible = el => {
                  const r = el.getBoundingClientRect(), s = getComputedStyle(el);
                  return r.width > 0 && r.height > 0 && s.visibility !== 'hidden' && s.display !== 'none';
              };
              document.querySelectorAll('[data-ff-box="' + label + '"]').forEach(el => el.removeAttribute('data-ff-box'));
              let labels = Array.from(document.querySelectorAll('body *'))
                  .filter(el => visible(el) && (el.innerText || '').trim() === label);
              labels = labels.filter(el => !labels.some(other => other !== el && el.contains(other)));
              if (labels.length !== 1) return {status: 'label', count: labels.length};
              const L = labels[0].getBoundingClientRect();
              const middle = (L.top + L.bottom) / 2;
              const sameRowRight = el => {
                  const r = el.getBoundingClientRect();
                  return Math.abs((r.top + r.bottom) / 2 - middle) <= 25 && r.left >= L.right - 2;
              };
              const dateRe = /^\\s*\\d{1,2}\\/\\d{1,2}\\/\\d{4}\\s*$/;
              let best = null;
              for (const el of document.querySelectorAll('body *')) {
                  if (!visible(el) || !sameRowRight(el)) continue;
                  const text = el.tagName === 'INPUT' ? (el.value || '') : (el.children.length ? '' : (el.textContent || ''));
                  if (!dateRe.test(text)) continue;
                  const left = el.getBoundingClientRect().left;
                  if (!best || left < best[0]) best = [left, el];
