          def zoom_calendar(page, seconds=6):
              """The open calendar popup and the (year, month) it shows, or (None, None)."""
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  found = page.evaluate(ZOOM_CALENDAR_JS)
                  if found and found.get('year') and found.get('month'):
                      return page.locator('[data-ff-cal="1"]'), (found['year'], found['month'])
                  time.sleep(0.3)
              return None, None


          def zoom_save_popup_diagnostic(page, label):
              Path('zoom-diagnostics').mkdir(exist_ok=True)
              try:
