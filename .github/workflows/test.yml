name: FlexiFunnels Discrepancy Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-google-sheets:
    name: Test Google Sheets Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Sheets dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth

      - name: Verify Google Sheets access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}
          UTM_LANDING_TAB: ${{ vars.UTM_LANDING_TAB }}
          UTM_REG_TAB: ${{ vars.UTM_REG_TAB }}
          DISCREPANCY_TAB_NAME: ${{ vars.DISCREPANCY_TAB_NAME }}

        run: |
          python -u - <<'PY'
          import json
          import os

          import gspread
          from google.oauth2.service_account import Credentials

          print("=" * 60)
          print("GOOGLE SHEETS CONNECTION TEST - VERSION 12")
          print("=" * 60)

          required = [
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "RAW_DATA_SHEET_ID",
              "UTM_SHEET_ID",
              "DISCREPANCY_SHEET_ID",
              "UTM_LANDING_TAB",
              "UTM_REG_TAB",
              "DISCREPANCY_TAB_NAME",
          ]

          missing = [
              name
              for name in required
              if not os.environ.get(name, "").strip()
          ]

          if missing:
              raise RuntimeError(
                  "Missing configuration: " + ", ".join(missing)
              )

          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets.readonly"
              ],
          )

          client = gspread.authorize(credentials)

          spreadsheet_ids = {
              "RAW DATA": os.environ["RAW_DATA_SHEET_ID"],
              "UTM": os.environ["UTM_SHEET_ID"],
              "DISCREPANCY STATS": os.environ["DISCREPANCY_SHEET_ID"],
          }

          opened = {}

          for label, spreadsheet_id in spreadsheet_ids.items():
              spreadsheet = client.open_by_key(spreadsheet_id)
              opened[label] = spreadsheet

              print("\n" + label + ": CONNECTED")
              print("Spreadsheet:", spreadsheet.title)
              print("Total tabs:", len(spreadsheet.worksheets()))

          print("\nCHECKING CONFIGURED SOURCE TABS")

          checks = [
              ("UTM_LANDING_TAB", "UTM"),
              ("UTM_REG_TAB", "UTM"),
              ("DISCREPANCY_TAB_NAME", "DISCREPANCY STATS"),
          ]

          for variable, spreadsheet_label in checks:
              tab_name = os.environ[variable].strip()

              try:
                  opened[spreadsheet_label].worksheet(tab_name)
                  print(variable + ": FOUND")

              except gspread.WorksheetNotFound:
                  raise RuntimeError(
                      variable + " does not match an existing tab."
                  )

          print("\n" + "=" * 60)
          print("GOOGLE SHEETS CONNECTION TEST SUCCESSFUL")
          print("READ-ONLY TEST: NO DATA MODIFIED")
          print("=" * 60)
          PY

  test-flexifunnels-login:
    name: Test FlexiFunnels Login and Both Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test login and both Published URL searches
        env:
          FLEXIFUNNELS_EMAIL: ${{ secrets.FLEXIFUNNELS_EMAIL }}
          FLEXIFUNNELS_PASSWORD: ${{ secrets.FLEXIFUNNELS_PASSWORD }}
          FLEXIFUNNELS_PROJECT_URL: ${{ vars.FLEXIFUNNELS_PROJECT_URL }}
          FLEXIFUNNELS_LANDING_URL: ${{ vars.FLEXIFUNNELS_LANDING_URL }}
          FLEXIFUNNELS_REG_URL: ${{ vars.FLEXIFUNNELS_REG_URL }}

        run: |
          python -u - <<'PY'
          import os
          import re
          import time

          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          print("=" * 60)
          print("FLEXIFUNNELS NAVIGATION TEST - VERSION 12")
          print("=" * 60)

          email = os.environ.get(
              "FLEXIFUNNELS_EMAIL", ""
          ).strip()

          password = os.environ.get(
              "FLEXIFUNNELS_PASSWORD", ""
          )

          project_url = os.environ.get(
              "FLEXIFUNNELS_PROJECT_URL", ""
          ).strip()

          landing_url = os.environ.get(
              "FLEXIFUNNELS_LANDING_URL", ""
          ).strip()

          reg_url = os.environ.get(
              "FLEXIFUNNELS_REG_URL", ""
          ).strip()

          if not email or not password:
              raise RuntimeError(
                  "FlexiFunnels credentials are missing."
              )

          expected_project = (
              "https://app.flexifunnels.com/projects/kvapNzyj"
          )

          if project_url.rstrip("/") != expected_project:
              raise RuntimeError(
                  "Unexpected FLEXIFUNNELS_PROJECT_URL."
              )

          expected_urls = {
              "FUNNEL AGENT": (
                  "https://sb.flexifunnels.com/funnel-agent"
              ),
              "FUNNEL AGENT REG": (
                  "https://sb.flexifunnels.com/flexi-genie-regteam"
              ),
          }

          if landing_url.rstrip("/") != expected_urls["FUNNEL AGENT"]:
              raise RuntimeError(
                  "Unexpected FLEXIFUNNELS_LANDING_URL."
              )

          if reg_url.rstrip("/") != expected_urls["FUNNEL AGENT REG"]:
              raise RuntimeError(
                  "Unexpected FLEXIFUNNELS_REG_URL."
              )

          def safe_location(page):
              if page.is_closed():
                  return "closed"

              parsed = urlparse(page.url)

              # Do not print account-switch URLs,
              # tokens, query strings, or fragments.
              if (
                  "login-as" in parsed.path
                  or "switch" in parsed.path
                  and parsed.path != "/switch-sub-users"
              ):
                  return (
                      parsed.scheme
                      + "://"
                      + (parsed.hostname or "")
                      + "/[authentication-path-redacted]"
                  )

              return (
                  parsed.scheme
                  + "://"
                  + (parsed.hostname or "")
                  + parsed.path
              )

          def current_path(page):
              if page.is_closed():
                  return ""

              return urlparse(page.url).path.rstrip("/")

          def visible_items(locator, limit=50):
              matches = []

              for index in range(min(locator.count(), limit)):
                  item = locator.nth(index)

                  if item.is_visible():
                      matches.append(item)

              return matches

          def unique_visible(locator):
              matches = visible_items(locator)

              if len(matches) == 1:
                  return matches[0]

              return None

          def wait_for_path_change(page, original, seconds=25):
              deadline = time.monotonic() + seconds

              while time.monotonic() < deadline:
                  if current_path(page) != original:
                      return current_path(page)

                  time.sleep(1)

              return current_path(page)

          def find_login_field(page, selectors):
              for selector in selectors:
                  field = unique_visible(
                      page.locator(selector)
                  )

                  if field is not None:
                      return field

              return None

          def select_saurabh(page):
              print("\nSTEP 7: Finding Saurabh Bhatnagar")

              exact_name = re.compile(
                  r"^\s*Saurabh Bhatnagar\s*$",
                  re.IGNORECASE,
              )

              name_element = unique_visible(
                  page.get_by_text(exact_name)
              )

              if name_element is None:
                  raise RuntimeError(
                      "Saurabh Bhatnagar was not found uniquely."
                  )

              print("Saurabh Bhatnagar: FOUND")

              print(
                  "\nSTEP 8: Finding Switch to user "
                  "inside Saurabh's card"
              )

              # Preserve the selector confirmed working
              # in Versions 9, 10, and 11.

              card = name_element.locator(
                  "xpath=ancestor::*["
                  ".//*["
                  "self::a or self::button or @role='button'"
                  "]["
                  "contains("
                  "translate(normalize-space(.), "
                  "'ABCDEFGHIJKLMNOPQRSTUVWXYZ', "
                  "'abcdefghijklmnopqrstuvwxyz'), "
                  "'switch to user'"
                  ")"
                  "]"
                  "][1]"
              )

              if card.count() != 1 or not card.is_visible():
                  raise RuntimeError(
                      "Could not identify Saurabh's account card."
                  )

              print("Saurabh account card: FOUND")

              switch_pattern = re.compile(
                  r"^\s*Switch to user\s*$",
                  re.IGNORECASE,
              )

              controls = card.locator(
                  "a, button, [role='button']"
              )

              matches = []

              for control in visible_items(controls):
                  label = control.inner_text().strip()

                  if switch_pattern.fullmatch(label):
                      matches.append(control)

              if len(matches) != 1:
                  raise RuntimeError(
                      "Could not uniquely identify "
                      "Saurabh's Switch to user control."
                  )

              switch_control = matches[0]

              if not switch_control.is_enabled():
                  raise RuntimeError(
                      "Saurabh's Switch to user control is disabled."
                  )

              print("Correct Switch to user control found.")

              print("\nSTEP 9: Switching to Saurabh")

              switch_control.click(timeout=15000)

              print(
                  "Clicked Switch to user "
                  "inside Saurabh's card."
              )

          def locate_switched_page(context, original_page):
              print(
                  "\nSTEP 10: Checking browser tabs "
                  "after sub-user switch"
              )

              deadline = time.monotonic() + 15

              while time.monotonic() < deadline:
                  pages = [
                      p for p in context.pages
                      if not p.is_closed()
                  ]

                  for candidate in reversed(pages):
                      if candidate != original_page:
                          print(
                              "Additional browser tab detected."
                          )

                          parsed = urlparse(candidate.url)

                          if (
                              parsed.scheme != "https"
                              or parsed.hostname
                                 != "app.flexifunnels.com"
                          ):
                              raise RuntimeError(
                                  "Unexpected sub-user destination."
                              )

                          return candidate

                  if current_path(original_page) != "/switch-sub-users":
                      print("Original tab changed location.")
                      return original_page

                  time.sleep(1)

              print(
                  "No navigation or new tab detected. "
                  "Continuing to Projects page."
              )

              return original_page

          def open_projects(page):
              print("\nOpening Projects page")

              page.goto(
                  "https://app.flexifunnels.com/projects",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              page.wait_for_timeout(3000)

              print(
                  "Projects page location:",
                  safe_location(page),
              )

              if current_path(page) != "/projects":
                  raise RuntimeError(
                      "Projects page is inaccessible."
                  )

              search_field = unique_visible(
                  page.locator(
                      'input[placeholder*="Search" i]'
                  )
              )

              if search_field is None:
                  raise RuntimeError(
                      "Projects page opened, but "
                      "the search field is missing."
                  )

              print("Projects page access verified.")

          def select_published_url(page):
              print(
                  "\nSelecting Published URL search filter"
              )

              # Screenshot confirms that the dropdown
              # contains exactly these options:
              #
              # Project Name
              # Published URL
              #
              # It does NOT contain "Project URL".

              native_selects = visible_items(
                  page.locator("select")
              )

              for select in native_selects:
                  options = select.locator("option")

                  labels = [
                      options.nth(i).inner_text().strip()
                      for i in range(options.count())
                  ]

                  if "Published URL" in labels:
                      select.select_option(
                          label="Published URL"
                      )

                      print(
                          "Published URL selected "
                          "using native dropdown."
                      )

                      return

              dropdown_candidates = [
                  page.get_by_role(
                      "button",
                      name=re.compile(
                          r"Project Name",
                          re.IGNORECASE,
                      ),
                  ),
                  page.get_by_role(
                      "combobox",
                      name=re.compile(
                          r"Project",
                          re.IGNORECASE,
                      ),
                  ),
                  page.get_by_text(
                      "Project Name",
                      exact=True,
                  ),
              ]

              dropdown = None

              for locator in dropdown_candidates:
                  candidate = unique_visible(locator)

                  if candidate is not None:
                      dropdown = candidate
                      break

              if dropdown is None:
                  raise RuntimeError(
                      "Project Name dropdown not found."
                  )

              dropdown.click(timeout=15000)

              print("Project Name dropdown opened.")

              page.wait_for_timeout(700)

              option_candidates = [
                  page.get_by_role(
                      "option",
                      name=re.compile(
                          r"^\s*Published URL\s*$",
                          re.IGNORECASE,
                      ),
                  ),
                  page.get_by_role(
                      "menuitem",
                      name=re.compile(
                          r"^\s*Published URL\s*$",
                          re.IGNORECASE,
                      ),
                  ),
                  page.get_by_text(
                      "Published URL",
                      exact=True,
                  ),
              ]

              option = None

              for locator in option_candidates:
                  candidate = unique_visible(locator)

                  if candidate is not None:
                      option = candidate
                      break

              if option is None:
                  raise RuntimeError(
                      "Published URL option not found "
                      "after opening the dropdown."
                  )

              option.click(timeout=15000)

              print("Published URL selected.")

          def search_published_url(page, published_url):
              print("\nEntering published page URL")

              search_field = unique_visible(
                  page.locator(
                      'input[placeholder*="Search" i]'
                  )
              )

              if search_field is None:
                  raise RuntimeError(
                      "Published URL search field not found."
                  )

              search_field.fill(published_url)

              print("Published URL entered.")

              # The Projects search may be reactive:
              # typing the URL can automatically update
              # results or open the matching project.

              search_button = unique_visible(
                  page.get_by_role(
                      "button",
                      name=re.compile(
                          r"^\s*Search\s*$",
                          re.IGNORECASE,
                      ),
                  )
              )

              if search_button is not None:
                  print("Clicking Search button.")
                  search_button.click(timeout=15000)
              else:
                  print(
                      "No separate Search button found. "
                      "Waiting for automatic search."
                  )

              print("Published URL search submitted.")

          def verify_project_opened(page, context):
              print(
                  "\nWaiting for project to open automatically"
              )

              expected_path = "/projects/kvapNzyj"
              deadline = time.monotonic() + 40

              while time.monotonic() < deadline:
                  pages = [
                      p for p in context.pages
                      if not p.is_closed()
                  ]

                  for candidate in pages:
                      if current_path(candidate) == expected_path:
                          print(
                              "Expected project opened."
                          )

                          return candidate

                  if current_path(page) in (
                      "/login",
                      "/switch-sub-users",
                  ):
                      raise RuntimeError(
                          "Authentication was lost "
                          "during published URL search."
                      )

                  time.sleep(2)

              print(
                  "Current location:",
                  safe_location(page),
              )

              raise RuntimeError(
                  "Published URL search did not "
                  "automatically open project kvapNzyj."
              )

          def test_published_page(
              page,
              context,
              label,
              published_url,
          ):
              print("\n" + "=" * 60)
              print("TESTING:", label)
              print("=" * 60)

              open_projects(page)

              select_published_url(page)

              search_published_url(
                  page,
                  published_url,
              )

              opened_page = verify_project_opened(
                  page,
                  context,
              )

              print(
                  "\nSUCCESS:",
                  label,
                  "published URL search opened the project."
              )

              return opened_page

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 900,
                  },
                  accept_downloads=False,
              )

              page = context.new_page()
              page.set_default_timeout(15000)

              try:
                  print("\nSTEP 1: Opening FlexiFunnels login")

                  page.goto(
                      "https://app.flexifunnels.com/login",
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  print("Location:", safe_location(page))

                  print("\nSTEP 2: Finding login fields")

                  email_field = find_login_field(
                      page,
                      [
                          'input[type="email"]',
                          'input[name="email"]',
                          'input[autocomplete="username"]',
                      ],
                  )

                  password_field = find_login_field(
                      page,
                      ['input[type="password"]'],
                  )

                  if email_field is None or password_field is None:
                      raise RuntimeError(
                          "Login fields were not found."
                      )

                  print("Login fields found.")

                  print("\nSTEP 3: Entering credentials")

                  email_field.fill(email)
                  password_field.fill(password)

                  print("Credentials entered.")

                  print("\nSTEP 4: Finding login button")

                  login_button = None

                  for selector in [
                      'button[type="submit"]',
                      'input[type="submit"]',
                      'button:has-text("Login")',
                      'button:has-text("Log in")',
                      'button:has-text("Sign in")',
                  ]:
                      candidate = unique_visible(
                          page.locator(selector)
                      )

                      if candidate is not None:
                          login_button = candidate
                          break

                  print("\nSTEP 5: Submitting login")

                  if login_button is not None:
                      login_button.click(timeout=15000)
                  else:
                      password_field.press("Enter")

                  print("Login submitted.")

                  print("\nSTEP 6: Opening sub-user selection")

                  path = wait_for_path_change(
                      page,
                      "/login",
                      seconds=25,
                  )

                  if path == "/login":
                      page.goto(
                          project_url,
                          wait_until="domcontentloaded",
                          timeout=60000,
                      )

                  page.wait_for_timeout(3000)

                  print(
                      "Current location:",
                      safe_location(page),
                  )

                  if current_path(page) != "/switch-sub-users":
                      raise RuntimeError(
                          "Sub-user selection page "
                          "was not displayed."
                      )

                  print(
                      "SUB-USER SELECTION SCREEN DETECTED"
                  )

                  select_saurabh(page)

                  switched_page = locate_switched_page(
                      context,
                      page,
                  )

                  switched_page.set_default_timeout(15000)

                  # First search:
                  # Funnel Agent published URL.

                  first_project_page = test_published_page(
                      switched_page,
                      context,
                      "FUNNEL AGENT",
                      landing_url,
                  )

                  # Second search:
                  # Funnel Agent Reg published URL.
                  #
                  # The Projects page is opened again
                  # so the same UI sequence is repeated.

                  second_project_page = test_published_page(
                      first_project_page,
                      context,
                      "FUNNEL AGENT REG",
                      reg_url,
                  )

                  print("\n" + "=" * 60)
                  print("FLEXIFUNNELS VERSION 12 TEST SUCCESSFUL")
                  print("=" * 60)
                  print("LOGIN: VERIFIED")
                  print("SAURABH SWITCH CONTROL: CLICKED")
                  print("PROJECTS PAGE: VERIFIED")
                  print("PUBLISHED URL FILTER: VERIFIED")
                  print("FUNNEL AGENT SEARCH: VERIFIED")
                  print("FUNNEL AGENT REG SEARCH: VERIFIED")
                  print("TARGET PROJECT: VERIFIED")
                  print("NO REPORTS DOWNLOADED")
                  print("NO GOOGLE SHEETS MODIFIED")
                  print("=" * 60)

              except Exception as exc:
                  print("\n" + "=" * 60)
                  print("FLEXIFUNNELS VERSION 12 TEST FAILED")
                  print("Error type:", type(exc).__name__)
                  print("Failure detail:", str(exc)[:300])
                  print("Last location:", safe_location(page))
                  print("=" * 60)

                  raise RuntimeError(
                      "FlexiFunnels navigation test failed. "
                      "Review the numbered logs above."
                  ) from None

              finally:
                  context.close()
                  browser.close()

                  print("\nBrowser closed.")
          PY
