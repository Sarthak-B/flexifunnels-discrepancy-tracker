name: FlexiFunnels Discrepancy Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-google-sheets:
    name: Test Google Sheets Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Sheets dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth

      - name: Verify Google Sheets access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_DATA_SHEET_ID: ${{ vars.RAW_DATA_SHEET_ID }}
          UTM_SHEET_ID: ${{ vars.UTM_SHEET_ID }}
          DISCREPANCY_SHEET_ID: ${{ vars.DISCREPANCY_SHEET_ID }}

        run: |
          python -u - <<'PY'
          import os
          import json
          import gspread

          from google.oauth2.service_account import Credentials

          print("=" * 60)
          print("GOOGLE SHEETS CONNECTION TEST")
          print("=" * 60)

          required = [
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "RAW_DATA_SHEET_ID",
              "UTM_SHEET_ID",
              "DISCREPANCY_SHEET_ID",
          ]

          missing = [
              name
              for name in required
              if not os.environ.get(name, "").strip()
          ]

          if missing:
              raise RuntimeError(
                  "Missing configuration: " + ", ".join(missing)
              )

          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets.readonly"
              ],
          )

          client = gspread.authorize(credentials)

          spreadsheets = {
              "RAW DATA": os.environ["RAW_DATA_SHEET_ID"],
              "UTM": os.environ["UTM_SHEET_ID"],
              "DISCREPANCY STATS": os.environ["DISCREPANCY_SHEET_ID"],
          }

          for label, sheet_id in spreadsheets.items():
              spreadsheet = client.open_by_key(sheet_id)

              print("\n" + label + ": CONNECTED")
              print("Spreadsheet:", spreadsheet.title)

              for worksheet in spreadsheet.worksheets():
                  print("  Tab:", worksheet.title)

          print("\nALL GOOGLE SHEETS CONNECTIONS SUCCESSFUL")
          print("READ-ONLY TEST: NO DATA MODIFIED")
          PY

  test-flexifunnels-login:
    name: Test FlexiFunnels Login
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test login and diagnose workspace selection
        env:
          FLEXIFUNNELS_EMAIL: ${{ secrets.FLEXIFUNNELS_EMAIL }}
          FLEXIFUNNELS_PASSWORD: ${{ secrets.FLEXIFUNNELS_PASSWORD }}
          FLEXIFUNNELS_PROJECT_URL: ${{ vars.FLEXIFUNNELS_PROJECT_URL }}

        run: |
          python -u - <<'PY'
          import os
          import time
          from urllib.parse import urlparse

          from playwright.sync_api import sync_playwright

          print("=" * 60)
          print("FLEXIFUNNELS LOGIN TEST - VERSION 3")
          print("=" * 60)

          email = os.environ.get("FLEXIFUNNELS_EMAIL", "").strip()
          password = os.environ.get("FLEXIFUNNELS_PASSWORD", "")
          project_url = os.environ.get(
              "FLEXIFUNNELS_PROJECT_URL", ""
          ).strip()

          if not email or not password:
              raise RuntimeError(
                  "FlexiFunnels email or password secret is missing."
              )

          parsed_project = urlparse(project_url)

          if (
              parsed_project.scheme != "https"
              or parsed_project.hostname != "app.flexifunnels.com"
              or parsed_project.path.rstrip("/")
                 != "/projects/kvapNzyj"
          ):
              raise RuntimeError(
                  "Unexpected FlexiFunnels project URL."
              )

          def safe_location(page):
              parsed = urlparse(page.url)
              return (
                  parsed.scheme
                  + "://"
                  + (parsed.hostname or "")
                  + parsed.path
              )

          def visible_first(locator):
              count = min(locator.count(), 30)

              for index in range(count):
                  item = locator.nth(index)

                  if item.is_visible():
                      return item

              return None

          def describe_workspace_screen(page):
              """
              Print structural information only.

              Do not print page text, names, emails,
              HTML, cookies, tokens, or form values.
              """

              print("\nWORKSPACE SCREEN DIAGNOSTICS")
              print("-" * 60)

              print("Location:", safe_location(page))

              selectors = {
                  "buttons": "button",
                  "submit_inputs": 'input[type="submit"]',
                  "links": "a",
                  "radio_inputs": 'input[type="radio"]',
                  "select_menus": "select",
                  "listboxes": '[role="listbox"]',
                  "options": '[role="option"]',
                  "comboboxes": '[role="combobox"]',
                  "dialogs": '[role="dialog"]',
                  "cards": (
                      '[class*="card" i], '
                      '[class*="workspace" i], '
                      '[class*="account" i], '
                      '[class*="user-list" i]'
                  ),
              }

              for label, selector in selectors.items():
                  locator = page.locator(selector)

                  total = locator.count()

                  visible = 0

                  for index in range(min(total, 100)):
                      if locator.nth(index).is_visible():
                          visible += 1

                  print(
                      f"{label}: total={total}, "
                      f"visible={visible}"
                  )

              print("\nVisible button labels:")

              buttons = page.locator(
                  'button, input[type="submit"], [role="button"]'
              )

              count = 0

              allowed_labels = {
                  "continue",
                  "next",
                  "select",
                  "switch",
                  "login",
                  "log in",
                  "sign in",
                  "submit",
                  "back",
                  "cancel",
              }

              for index in range(min(buttons.count(), 50)):
                  button = buttons.nth(index)

                  if not button.is_visible():
                      continue

                  label = (
                      button.get_attribute("aria-label")
                      or button.inner_text()
                      or button.get_attribute("value")
                      or ""
                  ).strip().lower()

                  if label in allowed_labels:
                      print("  Recognized action:", label)
                  else:
                      print("  Button with unrecognized label")

                  count += 1

              print("Visible action controls:", count)

              print("\nNo workspace was selected.")
              print("No form values or account names were logged.")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 900,
                  },
                  accept_downloads=False,
              )

              page = context.new_page()
              page.set_default_timeout(15000)

              try:
                  print("\nSTEP 1: Opening FlexiFunnels")

                  page.goto(
                      "https://app.flexifunnels.com/",
                      wait_until="domcontentloaded",
                      timeout=60000,
                  )

                  print("Location:", safe_location(page))

                  print("\nSTEP 2: Finding login fields")

                  email_field = visible_first(
                      page.locator(
                          'input[type="email"], '
                          'input[name="email"], '
                          'input[autocomplete="username"]'
                      )
                  )

                  password_field = visible_first(
                      page.locator('input[type="password"]')
                  )

                  if email_field is None:
                      raise RuntimeError("Email field not found.")

                  if password_field is None:
                      raise RuntimeError("Password field not found.")

                  print("Login fields found.")

                  print("\nSTEP 3: Entering credentials")

                  email_field.fill(email)
                  password_field.fill(password)

                  print("Credentials entered.")

                  print("\nSTEP 4: Submitting login")

                  selectors = [
                      'button[type="submit"]',
                      'input[type="submit"]',
                      'button:has-text("Login")',
                      'button:has-text("Log in")',
                      'button:has-text("Sign in")',
                      'button:has-text("Continue")',
                  ]

                  login_button = None

                  for selector in selectors:
                      candidate = visible_first(
                          page.locator(selector)
                      )

                      if candidate is not None:
                          login_button = candidate
                          break

                  if login_button is not None:
                      login_button.click(timeout=15000)
                      print("Login button clicked.")
                  else:
                      password_field.press("Enter")
                      print("Login submitted using Enter.")

                  print("\nSTEP 5: Waiting for login redirect")

                  deadline = time.monotonic() + 30

                  while time.monotonic() < deadline:
                      path = urlparse(page.url).path.rstrip("/")

                      if path != "/login":
                          break

                      time.sleep(1)

                  print("Location:", safe_location(page))

                  print("\nSTEP 6: Checking workspace selection")

                  current_path = urlparse(
                      page.url
                  ).path.rstrip("/")

                  if current_path == "/switch-sub-users":
                      print(
                          "WORKSPACE SELECTION SCREEN DETECTED"
                      )

                      page.wait_for_timeout(3000)

                      describe_workspace_screen(page)

                      print("\n" + "=" * 60)
                      print("LOGIN REDIRECT TEST: PASSED")
                      print("WORKSPACE SELECTION: NOT COMPLETED")
                      print("PROJECT ACCESS: NOT YET VERIFIED")
                      print("NO GOOGLE SHEETS MODIFIED")
                      print("=" * 60)

                  else:
                      print(
                          "No workspace-selection redirect detected."
                      )

                      print("\nSTEP 7: Opening project")

                      page.goto(
                          project_url,
                          wait_until="domcontentloaded",
                          timeout=60000,
                      )

                      page.wait_for_timeout(3000)

                      print("Location:", safe_location(page))

                      current_path = urlparse(
                          page.url
                      ).path.rstrip("/")

                      if current_path == "/switch-sub-users":
                          print(
                              "Workspace selection required "
                              "before project access."
                          )

                          describe_workspace_screen(page)

                          print(
                              "PROJECT ACCESS: NOT YET VERIFIED"
                          )

                      elif current_path == parsed_project.path:
                          project_content = page.get_by_text(
                              "Funnel Builder Agent",
                              exact=False,
                          )

                          project_content.first.wait_for(
                              state="visible",
                              timeout=15000,
                          )

                          print(
                              "SUCCESS: PROJECT ACCESS VERIFIED"
                          )

                      else:
                          raise RuntimeError(
                              "Unexpected redirect during "
                              "project access."
                          )

              except Exception as exc:
                  print("\nFLEXIFUNNELS TEST FAILED")
                  print("Error type:", type(exc).__name__)
                  print("Location:", safe_location(page))
                  raise RuntimeError(
                      "FlexiFunnels authentication test failed. "
                      "Review the numbered steps above."
                  ) from None

              finally:
                  context.close()
                  browser.close()
                  print("\nBrowser closed.")

          PY
